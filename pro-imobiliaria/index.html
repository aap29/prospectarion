<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00234E">
<meta name="description" content="PRO IMOBILIÁRIA - ANDERSON ALVES — app de prospecção e conversão de Anderson Alves">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<!-- identidade: perfis da marca Anderson Alves · Barlow Condensed/Poppins · barra superior + hero com retrato · fundo por perfil -->
<title>PRO IMOBILIÁRIA - ANDERSON ALVES</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap">
<style>
/* Layout: barra superior com a marca do perfil, hero com retrato e logos, faixa de contato no rodapé (como o banner "Planeje hoje") */
:root{
  /* PERFIL PRINCIPAL — banner "Planeje hoje" */
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#E8EFFA; --field:#F6F8FC;
  --fg:#021C50; --muted:#51607D; --accent:#0B5FCB; --accent-ink:#FFFFFF; --accent-2:#40C1FA;
  --hot:#F0A500; --hot-ink:#021C50;
  --line:rgba(2,28,80,.16); --line-soft:rgba(2,28,80,.09);
  --top-bg:#FFFFFF; --top-fg:#021C50; --top-muted:#51607D;
  --band:#00234E; --on-band:#FFFFFF; --on-band-muted:#A9BEDF;
  --hero-bg:#FFFFFF; --hero-fg:#021C50; --hero-muted:#3D4D6B; --shape-1:#014A97; --shape-2:#2C79D0; --shape-3:#0156AB;
  --f-display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root[data-perfil="imob"]{
  /* CORRETOR — logo azul royal Innovar */
  --bg:#1C3087; --surface:#23399A; --surface-2:#2C44AB; --field:#17287A;
  --fg:#FFFFFF; --muted:#C3D4F8; --accent:#95BAFF; --accent-ink:#11206A; --accent-2:#BAE1FF;
  --hot:#BAE1FF; --hot-ink:#11206A;
  --line:rgba(186,225,255,.30); --line-soft:rgba(186,225,255,.15);
  --top-bg:#16266F; --top-fg:#FFFFFF; --top-muted:#BCD0F7;
  --band:#13215F; --on-band:#FFFFFF; --on-band-muted:#BCD0F7;
  --hero-bg:#1C3087; --hero-fg:#FFFFFF; --hero-muted:#C9D9FA; --shape-1:transparent; --shape-2:transparent; --shape-3:transparent;
  color-scheme:dark;
}
:root[data-perfil="cons"]{
  /* CONSÓRCIOS & INVESTIMENTOS — azul-marinho + seta laranja */
  --bg:#00102A; --surface:#0A1F40; --surface-2:#112A52; --field:#000B1F;
  --fg:#FFFFFF; --muted:#A6B8D6; --accent:#E98018; --accent-ink:#1A0C00; --accent-2:#95BAFF;
  --hot:#E98018; --hot-ink:#1A0C00;
  --line:rgba(149,186,255,.26); --line-soft:rgba(149,186,255,.13);
  --top-bg:#000B1F; --top-fg:#FFFFFF; --top-muted:#A6B8D6;
  --band:#000B1F; --on-band:#FFFFFF; --on-band-muted:#A6B8D6;
  --hero-bg:#00102A; --hero-fg:#FFFFFF; --hero-muted:#B4C4DE; --shape-1:transparent; --shape-2:transparent; --shape-3:transparent;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--top-bg)}

/* BARRA SUPERIOR */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--top-bg);color:var(--top-fg);border-bottom:1px solid var(--line-soft)}
.top-in{display:flex;align-items:center;gap:20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.brand .mark{width:46px;height:36px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.3px;line-height:1;text-transform:uppercase}
.brand b.it{font-family:var(--f-body);font-style:italic;font-weight:700;text-transform:none;font-size:18px;letter-spacing:-.2px;color:var(--accent)}
.brand span{display:block;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--top-muted);font-weight:600;margin-top:3px}
.brand span.acc{color:var(--accent)}
#railNav{display:flex;gap:2px;flex-wrap:nowrap;min-width:0;flex:1 1 auto;overflow-x:auto;scrollbar-width:none}
#railNav::-webkit-scrollbar{display:none}

.navbtn{display:flex;align-items:center;gap:7px;padding:8px 11px;border:0;background:none;border-radius:9px;color:var(--top-muted);cursor:pointer;font-weight:600;font-size:13.5px}
.navbtn svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{color:var(--top-fg);background:var(--surface-2)}
.navbtn[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.modesw{display:flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-soft)}
.modesw button{border:0;background:none;padding:6px 12px;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.modesw button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.station{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.instbtn{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
.instbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.instbtn:hover{border-color:var(--accent)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.opt{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-soft)}
.opt .eyebrow{font-size:13px}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{flex:1;min-width:0}
.linkbox code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;padding:8px 10px;border-radius:8px;background:var(--field);border:1px solid var(--line-soft);user-select:all}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--top-muted);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--top-muted)}
.status.on i{background:var(--accent-2)}

main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.tabbar{display:none}

/* TIPOGRAFIA */
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,7vw,76px);line-height:.92;letter-spacing:-.5px;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase;letter-spacing:.2px}
h3{font-size:15px;font-weight:600}
.pagetitle{font-size:clamp(36px,5.5vw,56px)}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.acc{color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.btn.sm{min-height:32px;padding:4px 12px;font-size:12.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-soft);white-space:nowrap}
.chip.acc{color:var(--fg);border-color:var(--line)}
.chip.ex{font-size:10px;letter-spacing:1px;color:var(--hot-ink);background:var(--hot);border:0;font-weight:700}
input[type=text],input[type=password],input[type=url],input[type=tel],input[type=email],input[type=time],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
textarea{min-height:96px;resize:vertical}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* HERO */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;padding:36px;border-radius:18px;background:var(--hero-bg);color:var(--hero-fg);border:1px solid var(--line-soft)}
.hero::before{content:"";position:absolute;right:-6%;top:-10%;width:52%;height:130%;background:var(--shape-1);clip-path:polygon(38% 0,100% 0,100% 100%,0 100%);opacity:.95}
.hero::after{content:"";position:absolute;right:-2%;top:30%;width:34%;height:90%;background:var(--shape-2);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:.9}
.hero > *{position:relative;z-index:1}
.hero .wm{position:absolute;right:-40px;bottom:-60px;width:520px;max-width:none;opacity:.14;z-index:0;pointer-events:none}
.hero .wm .mark{width:100%;height:auto}
.hero-txt{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero.pro{grid-template-columns:minmax(0,1fr)}
.hero.pro::before,.hero.pro::after{opacity:.35}
.proid{display:flex;align-items:center;gap:28px;min-width:0}
.proid .pfoto{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.proid .portrait{width:200px;height:200px}
.proid .ptxt{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:820px){.proid{gap:18px}.proid .portrait{width:120px;height:120px;border-width:4px}.hero.pro::before,.hero.pro::after{opacity:.15}}
@media (max-width:520px){.proid{gap:12px}.proid .portrait{width:84px;height:84px;border-width:3px}.proid .creci{font-size:11px;padding:2px 8px}.proid .ptxt{gap:6px}.hero h1.protit{font-size:clamp(26px,8.4vw,36px)}.hero .prosub{font-size:clamp(17px,5.4vw,22px)}.hero .sitebtn{background:#E98018;color:#fff;border-color:transparent}
@media (max-width:520px){.hero .sitebtn{width:100%}}
.hero .prosub2{font-size:12.5px;line-height:1.35}}
@media (max-width:400px){.hero.pro{padding:18px}.proid{gap:10px}.proid .portrait{width:70px;height:70px}.hero h1.protit{font-size:7vw;overflow-wrap:anywhere}.hero .prosub{font-size:17px}.hero .prosub2{font-size:12px}}
.hero h1.protit{font-size:clamp(44px,7.4vw,84px);line-height:.9;margin:0}
.hero .prosub{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,38px);line-height:1;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
.hero .prosub2{margin:0;font-weight:600;font-size:clamp(14px,1.6vw,17px);letter-spacing:.4px;color:var(--hero-muted)}
.hb{display:flex;align-items:center;gap:12px}
.hb .mark{width:74px;height:58px;flex:none}
.hb-name{display:block;font-family:var(--f-body);font-style:italic;font-weight:700;font-size:26px;line-height:1;color:var(--shape-3)}
.hb-name.up{font-family:var(--f-display);font-style:normal;font-weight:800;font-size:30px;letter-spacing:.5px;color:var(--hero-fg)}
.hb-sub{display:block;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:var(--hero-muted);margin-top:5px}
.hb-sub.acc{color:var(--accent);font-size:13px;letter-spacing:1px;text-transform:none;font-weight:600}
.innovar{width:240px;max-width:100%;border-radius:6px;display:block}
.pill{align-self:flex-start;font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:4px;text-transform:uppercase;padding:4px 14px;background:var(--accent);color:var(--accent-ink);border-radius:2px}
.hero .tag{margin:0;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;font-size:12.5px;color:var(--hero-muted)}
.hero h1 .acc{color:var(--accent)}
.planbox{display:flex;flex-direction:column;gap:10px;max-width:520px}
.planbox .eyebrow{color:var(--accent)}
.planrow{display:flex;gap:18px;align-items:center}
.day{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.85;white-space:nowrap}
.day small{font-size:24px;color:var(--hero-muted);font-weight:700}
.planmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--hero-muted)}
.planmeta b{color:var(--hero-fg);font-weight:600}
.bar{height:7px;border-radius:9px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.hero-side{display:flex;flex-direction:column;align-items:center;gap:12px}
.portrait{width:230px;height:230px;border-radius:50%;overflow:hidden;border:6px solid #FFFFFF;box-shadow:0 14px 40px rgba(0,16,42,.28);background:#FFFFFF;flex:none}
.portrait img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);display:block}
.creci{font-family:var(--f-display);font-weight:700;letter-spacing:1px;font-size:15px;color:var(--hero-fg);background:rgba(0,0,0,.18);padding:3px 12px;border-radius:999px}
:root:not([data-perfil]) .creci,:root[data-perfil="owner"] .creci{background:var(--surface-2)}

/* LOGOS DO PERFIL PRINCIPAL */
.brandstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.btile{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;min-width:0;color:#FFFFFF}
.btile .mark{width:60px;height:47px;flex:none}
.btile b{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.4px;line-height:1;text-transform:uppercase}
.btile span{display:block;font-size:12px;margin-top:4px;color:#C3D4F8}
.btile.inn{background:#1A2F88;justify-content:center}
.btile.inn img{width:100%;max-width:280px;display:block}
.btile.cor{background:#1C3087}
.btile.con{background:#00102A}
.btile.con span{color:#E98018;font-weight:600}

/* RODAPÉ DE CONTATO */
.cband{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:22px 26px;border-radius:16px;background:var(--band);color:var(--on-band)}
.citem{display:flex;gap:12px;align-items:center;min-width:0}
.citem .ic{width:46px;height:46px;border-radius:50%;background:#0B5FCB;display:grid;place-items:center;flex:none}
:root[data-perfil="imob"] .citem .ic{background:#4E71CF}
:root[data-perfil="cons"] .citem .ic{background:#E98018}
.citem .ic svg{width:22px;height:22px;fill:none;stroke:#FFFFFF;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.citem small{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-2)}
:root[data-perfil="cons"] .citem small{color:#E98018}
.citem b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere;user-select:all}
.citem b.big{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.4px}

/* HOJE */
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.meter{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.meter .lbl{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.meter .num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:44px;font-weight:800;line-height:.9}
.meter .num small{font-size:20px;color:var(--muted);font-weight:700}
.meter .ctl{display:flex;gap:8px}
.meter .ctl button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:600;cursor:pointer;color:var(--fg)}
.meter .ctl button.plus{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.meter.done{border-color:var(--accent)}
.actions{display:flex;flex-direction:column;padding-block:4px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,auto);gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.act:last-child{border-bottom:0}
.act span.pri{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:1px;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);text-align:center;min-width:86px;text-transform:uppercase}
.act span.pri.urg{background:var(--hot);color:var(--hot-ink)}
.act p{margin:0}
.act .t{font-weight:600}
.checks{display:flex;flex-direction:column;gap:2px;padding-block:8px}
.check{display:flex;flex-direction:row;gap:12px;align-items:flex-start;padding:10px 8px;border-radius:10px;cursor:pointer;color:var(--fg);font-size:14px;font-weight:500}
.check:hover{background:var(--surface-2)}
.check input{appearance:none;width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--muted);margin:0;display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.check .when{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--accent);margin-right:6px}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wk{padding:10px 12px;border-radius:12px;border:1px solid var(--line-soft);background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.wk b{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:1.4px;color:var(--muted)}
.wk span{font-weight:600;font-size:13px;line-height:1.3}
.wk[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2)}
.wk[aria-pressed="true"] b{color:var(--accent)}
.wk.now b::after{content:" · AGORA"}
.acc-card{display:flex;flex-direction:column;gap:6px}
.acc-card .em{font-weight:600;overflow-wrap:anywhere;user-select:all}

/* LEADS */
.funnel{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fstep{flex:1 0 108px;padding:10px 12px;border-radius:12px;border:1px solid var(--line-soft);background:var(--surface);cursor:pointer;text-align:left;color:var(--fg)}
.fstep b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}

.qrow:last-child{border-bottom:0}
.qrow .nm{font-weight:700}
.qrow .row{justify-content:flex-end}
@media (max-width:820px){

}
/* SIMULADOR */
.simgrid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:18px;align-items:start}
.simform{display:flex;flex-direction:column;gap:12px}
.seg2{display:flex;gap:6px}
.seg2 button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-weight:700;cursor:pointer;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stile{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stile span{font-size:12.5px;color:var(--muted);font-weight:600}
.stile b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stile small{font-size:12px;color:var(--muted)}
.stile.hl{background:var(--accent);border-color:var(--accent)}
.stile.hl span,.stile.hl small,.stile.hl b{color:var(--accent-ink)}
.stile.alt{background:var(--surface-2)}
.verdict{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:flex;gap:10px;align-items:flex-start}
.verdict.ok{border-color:var(--accent)}
.verdict.warn{border-color:var(--hot);box-shadow:inset 3px 0 0 var(--hot)}
.notes{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.hintline{font-size:12px;color:var(--muted);font-weight:500}
@media (max-width:980px){.simgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.stile{padding:12px}.stile b{font-size:21px;white-space:nowrap}}
@media (max-width:820px){.tabbar .navbtn{font-size:9.5px;padding:6px 0}}
@media (max-width:1340px){.top-in .status{display:none}}
@media (max-width:1400px){#railNav .navbtn svg{display:none}}
@media (max-width:1180px){#railNav .navbtn{padding:8px 7px;font-size:13px}}
@media (max-width:1240px){.navbtn{padding:8px 9px}}
@media (max-width:1100px){.brand .txt span{display:none}}
@media (max-width:980px){
  .props{grid-template-columns:repeat(2,minmax(0,1fr))}
  .msgs{grid-template-columns:minmax(0,1fr)}

.abinfo{margin:0;font-size:12.5px;line-height:1.5}
.abwarn{margin:0;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:8px;background:var(--hot);color:var(--hot-ink)}
.abvars{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.abvars button{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-weight:600;font-size:12px;cursor:pointer;color:var(--fg)}
.abvars button:hover{border-color:var(--accent)}
.abvars button[disabled]{opacity:.45;cursor:wait}
.abtxt{min-height:180px;font-size:13.5px;line-height:1.55}
.abrow{gap:6px}

.abconv li{font-size:13px;padding:8px 10px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%}
.abconv li small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.abconv li.eu{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line-soft)}
.abconv li.ld{align-self:flex-start;background:var(--field);border:1px solid var(--line)}
.abconv .row textarea{flex:1;min-width:0;min-height:44px}
.absug{padding:12px 14px;border-radius:12px;border:1px solid var(--accent);background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.absug p{margin:0}
.abpre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px;margin:0;padding:10px;border-radius:8px;background:var(--field);border:1px solid var(--line-soft)}
/* SEPARAÇÃO VISUAL DOS LEADS (21/10/2026) */
:root:not([data-perfil]),:root[data-perfil="owner"]{--bg:#D5DEEC;--line-soft:rgba(2,28,80,.13)}
:root[data-perfil="imob"]{--bg:#142573}
:root[data-perfil="cons"]{--bg:#000A1C}
.panel.actions{background:transparent;border:0;padding:0;gap:16px}
.act{grid-template-columns:auto minmax(0,1fr);gap:10px 16px;align-items:start;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;box-shadow:0 3px 12px rgba(0,16,42,.14)}
.act:last-child{border-bottom:1px solid var(--line)}
.act:has(span.pri.urg){border-left-color:var(--hot)}
.act .t{font-size:16px;line-height:1.3;margin-bottom:4px}
.act .small{line-height:1.5}
.act > .row,.act > button{grid-column:1/-1}
.act > .row{justify-content:flex-start!important;gap:8px!important;padding-top:14px;border-top:1px dashed var(--line)}
.act > button{justify-self:start}
.leadlist{gap:18px}
.lead{border:1px solid var(--line);border-left:6px solid var(--accent);box-shadow:0 3px 12px rgba(0,16,42,.14);padding:18px}
.lead.late{border-left-color:var(--hot)}
.aglist{gap:12px}
.agi{border-color:var(--line);box-shadow:0 2px 10px rgba(0,16,42,.12)}
.cmgrid{gap:16px}
.cmcard{border-color:var(--line);box-shadow:0 3px 12px rgba(0,16,42,.14)}
.qrow{padding:16px 14px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 2px 10px rgba(0,16,42,.12)}
.qrow:last-child{border-bottom:1px solid var(--line)}
@media (max-width:560px){.act{padding:14px}}
.instbtn .lbm{display:none}
@media (max-width:820px){.instbtn .lbd{display:none}.instbtn .lbm{display:inline}.instbtn{background:var(--accent);color:var(--accent-ink);border-color:transparent;padding:6px 10px}}
@media (max-width:560px){.brand .txt{display:none}.instbtn .lbm{font-size:0}.instbtn .lbm::after{content:"Instalar";font-size:12.5px}}
@media (max-width:374px){.instbtn .lbm{display:none}.modesw button{padding:6px 6px;font-size:12px}.top-in{gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="top-in">
    <div class="brand" id="brand"></div>
    <nav id="railNav" aria-label="Navegação"></nav>
    <div class="top-right"><span id="modeSw"></span><button class="instbtn" id="cfgOpen" type="button" aria-label="Configurações" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button><button class="instbtn" id="instOpen" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg><span class="lbd">Área de trabalho</span><span class="lbm">Instalar no celular</span></button><span id="sync"></span></div>
  </div>
</header>
<main><div class="wrap"><div id="view" class="sec" style="gap:30px"></div></div></main>
<nav class="tabbar" id="tabNav" aria-label="Navegação"></nav>

<div class="overlay" id="modal" hidden>
  <form class="sheet wide" id="leadForm" autocomplete="off">
    <div class="sec-head"><div><p class="eyebrow" id="mEyebrow">Ficha do lead</p><h2 id="mTitle">Novo lead</h2></div><button type="button" class="btn ghost sm" id="mClose">Fechar</button></div>
    <div id="mDados"></div>
    <div class="quickacts" id="mQuick"></div>
    <div id="mFonte"></div>
    <div id="mVideo" hidden></div>
    <fieldset class="fs"><legend>Identificação</legend>
      <div class="grid3"><label>Nome completo *<input type="text" id="f_nome" required placeholder="Nome e sobrenome"></label><label>Empresa<input type="text" id="f_empresa"></label><label>Profissão / cargo<input type="text" id="f_cargo"></label></div>
    </fieldset>
    <fieldset class="fs"><legend>Contato</legend>
      <div class="grid3"><label>WhatsApp<input type="tel" id="f_fone" placeholder="(51) 9xxxx-xxxx"></label><label>Telefone 2<input type="tel" id="f_fone2"></label><label>E-mail<input type="text" id="f_email" inputmode="email"></label></div>
      <div class="grid3"><label>Instagram<input type="text" id="f_insta" placeholder="@perfil"></label><label>Cidade<input type="text" id="f_cidade" list="cidades"></label><label>Bairro<input type="text" id="f_bairro"></label></div>
    </fieldset>
    <fieldset class="fs"><legend>Negócio</legend>
      <div id="perfilWrap"></div>
      <div class="grid3"><label>Fonte: de onde veio (link ou canal)<input type="text" id="f_origem" list="dlOrig" placeholder="Cole o link do post, comentário, anúncio ou perfil"></label><label>Rede social<input type="text" id="f_rede" list="dlRedeF" placeholder="Instagram, Facebook, YouTube…"></label><label>Etapa<select id="f_etapa"></select></label></div>
      <label>Intenção do cliente e trecho da conversa<textarea id="f_intencao" rows="2" placeholder="ex.: comentou “qual o valor?” no reels da casa 2 quartos no Rio Branco; quer financiar com FGTS"></textarea></label>
      <datalist id="dlOrig"></datalist><datalist id="dlRedeF"></datalist>
      <div class="grid3"><label>Temperatura<span class="tempsel" id="f_temp"><button type="button" data-temp="frio">Frio</button><button type="button" data-temp="morno">Morno</button><button type="button" data-temp="quente">Quente</button></span></label><label>Valor estimado (R$)<input type="text" inputmode="numeric" class="money" id="f_valor" placeholder="ex.: 250.000"></label><label>Etiquetas<input type="text" id="f_tags" placeholder="ex.: FGTS, indicação"></label></div>
    </fieldset>
    <fieldset class="fs"><legend>Próximo passo</legend>
      <div class="grid3"><label>Data do retorno<input type="date" id="f_prox"></label><label>Hora<input type="time" id="f_hora"></label><label>O que fazer<input type="text" id="f_acao" placeholder="ex.: enviar simulação"></label></div>
      <label>Anotações<textarea id="f_notas" placeholder="Renda, prazo, objetivo, objeções…"></textarea></label>
    </fieldset>
    <fieldset class="fs"><legend>Histórico de atividades</legend>
      <div class="row"><select id="h_tipo" style="width:auto"><option>Ligação</option><option>WhatsApp</option><option>Visita</option><option>Reunião</option><option>E-mail</option><option>Simulação</option><option>Proposta</option><option>Nota</option></select><input type="text" id="h_txt" placeholder="O que aconteceu?" style="flex:1;min-width:160px"><button type="button" class="btn sm" id="h_add">Registrar</button></div>
      <ul class="hist" id="histList"></ul>
    </fieldset>
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn ghost sm" id="mDel" hidden>Excluir</button>
      <div class="row" style="margin-left:auto">
        <button type="button" class="btn ghost" id="mCancel">Cancelar</button>
        <button type="submit" class="btn pri">Salvar lead</button>
      </div>
    </div>
  </form>
</div>
<div class="overlay" id="agModal" hidden>
  <form class="sheet" id="agForm" autocomplete="off">
    <div class="sec-head"><h2 id="agTitle">Novo compromisso</h2><button type="button" class="btn ghost sm" id="agClose">Fechar</button></div>
    <label>Título *<input type="text" id="a_titulo" required placeholder="ex.: Visita casa 3 quartos"></label>
    <div class="grid3"><label>Tipo<select id="a_tipo"></select></label><label>Data<input type="date" id="a_data" required></label><label>Hora<input type="time" id="a_hora"></label></div>
    <div class="grid2"><label>Lead<select id="a_lead"></select></label><label>Duração<select id="a_dur"><option value="30">30 min</option><option value="60" selected>1 hora</option><option value="90">1h30</option><option value="120">2 horas</option></select></label></div>
    <label>Local<input type="text" id="a_local" placeholder="Endereço ou link da reunião"></label>
    <label>Anotações<textarea id="a_notas"></textarea></label>
    <label class="check" style="padding:4px 0"><input type="checkbox" id="a_feito"><span>Concluído</span></label>
    <div class="row" style="justify-content:space-between">
      <div class="row"><button type="button" class="btn ghost sm" id="agDel" hidden>Excluir</button><a class="btn ghost sm" id="agGcal" target="_blank" rel="noopener" hidden>Google Agenda</a></div>
      <div class="row" style="margin-left:auto"><button type="button" class="btn ghost" id="agCancel">Cancelar</button><button type="submit" class="btn pri">Salvar</button></div>
    </div>
  </form>
</div>
<datalist id="cidades"><option value="Sapucaia do Sul"><option value="São Leopoldo"><option value="Novo Hamburgo"><option value="Esteio"><option value="Canoas"><option value="Porto Alegre"><option value="Portão"><option value="Estância Velha"><option value="Campo Bom"><option value="Gravataí"></datalist>
<div class="overlay" id="inst" hidden>
  <div class="sheet" role="dialog" aria-labelledby="instTitle">
    <div class="sec-head"><h2 id="instTitle">Instalar o PRO IMOBILIÁRIA - ANDERSON ALVES</h2><button type="button" class="btn ghost sm" id="instClose">Fechar</button></div>
    <div id="instBody"></div>
  </div>
</div>
<div class="overlay" id="cfg" hidden>
  <div class="sheet wide" role="dialog" aria-labelledby="cfgTitle">
    <div class="sec-head"><h2 id="cfgTitle">Configurações</h2><button type="button" class="btn ghost sm" id="cfgClose">Fechar</button></div>
    <div id="cfgBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);

async function hashPin(pin){
  const txt='PROINNOVAR|'+String(pin||'').replace(/\D/g,'');
  try{if(crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return 's256:'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;for(let i=0;i<txt.length;i++)h=((h<<5)+h+txt.charCodeAt(i))>>>0;return 'djb:'+h.toString(16);
}

const CM_META=/^(\d+\s?(s|seg|min|h|d|sem|w|m|a|anos?|dias?|semanas?|horas?)|responder|reply|ver tradu[çc][ãa]o|see translation|curtir|like|\d+\s?(curtidas?|likes?|respostas?|replies)|ver (mais )?respostas.*|ver \d+ respostas?.*|ocultar respostas|editado|editada|autor|creator|criador|fixado|pinned|seguir|follow|enviar|·|•|—|-)$/i;
const CM_HANDLE=/^@?[A-Za-z0-9._]{2,30}$/;
const CM_NOME=/^[A-ZÀ-Ú][A-Za-zÀ-ú'.]+( [A-Za-zÀ-ú'.]+){1,4}$/;
S.cm=Object.assign({rede:'Instagram',orig:'Reels',pub:'',alvo:'',txt:'',filtro:'novos',soFone:false,prev:null},LS.get('cmPrefs',{}),{txt:'',prev:null});
function cmFone(t){const m=String(t||'').match(/(\+?55[\s.-]?)?\(?\b\d{2}\)?[\s.-]?9?[\s.]?\d{4}[\s.-]?\d{4}\b/);return m?m[0].trim():''}
function cmEmail(t){const m=String(t||'').match(/[\w.+-]+@[\w-]+\.[\w.]+/);return m?m[0]:''}
function cmClassifica(t){const x=String(t||'');for(const [k,l,temp,re] of CM_INT){if(k==='marcou'&&!/@[\w.]{2,}/.test(x))continue;if(re.test(x))return {int:k,temp}}return {int:'outro',temp:'frio'}}
function cmParse(txt,rede){
  const out=[];let cur=null;const fb=/Facebook|Marketplace/.test(rede);
  const push=()=>{if(cur&&cur.texto.trim())out.push(cur);cur=null};
  String(txt||'').split(/\r?\n/).map(x=>x.trim()).forEach(ln=>{
    if(!ln){return}
    if(CM_META.test(ln)||/^\d+\s?(s|min|h|d|sem|w)\b.*(responder|reply|curtir)/i.test(ln)||/^(curtir|responder)\b/i.test(ln))return;
    let m=ln.match(/^@?([A-Za-z0-9._]{2,30})\s*[:\-–]\s+(.+)$/);
    if(m&&!/\s/.test(m[1])){push();cur={user:m[1],nome:'',texto:m[2]};return}
    if(CM_HANDLE.test(ln)&&!/^\d+$/.test(ln.replace('@',''))&&(!cur||cur.texto||ln[0]==='@')){push();cur={user:ln.replace(/^@/,''),nome:'',texto:''};return}
    if(fb&&CM_NOME.test(ln)&&ln.length<=40&&(!cur||cur.texto)){push();cur={user:'',nome:ln,texto:''};return}
    if(!cur)cur={user:'',nome:'',texto:''};
    cur.texto+=(cur.texto?' ':'')+ln;
  });
  push();
  return out.map(c=>{const k=cmClassifica(c.texto);return Object.assign(c,k,{fone:cmFone(c.texto),email:cmEmail(c.texto)})});
}

function fonteDe(l){
  const o=String(l.origem||'')+' '+String(l.tags||'')+' '+String(l.notas||'')+' '+String(l.rede||'');
  if(/^Comentou|Comentário/i.test(String(l.notas||'')+' '+(l.tags||'')))return 'comentario';
  if(l.cnpj||/receita|cnpj|solutudo|guia de empresas|cadastro p[úu]blico|empresaqui|casa dos dados/i.test(o))return 'empresa';
  if(/olx|zap|vivareal|imovelweb|quintoandar|chaves ?na ?m[ãa]o|marketplace/i.test(o))return 'anuncio';
  if(/indica/i.test(o))return 'indicacao';
  if(/formul|site innovar|landing|pedido|or[çc]amento|plant[ãa]o/i.test(o))return 'pedido';
  if(/facebook\.com|grupo|publica[çc]|post/i.test(o))return 'post';
  if(/instagram|tiktok|youtube|linkedin/i.test(o))return 'rede';
  return 'outro';
}

   ['Instagram',gqw(`site:instagram.com ${intent} ${C}${P}`)],
   ['Facebook: publicações',fbPosts(intent.replace(/[()"]/g,'').split(' OR ')[0]+' '+C)],
   ['Facebook: grupos','https://www.facebook.com/search/groups/?q='+enc((S.mod==='imob'?'imóveis ':'empresários ')+C)],
   ['Marketplace','https://www.facebook.com/marketplace/search/?query='+enc((alvo==='vender'?'casa à venda ':alvo==='alugar'?'aluguel casa ':'casa ')+C)],
   ['TikTok','https://www.tiktok.com/search?q='+enc((S.mod==='imob'?'imóveis ':'consórcio ')+C)],
   ['YouTube','https://www.youtube.com/results?search_query='+enc((S.mod==='imob'?'imóveis ':'consórcio ')+C)+'&sp=EgIIAw%253D%253D'],
   ['OLX',gq(`site:olx.com.br ${alvo==='alugar'?'aluguel':'venda'} ${C}`)],
   ['Anúncios ativos (concorrência)','https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=BR&q='+enc((S.mod==='imob'?'imóveis ':'consórcio ')+C)]];

  if(im){if(/mcmv|minha casa/.test(im))return 'Minha Casa Minha Vida';if(/primeiro/.test(im))return 'Primeiro imóvel';if(/alto/.test(im))return 'Alto padrão';if(/vend/.test(im))return 'Quer vender';if(/alug/.test(im))return 'Quer alugar (inquilino)';if(/agenc|propriet/.test(im))return 'Agenciamento';if(/parceri/.test(im))return 'Parceria imobiliária';return 'Médio padrão'}

}

function parsePlanilha(txt){
  const out=[];
  String(txt||'').split(/\r?\n/).map(x=>x.replace(/\s+$/,'')).filter(x=>x.trim()).forEach((ln,i)=>{
    const f=(ln.includes('\t')?ln.split('\t'):ln.split(';')).map(x=>x.trim().replace(/^"|"$/g,''));
    if(i===0&&/nome/i.test(f[0]||'')&&/(tel|fone|rede)/i.test(f.slice(1).join(' ')))return;
    const [nome,fone,rede,email,acaoImovel,acaoCons,cidade,notas,origem,profissao,cnpj,perfilSocial,msg1]=f;
    if(!nome&&!fone&&!email)return;
    out.push({nome:nome||('Lead '+(fone||email)),fone:fone||'',rede:rede||'',email:email||'',acaoImovel:acaoImovel||'',acaoCons:acaoCons||'',cidade:cidade||'',notas:notas||'',origem:origem||'',profissao:profissao||'',cnpj:cnpj||'',perfilSocial:perfilSocial||'',msg1:(msg1||'').replace(/\\n/g,'\n')});
  });
  return out;
}

}
async function baixarArq(nome,conteudo,tipo){
  let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){d=null}
  if(d){try{await d.save({filename:nome,data:conteudo});toast('Planilha baixada.')}catch(e){if(e&&e.code!=='declined')toast('Não foi possível baixar agora.')}return}
  const blob=new Blob([conteudo],{type:tipo||'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);toast('Planilha baixada.');
}
function csvPlanilha(){
  const q=v=>{v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=PL_COLS.map(c=>c[1]).concat(['Etapa','Próximo contato']);
  const rows=plLeads().map(l=>PL_COLS.map(([k])=>l[k]||acaoPadrao(l,k)||'').concat([ETAPA[l.etapa]||'',l.prox?l.prox.split('-').reverse().join('/'):'']));
  return '﻿'+[head].concat(rows).map(r=>r.map(q).join(';')).join('\r\n');
}

    toast(novos.length+' lead(s) na planilha'+(dup?' · '+dup+' repetido(s) ignorado(s)':''));return;

});

function parseLista(txt){
  const out=[];
  String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach((ln,i)=>{
    if(i===0&&/nome/i.test(ln)&&/(fone|telefone|whats|celular|e-?mail|cidade)/i.test(ln))return;
    const parts=ln.split(/\t|;|,/).map(x=>x.trim().replace(/^"|"$/g,'')).filter(Boolean);
    let nome='',fone='',email='',insta='';const outros=[];
    parts.forEach(p=>{const dg=digits(p);
      if(!fone&&dg.length>=8&&dg.length<=13&&!/[a-zà-ú]{3}/i.test(p))fone=p;
      else if(!email&&/\S+@\S+\.\S+/.test(p))email=p;
      else if(!insta&&/^@[\w.]+$/.test(p))insta=p;
      else if(!nome&&/[a-zà-ú]/i.test(p))nome=p;
      else outros.push(p)});
    if(!nome&&!fone&&!email)return;
    out.push({nome:nome||('Lead '+(fone||email||insta)),fone,email,insta,cidade:outros[0]||'',empresa:outros[1]||''});
  });
  return out;
}

function enquadra(renda,valor){
  let k=renda<=3200?'F1':renda<=5000?'F2':renda<=9600?'F3':renda<=13000?'F4':'SBPE',nota='';
  if(k!=='SBPE'&&valor>FAIXAS[k].teto){nota=`O imóvel passa do teto de ${R$(FAIXAS[k].teto)} da ${FAIXAS[k].nome}. Simulei pelas condições SBPE.`;k='SBPE'}

function idadeMeses(nasc){
  if(!nasc)return null;const n=new Date(nasc+'T12:00:00'),h=new Date();if(isNaN(n))return null;
  let m=(h.getFullYear()-n.getFullYear())*12+(h.getMonth()-n.getMonth());if(h.getDate()<n.getDate())m--;return m;
}
const taxaMIP=anos=>anos<=30?0.00009:anos<=40?0.00011:anos<=50?0.00019:anos<=60?0.00035:0.0006;
function calcImob(rendaForcada){
  const v=S.sim.imob,valor=+v.valor||0,renda=rendaForcada!=null?rendaForcada:(+v.renda||0)+(+v.renda2||0);
  const im=idadeMeses(v.nasc),idadeSuposta=im==null,mesesIdade=im==null?(+v.idade||35)*12:im,anos=Math.floor(mesesIdade/12);
  const {k,nota}=enquadra(renda,valor);
  const taxa=v.taxa!==''&&!isNaN(+v.taxa)?+v.taxa:FAIXAS[k].taxa,i=taxa/100/12,ef=(Math.pow(1+i,12)-1)*100;
  const maxIdade=80*12+6-mesesIdade,n=Math.max(12,Math.min(+v.prazo||420,420,maxIdade>0?maxIdade:12));
  const comSeg=v.seg==='sim',mip=comSeg?taxaMIP(anos):0,fixo=comSeg?valor*0.000071+25:0;
  const parcMax=renda*(+v.comp||30)/100,cotaV=valor*(+v.cota||80)/100;
  const fatorSAC=1/n+i,fatorPRICE=i/(1-Math.pow(1+i,-n)),fator=v.sis==='SAC'?fatorSAC:fatorPRICE;
  const pRenda=Math.max(0,parcMax-fixo)/(fator+mip);
  const fin=Math.max(0,Math.min(cotaV,pRenda)),entrada=valor-fin;
  const desp=valor*(+v.desp||0)/100,naMao=Math.max(0,entrada+desp-(+v.fgts||0)-(+v.sub||0)),proprio=Math.max(0,entrada-(+v.fgts||0)-(+v.sub||0));
  const p1=fin*fator,pUlt=v.sis==='SAC'?fin/n*(1+i):p1,encargos=fin*mip+fixo,p1Total=p1+encargos;
  const juros=v.sis==='SAC'?fin*i*(n+1)/2:p1*n-fin;
  const rendaNec=(cotaV*(fator+mip)+fixo)/((+v.comp||30)/100);
  return {k,nota,taxa,ef,n,limitadoRenda:pRenda<cotaV,fin,entrada,proprio,desp,naMao,p1,p1Total,encargos,pUlt,juros,rendaNec,valor,renda,parcMax,anos,idadeSuposta,prazoCortado:n<(+v.prazo||420)};
}
function calcCons(){
  const v=S.sim.cons,c=+v.credito||0,n=Math.max(1,+v.prazo||1),adm=(+v.adm||0)/100,fr=(+v.fr||0)/100;
  const total=c*(1+adm+fr),parc=total/n,lance=c*(+v.lance||0)/100,liq=v.emb==='sim'?c-lance:c;

  return {c,n,total,parc,lance,liq,pf,totalFin,eco:totalFin-total,custo:(adm+fr)*100};
}

$('#inst').addEventListener('click',e=>{if(e.target.id==='inst')$('#inst').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#inst').hidden)$('#inst').hidden=true});
document.addEventListener('click',async e=>{
  if(e.target.id==='copyLink'){copy(APP_URL,$('#appLink'));return}
  if(e.target.closest('[data-act="instalar"]')){openInst();return}
  if(e.target.id==='nativeInstall'&&deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(x){}deferredPrompt=null;$('#inst').hidden=true;return}
  if(e.target.id==='dlShortcut'){baixar('PRO IMOBILIARIA - ANDERSON ALVES.html',launcherHTML(),'text/html');toast('Atalho baixado. Mova para a área de trabalho.');return}
});
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('PRO IMOBILIÁRIA - ANDERSON ALVES instalado.')});
function baixar(nome,conteudo,tipo){
  const blob=new Blob([conteudo],{type:tipo||'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
}

/* ---------- CONFIGURAÇÕES, BACKUP E LINK ---------- */
let importPend=null;
function pacoteBackup(){
  const dados={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('proinnovar.')===0){try{dados[k.slice(11)]=JSON.parse(localStorage.getItem(k))}catch(x){}}}}catch(x){}
  delete dados.perfilAparelho;
  return {app:'PRO IMOBILIÁRIA - ANDERSON ALVES',formato:1,origem:'independente',exportado:new Date().toISOString(),dados};
}
function exportarBackup(){
  baixar('PRO-IMOBILIARIA-backup-'+hojeKey()+'.json',JSON.stringify(pacoteBackup(),null,1),'application/json');
  LS.set('ultimoBackup',new Date().toISOString());toast('Backup exportado. Guarde o arquivo no Drive ou envie para o seu WhatsApp.');
  if(!$('#cfg').hidden)$('#cfgBody').innerHTML=rebrand(cfgHTML());
}
function lerBackup(file,cb){
  const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(String(r.result||''));if(!p||!['PRO INN'+'OVAR','PRO IMOBILIÁRIA - ANDERSON ALVES'].includes(p.app)||!p.dados)throw 0;cb(p)}catch(x){toast('Este arquivo não é um backup do PRO IMOBILIÁRIA - ANDERSON ALVES.')}};
  r.onerror=()=>toast('Não consegui ler o arquivo.');r.readAsText(file);
}
function aplicarBackup(p,modo){
  const d=p.dados||{};
  if(modo==='substituir'){
    try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('proinnovar.')===0&&k!=='proinnovar.perfilAparelho'&&k!=='proinnovar.conta')ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(x){}
    Object.keys(d).forEach(k=>{if(k==='conta'&&LS.get('conta',null)&&modo!=='primeiro')return;LS.set(k,d[k])});
  }else{
    const junta=(k)=>{const a=LS.get(k,[])||[],b=d[k]||[],m=new Map();a.forEach(x=>m.set(x.id,x));b.forEach(x=>m.set(x.id,Object.assign({},m.get(x.id)||{},x)));LS.set(k,[...m.values()])};
    junta('leads');junta('agenda');junta('oport');
    Object.keys(d).forEach(k=>{if(k==='leads'||k==='agenda'||k==='oport')return;if(k==='conta'){if(!LS.get('conta',null))LS.set('conta',d.conta);return}if(LS.get(k,null)==null)LS.set(k,d[k])});
  }
}
function cfgHTML(){
  const own=S.role==='owner',ub=LS.get('ultimoBackup',null);
  return `<div class="sec" style="gap:16px">
  ${own?`<fieldset class="fs"><legend>Registro do proprietário</legend>${camposConta(CONTA,'c_')}<div class="row"><button class="btn pri" type="button" id="cfgSalvarConta">Salvar registro</button></div></fieldset>`:''}
  <fieldset class="fs"><legend>Link do app</legend>
    <p class="small muted" style="margin:0">Endereço usado nos atalhos e no botão Instalar. Ao publicar em um domínio próprio (ex.: proinnovar.com.br), cole o novo link aqui.</p>
    <div class="linkbox"><input type="text" id="cfgLink" value="${esc(APP_URL)}" inputmode="url"><button class="btn sm" type="button" id="cfgSalvarLink">Salvar link</button></div>
    <p class="small muted" style="margin:0">Mudou de link? Os dados de cada aparelho ficam no endereço antigo: exporte o backup aqui e importe no endereço novo.</p>
  </fieldset>
  <fieldset class="fs"><legend>Backup dos dados</legend>
    <p class="small muted" style="margin:0">Último backup: <b>${ub?new Date(ub).toLocaleString('pt-BR'):'nunca'}</b>. Faça pelo menos uma vez por semana.</p>
    <div class="row"><button class="btn pri" type="button" id="cfgExport">Exportar backup</button><label class="btn" style="cursor:pointer">Importar backup<input type="file" id="cfgImport" accept=".json,application/json" hidden></label></div>
    <div id="cfgImportBox"></div>
  </fieldset>
  <fieldset class="fs"><legend>Este aparelho</legend>
    <p class="small muted" style="margin:0">Perfil atual: <b>${S.role==='owner'?'Principal':'Estação '+MODS[S.role].curto}</b>.</p>
    <div class="row"><button class="btn" type="button" data-trocaperfil="1">Trocar perfil deste aparelho</button>${own?'<button class="btn ghost" type="button" id="cfgSair">Bloquear (pedir PIN)</button>':''}</div>
  </fieldset>
  ${own?`<fieldset class="fs"><legend>Trocar PIN</legend><div class="grid3"><label>PIN atual<input type="text" class="pinf" id="cp_old" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="8"></label><label>Novo PIN<input type="text" class="pinf" id="cp_new" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="8"></label><label>Repita<input type="text" class="pinf" id="cp_new2" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="8"></label></div><div class="row"><button class="btn" type="button" id="cfgPin">Trocar PIN</button></div></fieldset>
  <fieldset class="fs"><legend>Apagar dados deste aparelho</legend><p class="small muted" style="margin:0">Remove leads, agenda e planos só deste aparelho. Exporte o backup antes.</p><div class="row"><button class="btn ghost" type="button" id="cfgZerar">Apagar dados</button></div></fieldset>`:''}
  <p class="small muted" style="margin:0">PRO IMOBILIÁRIA - ANDERSON ALVES · versão independente · funciona sem internet depois de aberto uma vez.</p>
  </div>`;
}
function openCfg(){$('#inst').hidden=true;$('#cfgBody').innerHTML=rebrand(cfgHTML());$('#cfg').hidden=false}
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.closest('[data-cfg]')||t.closest('#cfgOpen')){openCfg();return}
  if(t.id==='cfgClose'||t.id==='cfg'){$('#cfg').hidden=true;return}
  if(t.id==='cfgSalvarConta'){const c=Object.assign({},CONTA,lerConta('c_'));if(!c.nome||!c.whats){toast('Nome e WhatsApp são obrigatórios.');return}CONTA=c;LS.set('conta',c);applyConta();render();toast('Registro atualizado.');return}
  if(t.id==='cfgSalvarLink'){let v=$('#cfgLink').value.trim();if(v&&!/^https?:\/\//i.test(v))v='https://'+v;CONTA.link=v;LS.set('conta',CONTA);applyConta();$('#cfgLink').value=APP_URL;toast('Link salvo.');return}
  if(t.id==='cfgExport'){exportarBackup();return}
  if(t.id==='cfgSair'){SS.set('ok','');$('#cfg').hidden=true;S.mode='pin';render();return}
  if(t.id==='cfgPin'){
    if((await hashPin($('#cp_old').value))!==CONTA.pinHash){toast('PIN atual incorreto.');return}
    const n=$('#cp_new').value;if(!/^\d{4,8}$/.test(n)||n!==$('#cp_new2').value){toast('O novo PIN precisa ter de 4 a 8 números e ser igual nos dois campos.');return}
    CONTA.pinHash=await hashPin(n);LS.set('conta',CONTA);toast('PIN trocado.');$('#cfgBody').innerHTML=rebrand(cfgHTML());return;
  }
  if(t.id==='cfgZerar'){if(t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='Confirmar: apagar tudo deste aparelho';return}
    try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('proinnovar.')===0&&k!=='proinnovar.conta'&&k!=='proinnovar.perfilAparelho')ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(x){}
    location.reload();return}
  if(t.id==='impJuntar'||t.id==='impSubst'){if(!importPend)return;aplicarBackup(importPend,t.id==='impSubst'?'substituir':'juntar');importPend=null;toast('Backup importado. Recarregando…');setTimeout(()=>location.reload(),600);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cfgImport'&&t.files&&t.files[0]){lerBackup(t.files[0],p=>{importPend=p;const d=p.dados;$('#cfgImportBox').innerHTML=`<div class="opt"><p style="margin:0"><b>Backup de ${new Date(p.exportado).toLocaleString('pt-BR')}</b> · ${(d.leads||[]).length} lead(s) · ${(d.agenda||[]).length} compromisso(s)</p><div class="row"><button class="btn pri" type="button" id="impJuntar">Juntar com este aparelho</button><button class="btn ghost" type="button" id="impSubst">Substituir tudo</button></div><p class="small muted" style="margin:0">"Juntar" mantém o que já existe aqui e acrescenta o backup. "Substituir" troca leads, agenda e planos deste aparelho pelos do backup.</p></div>`})}
  if(t.id==='regImport'&&t.files&&t.files[0]){lerBackup(t.files[0],p=>{
    if(!p.dados.conta){toast('Este backup não tem registro. Preencha o formulário acima e importe depois em Configurações.');return}
    aplicarBackup(p,'juntar');LS.set('conta',p.dados.conta);LS.set('perfilAparelho','owner');toast('Backup importado. Digite o seu PIN.');setTimeout(()=>location.reload(),600)})}
});

/* ---------- INÍCIO ---------- */
function start(){
  S.mod=S.role==='owner'?(LS.get('modo','imob')==='cons'?'cons':'imob'):S.role;
  S.mode='local';
  S.leads=LS.get('leads',null);
  if(!S.leads){const ex=EXEMPLOS.map(x=>({...x}));S.leads=S.role==='owner'?ex:ex.filter(l=>l.mod===S.mod);LS.set('leads',S.leads)}
  S.agenda=LS.get('agenda',[]);
  S.oport=LS.get('oport',[]);
  loadModState();
  if(location.hash){const h=location.hash.slice(1);if(tabs().some(t=>t[0]===h))S.tab=h}
  render();
}
function init(){
  CONTA=LS.get('conta',null);
  if(!CONTA){S.mode='registro';render();return}
  applyConta();
  const p=LS.get('perfilAparelho',null);
  if(!p){S.mode='escolha';render();return}
  if(p==='owner'&&SS.get('ok')!=='1'){S.mode='pin';render();return}
  S.role=p;start();
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
init();
})();
</script>
