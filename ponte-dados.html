<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Levando seus dados • Marca &amp; Estratégia Tecnologia</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A1628;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0A1628;padding:16px;box-sizing:border-box}
.c{background:#fff;border-radius:16px;max-width:380px;width:100%;padding:24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.m{font-size:11px;letter-spacing:1.2px;font-weight:700;color:#C9960C;text-transform:uppercase;margin:0 0 4px}
h1{font-size:21px;margin:0 0 8px}p{margin:6px 0;color:#334}
.ok{background:#E8F5EC;color:#1E5B32;border-radius:10px;padding:10px 12px;margin-top:12px}
.er{background:#FDECEC;color:#8A1C1C;border-radius:10px;padding:10px 12px;margin-top:12px}
button{font:700 15px system-ui;border:0;border-radius:10px;padding:12px;width:100%;margin-top:14px;background:#0A1628;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="c">
<p class="m">Marca &amp; Estratégia Tecnologia</p>
<h1 id="t">Levando seus dados…</h1>
<p id="s">Estou copiando os dados deste aparelho para o novo endereço do app.</p>
<div id="r"></div>
</div>
<script>
/* Ponte de dados: roda no endereço antigo (aap29.github.io), lê os dados que ficaram aqui
 * neste aparelho e entrega SOMENTE para o novo endereço oficial do app que abriu esta janela.
 * Nada sai do aparelho: a cópia vai de uma aba para a outra. */
(function(){
"use strict";
var APPS = {
  "prospectarion":            {para:"https://prospectarion.github.io",   prefixos:["prospectarion"], idb:[]},
  "pro-imobiliaria":          {para:"https://pro-imobiliaria.github.io", prefixos:["proinnovar."],   idb:[]},
  "social-imob-360":          {para:"https://social-imob-360.github.io", prefixos:["sipro_"],        idb:["SOCIAL_IMOB_PRO_CLIENTE","SOCIAL_IMOB_PRO_VIDEOS"]},
  "social-imob-360-criador":  {para:"https://social-imob-360.github.io", prefixos:["si_"],           idb:["SOCIAL_IMOB_360_PRO","SOCIAL_IMOB_VIDEOS"]}
};
var q = new URLSearchParams(location.search), app = q.get("app"), para = q.get("para"), C = APPS[app];
var t = document.getElementById("t"), s = document.getElementById("s"), r = document.getElementById("r");
function erro(m){ t.textContent = "Não foi possível"; s.textContent = ""; r.innerHTML = '<div class="er"></div>'; r.firstChild.textContent = m; }
if(!C || para !== C.para){ erro("Este pedido não veio de um app oficial."); return; }
if(!window.opener){ erro("Abra esta página pelo botão “Trazer meus dados do endereço antigo”, dentro do app novo."); return; }

function lerLS(){
  var o = {};
  for(var i = 0; i < localStorage.length; i++){
    var k = localStorage.key(i);
    if(C.prefixos.some(function(p){ return k.indexOf(p) === 0; })) o[k] = localStorage.getItem(k);
  }
  return o;
}
function existe(nome){
  if(!indexedDB.databases) return Promise.resolve(true);
  return indexedDB.databases().then(function(l){ return l.some(function(x){ return x.name === nome; }); });
}
function lerBanco(nome){
  return existe(nome).then(function(sim){
    if(!sim) return null;
    return new Promise(function(ok, falha){
      var req = indexedDB.open(nome);
      req.onerror = function(){ falha(req.error); };
      req.onsuccess = function(){
        var db = req.result, lojas = [].slice.call(db.objectStoreNames);
        var out = {nome:nome, versao:db.version, lojas:[]};
        if(!lojas.length){ db.close(); return ok(out); }
        var tx = db.transaction(lojas, "readonly");
        lojas.forEach(function(ln){
          var os = tx.objectStore(ln), l = {nome:ln, keyPath:os.keyPath, autoIncrement:os.autoIncrement, indices:[], registros:[]};
          [].forEach.call(os.indexNames, function(ix){ var i = os.index(ix); l.indices.push({nome:ix, keyPath:i.keyPath, unique:i.unique, multiEntry:i.multiEntry}); });
          os.openCursor().onsuccess = function(e){ var c = e.target.result; if(c){ l.registros.push({k:c.primaryKey, v:c.value}); c.continue(); } };
          out.lojas.push(l);
        });
        tx.oncomplete = function(){ db.close(); ok(out); };
        tx.onerror = function(){ db.close(); falha(tx.error); };
      };
    });
  });
}
Promise.all(C.idb.map(lerBanco)).then(function(bancos){
  var dados = {tipo:"ponte-dados", app:app, gerado:new Date().toISOString(), ls:lerLS(), idb:bancos.filter(Boolean)};
  var n = Object.keys(dados.ls).length + dados.idb.reduce(function(a, b){ return a + b.lojas.reduce(function(x, l){ return x + l.registros.length; }, 0); }, 0);
  window.addEventListener("message", function(e){
    if(e.origin !== C.para || !e.data || e.data.tipo !== "ponte-ok") return;
    t.textContent = "Dados entregues ✓"; s.textContent = "Pode fechar esta janela e continuar no app novo.";
    setTimeout(function(){ window.close(); }, 2500);
  });
  window.opener.postMessage(dados, C.para);
  t.textContent = n ? "Dados enviados" : "Nada encontrado aqui";
  s.textContent = n ? n + " itens enviados para o app novo. Aguarde a confirmação…" : "Este aparelho não tem dados deste app no endereço antigo.";
  r.innerHTML = '<button type="button" onclick="window.close()">Fechar</button>';
}).catch(function(e){ erro("Falha ao ler os dados: " + (e && e.message || e)); });
})();
</script>
</body>
</html>
