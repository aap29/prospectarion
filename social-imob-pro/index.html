<link rel="manifest" id="mf" href="manifest.webmanifest">
<title>Social Imob 360 PRO</title>
<style>
:root{
  --bg:#F7F4EC; --surface:#FFFFFF; --row:#F5F6F8; --row2:#EEF0F4; --line:#E3E6EC;
  --txt:#323338; --mut:#676879; --blue:#579BFC; --navy:#1F4E8C;
  --acc:#FF7A45; --acc2:#FFB38A; --ok:#00C875; --bad:#E2445C; --warn:#FDAB3D; --dark:#333333;
  --r:12px; --fs:14.5px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Figtree,Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,Menlo,Consolas,"Roboto Mono",monospace}
body.dev-tablet{--fs:15px}
body.dev-pc{--fs:14.5px}

/* Cabeçalho + abas */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;max-width:1280px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.hrow h1{font-size:18px}
.hrow h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.hbtn{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
img.logo{background:none;object-fit:cover}
.inst-logo{width:96px;height:96px;border-radius:22px;display:block;margin:4px auto 10px;box-shadow:0 6px 18px rgba(242,85,44,.35)}
.passo{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0}
.passo b.n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.big-cta{width:100%;padding:16px;font-size:17px}
body.standalone #btnInstalar{display:none}
/* Estúdio: câmera + teleprompter */
body.no-scroll{overflow:hidden}
.nova-versao{position:fixed;left:12px;right:12px;bottom:84px;z-index:150;background:#323338;color:#fff;border-radius:12px;padding:10px 14px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px #0004}
.pre{white-space:pre-wrap;background:#F5F6F8;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;max-height:280px;overflow:auto}
.ra-it{align-items:flex-start;flex-wrap:wrap}.ra-it .grow{flex:1 1 calc(100% - 40px);min-width:0}.ra-bt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;padding-left:34px}
.ed-hist{display:flex;gap:6px;margin-left:auto;margin-right:8px}
.toast button{color:#323338}
#studio{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:none;overflow:hidden;font-family:inherit}
#studio.on{display:block}
.st-top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#202124;position:relative;z-index:5}
.st-top-flutua{position:absolute;top:0;left:0;right:0;background:linear-gradient(#000c,#0000)}
.st-tit{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}

.tile .side{text-align:right;font-size:12px;line-height:1.5}
.tile .ic{font-size:34px}
.badge-up{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--ok);align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-left:4px}
.badge-dn{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--bad);align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-left:4px}

/* Listas */
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .t{font-weight:600}
.it .m{font-size:12px;color:var(--mut)}
.it .grow{flex:1;min-width:0}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.col{flex:0 0 84%;max-width:310px;background:var(--row);border-radius:12px;min-height:220px;overflow:hidden}
body.dev-pc .col,body.dev-tablet .col{flex:1 1 0;max-width:none;min-width:200px}
.col h3{font-size:14px;display:flex;justify-content:space-between;margin:0;padding:9px 11px;color:#fff}
.col .cb{padding:8px}
.kc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.kc .t{font-size:13px;font-weight:600}
.kc .m{font-size:11px;color:var(--mut);margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.kc .mv{display:flex;justify-content:space-between;margin-top:7px}
.kc .mv button{background:var(--row);border:1px solid var(--line);border-radius:6px;padding:2px 12px;cursor:pointer}
.col.drop{outline:2px dashed var(--acc)}

/* Calendário estilo Swonkie / Magnific */
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;color:var(--mut);text-align:center;padding:4px 0;font-weight:700;text-transform:uppercase}
.cal .d{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:64px;padding:4px;cursor:pointer;overflow:hidden}
.cal .d.out{background:transparent;border-style:dashed;opacity:.5}
.cal .d.hoje{border:2px solid var(--acc)}
.cal .d.sel{background:#FFF6F1}
.cal .d .n{font-size:12px;font-weight:700;margin-bottom:2px}
.cal .d .n i{display:inline-block;background:var(--ok);color:#fff;border-radius:3px;padding:0 4px;font-style:normal}
.mini{border-radius:4px;margin-top:3px;overflow:hidden;background:var(--row);font-size:10px;line-height:1.25}
.mini .s{color:#fff;font-weight:700;padding:1px 4px;text-transform:uppercase;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .x{padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:10px;color:var(--mut);margin-top:2px}
body.dev-celular .mini .x{display:none}
body.dev-celular .mini .s{font-size:0;height:5px;padding:0}
body.dev-pc .cal .d{min-height:110px}
.wk{display:grid;grid-template-columns:1fr;gap:10px}
body.dev-pc .wk,body.dev-tablet .wk{grid-template-columns:repeat(7,minmax(0,1fr))}
.wkd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:90px}
.wkd .dh{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.wcard{border-radius:6px;overflow:hidden;margin-bottom:6px;cursor:pointer;border:1px solid var(--line)}
.wcard .s{color:#fff;font-weight:700;padding:4px 8px;font-size:12px;text-align:center}
.wcard .b{padding:6px 8px;font-size:12px;background:var(--surface)}
.wcard .b b{font-weight:700}

/* Grade 30 dias (SlideKit) */
.g30{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
body.dev-celular .g30{grid-template-columns:repeat(2,1fr)}
.g30 .gc{border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.g30 .gc .gh{color:#fff;font-weight:800;font-size:22px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center}
.g30 .gc .gh small{font-size:11px;font-weight:600;opacity:.9}
.g30 .gc .gb{padding:8px 10px;font-size:12px;min-height:58px}
.g30 .gc.hoje{outline:3px solid var(--acc)}

/* Semestre (SlideTeam) */
.sem .mh2{background:var(--acc);color:#fff;font-weight:800;padding:8px 12px;border-radius:8px 8px 0 0}
.sem .mb{background:#FFF5EE;border:1px solid #FFD9C6;border-top:0;border-radius:0 0 8px 8px;padding:10px 12px;margin-bottom:12px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(30,30,40,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:760px){.ov{align-items:center}.modal{border-radius:16px}}
.modal .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.modal .mh h2{font-size:19px}
.modal .mh .x{margin-left:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dark);color:#fff;font-weight:600;padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.panel-n{display:inline-flex;width:24px;height:24px;border-radius:6px;background:var(--acc);color:#fff;font-weight:800;font-size:13px;align-items:center;justify-content:center;margin-right:6px}
.bar{height:10px;background:var(--row2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.score{font-size:40px;font-weight:800}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td,.spec th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.spec th{font-size:12px;color:var(--mut)}
.counter{font-size:12px;font-weight:700;text-align:right;margin-top:3px}
.counter.over{color:var(--bad)}
.imv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.devs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dev{border:2px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;background:var(--surface)}
.dev b{display:block;font-size:30px}
.dev.on{border-color:var(--acc);background:#FFF1EA}

/* ===== Identidade v3.9.1: cores e layout da Marca & Estratégia ===== */
:root{ --bg:#F3F9FF; --surface:#FFFFFF; --row:#F4F9FE; --row2:#E9F4FC; --line:#DCEBF7; --txt:#14233D; --mut:#5D6E86;
  --blue:#00A9FC; --sky:#00A9FC; --sky2:#0280E8; --navy:#001637; --acc:#FE5101; --acc2:#FF8A3D; --r:16px; }
html,body{background:radial-gradient(900px 340px at -8% -6%, rgba(0,169,252,.16), transparent 62%), radial-gradient(720px 300px at 108% 2%, rgba(85,219,254,.16), transparent 60%), var(--bg);background-attachment:fixed}
h1,h2,h3,.grp-h,.tabs button,.btn,.title-row h2,.mh h2,.tile .big{font-family:Poppins,Figtree,Roboto,"Segoe UI",system-ui,sans-serif}
h1,h2{color:var(--navy);font-weight:800;letter-spacing:-.15px}
h3{color:var(--navy)}
header.top{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hrow h1{line-height:1.05}
.hrow h1 .marca{font-family:"Baloo 2",Poppins,system-ui,sans-serif;font-weight:800;font-size:1.32em;letter-spacing:.2px;color:#FE5101;background:linear-gradient(180deg,#FF8A1F,#FE5101);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hrow h1 .pro{color:var(--sky);font-family:Poppins,system-ui,sans-serif;font-weight:800;font-size:.95em;white-space:nowrap}
.hrow h1 small{margin-top:3px}
img.logo{width:40px;height:40px;border-radius:11px;box-shadow:0 4px 12px rgba(2,128,232,.35)}
.tabs{background:linear-gradient(120deg,#16BBFF 0%,#00A6FA 45%,#0280E8 100%);box-shadow:0 6px 18px rgba(2,128,232,.32)}
.tabs button{color:rgba(255,255,255,.95);font-weight:600}
.tabs button:hover{background:rgba(255,255,255,.16)}
.tabs button.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:0 4px 14px rgba(0,22,55,.20)}
.tabs .tsep{background:rgba(255,255,255,.4)}
.tseta{color:var(--sky2)}
.card{border-radius:18px;border:1px solid #E2EEF9;box-shadow:0 6px 20px rgba(0,110,200,.07)}
.card h2,.title-row h2{color:var(--navy)}
.btn{border-radius:12px;border-color:#D4E6F6;font-weight:600}
.btn:hover{border-color:var(--sky)}
.btn.acc{background:linear-gradient(135deg,#FF7A1A,#FE5101);border:0;border-radius:999px;color:#fff;box-shadow:0 6px 16px rgba(254,81,1,.28);padding-left:18px;padding-right:18px}
.btn.acc:hover{filter:brightness(1.05)}
.btn.hh{border-radius:999px}
.fab{background:linear-gradient(135deg,#FF7A1A,#FE5101);box-shadow:0 8px 22px rgba(254,81,1,.42)}
.chip{border-color:#D4E6F6}
.chip.on{border-color:var(--acc);background:#FFF1E8;color:#C8410A}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=url],select,textarea{border-radius:12px;border-color:#D4E6F6}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,169,252,.18)}
.nnum{color:#0267C1;background:#E3F4FF}
.inst-logo{box-shadow:0 8px 22px rgba(2,128,232,.38)}
.passo b.n{background:linear-gradient(135deg,#16BBFF,#0280E8)}
table.mt td.nm{border-radius:10px 0 0 10px}
table.mt td:last-child{border-radius:0 10px 10px 0}
</style>

function abrirDB(){
  return new Promise(function(res, rej){
    var r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = function(){
      var d = r.result;
      if(!d.objectStoreNames.contains('conteudos')) d.createObjectStore('conteudos', {keyPath:'id'});
      if(!d.objectStoreNames.contains('imoveis')) d.createObjectStore('imoveis', {keyPath:'id'});
      if(!d.objectStoreNames.contains('config')) d.createObjectStore('config', {keyPath:'k'});
    };
    r.onsuccess = function(){ db = r.result; res(); };
    r.onerror = function(){ rej(r.error); };
  });
}
function lerTudo(store){
  return new Promise(function(res, rej){
    var q = db.transaction(store, 'readonly').objectStore(store).getAll();
    q.onsuccess = function(){ res(q.result || []); };
    q.onerror = function(){ rej(q.error); };
  });
}
// todas as requisições disparadas de forma síncrona na mesma transação
function gravar(store, itens){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readwrite'); var st = tx.objectStore(store);
    itens.forEach(function(i){ st.put(i); });
    tx.oncomplete = function(){ res(); };
    tx.onerror = function(){ rej(tx.error); };
    tx.onabort = function(){ rej(tx.error); };
  });
}
function apagar(store, id){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(id);
    tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); };
  });
}

var PALAVRAS_POR_SEG = 2.5; /* ~150 palavras por minuto, fala natural em português */

  'Reel':{min:20, max:60, txt:'Reel: 30 a 60 s (ideal até 40 s)'},

}

  var msg = {ok:'✔ dentro do tempo sugerido', curto:'⚠ texto curto: complete o texto falado', longo:'⚠ passou do tempo sugerido: corte ou divida', vazio:'escreva o texto completo'}[i.status] || '';

function tituloLimpo(t){ return String(t||'').replace(/^[^\wÀ-ÿ]*/,'').replace(/^\d{1,2}\/\d{1,2}\s*\|\s*[^|]*\|\s*/,'').replace(/^(DOM|SEG|TER|QUA|QUI|SEX|SÁB|SAB)\s*\|\s*/i,'').replace(/^(🎬|📌|🎠|📸|🎥)\s*/,'').trim(); }
var ROTULO_RE = /(CART[ÃA]O|STORY|SLIDE)\s*(\d+|FINAL|\(capa\))?\s*(\([^)]*\))?\s*:\s*/gi;

  var p = perfil(c.perfil), rot = semNotas(c.roteiro), partes = [], cta = (c.cta || p.cta || '').trim();

    var topicos = []; rot.replace(/BLOCO \d+\s*[—-]\s*([^(\n]+?)\s*\(/g, function(m, t){ topicos.push('• '+t.trim().charAt(0)+t.trim().slice(1).toLowerCase()); return m; });
    partes.push(gancho || tituloLimpo(c.titulo)); if(topicos.length) partes.push('Neste vídeo:\n'+topicos.join('\n'));

/* lixeira: excluídos ficam 30 dias */
function lixeira(){ S.cfg.lixeira = (S.cfg.lixeira||[]).filter(function(x){ return Date.now()-x.em < 30*864e5; }); return S.cfg.lixeira; }
function paraLixeira(c){ lixeira().unshift({em:Date.now(), item:JSON.parse(JSON.stringify(c))}); return salvarCfg(); }
function tirarDaLixeira(id){ S.cfg.lixeira = lixeira().filter(function(x){ return x.item.id!==id; }); return salvarCfg(); }
function excluirConteudo(c){
  registrarHist(c, null, 'exclusão de "'+c.titulo+'"');
  return paraLixeira(c).then(function(){ return apagar('conteudos', c.id); }).then(function(){ S.conteudos = S.conteudos.filter(function(x){ return x.id!==c.id; }); });
}
function restaurarDaLixeira(id){ var e = lixeira().filter(function(x){ return x.item.id===id; })[0]; if(!e) return Promise.resolve(); registrarHist(null, e.item, 'restauração'); return salvarConteudo(e.item).then(function(){ return tirarDaLixeira(id); }); }
function telaLixeira(){
  var l = lixeira();
  abrirModal('<div class="mh"><h2>🗑️ Lixeira ('+l.length+')</h2><button class="btn sm ghost x" data-act="fechar">✕</button></div><p class="sub">Conteúdos excluídos ficam aqui por 30 dias. Toque em Restaurar para trazer de volta.</p><div class="list">'+
    (l.length ? l.map(function(x){ var c = x.item; return '<div class="it"><i class="dot" style="background:'+perfil(c.perfil).cor+'"></i><div class="grow"><div class="t">'+esc(c.titulo)+'</div><div class="m">'+esc(perfil(c.perfil).arroba)+' · excluído em '+new Date(x.em).toLocaleDateString('pt-BR')+'</div></div><button class="btn sm" data-restaurar="'+c.id+'">Restaurar</button></div>'; }).join('') : '<div class="empty">Lixeira vazia.</div>')+'</div>');
  $all('#modal [data-restaurar]').forEach(function(b){ b.onclick = function(){ restaurarDaLixeira(b.dataset.restaurar).then(function(){ toast('Restaurado ✔'); telaLixeira(); render(); }); }; });
}

/* ================= Roteiros reformulados (texto completo pronto) ================= */
function ehEsboco(c){ var r = String(c.roteiro||'').trim(); return !r || /^V1\b/.test(r) || /^(Dois imóveis|Postar d|Imóveis manhã|Até 40 segundos|Vídeo de \d)/i.test(r) || contarPalavras(r) < 20; }
function reformDe(c){
  if(c.notionId && REFORM.R[c.notionId]) return REFORM.R[c.notionId];
  if(/imóveis manhã e tarde/i.test(c.titulo||'') || /dois imóveis/i.test(c.roteiro||'')) return REFORM.POST;
  return null;
}
function aplicarReformulados(lista){
  var mud = [];
  (lista||S.conteudos).forEach(function(c){
    var rf = reformDe(c); if(!rf || !ehEsboco(c)) return;
    var antigo = c.roteiro, legAuto = !String(c.legenda||'').trim() || (c.historico||[]).some(function(h){ return /montadas automaticamente/.test(h.txt); });
    if(antigo) registrar(c, 'Esboço original guardado: '+antigo);
    var tv = (String(antigo||'').match(/V1\s+([^.]+)/)||[])[1]; if(tv && !String(c.tema||'').trim()) c.tema = tv.trim();
    c.roteiro = rf.r; if(!String(c.gancho||'').trim()) c.gancho = rf.g;
    if(legAuto) c.legenda = montarDescricao(c);
    registrar(c, 'Texto completo reformulado pelo assistente (revise antes de gravar)'); mud.push(c);
  });
  return gravar('conteudos', mud).then(function(){ return mud.length; });
}

var ANGULOS = [

var REGRAS_REDE = {
  'Instagram':'Reels de 30 a 60 s com gancho nos 3 primeiros segundos, texto na tela, legenda curta com 3 a 5 hashtags. Sinais que mais pesam: retenção, compartilhamentos e salvamentos.',
  'Facebook':'Reels e vídeos curtos com legenda; grupos locais ampliam o alcance. Sinais: compartilhamentos e comentários.',
  'YouTube':'Shorts até 60 s ou vídeo longo de 5 a 12 min com título que promete um resultado e capa clara. Sinais: retenção e cliques na capa.',
  'TikTok':'Vídeo de 15 a 60 s, começo direto, legenda e áudio em alta. Sinais: assistir até o fim, rever e compartilhar.',

  'WhatsApp':'Status e listas: mensagem curta com uma única ação.',

function lc(t){ t = String(t||'').trim(); return /^[A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-záéíóúâêôãõç]/.test(t) ? t.charAt(0).toLowerCase()+t.slice(1) : t; }
function temaEsboco(c){ var h = (c.historico||[]).filter(function(x){ return /^Esboço original guardado: /.test(x.txt); })[0]; var t = h ? h.txt.replace(/^Esboço original guardado: /,'') : (/^V1\b/.test(c.roteiro||'') ? c.roteiro : ''); var m = t.match(/V1\s+([^.]+)/); return m ? m[1].trim() : ''; }
function temaDe(c){ return (c.tema && c.tema.trim()) || temaEsboco(c) || tituloLimpo(c.titulo).replace(/^(V[ií]deos? \d.*|Reel #\d+\s*[—-]\s*)/i,'').trim() || 'este assunto'; }
function frasesDe(t){ return String(t||'').replace(/VÍDEO \d\n/g,' ').replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).filter(function(s){ return contarPalavras(s)>=4; }); }
function novaAbordagem(c, angK, rede){
  var a = ANGULOS.filter(function(x){ return x.k===angK; })[0] || ANGULOS[0], t = temaDe(c), p = perfil(c.perfil);
  var rf = reformDe(c), base = ehEsboco(c) && rf ? rf.r : c.roteiro, fr = frasesDe(base);
  var miolo = fr.filter(function(s){ return !/^Eu sou|Comente|Me chama|Até a próxima/i.test(s); }).slice(0, a.k==='dicas'?3:4);
  if(a.k==='dicas') miolo = miolo.map(function(s,i){ return (i+1)+') '+s; });
  var cta = (c.cta||p.cta||'').trim();
  var txt = a.g(t) + '\n\n' + miolo.join(' '+(a.k==='dicas'?'\n':'')) + (p.assinatura ? '\n\n'+p.assinatura : '') + (cta ? '\n\n'+(/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9 \/]+$/.test(cta) ? 'Comente '+cta.split('/')[0].trim()+'.' : cta) : '');
  return {gancho:a.g(t), roteiro:txt, como:a.e, regra:REGRAS_REDE[rede]||'Confira o guia da rede na aba Redes.'};
}
function motivoMetricas(c){
  var r = redeDe(c), pubs = S.conteudos.filter(function(x){ return x.perfil===c.perfil && x.etapa==='Publicado' && taxaEng(x)!==null; });
  if(pubs.length < 3) return 'Ainda há poucos posts com números neste perfil ('+pubs.length+'). Registre alcance e interações 48 h depois de publicar para o app personalizar as sugestões.';
  var med = pubs.reduce(function(s,x){ return s+taxaEng(x); },0)/pubs.length;
  var porFmt = {}; pubs.forEach(function(x){ (porFmt[x.formato]=porFmt[x.formato]||[]).push(taxaEng(x)); });
  var melhor = Object.keys(porFmt).map(function(k){ return [k, porFmt[k].reduce(function(s,v){return s+v;},0)/porFmt[k].length]; }).sort(function(a,b){ return b[1]-a[1]; })[0];
  var esse = taxaEng(c);
  return 'Média de engajamento deste perfil: '+med.toFixed(1)+'%. Melhor formato até agora: '+melhor[0]+' ('+melhor[1].toFixed(1)+'%).'+(esse!==null ? ' Este conteúdo teve '+esse.toFixed(1)+'%: '+(esse>=med*1.3?'acima da média, vale repetir o tema em outra rede.':esse<=med*0.7?'abaixo da média, troque o gancho e o horário.':'na média; teste um gancho mais forte.') : '');
}
function promptClaude(c, abordagem){
  var p = perfil(c.perfil), r = redeDe(c);
  return ['Use a skill "reutilizar-conteudo-360".', 'Perfil: '+p.arroba+' ('+p.nome+') · Rede: '+r+' · Formato: '+c.formato, 'Objetivo: '+(c.objetivo||'—')+' · CTA: '+(c.cta||p.cta||'—'),
    'Título atual: '+c.titulo, 'Texto atual:\n'+(c.roteiro||'—'), 'Resultados: '+(taxaEng(c)!==null ? 'engajamento '+taxaEng(c).toFixed(1)+'%, alcance '+num((c.metricas||{}).alcance) : 'sem números registrados'),
    'Contexto do perfil: '+motivoMetricas(c), abordagem ? 'Abordagem desejada: '+abordagem : '',
    'Entregue: título, gancho de 3 s, texto completo com tempo de fala, descrição para publicar, hashtags e o porquê das escolhas.'].filter(Boolean).join('\n\n');
}

function vCalendario(){

    }

  } else {
    var dia = UI.diaSel || hoje();

  var lac = lacunas(UI.gapPerfil);
  s += lac.length ? lac.map(function(g){ return '<div class="it"><b>📌</b><div class="grow"><div class="t">'+DIAS[dow(g.data)]+' '+dataBR(g.data)+' · '+g.formato+'</div><div class="m">Sem conteúdo planejado</div></div><button class="btn sm" data-encaixar="'+g.data+'|'+g.formato+'">Encaixar</button></div>'; }).join('') : '<div class="empty">Semana coberta para este perfil. ✅</div>';

function cartaoDia(k, lst){

function lacunas(pk){
  var out = [], h = hoje();
  for(var i=0;i<7;i++){
    var d = addDias(h,i), w = dow(d), precisa = [];
    if(S.cfg.cadencia[w]) precisa.push(S.cfg.cadencia[w]);

    precisa.forEach(function(f){
      var tem = S.conteudos.some(function(c){ return c.perfil===pk && c.data===d && (c.formato===f || (f!=='YouTube' && c.formato!=='YouTube' && c.formato!=='Story')); });
      if(!tem) out.push({data:d, formato:f});
    });
  }
  return out;
}

/* ---------- REDES: assistentes por rede ---------- */
function dadosRede(r){ return S.conteudos.filter(function(c){ return redeDe(c)===r; }); }
function insights(r){
  var pubs = dadosRede(r).filter(function(c){ return c.etapa==='Publicado' && taxaEng(c)!==null; });
  var out = {n:pubs.length};
  if(!pubs.length) return out;
  out.media = pubs.reduce(function(a,c){ return a+taxaEng(c); },0)/pubs.length;
  function agrupa(fn){ var g={}; pubs.forEach(function(c){ var k=fn(c); if(k==null||k==='') return; (g[k]=g[k]||[]).push(taxaEng(c)); }); return Object.keys(g).filter(function(k){ return g[k].length>=2; }).map(function(k){ return {k:k, n:g[k].length, m:g[k].reduce(function(a,b){return a+b;},0)/g[k].length}; }).sort(function(a,b){ return b.m-a.m; }); }
  out.dias = agrupa(function(c){ return c.data ? DIAS_L[dow(c.data)] : null; });
  out.horas = agrupa(function(c){ if(!c.hora) return null; var h=+c.hora.split(':')[0]; return h<9?'Manhã cedo (até 9h)':h<12?'Manhã (9h–12h)':h<14?'Almoço (12h–14h)':h<18?'Tarde (14h–18h)':h<21?'Noite (18h–21h)':'Noite tarde (21h+)'; });
  out.formatos = agrupa(function(c){ return c.formato; });
  out.perfis = agrupa(function(c){ return perfil(c.perfil).arroba; });
  out.top = pubs.slice().sort(function(a,b){ return taxaEng(b)-taxaEng(a); }).slice(0,5);
  out.leads = pubs.reduce(function(a,c){ return a+num((c.metricas||{}).leads); },0);
  return out;
}
function auditoria(r){
  var cs = dadosRede(r), h = hoje();
  var pub30 = cs.filter(function(c){ return c.etapa==='Publicado' && c.data>addDias(h,-30) && c.data<=h; });
  var semanas = 0; for(var w=0; w<4; w++){ var ini=addDias(h,-7*(w+1)), fim=addDias(h,-7*w); if(cs.some(function(c){ return c.etapa==='Publicado' && c.data>ini && c.data<=fim; })) semanas++; }
  var pubs = cs.filter(function(c){ return c.etapa==='Publicado'; });
  var comMet = pubs.filter(function(c){ return taxaEng(c)!==null; }).length;
  var comCta = cs.filter(function(c){ return c.cta && c.cta.trim(); }).length;
  var comLink = pubs.filter(function(c){ return c.link; }).length;
  var meta = r==='Google' ? 4 : r==='YouTube' ? 8 : 12;
  var auto = [
    ['freq', 'Frequência: '+pub30.length+' publicações em 30 dias (meta '+meta+')', pub30.length>=meta, 'Planeje pelo menos '+Math.ceil(meta/4)+' publicações por semana nesta rede. Use “Gerar mês pelo modelo” em Ajustes → 5.'],
    ['consist', 'Constância: publicou em '+semanas+' das últimas 4 semanas', semanas>=4, 'Não deixe semana vazia: o algoritmo favorece contas constantes.'],
    ['medicao', 'Medição: '+comMet+' de '+pubs.length+' publicados com números', pubs.length>0 && comMet/pubs.length>=0.7, 'Registre alcance e interações 48 h depois de publicar (ficha do conteúdo → Resultados).'],
    ['cta', 'Chamada para ação: '+comCta+' de '+cs.length+' conteúdos', cs.length>0 && comCta/cs.length>=0.8, 'Todo conteúdo deve terminar com uma única próxima ação.'],
    ['link', 'Links salvos: '+comLink+' de '+pubs.length+' publicados', pubs.length>0 && comLink/pubs.length>=0.8, 'Cole o link publicado para acompanhar e reaproveitar.']
  ];
  var man = (AUDIT_MANUAL[r]||[]).map(function(x){ var ok = !!((S.cfg.auditoria[r]||{})[x[0]]); return [x[0], x[1], ok, 'Ajuste: '+x[1].toLowerCase()+'.', true]; });
  var todos = auto.concat(man), ok = todos.filter(function(x){ return x[2]; }).length;
  return {itens:todos, nota: todos.length ? Math.round(ok/todos.length*100) : 0};
}

function parseCSV(txt){
  txt = txt.replace(/^﻿/, '');
  var primeira = txt.split(/\r?\n/)[0] || '';
  var sep = (primeira.split(';').length > primeira.split(',').length) ? ';' : ',';
  var rows = [], row = [], cel = '', q = false;
  for(var i=0;i<txt.length;i++){
    var ch = txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cel+='"'; i++; } else q=false; } else cel += ch; }
    else {
      if(ch==='"') q = true;
      else if(ch===sep){ row.push(cel); cel=''; }
      else if(ch==='\n'){ row.push(cel); rows.push(row); row=[]; cel=''; }
      else if(ch==='\r'){ }
      else cel += ch;
    }
  }
  if(cel!=='' || row.length){ row.push(cel); rows.push(row); }
  if(!rows.length) return [];
  var cab = rows[0].map(norm);
  return rows.slice(1).filter(function(r){ return r.some(function(x){ return x && x.trim(); }); }).map(function(r){
    var o = {}; cab.forEach(function(k,i){ o[k] = (r[i]||'').trim(); }); return o;
  });
}

function lerZip(buf){
  var dv = new DataView(buf), eocd = -1;

  var total = dv.getUint16(eocd+10,true), off = dv.getUint32(eocd+16,true), itens = [];
  for(var k=0;k<total;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    var metodo = dv.getUint16(off+10,true), tam = dv.getUint32(off+20,true), nl = dv.getUint16(off+28,true), el = dv.getUint16(off+30,true), cl = dv.getUint16(off+32,true), lho = dv.getUint32(off+42,true);
    var nome = new TextDecoder().decode(new Uint8Array(buf, off+46, nl));
    off += 46+nl+el+cl;
    var ini = lho + 30 + dv.getUint16(lho+26,true) + dv.getUint16(lho+28,true);
    itens.push({nome:nome, metodo:metodo, dados:new Uint8Array(buf, ini, tam)});
  }
  return Promise.all(itens.map(function(it){
    if(it.metodo===0) return Promise.resolve({nome:it.nome, bytes:it.dados});
    if(it.metodo===8){
      if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('Este navegador não abre ZIP. Extraia e envie o CSV.'));
      return new Response(new Blob([it.dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(b){ return {nome:it.nome, bytes:new Uint8Array(b)}; });
    }
    return Promise.resolve(null);
  })).then(function(r){ return r.filter(Boolean); });
}
function csvsDeArquivo(nome, buf){
  if(/\.zip$/i.test(nome)){
    return lerZip(buf).then(function(arqs){
      return Promise.all(arqs.map(function(a){
        if(/\.zip$/i.test(a.nome)) return csvsDeArquivo(a.nome, a.bytes.slice().buffer);
        if(/\.csv$/i.test(a.nome)) return [{nome:a.nome, txt:new TextDecoder().decode(a.bytes)}];
        return [];
      })).then(function(l){ return [].concat.apply([], l); });
    });
  }
  if(!/\.(csv|txt)$/i.test(nome) && !/^\uFEFF?[^\n]*,/.test(new TextDecoder().decode(new Uint8Array(buf).slice(0,400)))) return Promise.resolve([]);
  return Promise.resolve([{nome:nome, txt:new TextDecoder().decode(new Uint8Array(buf))}]);
}

dicalismo", "g": "Mudar a alimentação não precisa ser radical.", "p": ["Comece trocando um hábito por semana.", "Inclua antes de tirar: mais verduras e água no dia a dia.", "Constância vence perfeição. Pequenas mudanças somam muito no ano."], "f": "Reel", "o": "Educação", "a": "reeducacao"}]}, {"k": "psicologia", "nome": "Psicólogo(a)", "prof": "psicólogo", "ic": "🧠", "grupo": "Saúde, estética e bem-estar", "servicos": ["psicoterapia individual", "terapia online", "orientação para pais", "terapia de casal"], "regras": ["Siga o Código de Ética Profissional do Psicólogo e as resoluções do CFP sobre publicidade.", "Nada de depoimento de paciente nem promessa de resultado.", "Conteúdo informativo não substitui atendimento: deixe isso claro.", "Coloque o número do CRP nas publicações."], "hashtags": ["#psicologia", "#saudemental", "#terapia", "#autoconhecimento"], "palavra": "TERAPIA", "temas": [{"t": "Terapia não é só para crise", "g": "Você não precisa estar em crise para fazer terapia.", "p": ["Terapia é um espaço para entender emoções, padrões e escolhas.", "Muitas pessoas começam para se conhecer melhor ou atravessar uma fase de mudança.", "Buscar ajuda cedo costuma tornar o caminho mais leve."], "f": "Reel", "o": "Educação", "a": "terapia-crise"}, {"t": "Ansiedade: sinais no corpo", "g": "A ansiedade também aparece no corpo.", "p": ["Coração acelerado, tensão nos ombros e respiração curta são sinais comuns.", "Alterações no sono e no apetite também podem acontecer.", "Se esses sinais atrapalham a sua rotina, converse com um profissional."], "f": "Reel", "o": "Educação", "a": "ansiedade-corpo"}, {"t": "Como funciona a primeira sessão", "g": "Com medo da primeira sessão de terapia? Veja como é.", "p": ["É uma conversa para entender o que levou você até ali.", "Combinamos frequência, sigilo e como o processo vai funcionar.", "Você não precisa saber exatamente o que dizer. A gente constrói junto."], "f": "Reel", "o": "Lead", "a": "primeira-sessao"}, {"t": "Respiração p ": "Educação", "a": "sono"}, {"t": "Como apoiar alguém que está mal", "g": "Como ajudar alguém que não está bem?", "p": ["Ouvir sem julgar e sem pressa de dar solução.", "Perguntar como você pode ajudar, em vez de supor.", "Incentivar a busca de ajuda profissional, com cuidado e respeito."], "f": "Reel", "o": "Educação", "a": "apoiar"}, {"t": "Bastidor: por que o sigilo importa", "g": "O que você fala na terapia fica na terapia.", "p": ["O sigilo é um dever ético do psicólogo.", "Ele cria um espaço seguro para falar do que é difícil.", "As exceções são previstas no código de ética, e eu explico na primeira sessão."], "f": "Post", "o": "Autoridade", "a": "sigilo"}, {"t": "Pequenas pausas no dia", "g": "Cinco minutos de pausa também são cuidado.", "p": ["Afaste-se da tela e observe a respiração.", "Beba água, alongue o corpo, olhe pela janela.", "Pausas pequenas ajudam a atravessar dias longos."], "f": "Post", "o": "Engajamento", "a": "pausas"}]}, {"k": "fisioterapia", "nome": "Fisioterapeuta", "prof": "fisioterapeuta", "ic": "🦴", "grupo": "Saúde, estética e bem-estar", "servicos": ["fisioterapia ortopédica", "pilates", "reabilitação esportiva", "RPG", "fisioterapia domiciliar"], "regras": ["Siga o código de ética e as regras de publicidade do COFFITO: sem promessa de cura ou resultado.", "Exercícios em vídeo são orientação geral; quem tem dor deve ser avaliado.", "Coloque o número do CREFITO nas publicações."], "hashtags": ["#fisioterapia", "#fisioterapeuta", "#postura", "#qualidadedevida"], "palavra": "FISIO", "temas": [{"t": "Dor nas costas de quem trabalha sentado", "g": "Trabalha sentado e sente dor nas costas? Comece por aqui.", "p": ["Ajuste a altura da tela para ficar na linha dos olhos.", "Apoie os pés no chão e as costas na cadeira.", "Levante a cada hora para caminhar um pouco. Se a dor continuar, procure avaliação."], "f": "Reel", "o": "Educação", "a": "costas-sentado"}, {"t": "Alongamento rápido para o pescoço", "g": "Pescoço travado? Um alongamento de 30 segundos.", "p": ["Incline a cabeça para um lado, devagar, sem forçar.", "Segure alguns segundos e troque de lado.", "Se doer ou formigar, pare e procure um fisioterapeuta."], "f": "Reel", "o": "Engajamento", "a": "pescoco"}, {"t": "Mito ou verdade: dor é sinal de que está funcionando", "g": "Mito ou verdade: exercício que dói está fazendo efeito?", "p": ["Desconforto leve pode acontecer, mas dor forte é sinal de alerta.", "Respeitar os limites evita lesões.", "O tratamento certo é progressivo e acompanhado."], "f": "Reel", "o": "Engajamento", "a": "mito-dor"}, {"t": "Como carregar peso sem machucar a coluna", "g": "Vai levantar uma caixa pesada? Faça assim.", "p": ["Dobre os joelhos e mantenha as costas retas.", "Segure o peso perto do corpo.", "Evite girar o tronco com o peso nas mãos: vire com os pés."], "f": "Carrossel", "o": "Educação", "a": "carregar-peso"}, {"t": "Pilates: para quem é", "g": "Pilates é só para quem tem flexibilidade? Não.", "p": ["O método se adapta ao seu nível e às suas necessidades.", "Trabalha força, postura, respiração e controle do corpo.", "Uma avaliação define os exercícios mais indicados para você."], "f": "Reel", "o": "Educação", "a": "pilates"}, {"t": "Bastidor: como é a avaliação", "g": "É assim que começa o seu tratamento comigo.", "p": ["Escuto o seu histórico e o que piora ou melhora a dor.", "Faço testes de movimento, força e postura.", "Com isso monto um plano com objetivos claros."], "f": "Post", "o": "Autoridade", "a": "avaliacao"}, {"t": "Torceu o tornozelo: primeiros cuidados", "g": "Torceu o tornozelo? Veja os primeiros cuidados.", "p": ["Evite apoiar o peso se doer muito.", "Gelo protegido por um pano ajuda nas primeiras horas, e elevar o pé também.", "Se houver inchaço forte ou dificuldade para pisar, procure atendimento."], "f": "Reel", "o": "Educação", "a": "tornozelo"}, {"t": "Postura no celular", "g": "O jeito que você usa o celular pesa no pescoço.", "p": ["Traga o celular para a altura dos olhos.", "Faça pausas ro da OAB nas publicações."], "hashtags": ["#direito", "#advocacia", "#seusdireitos", "#informacaojuridica"], "palavra": "DIREITO", "temas": [{"t": "Comprou e veio com defeito: o que fazer", "g": "Comprou um produto e ele veio com defeito? Veja seus direitos.", "p": ["O Código de Defesa do Consumidor prevê prazos para reclamar de vícios do produto.", "Guarde nota fiscal, fotos e conversas com a loja.", "Primeiro procure a loja por escrito. Se não resolver, busque orientação."], "f": "Reel", "o": "Educação", "a": "produto-defeito"}, {"t": "Contrato: 3 cuidados antes de assinar", "g": "Não assine nenhum contrato sem conferir isto.", "p": ["Leia as cláusulas de multa e de rescisão.", "Confira se tudo o que foi combinado está escrito.", "Na dúvida, peça para um profissional revisar antes de assinar."], "f": "Carrossel", "o": "Educação", "a": "contrato"}, {"t": "Pensão alimentícia: dúvidas comuns", "g": "Pensão alimentícia: o que muita gente não sabe.", "p": ["O valor considera a necessidade de quem recebe e a possibilidade de quem paga.", "Ele pode ser revisto quando a situação de alguma das partes muda.", "Cada caso é analisado pelo juiz. Busque orientação para o seu."], "f": "Reel", "o": "Educação", "a": "pensao"}, {"t": "Mito ou verdade: acordo verbal não vale nada", "g": "Mito ou verdade: combinado de boca não vale?", "p": ["Em muitos casos o acordo verbal tem validade, mas é difícil de provar.", "Mensagens, testemunhas e comprovantes ajudam a demonstrar o que foi combinado.", "Por segurança, coloque os acordos importantes por escrito."], "f": "Reel", "o": "Engajamento", "a": "acordo-verbal"}, {"t": "Demissão: documentos para guardar", "g": "Foi demitido? Guarde estes documentos.", "p": ["Carteira de trabalho, contracheques e o termo de rescisão.", "Extrato do FGTS e comprovantes de horas extras, se houver.", "Com os documentos, fica mais fácil conferir se recebeu tudo o que é devido."], "f": "Reel", "o": "Educação", "a": "demissao"}, {"t": "Herança: por onde começa o inventário", "g": "Alguém da família faleceu e deixou bens? Por onde começar.", "p": ["O inventário é o procedimento que organiza a partilha dos bens.", "Pode ser feito em cartório em algumas situações, ou na Justiça.", "Há prazos e impostos envolvidos. Procure orientação logo no início."], "f": "Carrossel", "o": "Educação", "a": "inventario"}, {"t": "Bastidor: como eu analiso um caso", "g": "Como eu analiso um caso antes de qualquer decisão.", "p": ["Primeiro escuto e organizo os fatos em ordem.", "Depois avalio os documentos e o que a lei diz sobre aquela situação.", "Só então explico os caminhos possíveis, com riscos e prazos."], "f": "Post", "o": "Autoridade", "a": "bastidor-caso"}, {"t": "Golpes por mensagem: como se proteger", "g": "Recebeu pedido de dinheiro por mensagem? Cuidado.", "p": ["Golpistas se passam por parentes ou empresas conhecidas.", "Confirme por ligação antes de transferir qualquer valor.", "Se cair em golpe, registre boletim de ocorrência e avise o banco imediatamente."], "f": "Reel", "o": "Engajamento", "a": "golpes"}, {"t": "Aposentadoria: o que conferir no CNIS", "g": "Vai se aposentar? Confira o seu extrato do INSS.", "p": ["O CNIS reúne os seus vínculos e contribuições.", "Períodos faltando ou errados podem atrasar ou reduzir o benefício.", "Corrigir antes de pedir a aposentadoria evita dor de cabeça."], "f": "Reel", "o": "Educação", "a": "cnis"}, {"t": "Aluguel: direitos de quem aluga", "g": "Mora de aluguel? Conheça alguns direitos.", "p": ["O contrato deve dizer quem paga cada despesa.", "Reparos estruturais costumam ser responsabilidade do proprietário.", "Guarde recibos e registre por escrito qualquer combinado."], "f": "Reel", "o": "Educação", "a": "aluguel"}, {"t": "Pergunta frequente: preciso de advogado no juizado?", "g": "Preciso de advogado no juizado especial?", "p": ["Em causas de menor valor, em alguns casos é possível ir sem advogado.", "Mesmo assim, a orientação ajuda a reunir provas e evitar erros.", "Cada situação tem regras próprias. Informe-se antes."], "f": "Reel", "o": "Engajamento", "a": "juizado"}, {"t": "União estável: o que muda", "g": "União estável tem efeitos legais. Você sabia?", "p": ["Ela pode gerar direitos sobre bens e herança.", "É possível formalizar por escritura em cartório.", "Entender o regime de bens evita conflitos no futuro."], "f": "Reel", "o": "Educação", "a": "uniao-estavel"}]}, {"k": "contabilidade", "nome": "Contador(a)", "prof": "contador", "ic": "📊", "grupo": "Advocacia e contabilidade", "servicos": ["abertura de empresa", "contabilidade para MEI", "imposto de renda", "planejamento tributário", "folha de pagamento"], "regras": ["Siga o Código de Ética do Profissional Contábil.", "Não prometa redução de impostos sem análise do caso.", "Prazos e regras mudam: confira a data e a fonte oficial antes de publicar.", "Coloque o número do CRC nas publicações."], "hashtags": ["#contabilidade", "#contador", "#mei", "#empreendedorismo"], "palavra": "CONTADOR", "temas": [{"t": "MEI: obrigações que não podem atrasar", "g": "É MEI? Não deixe estas obrigações atrasarem.", "p": ["Pagar o DAS todo mês, mesmo sem faturar.", "Entregar a declaração anual do MEI no prazo.", "Acompanhar o limite de faturamento para não ter surpresa."], "f": "Reel", "o": "Educação", "a": "mei-obrigacoes"}, {"t": "Separar conta pessoal da empresa", "g": "Misturar a conta da empresa com a pessoal custa caro.", "p": ["Fica impossível saber se a empresa dá lucro de verdade.", "Defina um pró-labore, um valor fixo para você por mês.", "Use uma conta só para a empresa e registre tudo."], "f": "Reel", "o": "Educação", "a": "separar-contas"}, {"t": "Nota fiscal: por que emitir sempre", "g": "Por que emitir nota fiscal em toda venda?", "p": ["Ela comprova o faturamento da sua empresa.", "Ajuda a conseguir crédito e a participar de vendas para empresas.", "Evita problemas com a fiscalização."], "f": "Carrossel", "o": "Educação", "a": "nota-fiscal"}, {"t": "Imposto de renda: documentos para separar", "g": "Imposto de renda chegando? Separe estes documentos.", "p": ["Informes de rendimentos de empregadores e bancos.", "Recibos de despesas médicas e de educação.", "Documentos de compra e venda de bens. Organizar cedo evita erro e multa."], "f": "Carrossel", "o": "Educação", "a": "ir-documentos"}, {"t": "Mito ou verdade: MEI não paga imposto", "g": "Mito ou verdade: MEI não paga imposto?", "p": ["Mito. O MEI paga um valor fixo mensal no DAS.", "Esse valor inclui contribuição ao INSS e impostos conforme a atividade.", "Por ser simples, muita gente esquece de pagar. E a dívida cresce."], "f": "Reel", "o": "Engajamento", "a": "mei-imposto"}, {"t": "Quando sair do MEI", "g": "Sua empresa está crescendo? Talvez seja hora de sair do MEI.", "p": ["Quando o faturamento se aproxima do limite anual.", "Quando você precisa contratar mais funcionários do que o MEI permite.", "Ou quando quer ter sócio. O planejamento evita impostos maiores na mudança."], "f": "Reel", "o": "Educação", "a": "sair-mei"}, {"t": "Bastidor: o que eu faço pela sua empresa todo mês", "g": "O que o contador faz pela sua empresa todo mês.", "p": ["Calculo os impostos e organizo as guias com prazo.", "Cuido da folha de pagamento e das obrigações dos funcionários.", "Entrego relatórios para você decidir com números."], "f": "Post", "o": "Autoridade", "a": "bastidor-mensal"}, {"t": "Fluxo de caixa simples", "g": "Faça o fluxo de caixa da sua empresa em 3 colunas.", "p": ["Entradas: tudo o que você recebe, com data.", "Saídas: tudo o que você paga, com data.", "Saldo: o que sobra. Atualize toda semana."], "f": "Carrossel", "o": "Educação", "a": "fluxo-caixa"}, {"t": "Abrir empresa: primeiro passo", "g": "Quer abrir uma empresa? O primeiro passo não é o CNPJ.", "p": ["É definir a atividade e o tipo de empresa mais adequado.", "Isso muda os impostos que você vai pagar.", "Uma conversa antes da abertura evita escolher errado."], "f": "Reel", "o": "Lead", "a": "abrir-empresa"}, {"t": "Pró-labore: quanto tira   var prefP = [2,4].filter(function(x){ return dias.indexOf(x)>=0 && x!==cdia; });
