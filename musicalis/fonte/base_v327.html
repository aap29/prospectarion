let S=Object.assign({},D,loadSaved()); let page=S.owner?(S.lastPage||'study'):(S.theory===null?'welcome':'home');
const $=s=>document.querySelector(s); const save=()=>{S.lastPage=page;localStorage.setItem(K,JSON.stringify(S));};

/* ===== V3.8 • ACESSO: CONTAS (e-mail + senha), CRIADOR VITALÍCIO, PLANOS, CÓDIGOS, REGISTRO DE EXERCÍCIOS ===== */
const ACC_KEY='musicalis_contas_v1', OWNER_EMAILS=['andersonpinto.rs@gmail.com','kenny.alves@gmail.com','kennysax29@gmail.com','andersonalvespinto@gmail.com','kennyacustico29@gmail.com','vendedorandersonalves@gmail.com'], LIC_SECRET='f4e03fa2e5059f88598da52e47bd6b73f561be5eac4e8f95';
const PLANOS={gratuito:'Gratuito',mensal:'Premium Mensal',anual:'Premium Anual',vitalicio:'Vitalício',escola:'Professor/Escola',criador:'CRIADOR • Vitalício total'};
const OWNER_STATE_KEY=K; // dados que já existiam neste aparelho pertencem ao Criador

if(!ACC.session){try{ACC.session=sessionStorage.getItem('musicalis_sessao')||null}catch(e){}}
const enc=new TextEncoder(), hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function sha256(t){return hex(await crypto.subtle.digest('SHA-256',enc.encode(t)))}
async function pbkdf2(pass,saltHex){const k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);const salt=new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},k,256))}

 ACC.session=email;saveAcc();const u=ACC.users[email];K=userStateKey(email);
 let saved={};try{saved=JSON.parse(localStorage.getItem(K))||{}}catch(e){saved={}}
 S=Object.assign({},u.role==='owner'?D:DA,saved);S.progress=S.progress||{};S.owner=u.role==='owner';S.email=email;

async function licSig(email,body){const k=await crypto.subtle.importKey('raw',enc.encode(LIC_SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);const s=await crypto.subtle.sign('HMAC',k,enc.encode(normEmail(email)+'|'+body));const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return [...new Uint8Array(s)].slice(0,6).map(b=>A[b%32]).join('')}
async function makeLicense(email,plan,months){const P={mensal:'M',trimestral:'T',semestral:'S',anual:'A',vitalicio:'V',escola:'E'}[plan];let d='000000';if(P!=='V'){const x=new Date();x.setMonth(x.getMonth()+(+months||({M:1,T:3,S:6,A:12,E:12}[P])));d=x.toISOString().slice(2,10).replace(/-/g,'')}
 const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=[...crypto.getRandomValues(new Uint8Array(4))].map(b=>A[b%32]).join('');const body=P+d+'-'+r;return 'MUS-'+body+'-'+await licSig(email,body)}
async function checkLicense(email,code){const m=/^MUS-([MTSAVE])(\d{6})-([A-Z2-9]{4})-([A-Z2-9]{6})$/.exec((code||'').trim().toUpperCase());if(!m)return null;

// Formato: "Ré4:sm Mi4:sm Fá4:c Sol4:c Lá4:sm | Sol4:m P:m"   (sb=semibreve, m=mínima, sm=semínima, c=colcheia, P=pausa)
function parseNotation(txt){
 const ms=(txt||'').split('|').map(s=>s.trim()).filter(Boolean),ev=[],err=[];
 if(!ms.length)err.push('Digite ao menos um compasso.'); if(ms.length>6)err.push('Máximo de 6 compassos por exercício.');
 ms.forEach((mt,m)=>{let sum=0;
  mt.split(/[\s,;]+/).filter(Boolean).forEach(tok=>{
   const t=tok.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),x=/^(do|re|mi|fa|sol|la|si|p)(#)?(\d)?:(sb|sm|m|c)$/.exec(t);
   if(!x){err.push(`Compasso ${m+1}: não entendi "${tok}". Exemplo: Ré4:sm ou P:m`);return}
   const [b,k]=DUR[x[4]];sum+=b;
   if(x[1]==='p'){ev.push({m,rest:true,b,k});return}
   if(!x[3]){err.push(`Compasso ${m+1}: falta a oitava em "${tok}" (ex.: Sol4).`);return}
   const midi=(+x[3]+1)*12+PCN[x[1]]+(x[2]?1:0);
   if(midi<55||midi>84){err.push(`Compasso ${m+1}: "${tok}" fora da extensão (Sol3 a Dó6).`);return}
   ev.push({m,p:midi,b,k})});
  if(Math.abs(sum-4)>1e-9)err.push(`Compasso ${m+1}: soma ${String(sum).replace('.',',')} tempos — em 4/4 precisa somar exatamente 4.`)});
 return {events:ev,measures:ms.length,errors:err}}

const VAL=[[4,'whole',0],[3,'half',1],[2,'half',0],[1.5,'quarter',1],[1,'quarter',0],[.75,'eighth',1],[.5,'eighth',0]];

function fonteExercicio(id,B){const [t,k]=exSrc(id);
 if(t==='fig'){const d=figureDefs[k];let seq=d.seq.map(p=>({p,d:d.beats}));

/* re-escreve nos compassos de B tempos: divide o que atravessa a barra (nota → ligadura; pausa → duas pausas) */
function rebarrar(stream,B){const bars=[];let cur=[],room=B;
 const fecha=()=>{bars.push(cur);cur=[];room=B};
 stream.forEach(it=>{let d=it.d;const pecas=[];
  while(d>1e-6){const take=Math.min(d,room);decompor(take).forEach(v=>{const f=figura(v);const ev={p:it.p,d:v,k:f.k,dot:f.dot,rest:it.p==null};cur.push(ev);pecas.push(ev)});d=+(d-take).toFixed(6);room=+(room-take).toFixed(6);if(room<=1e-6)fecha()}
  if(it.p!=null)pecas.forEach((ev,i)=>{if(i<pecas.length-1)ev.liga=true;if(i>0)ev.ligada=true})});
 if(cur.length){const ult=cur[cur.length-1],soma=ult.d+room;const f=VAL.find(x=>Math.abs(x[0]-soma)<1e-6);
  if(f&&!ult.liga){ult.d=soma;ult.k=f[1];ult.dot=!!f[2]}else decompor(room).forEach(v=>{const g=figura(v);cur.push({p:null,d:v,k:g.k,dot:g.dot,rest:true})});fecha()}
 return bars}

   let on=0;const items=bar.map(e=>{const cheia=e.rest&&Math.abs(e.d-B)<1e-6;if(cheia){e.k='whole';e.dot=false;e.compasso=true}const it={x:cheia?x0+mw/2:x0+22+on/B*(mw-40),y:e.rest?0:yPitch(e.p,top),kind:e.k,id:'mt-'+flat.length,rest:e.rest,onset:on,midi:e.rest?null:e.p,dot:e.dot};flat.push(Object.assign(e,{x:it.x,y:it.y,top,s,beat:mi*B+on}));on+=e.d;return it});

 }

// Desenha uma sequência de notas de UM compasso: aplica direção de haste e agrupa colcheias por meio compasso.
function drawMeasureNotes(items,top){
 // items: [{x,y,kind,id,rest,onset,midi}]
 let out='',groups=[],cur=[];
 const flush=()=>{if(cur.length)groups.push(cur);cur=[]};
 items.forEach(it=>{
  if(it.kind==='eighth'&&!it.rest){
   if(cur.length&&Math.floor(cur[0].onset/BEAM_UNIT)===Math.floor(it.onset/BEAM_UNIT)&&cur[cur.length-1].next===it.onset)cur.push(it);else{flush();cur.push(it)}
   it.next=it.onset+.5;
  } else flush();
 });
 flush();
 const inGroup=new Map();groups.forEach(g=>g.forEach(it=>inGroup.set(it,g)));
 items.forEach(it=>{
  if(it.rest){out+=restGlyph(it.kind,it.x,top,it.id);return}
  out+=ledger(it.x,it.y,top);
  const g=inGroup.get(it);
  if(g&&g.length>1){const d=g.dir||(g.dir=beamDir(g,top));const yb=g.yb??(g.yb=beamY(g,top,d));out+=noteGlyph(it.kind,it.x,it.y,it.id,false,d,yb,it.midi)}
  else{const d=stemDir(it.y,top);out+=noteGlyph(it.kind,it.x,it.y,it.id,it.kind==='eighth',d,stemEnd(it.y,top,d),it.midi)}
 });
 groups.filter(g=>g.length>1).forEach(g=>{out+=eighthBeam(g,g.dir,g.yb,top)});
 return out;
}

 const lines=[0,1,2,3,4].map(i=>`<line class="staff-line" x1="${L}" y1="${top+i*12}" x2="${R}" y2="${top+i*12}"/>`).join('');
 const clef=`${gClef(L+4,top)}`;
 const time=`<text class="time-text" x="${L+60}" y="${top+22}">4</text><text class="time-text" x="${L+60}" y="${top+47}">4</text>`;
 const bars=Array.from({length:count+1},(_,i)=>start+i*mw).map(x=>`<line class="bar-line" x1="${x}" y1="${top}" x2="${x}" y2="${top+48}"/>`).join('');
 let body='';
 const byM={};d.events.forEach((e,i)=>{(byM[e.m]=byM[e.m]||[]).push(i)});
 Object.values(byM).forEach(idxs=>{
   let onset=0;const items=idxs.map((i,k)=>{const e=d.events[i],x=start+mw*e.m+mw*((k+1)/(idxs.length+1));const it={x,y:e.rest?0:yPitch(e.p,top),kind:e.k,id:`ped-${i}`,rest:!!e.rest,onset,midi:e.rest?null:e.p};onset+=e.b;return it});
   body+=drawMeasureNotes(items,top);
 });
 let formMarks='';
 if(type==='combined'){
   const repStart=start+3, firstX=start+mw*4, secondX=start+mw*5;
   formMarks+=`<line x1="${repStart}" y1="${top}" x2="${repStart}" y2="${top+48}" stroke="#111" stroke-width="5"/>
   <line x1="${repStart+7}" y1="${top}" x2="${repStart+7}" y2="${top+48}" stroke="#111" stroke-width="1.6"/>
   <circle cx="${repStart+15}" cy="${top+19}" r="2.7" fill="#111"/><circle cx="${repStart+15}" cy="${top+29}" r="2.7" fill="#111"/>
   <path d="M ${firstX} ${top-8} V ${top-20} H ${secondX-8} V ${top-8}" fill="none" stroke="#111" stroke-width="2"/>
   <text x="${firstX+8}" y="${top-23}" font-size="16" font-weight="700">1.</text>
   <circle cx="${secondX-15}" cy="${top+19}" r="2.7" fill="#111"/><circle cx="${secondX-15}" cy="${top+29}" r="2.7" fill="#111"/>
   <line x1="${secondX-7}" y1="${top}" x2="${secondX-7}" y2="${top+48}" stroke="#111" stroke-width="1.6"/>
   <line x1="${secondX}" y1="${top}" x2="${secondX}" y2="${top+48}" stroke="#111" stroke-width="5"/>
   <path d="M ${secondX+5} ${top-8} V ${top-20} H ${R-6} V ${top-8}" fill="none" stroke="#111" stroke-width="2"/>
   <text x="${secondX+12}" y="${top-23}" font-size="16" font-weight="700">2.</text>
   <line x1="${R-7}" y1="${top}" x2="${R-7}" y2="${top+48}" stroke="#111" stroke-width="1.6"/>
   <line x1="${R}" y1="${top}" x2="${R}" y2="${top+48}" stroke="#111" stroke-width="5"/>`;
 }
 return `<svg id="ped-svg" viewBox="0 0 1190 225" preserveAspectRatio="xMidYMin meet"><rect width="1190" height="225" fill="#fffdf8"/><text class="score-label" x="12" y="22">${S.instrument} • ${d.title}</text><text class="form-help" x="12" y="43">${d.desc}</text>${lines}${clef}${time}${bars}${body}${formMarks}<line id="ped-cursor" class="cursor-v" x1="${start+8}" y1="${top-10}" x2="${start+8}" y2="${top+58}"/></svg>`;
}

function pedEventX(i){
 const d=pedDefs[pedState.type],e=d.events[i],start=177,R=1115,count=(pedDefs[pedState.type].nm||(pedState.type==='combined'?6:4)),mw=(R-start)/count;
 const same=d.events.filter((a,j)=>j<=i&&a.m===e.m).length-1,total=d.events.filter(a=>a.m===e.m).length;
 return start+mw*e.m+mw*((same+1)/(total+1));
}
function playPedEvent(i){

function schedulePed(){
 if(!pedState.playing)return;
 const e=pedDefs[pedState.type].events[pedState.index],ms=(60000/S.bpm)*e.b;

'Intermediário I1':{titulo:'Regiões do saxofone e o ponto de aumento',secoes:[
 ['Linhas suplementares','Quando a nota não cabe na pauta, usamos <b>linhas suplementares</b>: pequenas linhas acima ou abaixo da pauta. Abaixo ficam os graves (Ré4 no espaço, Dó4 na 1ª linha suplementar, Si3 e Sib3 embaixo dela).'],
 ['As regiões do sax','<b>Graves</b>: Sib3 a Ré4 (abaixo da pauta). <b>Médias</b>: Mi4 (1ª linha) até Fá5 (5ª linha). <b>Agudas</b>: Sol5 a Mi6 (linhas suplementares em cima). <b>Super agudas</b>: acima de Mi6, só no avançado.'],
 ['O ponto de aumento','O <b>ponto</b> ao lado da nota aumenta <b>metade do valor</b> dela. Mínima pontuada = 2 + 1 = <b>3 tempos</b>. Semínima pontuada = 1 + ½ = <b>1 tempo e meio</b>, quase sempre seguida de uma colcheia.'],
 ['Graves e agudos no sax','Nos graves, pense em "ar quente" e boca relaxada. Nos agudos, mantenha o ar firme e a garganta aberta, sem morder a palheta.']],

'Intermediário I2':{titulo:'Acidentes e armaduras de clave',secoes:[
 ['Os acidentes','<b>Sustenido (#)</b> sobe a nota um semitom. <b>Bemol (b)</b> desce um semitom. <b>Bequadro (♮)</b> cancela o sustenido ou o bemol e volta à nota natural.'],

 ['Armadura de clave','A <b>armadura</b> são os sustenidos ou bemóis logo depois da clave. Eles valem para <b>a música inteira</b>, em todas as oitavas. Ex.: Sol maior tem <b>Fá#</b>; Fá maior tem <b>Sib</b>; Ré maior tem <b>Fá# e Dó#</b>.'],

'Intermediário I3':{titulo:'Compassos 3/4 e 2/4, ligadura e dinâmica',secoes:[
 ['Compasso 3/4','O <b>3/4</b> tem <b>3 tempos</b>. É o compasso da <b>valsa</b>. Gesto: ↓1 →2 ↑3. A nota que ocupa o compasso inteiro é a <b>mínima pontuada</b>.'],
 ['Compasso 2/4','O <b>2/4</b> tem <b>2 tempos</b>: ▼ pé no chão no 1, ▲ pé no alto no 2. É o compasso da <b>marcha</b>, do <b>samba</b> e do <b>choro</b>.'],
 ['Ligadura','A <b>ligadura</b> é um arco que une <b>duas notas iguais</b>: tocamos só a primeira e seguramos pelo valor das duas somadas. Ela permite atravessar a barra de compasso. Não confunda com a ligadura de expressão (arco sobre notas diferentes, para tocar sem separar).'],
 ['Síncope e dinâmica','<b>Síncope</b> é o som que começa no tempo fraco e se prolonga até o forte (ex.: semínima – mínima – semínima). <b>Dinâmica</b> é o volume: <b>p</b> (piano, fraco), <b>mf</b> (meio forte), <b>f</b> (forte), <b>crescendo</b> (&lt;) e <b>decrescendo</b> (&gt;).']],
 teste:[['Quantos tempos tem o 3/4?',['2','3','4','6'],1,'3 tempos.'],
  ['A ligadura entre duas notas iguais…',['repete a nota','soma os valores','corta a nota','muda a nota'],1,'Toca uma vez e segura pelo total.'],
  ['"p" na dinâmica significa…',['pausa','piano (fraco)','ponto','pulsação'],1,'Piano = tocar suave.'],
  ['Qual compasso é típico da marcha?',['2/4','3/4','6/8','5/4'],0,'Marcha: 2/4.']],
 prova:[['Em 3/4, a nota que ocupa o compasso inteiro é…',['semibreve','mínima pontuada','mínima','semínima'],1,'2 + 1 = 3 tempos.'],
  ['O gesto do 3/4 é…',['↓ ↑','↓ → ↑','↓ ← → ↑','só ↓'],1,'Três movimentos.'],
  ['Duas semínimas Sol ligadas valem…',['1 tempo','2 tempos','3 tempos','meio tempo'],1,'1 + 1, tocadas como uma só.'],
  ['"f" significa…',['fraco','forte','fermata','fim'],1,'Forte.'],
  ['A síncope começa…',['no tempo forte','no tempo fraco e se prolonga','só no fim da música','na pausa'],1,'Desloca o acento para o tempo fraco.'],
  ['O sinal de crescendo indica…',['ir aumentando o volume','acelerar','repetir','parar'],0,'Aumentar o volume aos poucos.'],
  ['Quantas colcheias cabem em 2/4?',['2','4','6','8'],1,'2 tempos × 2.'],
  ['A ligadura pode atravessar…',['a clave','a barra de compasso','a armadura','o metrônomo'],1,'Ela une a nota de um compasso à do seguinte.']]},
'Avançado A1':{titulo:'Semicolcheias, tercinas e pontuadas',secoes:[
 ['Semicolcheia','A <b>semicolcheia</b> vale <b>¼ de tempo</b> e tem 2 colchetes (ou 2 barras de união). Contamos "<b>1 e a e</b>" ou "<b>1-ti-ca-ti</b>": 4 notas em cada tempo.'],
 ['Tercina','A <b>tercina</b> são <b>3 notas no lugar de 2</b>, marcadas com o número <b>3</b>. Três colcheias de tercina ocupam 1 tempo. Fale "<b>tri-a-ná</b>" para sentir as três partes iguais.'],
 ['Colcheia pontuada','A <b>colcheia pontuada</b> vale ¾ de tempo e quase sempre vem com uma semicolcheia (¾ + ¼ = 1 tempo). Soa "lóóón-ga, cur-ta".'],
 ['Galope','O <b>galope</b> é colcheia + 2 semicolcheias (½ + ¼ + ¼). O <b>contragalope</b> é ao contrário: 2 semicolcheias + colcheia.']],
 teste:[['Quantas semicolcheias cabem em 1 tempo?',['2','3','4','8'],2,'4 × ¼ = 1.'],
  ['A tercina coloca…',['2 notas no lugar de 3','3 notas no lugar de 2','4 notas no lugar de 3','1 nota longa'],1,'Três no lugar de duas.'],
  ['Colcheia pontuada + semicolcheia =',['½ tempo','1 tempo','1 e meio','2 tempos'],1,'¾ + ¼ = 1.'],
  ['O galope é…',['colcheia + 2 semicolcheias','2 semicolcheias + colcheia','3 colcheias','semínima pontuada'],0,'½ + ¼ + ¼.']],
 prova:[['A semicolcheia tem…',['1 colchete','2 colchetes','nenhum colchete','um ponto'],1,'Dois colchetes ou duas barras.'],
  ['Quantas semicolcheias cabem num compasso 2/4?',['4','6','8','16'],2,'2 tempos × 4.'],
  ['Três colcheias de tercina valem…',['½ tempo','1 tempo','1 e meio','2 tempos'],1,'Ocupam o lugar de duas colcheias.'],
  ['O contragalope é…',['colcheia + 2 semicolcheias','2 semicolcheias + colcheia','semínima + colcheia','3 semicolcheias'],1,'¼ + ¼ + ½.'],
  ['A colcheia pontuada vale…',['½ tempo','¾ de tempo','1 tempo','1 e meio'],1,'½ + ¼.'],
  ['Para estudar semicolcheias rápidas…',['comece rápido','comece lento e suba 5 BPM por vez','toque sem metrônomo','pule as notas difíceis'],1,'Velocidade vem da precisão.'],
  ['O número 3 sobre um grupo indica…',['3 tempos','uma tercina','repetir 3 vezes','3º dedo'],1,'É a marca da tercina.'],
  ['"1 e a e" é a contagem de…',['colcheias','semicolcheias','tercinas','mínimas'],1,'4 partes por tempo.']]},
'Avançado A2':{titulo:'Tonalidades, escala menor e transposição',secoes:[
 ['Mais acidentes na armadura','<b>Sib maior</b>: Sib e Mib (2 bemóis). <b>Lá maior</b>: Fá#, Dó# e Sol# (3 sustenidos). Leia a armadura <b>antes</b> de tocar e lembre-se dela em todas as oitavas.'],
 ['Escala menor','Cada tom maior tem um <b>relativo menor</b> com a mesma armadura, começando 3 semitons abaixo. Lá menor é relativo de Dó maior. A <b>menor harmônica</b> sobe o 7º grau: em Lá menor, o Sol vira <b>Sol#</b>.'],
 ['Transposição do saxofone','O sax é um <b>instrumento transpositor</b>: a nota escrita não é a nota que soa. <b>Soprano e Tenor</b> são em <b>Sib</b>: o Dó escrito soa Sib. <b>Alto e Barítono</b> são em <b>Mib</b>: o Dó escrito soa Mib. Por isso, num grupo com saxes diferentes, cada um tem a sua partitura.'],
 ['Na prática','Num quarteto que soa em Sib maior, Soprano e Tenor leem em <b>Dó maior</b>, e Alto e Barítono leem em <b>Sol maior</b>. Cada um com a armadura mais fácil para o seu sax.']],
 teste:[['Sib maior tem quantos bemóis?',['1','2','3','4'],1,'Sib e Mib.'],
  ['O relativo menor de Dó maior é…',['Mi menor','Lá menor','Ré menor','Sol menor'],1,'Mesma armadura, nenhum acidente.'],
  ['No sax alto, o Dó escrito soa…',['Dó','Sib','Mib','Fá'],2,'Alto é em Mib.'],
  ['Na menor harmônica de Lá, o Sol vira…',['Solb','Sol#','Fá#','Lá#'],1,'O 7º grau sobe um semitom.']],
 prova:[['Lá maior tem…',['2 sustenidos','3 sustenidos','3 bemóis','nenhum'],1,'Fá#, Dó#, Sol#.'],
  ['Soprano e tenor são afinados em…',['Mib','Sib','Dó','Fá'],1,'Ambos em Sib.'],
  ['Alto e barítono são afinados em…',['Mib','Sib','Dó','Sol'],0,'Ambos em Mib.'],
  ['Um quarteto soa em Sib maior. O sax tenor lê em…',['Sib maior','Dó maior','Sol maior','Fá maior'],1,'Sib + 1 tom = Dó.'],
  ['No mesmo quarteto, o sax alto lê em…',['Dó maior','Sol maior','Ré maior','Fá maior'],1,'Mib: 6ª maior acima = Sol.'],
  ['O relativo menor fica…',['3 semitons abaixo do maior','uma oitava abaixo','um tom acima','5 semitons acima'],0,'Dó maior → Lá menor.'],
  ['Instrumento transpositor é aquele em que…',['a nota escrita é diferente da que soa','só toca notas graves','não lê partitura','troca de clave'],0,'Escrito ≠ som real.'],
  ['A menor harmônica se diferencia da natural pelo…',['3º grau','5º grau','7º grau elevado','1º grau'],2,'Sobe o 7º grau.']]},
'Avançado A3':{titulo:'Registro agudo, articulação e compassos compostos',secoes:[
 ['Chaves de palma','De <b>Ré6 a Fá6</b> usamos as <b>chaves de palma</b> (mão esquerda) e a chave lateral. Ar rápido e firme, garganta aberta, sem apertar o lábio.'],
 ['Super agudo','Acima do <b>Mi6</b> começa o <b>super agudo</b>. Fá6 e Fá#6 ainda usam chaves do instrumento; acima deles vêm as notas harmônicas. No MUSICALIS o super agudo aparece só no avançado, com moderação, porque exige controle de ar e afinação.'],
 ['Articulação','<b>Staccato</b> (ponto em cima ou embaixo da nota): curto e separado. <b>Legato</b> (arco sobre notas diferentes): sem separar. <b>Acento (&gt;)</b>: começar a nota mais forte.'],
 ['Compassos compostos','No <b>6/8</b> há 6 colcheias por compasso, mas sentimos <b>2 pulsos</b> (cada um com 3 colcheias): "1 e a 2 e a". O 9/8 tem 3 pulsos e o 12/8 tem 4.']],

  ['Quantos pulsos sentimos no 6/8?',['6','3','2','4'],2,'Dois grupos de 3 colcheias.'],
  ['O acento (>) indica…',['nota mais forte no início','nota mais longa','repetir','respirar'],0,'Ataque mais forte.']],

  ['O 12/8 tem quantos pulsos?',['2','3','4','12'],2,'4 grupos de 3.'],
  ['O legato pede…',['notas separadas','notas sem separar','notas mais curtas','pausas entre as notas'],1,'Ligar as notas.'],
  ['Para o agudo soar bem…',['morder a palheta','ar rápido e garganta aberta','soprar pouco','fechar a boca'],1,'Ar firme, sem apertar.'],
  ['Super agudo é a região…',['abaixo do Sib3','entre Mi4 e Fá5','acima do Mi6','entre Sol5 e Mi6'],2,'Tudo acima do Mi6 é super agudo.'],

ma nota da escala","tocar duas notas juntas","tocar três vezes","tocar em 3/4"],0,"Ex.: Dó-Mi, Ré-Fá…"]]},"Básico B8":{"titulo":"Melodias: frases, respiração e expressão","secoes":[["Frase musical","Uma melodia é feita de <b>frases</b>, como um texto. Geralmente a primeira frase \"pergunta\" (termina suspensa) e a segunda \"responde\" (termina na nota principal, a <b>tônica</b>)."],["Onde respirar","Respire <b>no fim das frases</b>, nas notas longas ou nas pausas, nunca no meio de uma palavra musical."],["Cantar antes de tocar","Cante ou solfeje a melodia antes de tocar. Se você sabe como ela soa, os dedos erram menos."]],"teste":[["Uma melodia é organizada em…",["frases","escalas","acordes","claves"],0,"Frases como num texto."],["O melhor lugar para respirar é…",["no meio da frase","no fim da frase ou nas pausas","em toda nota","nunca"],1,"Respire onde a música respira."],["A nota principal da tonalidade chama-se…",["dominante","tônica","sensível","mediante"],1,"Em Dó maior, a tônica é Dó."],["Antes de tocar uma melodia nova, é bom…",["tocar o mais rápido possível","cantar ou solfejar","pular os compassos difíceis","tocar sem ler"],1,"Ouvir por dentro antes de tocar."]],"prova":[["A frase que \"pergunta\" geralmente termina…",["na tônica","suspensa, fora da tônica","com pausa longa","mais forte"],1,"Ela pede uma resposta."],["A frase que \"responde\" termina…",["na tônica","na 7ª","em pausa","no agudo"],0,"Termina em repouso."],["\"Ode à Alegria\" foi composta por…",["Mozart","Beethoven","Bach","Chopin"],1,"Da 9ª Sinfonia de Beethoven, domínio público."],["No compasso 2/4 cabem…",["2 semínimas","4 semínimas","3 semínimas","1 semínima"],0,"2 tempos de semínima."],["Para tocar com expressão devemos…",["tocar tudo igual","variar a intensidade e respeitar as frases","tocar sempre forte","acelerar no fim"],1,"Dinâmica e fraseado dão vida."],["Melodias de domínio público são…",["obras livres de direitos autorais","proibidas","só para piano","sempre modernas"],0,"Podem ser tocadas e arranjadas livremente."]]},"Básico B9":{"titulo":"Mecânica II e revisão do Básico","secoes":[["Padrões","Padrões são <b>grupos de notas que se repetem</b> subindo pela escala (1-2-3, 1-2-3-4…). Eles treinam os dedos e a leitura ao mesmo tempo."],["Saltos maiores","Quartas e quintas exigem mais ar e embocadura firme para a nota de cima soar igual à de baixo."],["Revisão","Você já toca semibreve, mínima, semínima, colcheia, pausas, repetição, as escalas de Dó, Sol e Fá e seus arpejos. Isso é a base de tudo o que vem depois."]],"teste":[["O padrão 1-2-3-4 em Dó começa com…",["Dó-Ré-Mi-Fá","Dó-Mi-Sol-Dó","Dó-Fá-Sol-Dó","Ré-Mi-Fá-Sol"],0,"Quatro notas seguidas da escala."],["Dó para Sol é um salto de…",["terça","quarta","quinta","oitava"],2,"Dó-Ré-Mi-Fá-Sol: 5 notas."],["Os três acordes principais de Dó maior são…",["Dó, Fá e Sol","Dó, Ré e Mi","Dó, Lá e Si","Ré, Mi e Fá"],0,"I, IV e V graus."],["Para tocar saltos com som igual, precisamos de…",["ar e embocadura firmes","morder a palheta","tocar mais rápido","parar o ar"],0,"Ar constante."]],"prova":[["Dó para Fá é um salto de…",["terça","quarta","quinta","sexta"],1,"Dó-Ré-Mi-Fá: 4 notas."],["A pausa de colcheia vale…",["1 tempo","½ tempo","2 tempos","¼ de tempo"],1,"Metade de um tempo."],["O IV grau de Dó maior é…",["Fá","Sol","Mi","Lá"],0,"Dó(I) Ré(II) Mi(III) Fá(IV)."],["Qual escala tem Sib?",["Dó maior","Sol maior","Fá maior","Ré maior"],2,"Fá maior."],["Para subir o BPM com segurança…",["de 5 em 5, só quando estiver limpo","dobrar direto","nunca subir","pular para o máximo"],0,"Progresso gradual."],["Com o Básico completo você está pronto para…",["o Intermediário","parar de estudar","só tocar de ouvido","trocar de instrumento"],0,"Parabéns!"]]},"Intermediário I4":{"titulo":"As escalas com sustenidos e o ciclo das quintas","secoes":[["Ciclo das quintas","Subindo de quinta em quinta a partir do Dó (Dó → Sol → Ré → Lá → Mi → Si → Fá#), cada nova escala ganha <b>um sustenido</b>."],["Ordem dos sustenidos","Os sustenidos entram sempre na mesma ordem: <b>Fá – Dó – Sol – Ré – Lá – Mi – Si</b>. Dica: o último sustenido da armadura fica meio tom abaixo da tônica (em Ré maior, o último é Dó# → tônica Ré)."],["Como estudar","Para cada tom: escala, terças e arpejos. Comece devagar, toque de memória depois de alguns dias e suba o BPM aos poucos."]],"teste":[["Subindo uma quinta a partir de Sol chegamos em…",["Ré","Dó","Lá","Fá"],0,"Sol-Lá-Si-Dó-Ré."],["Quantos sustenidos tem Ré maior?",["1","2","3","4"],1,"Fá# e Dó#."],["Quantos sustenidos tem Lá maior?",["2","3","4","5"],1,"Fá#, Dó#, Sol#."],["A ordem dos sustenidos começa com…",["Fá#","Dó#","Si#","Sol#"],0,"Fá Dó Sol Ré Lá Mi Si."]],"prova":[["Quantos sustenidos tem Mi maior?",["3","4","5","6"],1,"Fá#, Dó#, Sol#, Ré#."],["Quantos sustenidos tem Si maior?",["4","5","6","7"],1,"Fá# Dó# Sol# Ré# Lá#."],["A armadura com 6 sustenidos é de…",["Si maior","Fá# maior","Dó# maior","Mi maior"],1,"Fá# maior."],["Último sustenido Sol#: a tônica é…",["Lá","Sol","Mi","Ré"],0,"Meio tom acima do último sustenido."],["Arpejo de Mi maior:",["Mi-Sol-Si","Mi-Sol#-Si","Mi-Lá-Dó#","Mi-Sol#-Dó"],1,"1-3-5 de Mi maior."],["As terças de Lá maior começam com…",["Lá-Dó#","Lá-Dó","Lá-Ré","Lá-Mi"],0,"Lá maior tem Dó#."]]},"Intermediário I5":{"titulo":"Escalas com bemóis e a escala cromática","secoes":[["Ciclo das quartas","Descendo de quinta (ou subindo de quarta) a partir do Dó: Dó → Fá → Sib → Mib → Láb → Réb → Solb. Cada escala ganha <b>um bemol</b>."],["Ordem dos bemóis","<b>Si – Mi – Lá – Ré – Sol – Dó – Fá</b> (o contrário dos sustenidos). Dica: o <b>penúltimo bemol</b> é o nome da tonalidade (Sib, Mib → Sib maior)."],["Escala cromática","Tem <b>12 notas</b>, todas separadas por semitom. Subindo usamos sustenidos; descendo, bemóis. É a escala da agilidade e do dedilhado alternativo."]],"teste":[["Quantos bemóis tem Sib maior?",["1","2","3","4"],1,"Sib e Mib."],["O primeiro bemol da armadura é sempre…",["Mib","Sib","Láb","Fá"],1,"Si – Mi – Lá – Ré…"],["Quantas notas tem a escala cromática?",["7","8","10","12"],3,"Todos os semitons."],["Armadura com Sib, Mib e Láb é de…",["Mib maior","Láb maior","Sib maior","Réb maior"],0,"Penúltimo bemol = Mib."]],"prova":[["Quantos bemóis tem Láb maior?",["3","4","5","6"],1,"Sib Mib Láb Réb."],["Réb maior tem…",["4 bemóis","5 bemóis","6 bemóis","3 bemóis"],1,"Sib Mib Láb Réb Solb."],["Solb maior soa igual a…",["Fá# maior","Sol maior","Fá maior","Lá maior"],0,"São enarmônicas."],["Na cromática descendente usamos…",["sustenidos","bemóis","só naturais","dobrados"],1,"Bemóis na descida."],["O arpejo de Sib maior é…",["Sib-Ré-Fá","Sib-Réb-Fá","Sib-Mib-Sol","Sib-Ré-Mib"],0,"1-3-5."],["Entre duas notas vizinhas da cromática há…",["um tom","um semitom","uma terça","um tom e meio"],1,"Sempre semitom."]]},"Intermediário I6":{"titulo":"Escalas menores: natural, harmônica e melódica","secoes":[["Tonalidade relativa","Toda escala maior tem uma <b>relativa menor</b> com a mesma armadura, começando no 6º grau. Dó maior ↔ Lá menor; Sol maior ↔ Mi menor; Fá maior ↔ Ré menor."],["Os três tipos","<b>Natural</b>: as notas da relativa maior. <b>Harmônica</b>: eleva o 7º grau (som \"árabe\" entre o 6º e o 7º). <b>Melódica</b>: sobe com 6º e 7º elevados e desce como a natural."],["Sensível","O 7º grau elevado (Sol# em Lá menor) chama-se <b>sensível</b>: ele \"puxa\" para a tônica e cria a cadência forte do tom menor."]],"teste":[["A relativa menor de Dó maior é…",["Mi menor","Lá menor","Ré menor","Dó menor"],1,"Começa no 6º grau."],["A menor harmônica eleva o…",["3º grau","6º grau","7º grau","5º grau"],2,"O 7º vira sensível."],["Em Lá menor harmônica, a sensível é…",["Sol","Sol#","Fá#","Si"],1,"Sol elevado."],["A menor melódica na descida fica igual à…",["natural","harmônica","maior","cromática"],0,"Desce como a natural."]],"prova":[["A relativa menor de Sol maior é…",["Mi menor","Si menor","Lá menor","Ré menor"],0,"6º grau de Sol."],["Ré menor tem armadura de…",["Fá maior (1 bemol)","Ré maior","Sol maior","Dó maior"],0,"Relativa de Fá."],["Mi menor harmônica tem…",["Ré#","Dó#","Sol#","Láb"],0,"7º grau elevado: Ré#."],["Lá menor melódica subindo tem…",["Fá# e Sol#","só Sol#","Fá e Sol","Sib"],0,"6º e 7º elevados."],["Mib menor é relativa de…",["Solb maior","Mib maior","Si maior","Láb maior"],0,"6 bemóis."],["O arpejo de Lá menor é…",["Lá-Dó-Mi","Lá-Dó#-Mi","Lá-Ré-Fá","Lá-Si-Dó"],0,"1-b3-5."]]},"Intermediário I7":{"titulo":"Melodias: tonalidades, compassos e fraseado","secoes":[["Ler pela tonalidade","Antes de tocar, olhe a <b>armadura</b> e o <b>compasso</b>. Toque a escala daquele tom primeiro: os dedos já ficam \"no lugar\"."],["Período musical","Muitas melodias têm <b>8 ou 16 compassos</b>: frase de pergunta, frase de resposta. Repare quando o começo se repete: isso ajuda a memorizar."],["Expressão","Use <b>dinâmica</b> (forte/piano), <b>crescendo</b> nas frases que sobem e um final calmo nas cadências."]],"teste":[["O que olhar primeiro numa partitura nova?",["o título","armadura e compasso","a última nota","a cor"],1,"Tom e compasso."],["Uma melodia de 16 compassos tem geralmente…",["2 a 4 frases","1 nota","16 frases","nenhuma frase"],0,"Frases de 4 ou 8 compassos."],["Crescendo significa…",["diminuir o som","aumentar o som aos poucos","acelerar","parar"],1,"Aumentar gradualmente."],["Compasso 3/4 tem…",["2 tempos","3 tempos","4 tempos","6 tempos"],1,"Valsa."]],"prova":[["Semínima pontuada + colcheia =",["1 tempo","2 tempos","3 tempos","1 tempo e meio"],1,"1,5 + 0,5."],["Mib maior tem…",["3 bemóis","2 bemóis","1 bemol","4 bemóis"],0,"Sib Mib Láb."],["Diminuendo significa…",["diminuir o som aos poucos","aumentar","parar","repetir"],0,"Oposto do crescendo."],["Cadência é…",["o final de uma frase","um instrumento","uma clave","a velocidade"],0,"Ponto de repouso."],["Para memorizar uma melodia ajuda…",["perceber as repetições","tocar sem ler","mudar as notas","tocar só o fim"],0,"Padrões repetidos."],["Em 2/4 a semínima vale…",["1 tempo","2 tempos","½ tempo","4 tempos"],0,"1 tempo."]]},"Intermediário I8":{"titulo":"Intervalos, registros e articulação","secoes":[["Intervalos","Intervalo é a distância entre duas notas. Conte as notas incluindo as duas pontas: Dó–Mi é <b>3ª</b>, Dó–Fá <b>4ª</b>, Dó–Sol <b>5ª</b>, Dó–Lá <b>6ª</b>."],["Registros do sax","<b>Grave</b>: Sib3 a Ré4. <b>Médio</b>: Mi4 a Fá5. <b>Agudo</b>: Sol5 a Mi6 (chaves de palma). Cada região pede um jeito de ar: grave com ar quente e relaxado, agudo com ar firme e garganta aberta."],["Staccato","Notas curtas e leves (ponto sobre a nota). A língua toca e solta rápido; o ar continua apoiado."]],"teste":[["Dó–Sol é um intervalo de…",["4ª","5ª","6ª","3ª"],1,"5 notas."],["O registro médio vai de…",["Sib3 a Ré4","Mi4 a Fá5","Sol5 a Mi6","Dó4 a Dó5"],1,"Mi4 a Fá5."],["Staccato é…",["nota curta e leve","nota longa","nota ligada","nota mais grave"],0,"Ponto sobre a nota."],["Para os graves soarem bem…",["ar quente e boca relaxada","morder","soprar o mínimo","fechar a garganta"],0,"Relaxar."]],"prova":[["Dó–Lá é…",["5ª","6ª","7ª","4ª"],1,"6 notas."],["Ré–Sol é…",["3ª","4ª","5ª","6ª"],1,"Ré Mi Fá Sol."],["A passagem mais delicada do sax é…",["Dó#5–Ré5","Dó4–Ré4","Sol4–Lá4","Mi4–Fá4"],0,"Troca quase todos os dedos."],["O registro agudo usa…",["chaves de palma","só a mão esquerda","a chave de Sib grave","nenhuma tecla"],0,"Ré6, Ré#6, Mi6…"],["A nota mais grave do sax é…",["Dó4","Sib3","Lá3","Ré4"],1,"Sib3 (escrito)."],["Intervalos de 3ª na escala de Sol: o primeiro par é…",["Sol-Si","Sol-Dó","Sol-Lá","Sol-Ré"],0,"Sol-Lá-Si."]]},"Intermediário I9":{"titulo":"Introdução aos modos e à pentatônica","secoes":[["O que é um modo","Um modo é uma escala que usa <b>as mesmas notas</b> de uma escala maior, mas começa em outro grau. Ré dórico = notas de Dó maior de Ré a Ré."],["Os primeiros modos","<b>Dórico</b> (2º grau): menor com 6ª maior, som de jazz e de música mineira. <b>Mixolídio</b> (5º grau): maior com 7ª menor, som de blues e baião. <b>Lídio</b> (4º grau): maior com 4ª aumentada, som \"flutuante\". <b>Frígio</b> (3º grau): menor com 2ª menor, som espanhol."],["Pentatônica maior","Cinco notas (1-2-3-5-6), sem semitons. Quase nada \"soa errado\": por isso é a escala preferida para começar a improvisar."]],"teste":[["Ré dórico usa as notas de…",["Ré maior","Dó maior","Sol maior","Fá maior"],1,"2º grau de Dó."],["O mixolídio começa no…",["2º grau","4º grau","5º grau","6º grau"],2,"Sol mixolídio em Dó."],["A pentatônica maior tem…",["5 notas","6 notas","7 notas","8 notas"],0,"1-2-3-5-6."],["A nota característica do lídio é…",["4ª aumentada","2ª menor","7ª menor","6ª maior"],0,"Fá# em Dó lídio."]],"prova":[["Mi frígio usa as notas de…",["Mi maior","Dó maior","Lá maior","Si maior"],1,"3º grau de Dó."],["O dórico é um modo…",["maior","menor com 6ª maior","diminuto","aumentado"],1,"Menor com 6ª maior."],["Sol mixolídio tem…",["Fá natural","Fá#","Sib","Dó#"],0,"Notas de Dó maior."],["Pentatônica maior de Dó:",["Dó Ré Mi Sol Lá","Dó Mi Fá Sol Si","Dó Ré Fá Sol Lá","Dó Mib Fá Sol Sib"],0,"1-2-3-5-6."],["Fá lídio usa as notas de…",["Dó maior","Fá maior","Sib maior","Sol maior"],0,"4º grau de Dó."],["O som \"espanhol\" vem do modo…",["lídio","frígio","jônio","mixolídio"],1,"2ª menor."]]},"Intermediário I10":{"titulo":"Primeiros passos no jazz: swing, blues e ii-V-I","secoes":[["Swing","No jazz, as colcheias são tocadas <b>desiguais</b>: a primeira mais longa, a segunda mais curta, como uma tercina (♩♪). Fale \"dú-bá, dú-bá\" e acentue levemente a segunda colcheia. O playback do MUSICALIS já toca com swing."],["Blues de 12 compassos","A forma mais tocada do jazz: <b>I7 (4 compassos) – IV7 (2) – I7 (2) – V7 – IV7 – I7 – V7</b>. A escala de blues (1 – b3 – 4 – #4 – 5 – b7) dá o sabor."],["ii – V – I","A sequência de acordes mais importante do jazz: em Dó, <b>Dm7 – G7 – C7M</b>. As <b>notas-guia</b> (3ª e 7ª de cada acorde) caminham por graus pequenos e mostram a harmonia."]],"teste":[["No swing, a primeira colcheia é…",["mais curta","mais longa","igual","em pausa"],1,"Longa-curta."],["O blues tradicional tem…",["8 compassos","12 compassos","16 compassos","32 compassos"],1,"12 compassos."],["O ii-V-I em Dó é…",["Dm7 – G7 – C7M","C – F – G","Am – Dm – E7","G7 – C – F"],0,"Graus II, V e I."],["A \"blue note\" da escala de blues é a…",["#4 (ou b5)","2ª","6ª","7ª maior"],0,"O semitom entre 4 e 5."]],"prova":[["As notas-guia de um acorde são…",["tônica e quinta","terça e sétima","só a tônica","nona e décima primeira"],1,"3ª e 7ª definem o acorde."],["O acorde de G7 tem…",["Sol Si Ré Fá","Sol Si Ré Fá#","Sol Sib Ré Fá","Sol Dó Ré Fá"],0,"Dominante com 7ª menor."],["Escala de blues em Dó:",["Dó Mib Fá Fá# Sol Sib","Dó Ré Mi Sol Lá","Dó Mi Sol Sib","Dó Ré Mib Fá Sol"],0,"1 b3 4 #4 5 b7."],["No blues em Dó, o IV7 é…",["F7","G7","D7","A7"],0,"4º grau."],["Para sentir o swing ajuda…",["falar \"dú-bá\" e acentuar a segunda","tocar tudo igual","acelerar","tocar staccato"],0,"Acento no contratempo."],["C7M significa…",["Dó com 7ª maior","Dó menor","Dó com 7ª menor","Dó diminuto"],0,"Dó Mi Sol Si."]]},"Avançado A4":{"titulo":"Os sete modos gregos","secoes":[["Modos relativos","Das notas de Dó maior saem sete modos: <b>Jônio</b> (Dó), <b>Dórico</b> (Ré), <b>Frígio</b> (Mi), <b>Lídio</b> (Fá), <b>Mixolídio</b> (Sol), <b>Eólio</b> (Lá) e <b>Lócrio</b> (Si)."],["Modos paralelos","Para tocar qualquer modo em qualquer tônica, pense na <b>escala maior-mãe</b>: Dó dórico = notas de Sib maior; Lá frígio = notas de Fá maior; Sol lídio = notas de Ré maior."],["Cor de cada modo","Maiores: jônio (padrão), lídio (#4, brilhante), mixolídio (b7, blues). Menores: dórico (6ª maior, jazz), eólio (natural, triste), frígio (b2, espanhol). Lócrio (b2 e b5) é o mais instável, usado sobre m7(b5)."]],"teste":[["O 6º modo de Dó maior é…",["Dórico","Eólio","Lócrio","Mixolídio"],1,"Lá eólio."],["Dó dórico usa as notas de…",["Sib maior","Dó maior","Fá maior","Mib maior"],0,"Dó é o 2º grau de Sib."],["O modo usado sobre m7(b5) é o…",["lócrio","lídio","jôn
