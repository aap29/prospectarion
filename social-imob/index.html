<title>SOCIAL IMOB 360 PRO</title>
<style>
:root{
  --bg:#F7F4EC; --surface:#FFFFFF; --row:#F5F6F8; --row2:#EEF0F4; --line:#E3E6EC;
  --txt:#323338; --mut:#676879; --blue:#579BFC; --navy:#1F4E8C;
  --acc:#FF7A45; --acc2:#FFB38A; --ok:#00C875; --bad:#E2445C; --warn:#FDAB3D; --dark:#333333;
  --r:12px; --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Figtree,Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,Menlo,Consolas,"Roboto Mono",monospace}
body.dev-tablet{--fs:16px}
body.dev-pc{--fs:15px}

/* Cabeçalho + abas */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;max-width:1280px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.hrow h1{font-size:18px}
.hrow h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.hbtn{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
img.logo{background:none;object-fit:cover}
.inst-logo{width:96px;height:96px;border-radius:22px;display:block;margin:4px auto 10px;box-shadow:0 6px 18px rgba(242,85,44,.35)}
.passo{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0}
.passo b.n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.big-cta{width:100%;padding:16px;font-size:17px}
body.standalone #btnInstalar{display:none}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1280px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 9px;cursor:pointer;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600}
.tabs button b{font-size:19px;line-height:1}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
main{padding:16px 16px 100px;max-width:1280px;margin:0 auto}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 18px rgba(255,122,69,.45);cursor:pointer}

/* Blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:18px;margin-bottom:10px}
.card h3{font-size:15px;margin-bottom:8px}
.sub{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp{height:10px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.empty{color:var(--mut);font-size:13px;padding:8px 0}
.title-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.title-row h2{font-size:22px;flex:1}

/* Botões e campos */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600;font-size:14px;color:var(--txt)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(87,155,252,.15)}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
details.sec{background:var(--row);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
details.sec summary{cursor:pointer;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:600}
.chip.on{border-color:var(--acc);background:#FFF1EA;color:#B8471C}
.chips{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;margin-bottom:12px;padding-bottom:2px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* Etiquetas sólidas (estilo do card de referência) */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:92px;padding:6px 10px;border-radius:4px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;text-align:center}
.pill.sm{min-width:0;padding:2px 7px;font-size:11px}
.pill.light{color:#323338}

/* Tabela agrupada */
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:19px;font-weight:600}
.grp-h .cnt{font-size:12px;color:var(--mut);font-weight:500}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.mt{border-collapse:separate;border-spacing:0 4px;width:100%;min-width:640px}
table.mt th{font-size:12px;color:var(--mut);font-weight:500;padding:2px 6px;text-align:center;white-space:nowrap}
table.mt th:first-child{text-align:left}
table.mt td{background:var(--row);padding:4px;text-align:center;vertical-align:middle;font-size:14px}
table.mt td.nm{text-align:left;padding:10px 12px;border-left:5px solid var(--blue);border-radius:4px 0 0 4px;cursor:pointer;min-width:220px;position:sticky;left:0;z-index:1;background:var(--row)}
table.mt td:last-child{border-radius:0 4px 4px 0}
table.mt td .pill{width:100%}
table.mt tr.tot td{background:transparent;font-size:12px;color:var(--mut)}
.chk{width:20px;height:20px;accent-color:var(--ok)}

/* Painel tipo mLabs */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.tile{border-radius:12px;color:#fff;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);min-height:150px;display:flex;flex-direction:column}
.tile .th{padding:9px 12px;background:rgba(0,0,0,.14);font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.tile .tb{padding:12px;display:flex;justify-content:space-between;align-items:flex-end;flex:1}
.tile .big{font-size:34px;font-weight:800;line-height:1}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;opacity:.95;font-weight:700}
.tile .side{text-align:right;font-size:12px;line-height:1.5}
.tile .ic{font-size:34px}
.badge-up{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--ok);align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-left:4px}
.badge-dn{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--bad);align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-left:4px}

/* Listas */
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .t{font-weight:600}
.it .m{font-size:12px;color:var(--mut)}
.it .grow{flex:1;min-width:0}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.col{flex:0 0 84%;max-width:310px;scroll-snap-align:start;background:var(--row);border-radius:12px;min-height:220px;overflow:hidden}
body.dev-pc .col,body.dev-tablet .col{flex:1 1 0;max-width:none;min-width:200px}
.col h3{font-size:14px;display:flex;justify-content:space-between;margin:0;padding:9px 11px;color:#fff}
.col .cb{padding:8px}
.kc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.kc .t{font-size:13px;font-weight:600}
.kc .m{font-size:11px;color:var(--mut);margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.kc .mv{display:flex;justify-content:space-between;margin-top:7px}
.kc .mv button{background:var(--row);border:1px solid var(--line);border-radius:6px;padding:2px 12px;cursor:pointer}
.col.drop{outline:2px dashed var(--acc)}

/* Calendário estilo Swonkie / Magnific */
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;color:var(--mut);text-align:center;padding:4px 0;font-weight:700;text-transform:uppercase}
.cal .d{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:64px;padding:4px;cursor:pointer;overflow:hidden}
.cal .d.out{background:transparent;border-style:dashed;opacity:.5}
.cal .d.hoje{border:2px solid var(--acc)}
.cal .d.sel{background:#FFF6F1}
.cal .d .n{font-size:12px;font-weight:700;margin-bottom:2px}
.cal .d .n i{display:inline-block;background:var(--ok);color:#fff;border-radius:3px;padding:0 4px;font-style:normal}
.mini{border-radius:4px;margin-top:3px;overflow:hidden;background:var(--row);font-size:10px;line-height:1.25}
.mini .s{color:#fff;font-weight:700;padding:1px 4px;text-transform:uppercase;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .x{padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:10px;color:var(--mut);margin-top:2px}
body.dev-celular .mini .x{display:none}
body.dev-celular .mini .s{font-size:0;height:5px;padding:0}
body.dev-pc .cal .d{min-height:110px}
.wk{display:grid;grid-template-columns:1fr;gap:10px}
body.dev-pc .wk,body.dev-tablet .wk{grid-template-columns:repeat(7,minmax(0,1fr))}
.wkd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:90px}
.wkd .dh{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.wcard{border-radius:6px;overflow:hidden;margin-bottom:6px;cursor:pointer;border:1px solid var(--line)}
.wcard .s{color:#fff;font-weight:700;padding:4px 8px;font-size:12px;text-align:center}
.wcard .b{padding:6px 8px;font-size:12px;background:var(--surface)}
.wcard .b b{font-weight:700}

/* Grade 30 dias (SlideKit) */
.g30{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
body.dev-celular .g30{grid-template-columns:repeat(2,1fr)}
.g30 .gc{border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.g30 .gc .gh{color:#fff;font-weight:800;font-size:22px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center}
.g30 .gc .gh small{font-size:11px;font-weight:600;opacity:.9}
.g30 .gc .gb{padding:8px 10px;font-size:12px;min-height:58px}
.g30 .gc.hoje{outline:3px solid var(--acc)}

/* Semestre (SlideTeam) */
.sem .mh2{background:var(--acc);color:#fff;font-weight:800;padding:8px 12px;border-radius:8px 8px 0 0}
.sem .mb{background:#FFF5EE;border:1px solid #FFD9C6;border-top:0;border-radius:0 0 8px 8px;padding:10px 12px;margin-bottom:12px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(30,30,40,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:760px){.ov{align-items:center}.modal{border-radius:16px}}
.modal .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.modal .mh h2{font-size:19px}
.modal .mh .x{margin-left:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dark);color:#fff;font-weight:600;padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.panel-n{display:inline-flex;width:24px;height:24px;border-radius:6px;background:var(--acc);color:#fff;font-weight:800;font-size:13px;align-items:center;justify-content:center;margin-right:6px}
.bar{height:10px;background:var(--row2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.score{font-size:40px;font-weight:800}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td,.spec th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.spec th{font-size:12px;color:var(--mut)}
.counter{font-size:12px;font-weight:700;text-align:right;margin-top:3px}
.counter.over{color:var(--bad)}
.imv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.devs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dev{border:2px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;background:var(--surface)}
.dev b{display:block;font-size:30px}
.dev.on{border-color:var(--acc);background:#FFF1EA}
</style>

/* ---------------- Banco local (IndexedDB) ---------------- */
function abrirDB(){
  return new Promise(function(res, rej){
    var r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = function(){
      var d = r.result;
      if(!d.objectStoreNames.contains('conteudos')) d.createObjectStore('conteudos', {keyPath:'id'});
      if(!d.objectStoreNames.contains('imoveis')) d.createObjectStore('imoveis', {keyPath:'id'});
      if(!d.objectStoreNames.contains('config')) d.createObjectStore('config', {keyPath:'k'});
    };
    r.onsuccess = function(){ db = r.result; res(); };
    r.onerror = function(){ rej(r.error); };
  });
}
function lerTudo(store){
  return new Promise(function(res, rej){
    var q = db.transaction(store, 'readonly').objectStore(store).getAll();
    q.onsuccess = function(){ res(q.result || []); };
    q.onerror = function(){ rej(q.error); };
  });
}
// todas as requisições disparadas de forma síncrona na mesma transação
function gravar(store, itens){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readwrite'); var st = tx.objectStore(store);
    itens.forEach(function(i){ st.put(i); });
    tx.oncomplete = function(){ res(); };
    tx.onerror = function(){ rej(tx.error); };
    tx.onabort = function(){ rej(tx.error); };
  });
}
function apagar(store, id){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(id);
    tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); };
  });
}
function salvarCfg(){ return gravar('config', [{k:'main', v:S.cfg}]); }
function salvarCampanhas(){ return gravar('config', [{k:'campanhas', v:S.campanhas}]); }
function carregar(){
  return Promise.all([lerTudo('conteudos'), lerTudo('imoveis'), lerTudo('config')]).then(function(r){
    S.conteudos = r[0]; S.imoveis = r[1];
    var c = r[2].filter(function(x){ return x.k==='main'; })[0];
    var cp = r[2].filter(function(x){ return x.k==='campanhas'; })[0];
    S.cfg = c ? c.v : JSON.parse(JSON.stringify(PADRAO));
    S.campanhas = cp ? (cp.v||[]) : [];
    Object.keys(PADRAO).forEach(function(k){ if(S.cfg[k]==null) S.cfg[k] = JSON.parse(JSON.stringify(PADRAO[k])); });
    S.cfg.perfis.forEach(function(p){ var d = PADRAO.perfis.filter(function(x){ return x.k===p.k; })[0]; if(d && !p.ic) p.ic = d.ic; if(!p.rede) p.rede = 'Instagram'; });
    aplicarDevice();
    if(!c) return salvarCfg();
  });
}

  return gravar('conteudos', [c]);
}

el 45s: quais documentos separar antes de tentar financiar o primeiro imóvel (doc c/ foto, CPF, comprovante renda, residência, estado civil + FGTS se aplicável). Documentação completa não garante aprovação — banco ainda analisa renda, capacidade, modalidade e depois o imóvel.","cta":"CASA","objetivo":"Educação","idunico":"105","observacoes":""},{"conteudo":"🎬 Reel #1 — Financiamento ou consórcio: compare o custo total, não só a parcela","status":"Ideia","formato":"Reel","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-14","roteiroouideia":"Uma parcela menor nem sempre significa a melhor escolha. No financiamento existem juros e outros custos; no consórcio não há juros, mas existem taxa de administração, possíveis fundos e reajustes previstos em contrato. A decisão depende do prazo, da urgência e da sua capacidade financeira. Eu sou Anderson Alves, consultor de investimentos e consórcios. Quer comparar os caminhos com números reais? Me chama para uma simulação.","cta":"Me chama para comparar financiamento e consórcio com uma simulação","objetivo":"Educação","idunico":"106","observacoes":"Conteúdo exclusivo do @andersonalves.invest. Não usar estatística 9 em cada 10 nem afirmar valores genéricos sem simulação. Comparar custo total e prazo."},{"conteudo":"🎬 Reel #2 — Consórcio não tem juros, mas tem custos: entenda antes de contratar","status":"Ideia","formato":"Reel","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-15","roteiroouideia":"Consórcio não cobra juros como um financiamento, mas isso não significa custo zero. A parcela pode incluir fundo comum, taxa de administração, fundo de reserva e seguro, conforme o contrato. O crédito e as parcelas também podem ser reajustados pelo índice previsto no grupo. Eu sou Anderson Alves, consultor de investimentos e consórcios. Antes de contratar, peça a composição completa da parcela.","cta":"Me chama e peça uma simulação com todos os custos identificados","objetivo":"Educação","idunico":"107","observacoes":"Conteúdo exclusivo do @andersonalves.invest. Linguagem técnica e transparente. Não prometer imóvel sem juros como se não houvesse taxa ou reajuste."},{"conteudo":"🎬 Reel #3 — Carta contemplada: o que precisa acontecer antes de usar o crédito","status":"Ideia","formato":"Reel","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-16","roteiroouideia":"A contemplação libera o direito de utilizar o crédito, mas a compra ainda depende das regras do contrato, análise da administradora, documentação e aprovação do bem ou serviço. Se houver transferência de cota, também é necessário verificar condições, saldo devedor e autorização da administradora. Eu sou Anderson Alves, consultor de investimentos e consórcios. Quer analisar uma opção com segurança? Fale comigo.","cta":"Fale comigo para analisar regras, saldo e documentação da carta","objetivo":"Lead","idunico":"108","observacoes":"Conteúdo exclusivo do @andersonalves.invest. Retiradas promessas de uso imediato e disponibilidade de cartas não comprovada."},{"conteudo":"📌 Post Fixo — Financiamento e consórcio atendem necessidades diferentes","status":"Ideia","formato":"Post","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-17","roteiroouideia":"TEXTO DA ARTE: Financiamento ou consórcio? A resposta depende do seu prazo. LEGENDA: O financiamento pode atender quem precisa adquirir o bem agora e aceita o custo do crédito. O consórcio pode atender quem possui planejamento e aceita que a contemplação não tem data garantida. Compare entrada, custo total, prazo, reajustes, taxas e urgência antes de decidir.","cta":"Salve e me chame para fazer uma comparação personalizada","objetivo":"Educação","idunico":"109","observacoes":"Post exclusivo do @andersonalves.invest. Comparação equilibrada, sem demonizar bancos, sem promessa de economia universal e sem números genéricos."},{"conteudo":"🎠 Carrossel — 6 perguntas essenciais antes de entrar em um consórcio","status":"Ideia","formato":"Carrossel","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-18","roteiroouideia":"SLIDE 1: 6 perguntas antes de entrar em um consórcio. | SLIDE 2: Qual é a taxa de administração total e como ela será cobrada? | SLIDE 3: Existem fundo de reserva, seguro ou outras cobranças? | SLIDE 4: Qual índice reajusta o crédito e as parcelas? | SLIDE 5: Quais são as regras de sorteio, lance próprio e lance embutido? | SLIDE 6: O que acontece se eu atrasar, desistir ou precisar transferir a cota? | SLIDE 7: A administradora está autorizada pelo Banco Central? | SLIDE FINAL: Leia o contrato e compare cenários antes de decidir.","cta":"Salve este carrossel e me chame para analisar uma proposta","objetivo":"Educação","idunico":"110","observacoes":"Carrossel exclusivo do @andersonalves.invest. Conteúdo baseado em transparência contratual. Retiradas afirmações sobre poupança e carta contemplada que poderiam induzir ao erro."},{"conteudo":"📸 Post — Bastidor: como preparo uma análise de consórcio","status":"Ideia","formato":"Post","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-19","roteiroouideia":"TEXTO DA ARTE: Antes da proposta, vem a estratégia. LEGENDA: Neste perfil, meu trabalho é entender objetivo, prazo, capacidade mensal e recursos disponíveis para lance. Depois comparo crédito, prazo, custos, reajustes e regras do grupo. Consórcio não deve ser vendido como promessa; deve ser analisado como uma decisão de longo prazo. Anderson Alves, consultor de investimentos e consórcios.","cta":"Qual é o seu objetivo: imóvel, veículo ou patrimônio? Me chama","objetivo":"Autoridade","idunico":"111","observacoes":"Post exclusivo do @andersonalves.invest. Humaniza o atendimento e separa claramente esta atuação da corretagem imobiliária."},{"conteudo":"🎬 Reel #1 — Por que empresas locais somem do Google? O erro invisível","status":"Ideia","formato":"Reel","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-14","roteiroouideia":"GANCHO: 'Seu concorrente aparece no Google Maps e você não. Eu vou te mostrar por quê.' DESENVOLVIMENTO: Perfil do Google Meu Negócio desatualizado ou sem fotos = invisibilidade. Dado: 76% das buscas locais resultam em visita ao estabelecimento. CTA: 'Comenta GOOGLE que te mando um diagnóstico grátis do seu perfil.'","cta":"Comenta GOOGLE para diagnóstico grátis","objetivo":"Autoridade","idunico":"112","observacoes":"Reel #1 @marcaeestrategia — abrir com problema/dor das empresas locais. Série da semana."},{"conteudo":"🎥 YouTube — Guia do consórcio: custos, contemplação e uso da carta de crédito","status":"Roteiro","formato":"Vídeo YouTube","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"YouTube","datapublicacao":"2026-09-16","roteiroouideia":"ABERTURA: o que o público aprenderá e para quem o consórcio pode fazer sentido. | BLOCO 1: consórcio como sistema de autofinanciamento em grupo e papel da administradora autorizada. | BLOCO 2: composição da parcela: fundo comum, taxa de administração e cobranças previstas no contrato. | BLOCO 3: contemplação por sorteio ou lance, sem garantia de data. | BLOCO 4: tipos de lance e impacto no saldo devedor conforme regras do grupo. | BLOCO 5: etapas posteriores à contemplação: análise, documentos e aquisição do bem ou serviço. | BLOCO 6: riscos, reajustes e perguntas obrigatórias antes de aderir. | ENCERRAMENTO: convite para simulação personalizada. Duração prevista: 12 a 18 minutos.","cta":"Inscreva-se e deixe sua dúvida sobre consórcio","objetivo":"Autoridade","idunico":"113","observacoes":"Canal Anderson Alves Investimentos / @andersonalves.invest. Basear dados no contrato do grupo, na Lei 11.795/2008 e em orientações do Banco Central. Não publicar como conteúdo imobiliário."},{"conteudo":"🎥 YouTube — Como comparar administradoras e planos de consórcio com segurança","status":"Ideia","formato":"Vídeo YouTube","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"YouTube","datapublicacao":"2026-09-18","roteiroouideia":"ABERTURA: não existe melhor administradora para todos; existe proposta adequada ao objetivo e ao orçamento. | BLOCO 1: confirmar autorização e supervisão no Banco Central. | BLOCO 2: comparar taxa de administração total, prazo, fundo de reserva, seguro e critérios de reajuste. | BLOCO 3: entender regras de contemplação e histórico sem transformar histórico em promessa futura. | BLOCO 4: avaliar atendimento, canais, contrato, assembleias e transparência. | BLOCO 5: comparar propostas equivalentes, com mesmo crédito e prazo. | BLOCO 6: demonstração usando somente dados oficiais e vigentes de propostas reais. | ENCERRAMENTO: checklist e convite para análise. Duração prevista: 12 a 18 minutos.","cta":"Comente sua dúvida e peça o checklist de comparação","objetivo":"Autoridade","idunico":"114","observacoes":"Canal Anderson Alves Investimentos / @andersonalves.invest. Não publicar ranking ou taxas sem documentos atuais das administradoras. HS pode ser apresentada com base na proposta vigente, sem superioridade automática."},{"conteudo":"🎬 Reel #2 — O que acontece com a empresa que ignora o marketing digital","status":"Ideia","formato":"Reel","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-15","roteiroouideia":"GANCHO: 'Você sabia que 60% das pequenas empresas fecham em 5 anos? Uma das principais causas: invisibilidade digital.' DESENVOLVIMENTO: Mostrar o ciclo — sem presença digital → menos clientes → receita cai → fecha. Dado: empresa com GMN ativo recebe 7x mais cliques. CTA: 'Salva e manda para um dono de negócio que precisa ver isso.'","cta":"Salva esse vídeo e manda para um dono de negócio que precisa ver isso","objetivo":"Educação","idunico":"115","observacoes":"Reel #2 @marcaeestrategia — solução/desenvolvimento. Continua o gancho do Reel #1 (erro invisível no Google)."},{"conteudo":"🎬 Reel #3 — Em 24h configurei o Google Meu Negócio de uma empresa e isso aconteceu","status":"Ideia","formato":"Reel","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-16","roteiroouideia":"GANCHO: 'Em menos de 24 horas, configurei o Google Meu Negócio de um cliente e o telefone dele começou a tocar.' DESENVOLVIMENTO: Mostrar o processo: perfil antes (zerado/incompleto) → configuração → primeiros resultados (ligações, visitas, avaliações). PROVA: resultado real ou simulação visual do antes/depois. CTA: 'Me chama no WhatsApp — faço o diagnóstico do seu negócio grátis hoje.'","cta":"Me chama no WhatsApp: (51) 98416-8848 — diagnóstico grátis","objetivo":"Lead","idunico":"116","observacoes":"Reel #3 @marcaeestrategia — autoridade + conversão. Fecha a série com prova social e CTA direto."},{"conteudo":"📌 Post Fixo — 3 sinais de que sua empresa precisa de um marketing urgente","status":"Ideia","formato":"Post","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-17","roteiroouideia":"Post estático com lista visual. Design: fundo #0A1628, título Playfair Display branco, lista em Inter com ícones dourados. SINAL 1: Seu concorrente aparece no Google e você não. SINAL 2: Seu Instagram tem menos de 3 posts nos últimos 30 dias. SINAL 3: Você depende só de indicação para fechar clientes. Rodapé: 'Se você marcou 2 ou mais — a gente precisa conversar.' + (51) 98416-8848.","cta":"Comenta quantos desses você tem — serei honesto na resposta","objetivo":"Engajamento","idunico":"117","observacoes":"Post fixo de quinta @marcaeestrategia. Padrão 1 adaptado — lista de impacto com gancho de identificação."},{"conteudo":"🎠 Carrossel — Passo a passo para configurar seu Google Meu Negócio do zero","status":"Ideia","formato":"Carrossel","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-18","roteiroouideia":"SLIDE 1 (capa): 'Passo a passo para colocar seu negócio no Google Maps — do zero' | SLIDE 2: Acesse business.google.com e crie sua conta. | SLIDE 3: Preencha nome exato, categoria e endereço. | SLIDE 4: Adicione horários de funcionamento e telefone. | SLIDE 5: Suba pelo menos 10 fotos reais do negócio. | SLIDE 6: Peça avaliações para os primeiros clientes — isso impacta o ranqueamento. | SLIDE 7: Publique posts semanais no perfil. | SLIDE FINAL: 'Quer que eu faça isso por você? Me chama no WhatsApp.'","cta":"Salva esse carrossel — é o tutorial mais completo que você vai encontrar","objetivo":"Educação","idunico":"118","observacoes":"Carrossel de sexta @marcaeestrategia. Alto potencial de salvamento e compartilhamento — tutorial prático. Elemento cortado na borda direita em todos os slides intermediários."},{"conteudo":"📸 Post — Bastidor: como é montar uma estratégia digital para um negócio local","status":"Ideia","formato":"Post","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-19","roteiroouideia":"Post de bastidor de Anderson trabalhando — notebook, anotações, visita a cliente. Padrão 7 adaptado para @marcaeestrategia: foto de Anderson em ação + overlay leve + frase: 'Cada negócio local que ajudo a crescer no digital é uma família que consegue pagar as contas no final do mês.' + logo Marca & Estratégia + (51) 98416-8848.","cta":"Comenta: qual é o maior desafio do seu negócio no digital?","objetivo":"Engajamento","idunico":"119","observacoes":"Post de sábado @marcaeestrategia. Humaniza a marca e conecta emocionalmente com pequenos empreendedores."},{"conteudo":"🎬 Reel #1 — Antes de procurar imóvel, descubra quanto você pode comprar","status":"Ideia","formato":"Reel","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-14","roteiroouideia":"Antes de procurar uma casa ou apartamento, descubra quanto realmente cabe no seu orçamento. O primeiro passo é analisar renda, valor disponível para entrada, possibilidade de usar o FGTS e composição de renda. Isso define uma faixa de compra realista e evita visitas a imóveis incompatíveis. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Quer começar essa análise? Me chama no Direct. Até a próxima vez!","cta":"Me chama no Direct para analisar sua faixa de compra","objetivo":"Educação","idunico":"120","observacoes":"Conteúdo exclusivo do @corretorandersonalves.invest. Tema imobiliário: preparação financeira do comprador antes das visitas. Não mencionar consórcio ou HS."},{"conteudo":"🎬 Reel #2 — A parcela sozinha não revela qual imóvel você pode comprar","status":"Ideia","formato":"Reel","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-15","roteiroouideia":"Muita gente escolhe o imóvel olhando apenas o valor da parcela. Mas o banco também analisa renda comprovada, comprometimento mensal, entrada, prazo, idade e histórico de crédito. Por isso, duas pessoas com a mesma renda podem receber condições diferentes. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Antes de visitar, faça uma análise da sua capacidade de compra. Me chama no Direct. Até a próxima vez!","cta":"Me chama no Direct para avaliar sua capacidade de compra","objetivo":"Educação","idunico":"121","observacoes":"Conteúdo exclusivo do @corretorandersonalves.invest. Tema imobiliário: capacidade de compra e análise de financiamento. Sem consórcio."},{"conteudo":"🎬 Reel #3 — Três informações que o corretor precisa antes de indicar um imóvel","status":"Ideia","formato":"Reel","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-16","roteiroouideia":"Antes de indicar um imóvel, eu preciso entender três pontos: onde você quer morar, quanto pode investir e em quanto tempo pretende comprar. Sem essas respostas, a busca vira uma sequência de visitas sem direção. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Quer encontrar imóveis compatíveis com sua realidade? Me chama no Direct. Até a próxima vez!","cta":"Me chama no Direct e conte região, orçamento e prazo","objetivo":"Lead","idunico":"122","observacoes":"Conteúdo exclusivo do @corretorandersonalves.invest. Tema imobiliário: qualificação do comprador e busca direcionada. Retiradas referências a banco, patrimônio, HS e consórcio."},{"conteudo":"📌 Post Fixo — O imóvel certo começa com uma busca bem orientada","status":"Ideia","formato":"Post","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-17","roteiroouideia":"TEXTO DA ARTE: O imóvel certo começa com uma busca bem orientada. LEGENDA: Antes de abrir dezenas de anúncios, defina localização, faixa de compra, entrada disponível, forma de pagamento e necessidades da família. Quando esses critérios estão claros, a procura fica mais rápida, segura e realista. Anderson Alves: imóveis com visão, negócios com estratégia.","cta":"Salve este post e me chame para organizar sua busca","objetivo":"Autoridade","idunico":"123","observacoes":"Post exclusivo do @corretorandersonalves.invest. Posicionamento como corretor consultivo. Não usar assinatura de estrategista patrimonial ou HS Consórcios."},{"conteudo":"🎠 Carrossel — 5 passos antes de visitar o primeiro imóvel","status":"Ideia","formato":"Carrossel","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-18","roteiroouideia":"SLIDE 1: 5 passos antes de visitar o primeiro imóvel. | SLIDE 2: Defina a região e o deslocamento aceitável. | SLIDE 3: Calcule entrada, despesas da compra e faixa de parcela. | SLIDE 4: Verifique renda, FGTS e possibilidade de composição de renda. /* ---------------- Regras ---------------- */
function atrasado(c){ return !!(c.data && c.data < hoje() && c.etapa !== 'Publicado'); }
function filtrados(){
  var b = norm(UI.busca);
  return S.conteudos.filter(function(c){
    if(UI.perfil!=='todos' && c.perfil!==UI.perfil) return false;
    if(UI.formato!=='todos' && c.formato!==UI.formato) return false;
    if(UI.rede!=='todas' && redeDe(c)!==UI.rede) return false;
    if(UI.perenes && !c.perene) return false;
    if(b && norm(c.titulo + ' ' + c.tema + ' ' + c.gancho).indexOf(b)<0) return false;
    return true;
  });
}
function ordemData(a,b){ var x=(a.data||'9999')+(a.hora||''), y=(b.data||'9999')+(b.hora||''); return x<y?-1:x>y?1:0; }
function reelsSemYoutube(){ return S.conteudos.filter(function(c){ return c.formato==='Reel' && !c.youtubeId && c.etapa!=='Ideia'; }); }
function sequencia(){
  var pub = {}; S.conteudos.forEach(function(c){ if(c.etapa==='Publicado' && c.data) pub[c.data]=1; });
  var n=0, d=hoje(); if(!pub[d]) d=addDias(d,-1);
  while(pub[d]){ n++; d=addDias(d,-1); }
  return n;
}
function num(v){ var n = parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
function interacoes(c){ var m = c.metricas||{}; return num(m.curtidas)+num(m.comentarios)+num(m.salvos)+num(m.compart); }
function taxaEng(c){ var m = c.metricas||{}; var base = num(m.alcance) || num(m.views); return base ? interacoes(c)/base*100 : null; }

/* ---------------- Render ---------------- */
function render(){
  $all('#tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.v===UI.view); });
  var f = {painel:vPainel, calendario:vCalendario, workflow:vWorkflow, planilha:vPlanilha, campanhas:vCampanhas, redes:vRedes, grade:vGrade, semestre:vSemestre, imoveis:vImoveis, ajustes:vAjustes}[UI.view];
  $('#app').innerHTML = f();
  ligar();
}
function chipsPerfil(){

function legenda(){ return '<div class="legend">'+REDE_NOMES.map(function(r){ return '<span><i class="dot" style="background:'+corRede(r)+'"></i>'+r+'</span>'; }).join('')+'</div>'; }
function itemConteudo(c){

/* ---------- CALENDÁRIO (Mês / Semana / Dia) ---------- */
function miniCard(c){
  var r = redeDe(c);
  return '<div class="mini" data-open="'+c.id+'"><div class="s" style="background:'+corRede(r)+'">'+(c.hora?esc(c.hora)+' · ':'')+esc(r)+'</div><div class="x" style="border-left:3px solid '+(atrasado(c)?'#E2445C':ETAPA_COR[c.etapa])+'">'+esc(c.titulo)+'</div></div>';
}
function weekCard(c){
  var r = redeDe(c), p = perfil(c.perfil);
  return '<div class="wcard" data-open="'+c.id+'"><div class="s" style="background:'+corRede(r)+'">'+REDES[r].ic+' '+esc(r)+'</div><div class="b"><b>Horário:</b> '+esc(c.hora||'—')+'<br><b>Conteúdo:</b> '+esc(c.titulo)+'<br><span style="color:'+p.cor+';font-weight:700">'+esc(p.arroba)+'</span><div style="margin-top:4px">'+pillEtapa(c,true)+'</div></div></div>';
}
function vCalendario(){
  if(!UI.mes){ var d0=new Date(); UI.mes=[d0.getFullYear(), d0.getMonth()]; }
  var porDia = {};
  filtrados().forEach(function(c){ if(c.data){ (porDia[c.data]=porDia[c.data]||[]).push(c); } });
  Object.keys(porDia).forEach(function(k){ porDia[k].sort(ordemData); });
  var s = chipsPerfil();
  s += '<div class="row" style="margin-bottom:8px">'+['mes','semana','dia'].map(function(m){ return '<span class="chip '+(UI.calModo===m?'on':'')+'" data-cal="'+m+'">'+{mes:'Mensal',semana:'Semanal',dia:'Diária'}[m]+'</span>'; }).join('')+
    '<span style="flex:1"></span><button class="btn sm" data-act="exportCal">📤 Exportar mês</button></div>';
  s += legenda();
  if(UI.calModo==='mes'){
    var y=UI.mes[0], m=UI.mes[1], off=new Date(y,m,1).getDay(), dias=new Date(y,m+1,0).getDate();
    s += '<div class="card"><div class="row"><button class="btn sm" data-mes="-1">◀</button><h2 style="flex:1;text-align:center;margin:0">'+MESES[m]+' '+y+'</h2><button class="btn sm" data-mes="1">▶</button></div><div class="sp"></div><div class="cal">';
    DIAS.forEach(function(x){ s+='<div class="h">'+x+'</div>'; });
    for(var i=0;i<off;i++) s+='<div class="d out"></div>';
    var lim = document.body.classList.contains('dev-pc') ? 4 : 3;
    for(var dd=1; dd<=dias; dd++){
      var k = ymd(y,m+1,dd), lst = porDia[k]||[];
      s += '<div class="d '+(k===hoje()?'hoje ':'')+(k===UI.diaSel?'sel':'')+'" data-dia="'+k+'"><div class="n">'+(k===hoje()?'<i>'+dd+'</i>':dd)+'</div>'+lst.slice(0,lim).map(miniCard).join('')+(lst.length>lim?'<div class="more">+'+(lst.length-lim)+' ver mais</div>':'')+'</div>';
    }
    s += '</div><p class="hint">Faixa de cima = rede. Barrinha lateral = status. Toque no dia para ver os detalhes.</p></div>';
    if(UI.diaSel) s += cartaoDia(UI.diaSel, porDia[UI.diaSel]||[]);
  } else if(UI.calModo==='semana'){
    if(!UI.semIni){ var hh=hoje(); UI.semIni = addDias(hh, -((dow(hh)+6)%7)); }
    s += '<div class="card"><div class="row"><button class="btn sm" data-sem="-7">◀</button><h2 style="flex:1;text-align:center;margin:0">Semana de '+dataBR(UI.semIni)+'</h2><button class="btn sm" data-sem="7">▶</button></div><div class="sp"></div><div class="wk">';
    for(var w=0; w<7; w++){
      var dk = addDias(UI.semIni, w), ls = porDia[dk]||[];
      s += '<div class="wkd" style="'+(dk===hoje()?'border:2px solid var(--acc)':'')+'"><div class="dh"><span>'+DIAS[dow(dk)]+' '+dataCurta(dk)+'</span><button class="btn sm ghost" data-novodia="'+dk+'">＋</button></div>'+(ls.length?ls.map(weekCard).join(''):'<div class="empty">Livre</div>')+'</div>';
    }
    s += '</div></div>';
  } else {
    var dia = UI.diaSel || hoje();
    s += '<div class="card"><div class="row"><button class="btn sm" data-diamv="-1">◀</button><h2 style="flex:1;text-align:center;margin:0">'+DIAS_L[dow(dia)]+' '+dataBR(dia)+'</h2><button class="btn sm" data-diamv="1">▶</button></div></div>';
    s += cartaoDia(dia, porDia[dia]||[]);
  }
  s += '<div class="card"><h2>🕳️ Lacunas dos próximos 7 dias</h2><p class="sub">Pela sua cadência: Reels seg/ter/qua, post qui, carrossel sex, post sáb e YouTube 2×/semana.</p>';
  s += '<div class="chips" style="margin-top:8px">'+S.cfg.perfis.map(function(p){ return '<span class="chip '+(UI.gapPerfil===p.k?'on':'')+'" data-gap="'+p.k+'"><i class="dot" style="background:'+p.cor+'"></i>'+esc(p.arroba)+'</span>'; }).join('')+'</div><div class="list">';
  var lac = lacunas(UI.gapPerfil);
  s += lac.length ? lac.map(function(g){ return '<div class="it"><b>📌</b><div class="grow"><div class="t">'+DIAS[dow(g.data)]+' '+dataBR(g.data)+' · '+g.formato+'</div><div class="m">Sem conteúdo planejado</div></div><button class="btn sm" data-encaixar="'+g.data+'|'+g.formato+'">Encaixar</button></div>'; }).join('') : '<div class="empty">Semana coberta para este perfil. ✅</div>';
  return s + '</div></div>';
}
function cartaoDia(k, lst){
  return '<div class="card"><div class="row"><h2 style="flex:1;margin:0">'+DIAS_L[dow(k)]+' '+dataBR(k)+'</h2><button class="btn sm acc" data-novodia="'+k+'">+ Novo</button></div><div class="sp"></div>'+
    (lst.length ? '<div class="wk" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">'+lst.map(weekCard).join('')+'</div>' : '<div class="empty">Dia livre.</div>')+'</div>';
}
function lacunas(pk){
  var out = [], h = hoje();
  for(var i=0;i<7;i++){
    var d = addDias(h,i), w = dow(d), precisa = [];
    if(S.cfg.cadencia[w]) precisa.push(S.cfg.cadencia[w]);
    if((S.cfg.youtubeDias||[]).indexOf(w)>=0) precisa.push('YouTube');
    precisa.forEach(function(f){
      var tem = S.conteudos.some(function(c){ return c.perfil===pk && c.data===d && (c.formato===f || (f!=='YouTube' && c.formato!=='YouTube' && c.formato!=='Story')); });
      if(!tem) out.push({data:d, formato:f});
    });
  }
  return out;
}

/* ---------- REDES: assistentes por rede ---------- */
function dadosRede(r){ return S.conteudos.filter(function(c){ return redeDe(c)===r; }); }
function insights(r){
  var pubs = dadosRede(r).filter(function(c){ return c.etapa==='Publicado' && taxaEng(c)!==null; });
  var out = {n:pubs.length};
  if(!pubs.length) return out;
  out.media = pubs.reduce(function(a,c){ return a+taxaEng(c); },0)/pubs.length;
  function agrupa(fn){ var g={}; pubs.forEach(function(c){ var k=fn(c); if(k==null||k==='') return; (g[k]=g[k]||[]).push(taxaEng(c)); }); return Object.keys(g).filter(function(k){ return g[k].length>=2; }).map(function(k){ return {k:k, n:g[k].length, m:g[k].reduce(function(a,b){return a+b;},0)/g[k].length}; }).sort(function(a,b){ return b.m-a.m; }); }
  out.dias = agrupa(function(c){ return c.data ? DIAS_L[dow(c.data)] : null; });
  out.horas = agrupa(function(c){ if(!c.hora) return null; var h=+c.hora.split(':')[0]; return h<9?'Manhã cedo (até 9h)':h<12?'Manhã (9h–12h)':h<14?'Almoço (12h–14h)':h<18?'Tarde (14h–18h)':h<21?'Noite (18h–21h)':'Noite tarde (21h+)'; });
  out.formatos = agrupa(function(c){ return c.formato; });
  out.perfis = agrupa(function(c){ return perfil(c.perfil).arroba; });
  out.top = pubs.slice().sort(function(a,b){ return taxaEng(b)-taxaEng(a); }).slice(0,5);
  out.leads = pubs.reduce(function(a,c){ return a+num((c.metricas||{}).leads); },0);
  return out;
}
function auditoria(r){
  var cs = dadosRede(r), h = hoje();
  var pub30 = cs.filter(function(c){ return c.etapa==='Publicado' && c.data>addDias(h,-30) && c.data<=h; });
  var semanas = 0; for(var w=0; w<4; w++){ var ini=addDias(h,-7*(w+1)), fim=addDias(h,-7*w); if(cs.some(function(c){ return c.etapa==='Publicado' && c.data>ini && c.data<=fim; })) semanas++; }
  var pubs = cs.filter(function(c){ return c.etapa==='Publicado'; });
  var comMet = pubs.filter(function(c){ return taxaEng(c)!==null; }).length;
  var comCta = cs.filter(function(c){ return c.cta && c.cta.trim(); }).length;
  var comLink = pubs.filter(function(c){ return c.link; }).length;
  var meta = r==='Google' ? 4 : r==='YouTube' ? 8 : 12;
  var auto = [
    ['freq', 'Frequência: '+pub30.length+' publicações em 30 dias (meta '+meta+')', pub30.length>=meta, 'Planeje pelo menos '+Math.ceil(meta/4)+' publicações por semana nesta rede. Use “Gerar mês pelo modelo” em Ajustes → 5.'],
    ['consist', 'Constância: publicou em '+semanas+' das últimas 4 semanas', semanas>=4, 'Não deixe semana vazia: o algoritmo favorece contas constantes.'],
    ['medicao', 'Medição: '+comMet+' de '+pubs.length+' publicados com números', pubs.length>0 && comMet/pubs.length>=0.7, 'Registre alcance e interações 48 h depois de publicar (ficha do conteúdo → Resultados).'],
    ['cta', 'Chamada para ação: '+comCta+' de '+cs.length+' conteúdos', cs.length>0 && comCta/cs.length>=0.8, 'Todo conteúdo deve terminar com uma única próxima ação.'],
    ['link', 'Links salvos: '+comLink+' de '+pubs.length+' publicados', pubs.length>0 && comLink/pubs.length>=0.8, 'Cole o link publicado para acompanhar e reaproveitar.']
  ];
  var man = (AUDIT_MANUAL[r]||[]).map(function(x){ var ok = !!((S.cfg.auditoria[r]||{})[x[0]]); return [x[0], x[1], ok, 'Ajuste: '+x[1].toLowerCase()+'.', true]; });
  var todos = auto.concat(man), ok = todos.filter(function(x){ return x[2]; }).length;
  return {itens:todos, nota: todos.length ? Math.round(ok/todos.length*100) : 0};
}

function gerarMesModelo(pk){

function parseCSV(txt){
  txt = txt.replace(/^﻿/, '');
  var primeira = txt.split(/\r?\n/)[0] || '';
  var sep = (primeira.split(';').length > primeira.split(',').length) ? ';' : ',';
  var rows = [], row = [], cel = '', q = false;
  for(var i=0;i<txt.length;i++){
    var ch = txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cel+='"'; i++; } else q=false; } else cel += ch; }
    else {
      if(ch==='"') q = true;
      else if(ch===sep){ row.push(cel); cel=''; }
      else if(ch==='\n'){ row.push(cel); rows.push(row); row=[]; cel=''; }
      else if(ch==='\r'){ }
      else cel += ch;
    }
  }
  if(cel!=='' || row.length){ row.push(cel); rows.push(row); }
  if(!rows.length) return [];
  var cab = rows[0].map(norm);
  return rows.slice(1).filter(function(r){ return r.some(function(x){ return x && x.trim(); }); }).map(function(r){
    var o = {}; cab.forEach(function(k,i){ o[k] = (r[i]||'').trim(); }); return o;
  });
}

  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return ymd(+m[1], +m[2], +m[3]);
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return ymd(+m[3], +m[2], +m[1]);
  if((m = s.match(/^([A-Za-zÀ-ú]+)\.?\s+(\d{1,2}),?\s+(\d{4})/))){ var mm = MES_N[norm(m[1]).slice(0,3)]; if(mm) return ymd(+m[3], mm, +m[2]); }

function lerZip(buf){
  var dv = new DataView(buf), eocd = -1;
  for(var i = buf.byteLength-22; i >= Math.max(0, buf.byteLength-65557); i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd = i; break; } }

  if(dv.getUint32(eocd+16,true)===0xFFFFFFFF || dv.getUint16(eocd+10,true)===0xFFFF) return Promise.reject(new Error('Exportação grande demais (ZIP64). Exporte só o banco Conteúdo 360° ou extraia o ZIP e envie o arquivo .csv.'));
  var total = dv.getUint16(eocd+10,true), off = dv.getUint32(eocd+16,true), itens = [];
  for(var k=0;k<total;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    var metodo = dv.getUint16(off+10,true), tam = dv.getUint32(off+20,true), nl = dv.getUint16(off+28,true), el = dv.getUint16(off+30,true), cl = dv.getUint16(off+32,true), lho = dv.getUint32(off+42,true);
    var nome = new TextDecoder().decode(new Uint8Array(buf, off+46, nl));
    off += 46+nl+el+cl;
    var ini = lho + 30 + dv.getUint16(lho+26,true) + dv.getUint16(lho+28,true);
    itens.push({nome:nome, metodo:metodo, dados:new Uint8Array(buf, ini, tam)});
  }
  return Promise.all(itens.map(function(it){
    if(it.metodo===0) return Promise.resolve({nome:it.nome, bytes:it.dados});
    if(it.metodo===8){
      if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('Este navegador não abre ZIP. Extraia e envie o CSV.'));
      return new Response(new Blob([it.dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(b){ return {nome:it.nome, bytes:new Uint8Array(b)}; });
    }
    return Promise.resolve(null);
  })).then(function(r){ return r.filter(Boolean); });
}
function csvsDeArquivo(nome, buf){
  if(/\.zip$/i.test(nome)){
    return lerZip(buf).then(function(arqs){
      return Promise.all(arqs.map(function(a){
        if(/\.zip$/i.test(a.nome)) return csvsDeArquivo(a.nome, a.bytes.slice().buffer);
        if(/\.csv$/i.test(a.nome)) return [{nome:a.nome, txt:new TextDecoder().decode(a.bytes)}];
        return [];
      })).then(function(l){ return [].concat.apply([], l); });
    });
  }
  if(!/\.(csv|txt)$/i.test(nome) && !/^\uFEFF?[^\n]*,/.test(new TextDecoder().decode(new Uint8Array(buf).slice(0,400)))) return Promise.resolve([]);
  return Promise.resolve([{nome:nome, txt:new TextDecoder().decode(new Uint8Array(buf))}]);
}
function importarArquivos(files){
  var msgs = [];
  return Array.prototype.reduce.call(files, function(p, f){
    return p.then(function(){ return f.arrayBuffer(); }).then(function(buf){ return csvsDeArquivo(f.name, buf); }).then(function(csvs){
      if(/\.json$/i.test(f.name)){ msgs.push('"'+f.name+'" é um backup do app: use Ajustes → Restaurar backup.'); return; }
      if(!csvs.length){ msgs.push('"'+f.name+'": não encontrei planilha CSV dentro. No Notion, exporte o banco escolhendo o formato "Markdown e CSV" (não HTML nem PDF).'); return; }
      var temAll = csvs.some(function(c){ return /_all\.csv$/i.test(c.nome); });
      return csvs.filter(function(c){ return !temAll || /_all\.csv$/i.test(c.nome); }).reduce(function(q, c){
        return q.then(function(){ return importarLinhas(parseCSV(c.txt)); }).then(function(m){ msgs.push(m); });
      }, Promise.resolve());
    });
  }, Promise.resolve()).then(function(){ return msgs; });
}

// Restauração atômica: valida antes; troca tudo numa transação só
function restaurar(txt){
  var d;
  try{ d = JSON.parse(txt); }catch(e){ return Promise.reject(new Error('Este arquivo não é um backup do app (.json). Para trazer os dados do Notion, use o botão “Carregar meus conteúdos do Notion” no Painel ou em Ajustes → 6.')); }
  if(!d || d.app!=='SOCIAL_IMOB_360_PRO' || !Array.isArray(d.conteudos) || !Array.isArray(d.imoveis) || typeof d.config!=='object') return Promise.reject(new Error('Backup incompatível'));
  if(d.conteudos.some(function(c){ return !c || !c.id; }) || d.imoveis.some(function(m){ return !m || !m.id; })) return Promise.reject(new Error('Backup com registros sem identificação'));
  var camps = Array.isArray(d.campanhas) ? d.campanhas : [];
  return new Promise(function(res, rej){
    var tx = db.transaction(['conteudos','imoveis','config'], 'readwrite');
    var a = tx.objectStore('conteudos'), b = tx.objectStore('imoveis'), c = tx.objectStore('config');
    a.clear(); b.clear(); c.clear();
    d.conteudos.forEach(function(x){ a.put(x); }); d.imoveis.forEach(function(x){ b.put(x); }); c.put({k:'main', v:d.config}); c.put({k:'campanhas', v:camps});
    tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; tx.onabort = function(){ rej(tx.error || new Error('Restauração cancelada')); };
  }).then(carregar);
}
function zerar(){
  return new Promise(function(res, rej){
    var tx = db.transaction(['conteudos','imoveis','config'], 'readwrite');
    tx.objectStore('conteudos').clear(); tx.objectStore('imoveis').clear(); tx.objectStore('config').clear();
    tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); };
  }).then(carregar);
}

    case 'planoRede': copiar(planoRede(UI.redeSel)); break;
    case 'salvarCfg':
      $all('[data-pf]').forEach(function(i){ var p = i.dataset.pf.split('|'); S.cfg.perfis[+p[0]][p[1]] = i.value.trim(); });
      S.cfg.perfis.forEach(function(p){ if(!/^(imoveis|consorcios|me|kenny)$/.test(p.k)) p.ic = (REDES[p.rede||'Instagram']||{}).ic || p.ic; });
      S.cfg.pilares = $('#cfgPilares').value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
      $all('[data-hs]').forEach(function(i){ S.cfg.hashtags[i.dataset.hs] = i.value.trim(); });
      $all('[data-cad]').forEach(function(i){ if(i.value) S.cfg.cadencia[i.dataset.cad] = i.value; else delete S.cfg.cadencia[i.dataset.cad]; });
      salvarCfg().then(function(){ toast('Ajustes salvos ✔'); render(); });
      break;
    case 'salvarModelo':
      var mo = {}; $all('#app [data-mt]').forEach(function(i){ var w=i.dataset.mt, f=$('#app [data-mf="'+w+'"]').value; if(i.value.trim()) mo[w] = [i.value.trim(), f||'Post']; });
      S.cfg.modelos[UI.modeloPerfil] = mo; salvarCfg().then(function(){ toast('Modelo salvo ✔'); });
      break;
    case 'gerarMes':
      if(!confirm('Criar Ideias para o próximo mês de '+perfil(UI.modeloPerfil).arroba+' seguindo o modelo semanal? Dias que já têm conteúdo não são alterados.')) break;
      gerarMesModelo(UI.modeloPerfil).then(function(r){ toast(r.n+' ideias criadas em '+r.mes); });
      break;
    case 'importar': $('#fileImport').value=''; $('#fileImport').click(); break;
    case 'importarCola':
      var t = $('#csvCola').value; if(!t.trim()){ toast('Cole o CSV primeiro'); break; }
      importarLinhas(parseCSV(t)).then(function(msg){ alert(msg); render(); });
      break;
    case 'exportCsv': baixar('social-imob-conteudos-'+hoje()+'.csv', exportarConteudosCSV(), 'text/csv;charset=utf-8'); break;
    case 'exportImv': baixar('social-imob-imoveis-'+hoje()+'.csv', exportarImoveisCSV(), 'text/csv;charset=utf-8'); break;
    case 'backup': baixar('social-imob-backup-'+hoje()+'.json', backupJSON(), 'application/json'); toast('Backup baixado'); break;
    case 'restaurar': $('#fileRestore').value=''; $('#fileRestore').click(); break;
    case 'relatorio': var r = relatorio(); copiar(r); abrirModal('<div class="mh"><h2>📊 Relatório</h2><button class="btn sm ghost x" data-act="fechar">✕</button></div><textarea style="min-height:280px" readonly>'+esc(r)+'</textarea><p class="hint">Já copiado.</p>'); break;
    case 'zerar':
      var conf = prompt('Isso apaga TODOS os dados deste aparelho. Digite APAGAR para confirmar.');
      if(conf==='APAGAR') zerar().then(function(){ toast('Dados apagados'); UI.view='painel'; render(); });
      break;
  }
}

/* ---------------- Início ---------------- */
function iniciar(){
  $('#ver').textContent = 'v'+APP_VER+' · '+(/^https:/.test(location.protocol)?'online e offline':'offline');
  $all('#tabs button').forEach(function(b){ b.onclick = function(){ UI.view = b.dataset.v; window.scrollTo(0,0); render(); }; });
  $('#fab').onclick = acoesRapidas;
  $('#btnDev').onclick = function(){ telaDevice(false); };
  $('#btnInstalar').onclick = function(){ telaInstalar(); };
  prepararInstalacao();
  $('#ov').onclick = function(e){ if(e.target.id==='ov' && S.cfg && S.cfg.device) fecharModal(); };
  $('#fileImport').onchange = function(e){
    var fs = e.target.files; if(!fs || !fs.length) return;
    toast('Importando…');
    importarArquivos(fs).then(function(msgs){ alert(msgs.join('\n') || 'Nada importado'); render(); }, function(err){ alert('Erro ao importar: '+(err && err.message || err)); });
  };
  $('#fileRestore').onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    if(!confirm('Restaurar substitui TODOS os dados atuais deste aparelho pelos do backup. Continuar?')) return;
    f.text().then(restaurar).then(function(){ toast('Backup restaurado ✔'); render(); }, function(err){ alert('Restauração cancelada, nada foi alterado: '+err.message); });
  };
  return abrirDB().then(carregar).then(function(){ render(); if(!S.cfg.device) telaDevice(true); }).catch(function(err){
    $('#app').innerHTML = '<div class="card"><h2>Não foi possível abrir o banco local</h2><p class="sub">'+esc(err && err.message || err)+'</p><p class="sub">Abra o arquivo no Chrome (não no visualizador de arquivos).</p></div>';
  });
}
if(typeof window !== 'undefined' && !window.__SI_TEST__) document.addEventListener('DOMContentLoaded', iniciar);
</script>
