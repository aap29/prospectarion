, "cta": "Comente a sua outra paixão", "obj": "Engajamento", "pil": "Bastidor", "f": "Post"}, {"t": "Retrospectiva do ano", "g": "As ilustrações do ano.", "r": "Carrossel com as ilustrações do ano (reais). Qual foi a sua preferida?\nComo gravar: carrossel com os destaques.", "cta": "Comente a sua preferida", "obj": "Engajamento", "pil": "Prova social", "f": "Carrossel"}]}}, "tags": {"kenny": "#kennysax29 #saxofone #musicaaovivo #casamento #portoalegre", "kennyacu": "#acustico #musicaaovivo #vozeviolao #eventos #portoalegre", "saxruas": "#saxnasruas #saxofone #musicaderua #artederua #portoalegre", "acu29": "#acustico29 #musicaaovivo #acustico #banda #portoalegre", "mta": "#musicaetecnologia #homestudio #musicos #producaomusical #arte", "kennyilu": "#ilustracao #desenho #arte #processocriativo #sketch"}};
var TEXTOS39 = {"105": {"t": "Documentos antes do financiamento", "g": "Vai financiar o primeiro imóvel? Separe estes documentos antes.", "r": "Vai financiar o primeiro imóvel? Antes de procurar a casa, separe a sua pasta. Documento de identidade com foto e CPF. Comprovante de estado civil: certidão de nascimento ou de casamento. Comprovante de residência atualizado. Comprovantes de renda: holerites, extratos ou declaração de imposto de renda, se você for autônomo. E, se for usar, o extrato do FGTS. Com tudo isso em mãos, a análise anda mais rápido. Mas atenção: documentação completa não garante aprovação. O banco ainda analisa a sua renda, a sua capacidade de pagamento e, depois, o próprio imóvel. Comente CASA que eu te envio a lista completa.", "cta": "Comente CASA"}, "113": {"t": "Guia do consórcio: custos, contemplação e uso da carta de crédito", "g": "Consórcio do começo ao fim: custos, contemplação e o que acontece depois.", "r": "ABERTURA (0:00–0:30): Se você já pensou em consórcio e ficou com dúvida sobre quanto custa, como funciona a contemplação e o que acontece depois que a carta sai, este vídeo é para você. Eu vou explicar o caminho completo, do primeiro boleto até a compra do bem, com transparência. No final, você vai saber se o consórcio faz sentido para o seu objetivo ou se outro caminho é melhor. Eu sou Anderson Alves, consultor de investimentos e consórcios.\n\nBLOCO 1 — O QUE É O CONSÓRCIO (0:30–1:15): Consórcio é um sistema de autofinanciamento em grupo. Um grupo de pessoas com o mesmo objetivo contribui todo mês para formar um fundo comum. Com esse fundo, a cada assembleia, uma ou mais pessoas são contempladas e recebem a carta de crédito para comprar o bem: imóvel, veículo, máquina ou até serviço, conforme o tipo de plano. Quem organiza tudo é a administradora, que precisa ser autorizada e supervisionada pelo Banco Central. Ela forma os grupos, faz as assembleias, cobra as parcelas e libera o crédito. Por isso, o primeiro cuidado é sempre conferir se a administradora é autorizada. Consórcio não é investimento com rentabilidade: é uma forma planejada de comprar.\n\nBLOCO 2 — O QUE TEM DENTRO DA PARCELA (1:15–2:00): A parcela do consórcio não é só o valor do bem dividido pelo prazo. Ela tem algumas partes. O fundo comum, que é o dinheiro que forma as cartas de crédito do grupo. A taxa de administração, que é a remuneração da administradora, cobrada ao longo do plano. Em muitos grupos existe o fundo de reserva, que protege o grupo contra inadimplência. E alguns planos têm seguro. Consórcio não tem juros como o financiamento, mas tem custo. Por isso, a pergunta certa não é só quanto é a parcela, e sim quanto eu vou pagar no total e o que estou recebendo em troca. Peça sempre a simulação com todos esses itens separados.\n\nBLOCO 3 — COMO FUNCIONA A CONTEMPLAÇÃO (2:00–2:42): A contemplação acontece de duas formas: por sorteio ou por lance, conforme as regras do grupo. No sorteio, qualquer participante em dia pode ser contemplado. No lance, você oferece antecipar uma parte das parcelas, e os maiores lances, pelas regras do grupo, são contemplados. O ponto mais importante deste vídeo: ninguém pode garantir a data da sua contemplação. Nem eu, nem a administradora, nem ninguém. Quem promete data está prometendo o que não pode cumprir. O jeito certo de planejar é pensar que a carta pode sair em qualquer momento do prazo, inclusive no final, e tratar uma contemplação antecipada como uma vantagem, não como garantia.\n\nBLOCO 4 — TIPOS DE LANCE (2:42–3:29): Existem alguns tipos de lance, e cada grupo define quais aceita. O lance livre é quando você escolhe o percentual que quer oferecer. O lance fixo tem um percentual definido pelo grupo. E o lance embutido usa uma parte da própria carta de crédito para compor o lance, o que significa que você recebe um crédito menor. Em geral, o lance pago reduz o saldo devedor, diminuindo o prazo ou o valor das parcelas, conforme o regulamento. Antes de pensar em lance, responda: de onde vem esse dinheiro? Lance não deve sair da sua reserva de emergência. E o histórico de lances de um grupo ajuda a planejar, mas não é promessa para as próximas assembleias.\n\nBLOCO 5 — DEPOIS DA CONTEMPLAÇÃO (3:29–4:07): Fui contemplado, e agora? A carta de crédito não cai livre na sua conta. Primeiro, a administradora faz uma análise: confere documentos, capacidade de pagamento das parcelas que faltam e, no caso de imóvel, a documentação e a avaliação do bem. Depois de aprovado, o pagamento é feito ao vendedor, e o bem fica como garantia até o fim do plano. Esse processo leva algum tempo, então vale ir organizando os documentos com antecedência. Em muitos planos imobiliários, a carta pode ser usada também para construção, reforma ou quitação de financiamento, conforme as regras do contrato.\n\nBLOCO 6 — RISCOS E PERGUNTAS ANTES DE ENTRAR (4:07–4:46): Agora, as perguntas que você precisa fazer antes de assinar. Qual é a taxa de administração total? Existe fundo de reserva e seguro? Qual índice reajusta a carta e a parcela? Quais são as regras de lance? O que acontece se eu precisar desistir? E a mais importante: essa parcela cabe no meu orçamento por todo o prazo, mesmo com reajuste? Os principais riscos são entrar sem objetivo, comprometer renda demais, contar com uma data de contemplação e não ler o regulamento. Com respostas claras para essas perguntas, o consórcio pode ser uma ótima ferramenta de planejamento.\n\nENCERRAMENTO (4:46–5:10): Recapitulando: consórcio é compra planejada, tem custos que precisam ser comparados, a contemplação não tem data garantida e, depois da carta, ainda existe uma etapa de análise. Se você quer saber se o consórcio faz sentido para o seu objetivo, inscreva-se no canal, deixe a sua dúvida nos comentários e peça uma simulação personalizada pelo WhatsApp (51) 98416-8848.", "cta": "Inscreva-se e deixe sua dúvida sobre consórcio"}, "114": {"t": "Como comparar administradoras e planos de consórcio com segurança", "g": "Não existe a melhor administradora para todo mundo. Existe a proposta certa para você.", "r": "ABERTURA (0:00–0:26): Não existe a melhor administradora de consórcio para todo mundo. Existe a proposta adequada ao seu objetivo e ao seu orçamento. Neste vídeo eu mostro um passo a passo para comparar administradoras e planos com segurança, sem cair na armadilha de olhar só a parcela. No final, eu deixo um checklist para você usar em qualquer proposta. Eu sou Anderson Alves, consultor de investimentos e consórcios.\n\nBLOCO 1 — AUTORIZAÇÃO DO BANCO CENTRAL (0:26–0:57): O primeiro filtro é simples e eliminatório: a administradora precisa ser autorizada a funcionar e é supervisionada pelo Banco Central. Antes de qualquer conversa sobre valores, confirme isso nos canais oficiais do Banco Central, procurando pelo nome e pelo CNPJ da empresa. Desconfie de quem pede pagamento antecipado para garantir carta, promete contemplação rápida ou vende carta contemplada sem contrato claro com a administradora. Autorização não é detalhe: é a base da segurança do seu dinheiro.\n\nBLOCO 2 — O QUE COMPARAR NOS CUSTOS (0:57–1:32): Depois da autorização, compare os custos de forma completa. Taxa de administração total, e não só a mensal. Prazo do grupo. Existência de fundo de reserva e qual é o percentual. Seguro, se houver, e se ele é obrigatório. E o critério de reajuste: qual índice corrige a carta e a parcela, e em que momento. Duas propostas com a mesma parcela podem ter custos totais muito diferentes. Por isso, monte uma tabela simples com esses itens lado a lado. É assim que a comparação fica justa.\n\nBLOCO 3 — CONTEMPLAÇÃO E HISTÓRICO (1:32–2:03): O próximo ponto são as regras de contemplação. Quantas contemplações por assembleia o grupo costuma ter? Quais tipos de lance são aceitos: livre, fixo, embutido? Como o lance é abatido do saldo? O histórico de lances dos últimos meses ajuda a entender o comportamento do grupo e a planejar o seu lance. Mas atenção: histórico não é promessa. Cada assembleia é diferente e ninguém pode garantir quando você será contemplado. Use o histórico para planejar, nunca como garantia.\n\nBLOCO 4 — ATENDIMENTO, CONTRATO E TRANSPARÊNCIA (2:03–2:34): Consórcio é um compromisso de anos. Então avalie também quem vai estar do outro lado durante esse tempo. Os canais de atendimento funcionam? É fácil acessar o extrato, o resultado das assembleias e os boletos? O contrato e o regulamento são entregues antes da assinatura e estão claros? Quem está vendendo responde às suas perguntas com transparência ou só fala da parcela? Uma boa administradora e um bom consultor tornam o caminho até a carta muito mais tranquilo.\n\nBLOCO 5 — COMPARE PROPOSTAS EQUIVALENTES (2:34–3:06): Um erro comum é comparar propostas diferentes como se fossem iguais. Para comparar de verdade, use o mesmo valor de crédito, o mesmo prazo e o mesmo tipo de bem. Só assim a diferença de custo aparece. Se uma proposta tem prazo maior, a parcela pode ser menor, mas o custo total e o tempo de compromisso mudam. Coloque as propostas lado a lado com os mesmos parâmetros e compare o custo total, as regras de lance e o reajuste.\n\nBLOCO 6 — COMO MONTAR A SUA COMPARAÇÃO (3:06–3:37): Na prática, peça a cada administradora a proposta por escrito, com todos os custos separados e o regulamento do grupo. Use somente dados oficiais e vigentes, das propostas que você recebeu. Monte a sua tabela: administradora, autorização confirmada, crédito, prazo, taxa de administração total, fundo de reserva, seguro, índice de reajuste, regras de lance e canais de atendimento. Com essa tabela, a decisão deixa de ser pela parcela mais bonita e passa a ser pela proposta mais adequada.\n\nBLOCO 7 — SINAIS DE ALERTA (3:37–4:17): Alguns sinais pedem que você pare e pergunte mais. Promessa de contemplação em data certa. Pedido de pagamento por fora do boleto da administradora. Venda de carta contemplada sem contrato e sem anuência da administradora. Pressa para você assinar sem ler o regulamento. E respostas vagas quando você pergunta sobre taxa de administração total e reajuste. Se aparecer qualquer um desses sinais, não assine. Peça tudo por escrito, confirme os dados com a administradora e, se precisar, procure uma segunda opinião. Um bom negócio continua bom depois de uma semana de análise; um negócio ruim depende da sua pressa.\n\nENCERRAMENTO (4:17–4:36): Recapitulando o checklist: autorização do Banco Central, custo total, reajuste, regras de contemplação, contrato claro, atendimento e propostas comparadas com os mesmos parâmetros. Comente a sua dúvida aqui embaixo e peça o checklist de comparação. Se quiser ajuda para analisar as suas propostas, chame no WhatsApp (51) 98416-8848.", "cta": "Comente sua dúvida e peça o checklist de comparação"}, "126": {"t": "Consórcio no planejamento patrimonial: possibilidades, limites e riscos", "g": "Consórcio não é investimento. Mas pode fazer parte de um plano de patrimônio.", "r": "ABERTURA (0:00–0:26): Vamos começar sendo honestos: consórcio não é investimento com rentabilidade e não multiplica patrimônio sozinho. Mas, usado com planejamento, ele pode ser uma ferramenta para comprar bens que fazem parte do seu patrimônio. Neste vídeo eu mostro quando o consórcio faz sentido, quais são os limites e os riscos, e quando outro caminho pode ser melhor. Eu sou Anderson Alves, consultor de investimentos e consórcios.\n\nBLOCO 1 — QUANDO A COMPRA PLANEJADA FAZ SENTIDO (0:26–0:58): O consórcio faz mais sentido quando existe um objetivo claro e tempo para esperar. Por exemplo: quem quer comprar um imóvel para alugar nos próximos anos, um terreno para construir, a sede da empresa ou trocar de carro sem pressa. Nesses casos, o consórcio organiza a compra em parcelas, sem juros de financiamento, com os custos previstos em contrato. Se a necessidade é imediata, o consórcio provavelmente não é a ferramenta certa, porque a contemplação não tem data garantida.\n\nBLOCO 2 — INVESTIR DINHEIRO X CONTRATAR CRÉDITO (0:58–1:32): Aqui está uma diferença importante. Quando você investe, o seu dinheiro rende juros a seu favor. Quando você entra no consórcio, você está contratando um crédito por autofinanciamento: paga parcelas, com taxa de administração, para receber uma carta no futuro. O consórcio não rende como uma aplicação. O que ele pode fazer é viabilizar a compra de um bem que, esse sim, pode gerar renda ou valorizar, como um imóvel alugado. Por isso, o consórcio entra no planejamento patrimonial como ferramenta de compra, não como aplicação financeira.\n\nBLOCO 3 — FLUXO DE CAIXA E PRAZO (1:32–2:04): Antes de pensar em patrimônio, pense em fluxo de caixa. A parcela precisa caber no seu orçamento por todo o prazo, considerando os reajustes. E você precisa manter a reserva de emergência separada, porque o dinheiro das parcelas não fica disponível para saque. O prazo também deve combinar com o seu objetivo: onde você quer estar quando pagar a última parcela? Para quem pensa em aposentadoria, por exemplo, faz sentido escolher um prazo que termine antes de a renda mudar.\n\nBLOCO 4 — CONTEMPLAÇÃO E LANCES (2:04–2:36): A contemplação acontece por sorteio ou por lance, conforme as regras do grupo. Você pode usar lance com recursos próprios ou, quando o grupo permite, lance embutido, que usa parte da carta e reduz o crédito que você recebe. Nenhum tipo de lance garante antecipação. Por isso, um bom planejamento considera os dois cenários: a carta saindo cedo e a carta saindo no final do prazo. Se o seu plano só funciona com contemplação rápida, ele precisa ser revisto.\n\nBLOCO 5 — REAJUSTES (2:36–2:56): A carta de crédito e as parcelas são reajustadas pelo índice previsto no contrato. Isso protege o poder de compra da carta, mas também faz a parcela subir ao longo do tempo. Coloque esse reajuste na sua conta desde o início, para não ser surpreendido no meio do caminho.\n\nBLOCO 6 — QUANDO OUTRO CAMINHO É MELHOR (2:56–3:28): Existem cenários em que o consórcio não é a melhor escolha. Se você precisa do bem agora, o financiamento pode fazer mais sentido, mesmo com juros. Se você já tem o dinheiro, a compra à vista pode trazer poder de negociação. E se o objetivo é fazer o dinheiro render, uma aplicação financeira adequada ao seu perfil é o caminho. Um bom consultor mostra esses cenários lado a lado, com transparência, em vez de vender a mesma solução para todo mundo.\n\nEXEMPLO (3:28–4:04): Vamos a um exemplo hipotético, só para ilustrar o raciocínio. Imagine uma pessoa que quer comprar um imóvel para alugar daqui a alguns anos. Ela escolhe uma carta compatível com o valor do imóvel, uma parcela que cabe no orçamento com folga e mantém a reserva separada. Ela planeja como se a carta pudesse sair no fim do prazo. Se a contemplação vier antes, por sorteio ou lance, é um ganho de tempo. Este exemplo não é promessa de resultado: cada grupo e cada pessoa têm regras e números próprios.\n\nPERGUNTAS FREQUENTES (4:04–4:45): Posso usar o consórcio para comprar imóvel para alugar? Sim, a carta imobiliária pode ser usada para comprar imóveis residenciais ou comerciais, conforme o contrato. Consórcio serve para empresa? Pode servir para planejar imóveis, veículos e equipamentos, desde que a parcela caiba no fluxo de caixa. E se a minha renda mudar no meio do caminho? Por isso a parcela deve ter folga e a reserva deve ficar separada; o contrato também traz as regras para transferência ou desistência. Dá para ter mais de uma cota? Dá, mas cada cota é um compromisso a mais no orçamento, então só faz sentido com planejamento.\n\nENCERRAMENTO (4:45–5:00): Resumindo: consórcio não é investimento, é uma ferramenta de compra planejada. Ele funciona quando existe objetivo, prazo, parcela sustentável e reserva preservada. Comente o seu objetivo aqui embaixo e solicite uma análise personalizada pelo WhatsApp (51) 98416-8848.", "cta": "Comente seu objetivo e solicite uma análise personalizada"}};

  Object.keys(antes).forEach(function(id){ if(!depois[id]){ pares.push([JSON.parse(antes[id]), null]); del.push(id); } });

    fim:S.conteudos.reduce(function(m,c){ return c.data && c.data>m ? c.data : m; }, ''), total:S.conteudos.filter(function(c){ return c.data && c.data>=hoje() && c.etapa!=='Publicado'; }).length};

  return gravar('conteudos', put).then(function(){ return del.reduce(function(q,id){ return q.then(function(){ return apagar('conteudos', id); }); }, Promise.resolve()); }).then(salvarCfg).then(function(){ return r; });
}

/* ---------------- Regras ---------------- */
function atrasado(c){ return !!(c.data && c.data < hoje() && c.etapa !== 'Publicado'); }
function filtrados(){
  var b = norm(UI.busca);
  return S.conteudos.filter(function(c){
    if(UI.perfil!=='todos' && c.perfil!==UI.perfil) return false;
    if(UI.formato!=='todos' && c.formato!==UI.formato) return false;
    if(UI.rede!=='todas' && redeDe(c)!==UI.rede) return false;
    if(UI.perenes && !c.perene) return false;
    if(b && norm(c.titulo + ' ' + c.tema + ' ' + c.gancho).indexOf(b)<0) return false;
    return true;
  });
}
function ordemData(a,b){ var x=(a.data||'9999')+(a.hora||''), y=(b.data||'9999')+(b.hora||''); return x<y?-1:x>y?1:0; }
function reelsSemYoutube(){ return S.conteudos.filter(function(c){ return c.formato==='Reel' && !c.youtubeId && !c.deriv && String(c.roteiro||'').trim(); }); }
function sequencia(){
  var pub = {}; S.conteudos.forEach(function(c){ if(c.etapa==='Publicado' && c.data) pub[c.data]=1; });
  var n=0, d=hoje(); if(!pub[d]) d=addDias(d,-1);
  while(pub[d]){ n++; d=addDias(d,-1); }
  return n;
}
function num(v){ var n = parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
function interacoes(c){ var m = c.metricas||{}; return num(m.curtidas)+num(m.comentarios)+num(m.salvos)+num(m.compart); }
function taxaEng(c){ var m = c.metricas||{}; var base = num(m.alcance) || num(m.views); return base ? interacoes(c)/base*100 : null; }

    '<span style="flex:1"></span><button class="btn sm" data-act="exportCal">📤 Exportar mês</button></div>';

/* ---------- REDES: assistentes por rede ---------- */
function dadosRede(r){ return S.conteudos.filter(function(c){ return redeDe(c)===r; }); }
function insights(r){
  var pubs = dadosRede(r).filter(function(c){ return c.etapa==='Publicado' && taxaEng(c)!==null; });
  var out = {n:pubs.length};
  if(!pubs.length) return out;
  out.media = pubs.reduce(function(a,c){ return a+taxaEng(c); },0)/pubs.length;
  function agrupa(fn){ var g={}; pubs.forEach(function(c){ var k=fn(c); if(k==null||k==='') return; (g[k]=g[k]||[]).push(taxaEng(c)); }); return Object.keys(g).filter(function(k){ return g[k].length>=2; }).map(function(k){ return {k:k, n:g[k].length, m:g[k].reduce(function(a,b){return a+b;},0)/g[k].length}; }).sort(function(a,b){ return b.m-a.m; }); }
  out.dias = agrupa(function(c){ return c.data ? DIAS_L[dow(c.data)] : null; });
  out.horas = agrupa(function(c){ if(!c.hora) return null; var h=+c.hora.split(':')[0]; return h<9?'Manhã cedo (até 9h)':h<12?'Manhã (9h–12h)':h<14?'Almoço (12h–14h)':h<18?'Tarde (14h–18h)':h<21?'Noite (18h–21h)':'Noite tarde (21h+)'; });
  out.formatos = agrupa(function(c){ return c.formato; });
  out.perfis = agrupa(function(c){ return perfil(c.perfil).arroba; });
  out.top = pubs.slice().sort(function(a,b){ return taxaEng(b)-taxaEng(a); }).slice(0,5);
  out.leads = pubs.reduce(function(a,c){ return a+num((c.metricas||{}).leads); },0);
  return out;
}
function auditoria(r){
  var cs = dadosRede(r), h = hoje();
  var pub30 = cs.filter(function(c){ return c.etapa==='Publicado' && c.data>addDias(h,-30) && c.data<=h; });
  var semanas = 0; for(var w=0; w<4; w++){ var ini=addDias(h,-7*(w+1)), fim=addDias(h,-7*w); if(cs.some(function(c){ return c.etapa==='Publicado' && c.data>ini && c.data<=fim; })) semanas++; }
  var pubs = cs.filter(function(c){ return c.etapa==='Publicado'; });
  var comMet = pubs.filter(function(c){ return taxaEng(c)!==null; }).length;
  var comCta = cs.filter(function(c){ return c.cta && c.cta.trim(); }).length;
  var comLink = pubs.filter(function(c){ return c.link; }).length;
  var meta = r==='Google' ? 4 : r==='YouTube' ? 8 : 12;
  var auto = [
    ['freq', 'Frequência: '+pub30.length+' publicações em 30 dias (meta '+meta+')', pub30.length>=meta, 'Planeje pelo menos '+Math.ceil(meta/4)+' publicações por semana nesta rede. Use “Gerar mês pelo modelo” em Ajustes → 5.'],
    ['consist', 'Constância: publicou em '+semanas+' das últimas 4 semanas', semanas>=4, 'Não deixe semana vazia: o algoritmo favorece contas constantes.'],
    ['medicao', 'Medição: '+comMet+' de '+pubs.length+' publicados com números', pubs.length>0 && comMet/pubs.length>=0.7, 'Registre alcance e interações 48 h depois de publicar (ficha do conteúdo → Resultados).'],
    ['cta', 'Chamada para ação: '+comCta+' de '+cs.length+' conteúdos', cs.length>0 && comCta/cs.length>=0.8, 'Todo conteúdo deve terminar com uma única próxima ação.'],
    ['link', 'Links salvos: '+comLink+' de '+pubs.length+' publicados', pubs.length>0 && comLink/pubs.length>=0.8, 'Cole o link publicado para acompanhar e reaproveitar.']
  ];
  var man = (AUDIT_MANUAL[r]||[]).map(function(x){ var ok = !!((S.cfg.auditoria[r]||{})[x[0]]); return [x[0], x[1], ok, 'Ajuste: '+x[1].toLowerCase()+'.', true]; });
  var todos = auto.concat(man), ok = todos.filter(function(x){ return x[2]; }).length;
  return {itens:todos, nota: todos.length ? Math.round(ok/todos.length*100) : 0};
}

function planoRede(r){

function gerarMesModelo(pk){
  var d0 = new Date(), y = d0.getFullYear(), m = d0.getMonth()+1; if(m>11){ m=0; y++; }

  for(var dd=1; dd<=dias; dd++){
    var k = ymd(y,m+1,dd), it = mo[dow(k)];
    if(!it || !it[0]) continue;
    if(S.conteudos.some(function(c){ return c.perfil===pk && c.data===k; })) continue;
    var c = novoConteudo({titulo:it[0]+' · '+dataCurta(k), perfil:pk, formato:it[1]||'Post', etapa:'Produção', data:k, tema:it[0], cta:perfil(pk).cta});
    registrar(c, 'Criado pelo modelo semanal'); lote.push(c);
  }
  lote.forEach(function(c){ S.conteudos.push(c); });
  return gravar('conteudos', lote).then(function(){ return {n:lote.length, mes:MESES[m]+' '+y}; });
}

function lerZip(buf){

  for(var k=0;k<total;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;

    itens.push({nome:nome, metodo:metodo, dados:new Uint8Array(buf, ini, tam)});
  }
  return Promise.all(itens.map(function(it){
    if(it.metodo===0) return Promise.resolve({nome:it.nome, bytes:it.dados});
    if(it.metodo===8){
      if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('Este navegador não abre ZIP. Extraia e envie o CSV.'));

    }

function csvsDeArquivo(nome, buf){
  if(/\.zip$/i.test(nome)){
    return lerZip(buf).then(function(arqs){

        if(/\.zip$/i.test(a.nome)) return csvsDeArquivo(a.nome, a.bytes.slice().buffer);
        if(/\.csv$/i.test(a.nome)) return [{nome:a.nome, txt:new TextDecoder().decode(a.bytes)}];
        return [];
      })).then(function(l){ return [].concat.apply([], l); });

  if(!/\.(csv|txt)$/i.test(nome) && !/^\uFEFF?[^\n]*,/.test(new TextDecoder().decode(new Uint8Array(buf).slice(0,400)))) return Promise.resolve([]);

      break;
    case 'salvarModelo':
      var mo = {}; $all('#app [data-mt]').forEach(function(i){ var w=i.dataset.mt, f=$('#app [data-mf="'+w+'"]').value; if(i.value.trim()) mo[w] = [i.value.trim(), f||'Post']; });
      S.cfg.modelos[UI.modeloPerfil] = mo; salvarCfg().then(function(){ toast('Modelo salvo ✔'); });
      break;
    case 'gerarMes':
      if(!confirm('Criar Ideias para o próximo mês de '+perfil(UI.modeloPerfil).arroba+' seguindo o modelo semanal? Dias que já têm conteúdo não são alterados.')) break;
      gerarMesModelo(UI.modeloPerfil).then(function(r){ toast(r.n+' ideias criadas em '+r.mes); });
      break;
    case 'importar': $('#fileImport').value=''; $('#fileImport').click(); break;
    case 'importarCola':
      var t = $('#csvCola').value; if(!t.trim()){ toast('Cole o CSV primeiro'); break; }
      importarLinhas(parseCSV(t)).then(function(msg){ alert(msg); render(); });
      break;
    case 'exportCsv': baixar('social-imob-conteudos-'+hoje()+'.csv', exportarConteudosCSV(), 'text/csv;charset=utf-8'); break;
    case 'exportImv': baixar('social-imob-imoveis-'+hoje()+'.csv', exportarImoveisCSV(), 'text/csv;charset=utf-8'); break;
    case 'backup': baixar('social-imob-backup-'+hoje()+'.json', backupJSON(), 'application/json'); toast('Backup baixado'); break;
    case 'restaurar': $('#fileRestore').value=''; $('#fileRestore').click(); break;
    case 'relatorio': var r = relatorio(); copiar(r); abrirModal('<div class="mh"><h2>📊 Relatório</h2><button class="btn sm ghost x" data-act="fechar">✕</button></div><textarea style="min-height:280px" readonly>'+esc(r)+'</textarea><p class="hint">Já copiado.</p>'); break;
    case 'zerar':
      var conf = prompt('Isso apaga TODOS os dados deste aparelho. Digite APAGAR para confirmar.');
      if(conf==='APAGAR') zerar().then(function(){ toast('Dados apagados'); UI.view='painel'; render(); });
      break;
  }
}

/* ---------------- Início ---------------- */
function iniciar(){
  $('#ver').textContent = 'v'+APP_VER+' · '+(/^https:/.test(location.protocol)?'online e offline':'offline');
  (function(){ var tb=$('#tabs'); if(!tb) return; function marca(){ var m=tb.scrollWidth-tb.clientWidth; var w=$('#tabsW'); w.classList.toggle('mais-d', m>2 && tb.scrollLeft<m-2); w.classList.toggle('mais-e', m>2 && tb.scrollLeft>2); } $all('#tabsW [data-ts]').forEach(function(a){ a.onclick=function(){ var dx=(+a.dataset.ts)*tb.clientWidth*0.7; tb.scrollBy?tb.scrollBy({left:dx,behavior:'smooth'}):(tb.scrollLeft+=dx); }; }); tb.addEventListener('scroll',marca,{passive:true}); window.addEventListener('resize',marca); setTimeout(marca,50); })();
  $all('#tabs button').forEach(function(b){ b.onclick = function(){ UI.view = b.dataset.v; window.scrollTo(0,0); try{ history.pushState({si:'view', v:UI.view}, ''); }catch(e){} render(); }; });
  $('#fab').onclick = acoesRapidas;
  $('#btnDev').onclick = function(){ telaDevice(false); };
  $('#btnInstalar').onclick = function(){ telaInstalar(); };
  $('#btnDesfazer').onclick = desfazerGlobal; $('#btnRefazer').onclick = refazerGlobal;
  try{ history.replaceState({si:'base', v:UI.view}, ''); }catch(e){}
  prepararInstalacao();
  $('#ov').onclick = function(e){ if(e.target.id==='ov' && S.cfg && S.cfg.device) fecharModalSeguro(); };
  $('#fileImport').onchange = function(e){
    var fs = e.target.files; if(!fs || !fs.length) return;
    toast('Importando…');
    importarArquivos(fs).then(function(msgs){ alert(msgs.join('\n') || 'Nada importado'); render(); }, function(err){ alert('Erro ao importar: '+(err && err.message || err)); });
  };
  $('#fileRestore').onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    if(!confirm('Restaurar substitui TODOS os dados atuais deste aparelho pelos do backup. Continuar?')) return;
    f.text().then(restaurar).then(function(){ toast('Backup restaurado ✔'); render(); }, function(err){ alert('Restauração cancelada, nada foi alterado: '+err.message); });
  };
  return abrirDB().then(carregar).then(function(){
    var voltou = restaurarUI(); render();
    if(voltou && restaurarUI.scroll) setTimeout(function(){ window.scrollTo(0, restaurarUI.scroll); }, 30);
    if(!S.cfg.device) telaDevice(true); else recuperarRascunho();
    if(S.conteudos.length && (!S.cfg.rev380 || !S.cfg.rev390)){ var r38 = !S.cfg.rev380; S.cfg.rev380 = true; S.cfg.rev390 = true; (r38 ? revisarTextos() : Promise.resolve()).then(function(){ return planejarTudo(); }).then(function(r){ render(); avisoPlano(r); }); }
    setTimeout(checarAtualizacao, 1500);
  }).catch(function(err){
    $('#app').innerHTML = '<div class="card"><h2>Não foi possível abrir o banco local</h2><p class="sub">'+esc(err && err.message || err)+'</p><p class="sub">Abra o arquivo no Chrome (não no visualizador de arquivos).</p></div>';
  });
}
if(typeof window !== 'undefined' && !window.__SI_TEST__) document.addEventListener('DOMContentLoaded', iniciar);
</script>
