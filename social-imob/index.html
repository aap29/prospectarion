<title>SOCIAL IMOB 360 PRO</title>
<style>
:root{
  --bg:#F7F4EC; --surface:#FFFFFF; --row:#F5F6F8; --row2:#EEF0F4; --line:#E3E6EC;
  --txt:#323338; --mut:#676879; --blue:#579BFC; --navy:#1F4E8C;
  --acc:#FF7A45; --acc2:#FFB38A; --ok:#00C875; --bad:#E2445C; --warn:#FDAB3D; --dark:#333333;
  --r:12px; --fs:14.5px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Figtree,Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,Menlo,Consolas,"Roboto Mono",monospace}
body.dev-tablet{--fs:15px}
body.dev-pc{--fs:14.5px}

/* Cabeçalho + abas */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;max-width:1280px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.hrow h1{font-size:18px}
.hrow h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.hbtn{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
img.logo{background:none;object-fit:cover}
.inst-logo{width:96px;height:96px;border-radius:22px;display:block;margin:4px auto 10px;box-shadow:0 6px 18px rgba(242,85,44,.35)}
.passo{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0}
.passo b.n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.big-cta{width:100%;padding:16px;font-size:17px}
body.standalone #btnInstalar{display:none}
/* Estúdio: câmera + teleprompter */
body.no-scroll{overflow:hidden}
.nova-versao{position:fixed;left:12px;right:12px;bottom:84px;z-index:150;background:#323338;color:#fff;border-radius:12px;padding:10px 14px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px #0004}
.pre{white-space:pre-wrap;background:#F5F6F8;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;max-height:280px;overflow:auto}
.ra-it{align-items:flex-start;flex-wrap:wrap}.ra-it .grow{flex:1 1 calc(100% - 40px);min-width:0}.ra-bt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;padding-left:34px}
.ed-hist{display:flex;gap:6px;margin-left:auto;margin-right:8px}
.toast button{color:#323338}
#studio{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:none;overflow:hidden;font-family:inherit}
#studio.on{display:block}
.st-top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#202124;position:relative;z-index:5}
.st-top-flutua{position:absolute;top:0;left:0;right:0;background:linear-gradient(#000c,#0000)}
.st-tit{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.st-ic{background:#ffffff1f;border:0;color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px;flex:none;cursor:pointer}
.st-ic:disabled{opacity:.35}
.st-escolha{padding:20px 16px;max-width:720px;margin:0 auto}
.st-escolha p{color:#bbb;margin:6px 0 14px;font-size:16px}
.st-op{display:flex;gap:14px;align-items:center;background:#1c1c1e;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer}
.st-op b{font-size:40px}.st-op h3{color:#fff;margin:0 0 4px}.st-op span{color:#aaa;font-size:14px}
.st-stage{position:absolute;inset:0;bottom:150px;overflow:hidden;background:#000}
#stVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#111}
.com-cam #stVideo{display:block}
.st-texto{position:absolute;left:0;right:0;top:0;bottom:0;display:none;--op:.55}
.com-texto .st-texto{display:block}
.modo-tele.com-texto .st-texto{background:#000}
.modo-tele.com-cam.pip-fundo .st-texto{background:rgba(0,0,0,var(--op))}
.modo-tele.com-cam.pip-canto #stVideo{inset:auto;right:12px;bottom:12px;width:30%;height:auto;aspect-ratio:9/16;max-height:45%;border-radius:12px;border:2px solid #fff6;z-index:4}
.modo-camera.com-texto .st-texto{background:rgba(0,0,0,var(--op))}
.modo-camera.com-texto.pos-topo .st-texto{bottom:auto;height:42%}
.modo-camera.com-texto.pos-meio .st-texto{top:29%;bottom:auto;height:42%}
.modo-camera.com-texto.pos-baixo .st-texto{top:auto;height:42%}
.st-scroll{position:absolute;inset:0;overflow:hidden}
.st-conteudo{margin:0 auto;padding:0 4%;color:#fff;font-weight:500;will-change:transform}
.st-conteudo p{margin:0 0 .8em}.st-vazio{color:#999;font-size:20px}
.st-foco{position:absolute;left:0;right:0;height:0;border-top:2px dashed #FF7A4580;z-index:2;pointer-events:none}
.st-foco::before{content:'▶';position:absolute;left:4px;top:-13px;color:#FF7A45;font-size:16px}
.st-rec{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#E2445C;color:#fff;font-weight:800;padding:4px 12px;border-radius:20px;display:none;z-index:6}
.st-rec.on{display:block;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.55}}
.st-conta{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:#fff;background:#0006;z-index:7}
.st-conta.on{display:flex}
.st-bar{position:absolute;left:0;right:0;bottom:0;height:150px;background:#2b2b2e;padding:8px 14px;z-index:5}
.st-prog{display:flex;align-items:center;gap:10px;font-size:13px;color:#ccc}
.st-prog input{flex:1;accent-color:#2196F3}
.st-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:4px}
.st-play{width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:none;color:#fff;font-size:24px;cursor:pointer}
.st-tog{background:#ffffff14;border:1px solid #555;color:#fff;border-radius:12px;padding:4px 10px;font-size:20px;display:flex;flex-direction:column;align-items:center;min-width:92px;cursor:pointer}
.st-tog small{font-size:11px;color:#bbb}.st-tog.on{border-color:#FF7A45;background:#FF7A4533}.st-tog.on small{color:#FFB38A}
.st-ctrl2{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13px;color:#bbb}
.st-recbtn{display:flex;align-items:center;gap:8px;background:#E2445C;border:0;color:#fff;font-weight:800;border-radius:22px;padding:8px 18px;cursor:pointer}
.st-recbtn i{width:14px;height:14px;border-radius:50%;background:#fff}.st-recbtn.on i{border-radius:2px}
.st-recbtn:disabled{background:#555;color:#999}
.st-sheet{position:absolute;left:0;right:0;bottom:0;max-height:85%;overflow:auto;background:#fff;color:#323338;border-radius:18px 18px 0 0;padding:16px;z-index:9;display:none}
.st-sheet.on{display:block}
.st-l{display:flex;justify-content:space-between;font-size:14px;color:#676879;margin:12px 0 4px}
.st-sheet input[type=range]{width:100%;accent-color:#FF7A45}
.st-sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.st-sw small{display:block;color:#888}.st-sw input{width:22px;height:22px}
.st-lista{max-height:240px;overflow:auto;border:1px solid #eee;border-radius:10px}
.st-item{display:flex;gap:10px;padding:10px;border-bottom:1px solid #f0f0f0;cursor:pointer}.st-item small{display:block;color:#888}
.st-result video{width:100%;max-height:50vh;background:#000;border-radius:12px}
.st-aviso{display:flex;gap:10px;align-items:center}
.tempo-box{margin:6px 0 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.parte-n{display:inline-flex;width:22px;height:22px;border-radius:6px;background:var(--acc);color:#fff;align-items:center;justify-content:center;font-size:13px;margin-right:6px}
.btn.gravar{background:#E2445C;border-color:#E2445C;color:#fff;font-weight:800}
.st-voltar{background:#FF7A45;color:#fff;border:0;border-radius:22px;padding:10px 16px;font-size:17px;font-weight:800;flex:none;cursor:pointer;box-shadow:0 2px 8px #0006}
.st-a{width:auto;min-width:42px;padding:0 10px;border-radius:12px;font-weight:800;font-size:16px}.st-a.on{background:#FF7A45}
.st-tit{font-size:15px}
.btn.x{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff!important;font-weight:800;padding:8px 14px}
.vd-it{flex-wrap:wrap}.vd-it .ra-bt{padding-left:0}.vd-play{width:100%}
.ed-fonte{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
@media (max-width:560px){ .hrow h1{font-size:17px;line-height:1.2} .hrow h1 small{font-size:11px} .hbtn .btn{padding:6px 9px;font-size:13px} #btnDev{font-size:0} #btnDev::first-letter{font-size:18px} .btn.hh span{display:none} .btn.hh{min-width:44px} .mh h2{font-size:18px} .ed-hist .btn{padding:5px 8px;font-size:12px} }

.redes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.rede-card{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.rede-card .ri{font-size:26px;flex:none}
.rede-grupo{margin-top:12px}.rede-head{display:flex;gap:10px;align-items:center;border-left:5px solid;padding:4px 0 4px 10px}.rede-head b{flex:1;font-size:16px}.rede-card .t{font-weight:700}.rede-card.add{border-style:dashed;background:#FFF8F3}
/* Barra principal em destaque (v3.8) */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px max(10px,calc((100% - 1280px)/2 + 10px));margin:4px 0 0;scrollbar-width:none;background:linear-gradient(180deg,#1F4E8C,#173D70);box-shadow:0 4px 14px rgba(31,78,140,.28);scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:76px;background:transparent;border:0;border-radius:12px;padding:9px 10px 8px;cursor:pointer;color:rgba(255,255,255,.82);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13.5px;font-weight:700;letter-spacing:.1px;scroll-snap-align:start;transition:background .15s,color .15s}
.tabs button b{font-size:23px;line-height:1}
.tabs button:hover{background:rgba(255,255,255,.10);color:#fff}
.tabs button.on{background:#fff;color:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tabs-w{position:relative}

.btn.hh:disabled{opacity:.45}

header.top{border-bottom:0}
@media (max-width:560px){ .tabs{padding:7px 8px} .tabs button{min-width:70px;font-size:13px;padding:8px 8px 7px} .tabs button b{font-size:22px} }
main{padding:16px 16px 100px;max-width:1280px;margin:0 auto}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 18px rgba(255,122,69,.45);cursor:pointer}

/* Blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:17px;margin-bottom:10px}
.card h3{font-size:14.5px;margin-bottom:8px}
.sub{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp{height:10px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.empty{color:var(--mut);font-size:13px;padding:8px 0}
.title-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.title-row h2{font-size:22px;flex:1}

/* Botões e campos */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600;font-size:14px;color:var(--txt)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;outline:none}

input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(87,155,252,.15)}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
details.sec{background:var(--row);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
details.sec summary{cursor:pointer;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:600}
.chip.on{border-color:var(--acc);background:#FFF1EA;color:#B8471C}
.chips{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;margin-bottom:12px;padding-bottom:2px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* Etiquetas sólidas (estilo do card de referência) */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:92px;padding:6px 10px;border-radius:4px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;text-align:center}
.pill.sm{min-width:0;padding:2px 7px;font-size:11px}
.pill.light{color:#323338}

/* Tabela agrupada */
.grp{margin-bottom:22px}

.grp-h .cnt{font-size:12px;color:var(--mut);font-weight:500}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.mt{border-collapse:separate;border-spacing:0 4px;width:100%;min-width:640px}
table.mt th{font-size:12px;color:var(--mut);font-weight:500;padding:2px 6px;text-align:center;white-space:nowrap}
table.mt th:first-child{text-align:left}

table.mt td.nm{text-align:left;padding:10px 12px;border-left:5px solid var(--blue);border-radius:4px 0 0 4px;cursor:pointer;min-width:220px;position:sticky;left:0;z-index:1;background:var(--row)}
table.mt td:last-child{border-radius:0 4px 4px 0}
table.mt td .pill{width:100%}
table.mt tr.tot td{background:transparent;font-size:12px;color:var(--mut)}
.chk{width:20px;height:20px;accent-color:var(--ok)}
/* Planilha compacta (v3.8.2): tudo cabe sem rolar para o lado */
table.mt{min-width:0;border-spacing:0 3px}
table.mt th{font-size:11px;padding:2px 3px}
table.mt td{padding:3px;font-size:13px}

.pill.ph{gap:4px}.pill.ph i{font-style:normal;font-size:12px}

@media (max-width:560px){ table.mt .c-fmt,table.mt th .lg{display:none} table.mt th .sh{display:inline} table.mt td.nm small.fm{display:block;font-size:11px;color:var(--mut);margin-top:2px} table.mt td,table.mt th{padding-left:2px;padding-right:2px} }

/* Painel tipo mLabs */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.tile{border-radius:12px;color:#fff;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);min-height:150px;display:flex;flex-direction:column}
.tile .th{padding:9px 12px;background:rgba(0,0,0,.14);font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.tile .tb{padding:12px;display:flex;justify-content:space-between;align-items:flex-end;flex:1}

.badge-up{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--ok);align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-left:4px}

/* Listas */
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}

/* Kanban */

.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin:6px 0 10px}

.mini{border-radius:4px;margin-top:3px;overflow:hidden;background:var(--row);font-size:10px;line-height:1.25}

.more{font-size:10px;color:var(--mut);margin-top:2px}

/* Semestre (SlideTeam) */
.sem .mh2{background:var(--acc);color:#fff;font-weight:800;padding:8px 12px;border-radius:8px 8px 0 0}
.sem .mb{background:#FFF5EE;border:1px solid #FFD9C6;border-top:0;border-radius:0 0 8px 8px;padding:10px 12px;margin-bottom:12px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(30,30,40,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}

.modal .mh .x{margin-left:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dark);color:#fff;font-weight:600;padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.panel-n{display:inline-flex;width:24px;height:24px;border-radius:6px;background:var(--acc);color:#fff;font-weight:800;font-size:13px;align-items:center;justify-content:center;margin-right:6px}
.bar{height:10px;background:var(--row2);border-radius:99px;overflow:hidden}

.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td,.spec th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.spec th{font-size:12px;color:var(--mut)}
.counter{font-size:12px;font-weight:700;text-align:right;margin-top:3px}

.imv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.devs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dev{border:2px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;background:var(--surface)}

/* ---------------- Banco local (IndexedDB) ---------------- */
function abrirDB(){
  return new Promise(function(res, rej){
    var r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = function(){
      var d = r.result;
      if(!d.objectStoreNames.contains('conteudos')) d.createObjectStore('conteudos', {keyPath:'id'});
      if(!d.objectStoreNames.contains('imoveis')) d.createObjectStore('imoveis', {keyPath:'id'});
      if(!d.objectStoreNames.contains('config')) d.createObjectStore('config', {keyPath:'k'});
    };
    r.onsuccess = function(){ db = r.result; res(); };
    r.onerror = function(){ rej(r.error); };
  });
}
function lerTudo(store){
  return new Promise(function(res, rej){
    var q = db.transaction(store, 'readonly').objectStore(store).getAll();
    q.onsuccess = function(){ res(q.result || []); };
    q.onerror = function(){ rej(q.error); };
  });
}
// todas as requisições disparadas de forma síncrona na mesma transação
function gravar(store, itens){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readwrite'); var st = tx.objectStore(store);
    itens.forEach(function(i){ st.put(i); });
    tx.oncomplete = function(){ res(); };
    tx.onerror = function(){ rej(tx.error); };
    tx.onabort = function(){ rej(tx.error); };
  });
}
function apagar(store, id){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(id);
    tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); };
  });
}
function salvarCfg(){ return gravar('config', [{k:'main', v:S.cfg}]); }
function salvarCampanhas(){ return gravar('config', [{k:'campanhas', v:S.campanhas}]); }
function carregar(){
  return Promise.all([lerTudo('conteudos'), lerTudo('imoveis'), lerTudo('config')]).then(function(r){
    S.conteudos = r[0]; S.imoveis = r[1];
    var c = r[2].filter(function(x){ return x.k==='main'; })[0];
    var cp = r[2].filter(function(x){ return x.k==='campanhas'; })[0];
    S.cfg = c ? c.v : JSON.parse(JSON.stringify(PADRAO));
    S.campanhas = cp ? (cp.v||[]) : [];
    Object.keys(PADRAO).forEach(function(k){ if(S.cfg[k]==null) S.cfg[k] = JSON.parse(JSON.stringify(PADRAO[k])); });
    S.cfg.perfis.forEach(function(p){ var d = PADRAO.perfis.filter(function(x){ return x.k===p.k; })[0]; if(d && !p.ic) p.ic = d.ic; if(!p.rede) p.rede = 'Instagram'; });
    aplicarDevice();
    (S.cfg.redesExtra||[]).forEach(registrarRede);
    var add = 0;
    PERFIS_EXTRA.forEach(function(d){
      var ja = S.cfg.perfis.some(function(p){ return p.k===d.k || norm(p.arroba)===norm(d.arroba); });
      if(!ja && (S.cfg.perfisRemovidos||[]).indexOf(d.k)<0){ garantirRede(d.rede); S.cfg.perfis.push(JSON.parse(JSON.stringify(d))); S.cfg.hashtags[d.k] = S.cfg.hashtags[d.k]||''; add++; }

    if(!S.cfg.reform370 && S.conteudos.length){ S.cfg.reform370 = true; return aplicarReformulados().then(function(){ return completarTextos(); }).then(function(){ S.cfg.textosCompletos360 = true; return salvarCfg(); }); }

    if(!c || add) return salvarCfg();
  });
}

}

mato":"Post","marca":"","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-02","roteiroouideia":"Dois imóveis do dia.","cta":"QUERO VISITAR","objetivo":"Venda","idunico":"99","observacoes":""},{"conteudo":"10/09 | CONSÓRCIO | Vídeos 1 e 2","status":"Produção","formato":"Reel","marca":"","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-12-22","roteiroouideia":"V1 Fechamento 30 dias. V2 Posicionamento.","cta":"PLANO / CONSULTORIA","objetivo":"Autoridade","idunico":"100","observacoes":""},{"conteudo":"08/09 | CORRETOR | Vídeos 1 e 2","status":"Produção","formato":"Reel","marca":"","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-08","roteiroouideia":"V1 Diagnóstico do comprador. V2 Pare de começar pela casa.","cta":"ANÁLISE / CASA","objetivo":"Lead","idunico":"101","observacoes":""},{"conteudo":"03/09 | CORRETOR | Vídeos 1 e 2","status":"Produção","formato":"Reel","marca":"","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-03","roteiroouideia":"V1 O que observar na visita. V2 Gostar x fazer sentido.","cta":"VISITA / CHECKLIST","objetivo":"Educação","idunico":"102","observacoes":""},{"conteudo":"02/09 | CONSÓRCIO | Vídeos 1 e 2","status":"Produção","formato":"Reel","marca":"","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-11-26","roteiroouideia":"V1 Planejar expansão. V2 Bem produtivo.","cta":"EMPRESA / EXPANSÃO","objetivo":"Lead","idunico":"103","observacoes":""},{"conteudo":"03/09 | EXECUÇÃO | Imóveis manhã e tarde","status":"Produção","formato":"Post","marca":"","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-03","roteiroouideia":"Dois imóveis do dia.","cta":"QUERO VISITAR","objetivo":"Venda","idunico":"104","observacoes":""},{"conteudo":"14/08 | CORRETOR 360° | Aula 01 - Documentos antes do financiamento","status":"Roteiro","formato":"Reel","marca":"","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-08-14","roteiroouideia":"Reel 45s: quais documentos separar antes de tentar financiar o primeiro imóvel (doc c/ foto, CPF, comprovante renda, residência, estado civil + FGTS se aplicável). Documentação completa não garante aprovação — banco ainda analisa renda, capacidade, modalidade e depois o imóvel.","cta":"CASA","objetivo":"Educação","idunico":"105","observacoes":""},{"conteudo":"🎬 Reel #1 — Financiamento ou consórcio: compare o custo total, não só a parcela","status":"Ideia","formato":"Reel","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-14","roteiroouideia":"Uma parcela menor nem sempre significa a melhor escolha. No financiamento existem juros e outros custos; no consórcio não há juros, mas existem taxa de administração, possíveis fundos e reajustes previstos em contrato. A decisão depende do prazo, da urgência e da sua capacidade financeira. Eu sou Anderson Alves, consultor de investimentos e consórcios. Quer comparar os caminhos com números reais? Me chama para uma simulação.","cta":"Me chama para comparar financiamento e consórcio com uma simulação","objetivo":"Educação","idunico":"106","observacoes":"Conteúdo exclusivo do @andersonalves.invest. Não usar estatística 9 em cada 10 nem afirmar valores genéricos sem simulação. Comparar custo total e prazo."},{"conteudo":"🎬 Reel #2 — Consórcio não tem juros, mas tem custos: entenda antes de contratar","status":"Ideia","formato":"Reel","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-15","roteiroouideia":"Consórcio não cobra juros como um financiamento, mas isso não significa custo zero. A parcela pode incluir fundo comum, taxa de administração, fundo de reserva e seguro, conforme o contrato. O crédito e as parcelas também podem ser reajustados pelo índice previsto no grupo. Eu sou Anderson Alves, consultor de investimentos e consórcios. Antes de contratar, peça a composição completa da parcela.","cta":"Me chama e peça uma simulação com todos os custos identificados","objetivo":"Educação","idunico":"107","observacoes":"Conteúdo exclusivo do @andersonalves.invest. Linguagem técnica e transparente. Não prometer imóvel sem juros como se não houvesse taxa ou reajuste."},{"conteudo":"🎬 Reel #3 — Carta contemplada: o que precisa acontecer antes de usar o crédito","status":"Ideia","formato":"Reel","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-16","roteiroouideia":"A contemplação libera o direito de utilizar o crédito, mas a compra ainda depende das regras do contrato, análise da administradora, documentação e aprovação do bem ou serviço. Se houver transferência de cota, também é necessário verificar condições, saldo devedor e autorização da administradora. Eu sou Anderson Alves, consultor de investimentos e consórcios. Quer analisar uma opção com segurança? Fale comigo.","cta":"Fale comigo para analisar regras, saldo e documentação da carta","objetivo":"Lead","idunico":"108","observacoes":"Conteúdo exclusivo do @andersonalves.invest. Retiradas promessas de uso imediato e disponibilidade de cartas não comprovada."},{"conteudo":"📌 Post Fixo — Financiamento e consórcio atendem necessidades diferentes","status":"Ideia","formato":"Post","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-17","roteiroouideia":"TEXTO DA ARTE: Financiamento ou consórcio? A resposta depende do seu prazo. LEGENDA: O financiamento pode atender quem precisa adquirir o bem agora e aceita o custo do crédito. O consórcio pode atender quem possui planejamento e aceita que a contemplação não tem data garantida. Compare entrada, custo total, prazo, reajustes, taxas e urgência antes de decidir.","cta":"Salve e me chame para fazer uma comparação personalizada","objetivo":"Educação","idunico":"109","observacoes":"Post exclusivo do @andersonalves.invest. Comparação equilibrada, sem demonizar bancos, sem promessa de economia universal e sem números genéricos."},{"conteudo":"🎠 Carrossel — 6 perguntas essenciais antes de entrar em um consórcio","status":"Ideia","formato":"Carrossel","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-18","roteiroouideia":"SLIDE 1: 6 perguntas antes de entrar em um consórcio. | SLIDE 2: Qual é a taxa de administração total e como ela será cobrada? | SLIDE 3: Existem fundo de reserva, seguro ou outras cobranças? | SLIDE 4: Qual índice reajusta o crédito e as parcelas? | SLIDE 5: Quais são as regras de sorteio, lance próprio e lance embutido? | SLIDE 6: O que acontece se eu atrasar, desistir ou precisar transferir a cota? | SLIDE 7: A administradora está autorizada pelo Banco Central? | SLIDE FINAL: Leia o contrato e compare cenários antes de decidir.","cta":"Salve este carrossel e me chame para analisar uma proposta","objetivo":"Educação","idunico":"110","observacoes":"Carrossel exclusivo do @andersonalves.invest. Conteúdo baseado em transparência contratual. Retiradas afirmações sobre poupança e carta contemplada que poderiam induzir ao erro."},{"conteudo":"📸 Post — Bastidor: como preparo uma análise de consórcio","status":"Ideia","formato":"Post","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"Instagram","datapublicacao":"2026-09-19","roteiroouideia":"TEXTO DA ARTE: Antes da proposta, vem a estratégia. LEGENDA: Neste perfil, meu trabalho é entender objetivo, prazo, capacidade mensal e recursos disponíveis para lance. Depois comparo crédito, prazo, custos, reajustes e regras do grupo. Consórcio não deve ser vendido como promessa; deve ser analisado como uma decisão de longo prazo. Anderson Alves, consultor de investimentos e consórcios.","cta":"Qual é o seu objetivo: imóvel, veículo ou patrimônio? Me chama","objetivo":"Autoridade","idunico":"111","observacoes":"Post exclusivo do @andersonalves.invest. Humaniza o atendimento e separa claramente esta atuação da corretagem imobiliária."},{"conteudo":"🎬 Reel #1 — Por que empresas locais somem do Google? O erro invisível","status":"Ideia","formato":"Reel","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-14","roteiroouideia":"GANCHO: 'Seu concorrente aparece no Google Maps e você não. Eu vou te mostrar por quê.' DESENVOLVIMENTO: Perfil do Google Meu Negócio desatualizado ou sem fotos = invisibilidade. Dado: 76% das buscas locais resultam em visita ao estabelecimento. CTA: 'Comenta GOOGLE que te mando um diagnóstico grátis do seu perfil.'","cta":"Comenta GOOGLE para diagnóstico grátis","objetivo":"Autoridade","idunico":"112","observacoes":"Reel #1 @marcaeestrategia — abrir com problema/dor das empresas locais. Série da semana."},{"conteudo":"🎥 YouTube — Guia do consórcio: custos, contemplação e uso da carta de crédito","status":"Roteiro","formato":"Vídeo YouTube","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"YouTube","datapublicacao":"2026-09-16","roteiroouideia":"ABERTURA: o que o público aprenderá e para quem o consórcio pode fazer sentido. | BLOCO 1: consórcio como sistema de autofinanciamento em grupo e papel da administradora autorizada. | BLOCO 2: composição da parcela: fundo comum, taxa de administração e cobranças previstas no contrato. | BLOCO 3: contemplação por sorteio ou lance, sem garantia de data. | BLOCO 4: tipos de lance e impacto no saldo devedor conforme regras do grupo. | BLOCO 5: etapas posteriores à contemplação: análise, documentos e aquisição do bem ou serviço. | BLOCO 6: riscos, reajustes e perguntas obrigatórias antes de aderir. | ENCERRAMENTO: convite para simulação personalizada. Duração prevista: 12 a 18 minutos.","cta":"Inscreva-se e deixe sua dúvida sobre consórcio","objetivo":"Autoridade","idunico":"113","observacoes":"Canal Anderson Alves Investimentos / @andersonalves.invest. Basear dados no contrato do grupo, na Lei 11.795/2008 e em orientações do Banco Central. Não publicar como conteúdo imobiliário."},{"conteudo":"🎥 YouTube — Como comparar administradoras e planos de consórcio com segurança","status":"Ideia","formato":"Vídeo YouTube","marca":"Consórcios e Investimentos","perfil":"Investimentos & Consórcios","canal":"YouTube","datapublicacao":"2026-09-18","roteiroouideia":"ABERTURA: não existe melhor administradora para todos; existe proposta adequada ao objetivo e ao orçamento. | BLOCO 1: confirmar autorização e supervisão no Banco Central. | BLOCO 2: comparar taxa de administração total, prazo, fundo de reserva, seguro e critérios de reajuste. | BLOCO 3: entender regras de contemplação e histórico sem transformar histórico em promessa futura. | BLOCO 4: avaliar atendimento, canais, contrato, assembleias e transparência. | BLOCO 5: comparar propostas equivalentes, com mesmo crédito e prazo. | BLOCO 6: demonstração usando somente dados oficiais e vigentes de propostas reais. | ENCERRAMENTO: checklist e convite para análise. Duração prevista: 12 a 18 minutos.","cta":"Comente sua dúvida e peça o checklist de comparação","objetivo":"Autoridade","idunico":"114","observacoes":"Canal Anderson Alves Investimentos / @andersonalves.invest. Não publicar ranking ou taxas sem documentos atuais das administradoras. HS pode ser apresentada com base na proposta vigente, sem superioridade automática."},{"conteudo":"🎬 Reel #2 — O que acontece com a empresa que ignora o marketing digital","status":"Ideia","formato":"Reel","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-15","roteiroouideia":"GANCHO: 'Você sabia que 60% das pequenas empresas fecham em 5 anos? Uma das principais causas: invisibilidade digital.' DESENVOLVIMENTO: Mostrar o ciclo — sem presença digital → menos clientes → receita cai → fecha. Dado: empresa com GMN ativo recebe 7x mais cliques. CTA: 'Salva e manda para um dono de negócio que precisa ver isso.'","cta":"Salva esse vídeo e manda para um dono de negócio que precisa ver isso","objetivo":"Educação","idunico":"115","observacoes":"Reel #2 @marcaeestrategia — solução/desenvolvimento. Continua o gancho do Reel #1 (erro invisível no Google)."},{"conteudo":"🎬 Reel #3 — Em 24h configurei o Google Meu Negócio de uma empresa e isso aconteceu","status":"Ideia","formato":"Reel","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-16","roteiroouideia":"GANCHO: 'Em menos de 24 horas, configurei o Google Meu Negócio de um cliente e o telefone dele começou a tocar.' DESENVOLVIMENTO: Mostrar o processo: perfil antes (zerado/incompleto) → configuração → primeiros resultados (ligações, visitas, avaliações). PROVA: resultado real ou simulação visual do antes/depois. CTA: 'Me chama no WhatsApp — faço o diagnóstico do seu negócio grátis hoje.'","cta":"Me chama no WhatsApp: (51) 98416-8848 — diagnóstico grátis","objetivo":"Lead","idunico":"116","observacoes":"Reel #3 @marcaeestrategia — autoridade + conversão. Fecha a série com prova social e CTA direto."},{"conteudo":"📌 Post Fixo — 3 sinais de que sua empresa precisa de um marketing urgente","status":"Ideia","formato":"Post","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-17","roteiroouideia":"Post estático com lista visual. Design: fundo #0A1628, título Playfair Display branco, lista em Inter com ícones dourados. SINAL 1: Seu concorrente aparece no Google e você não. SINAL 2: Seu Instagram tem menos de 3 posts nos últimos 30 dias. SINAL 3: Você depende só de indicação para fechar clientes. Rodapé: 'Se você marcou 2 ou mais — a gente precisa conversar.' + (51) 98416-8848.","cta":"Comenta quantos desses você tem — serei honesto na resposta","objetivo":"Engajamento","idunico":"117","observacoes":"Post fixo de quinta @marcaeestrategia. Padrão 1 adaptado — lista de impacto com gancho de identificação."},{"conteudo":"🎠 Carrossel — Passo a passo para configurar seu Google Meu Negócio do zero","status":"Ideia","formato":"Carrossel","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-18","roteiroouideia":"SLIDE 1 (capa): 'Passo a passo para colocar seu negócio no Google Maps — do zero' | SLIDE 2: Acesse business.google.com e crie sua conta. | SLIDE 3: Preencha nome exato, categoria e endereço. | SLIDE 4: Adicione horários de funcionamento e telefone. | SLIDE 5: Suba pelo menos 10 fotos reais do negócio. | SLIDE 6: Peça avaliações para os primeiros clientes — isso impacta o ranqueamento. | SLIDE 7: Publique posts semanais no perfil. | SLIDE FINAL: 'Quer que eu faça isso por você? Me chama no WhatsApp.'","cta":"Salva esse carrossel — é o tutorial mais completo que você vai encontrar","objetivo":"Educação","idunico":"118","observacoes":"Carrossel de sexta @marcaeestrategia. Alto potencial de salvamento e compartilhamento — tutorial prático. Elemento cortado na borda direita em todos os slides intermediários."},{"conteudo":"📸 Post — Bastidor: como é montar uma estratégia digital para um negócio local","status":"Ideia","formato":"Post","marca":"Marca e Estrategia","perfil":"Marca Pessoal","canal":"Instagram","datapublicacao":"2026-09-19","roteiroouideia":"Post de bastidor de Anderson trabalhando — notebook, anotações, visita a cliente. Padrão 7 adaptado para @marcaeestrategia: foto de Anderson em ação + overlay leve + frase: 'Cada negócio local que ajudo a crescer no digital é uma família que consegue pagar as contas no final do mês.' + logo Marca & Estratégia + (51) 98416-8848.","cta":"Comenta: qual é o maior desafio do seu negócio no digital?","objetivo":"Engajamento","idunico":"119","observacoes":"Post de sábado @marcaeestrategia. Humaniza a marca e conecta emocionalmente com pequenos empreendedores."},{"conteudo":"🎬 Reel #1 — Antes de procurar imóvel, descubra quanto você pode comprar","status":"Ideia","formato":"Reel","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-14","roteiroouideia":"Antes de procurar uma casa ou apartamento, descubra quanto realmente cabe no seu orçamento. O primeiro passo é analisar renda, valor disponível para entrada, possibilidade de usar o FGTS e composição de renda. Isso define uma faixa de compra realista e evita visitas a imóveis incompatíveis. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Quer começar essa análise? Me chama no Direct. Até a próxima vez!","cta":"Me chama no Direct para analisar sua faixa de compra","objetivo":"Educação","idunico":"120","observacoes":"Conteúdo exclusivo do @corretorandersonalves.invest. Tema imobiliário: preparação financeira do comprador antes das visitas. Não mencionar consórcio ou HS."},{"conteudo":"🎬 Reel #2 — A parcela sozinha não revela qual imóvel você pode comprar","status":"Ideia","formato":"Reel","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-15","roteiroouideia":"Muita gente escolhe o imóvel olhando apenas o valor da parcela. Mas o banco também analisa renda comprovada, comprometimento mensal, entrada, prazo, idade e histórico de crédito. Por isso, duas pessoas com a mesma renda podem receber condições diferentes. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Antes de visitar, faça uma análise da sua capacidade de compra. Me chama no Direct. Até a próxima vez!","cta":"Me chama no Direct para avaliar sua capacidade de compra","objetivo":"Educação","idunico":"121","observacoes":"Conteúdo exclusivo do @corretorandersonalves.invest. Tema imobiliário: capacidade de compra e análise de financiamento. Sem consórcio."},{"conteudo":"🎬 Reel #3 — Três informações que o corretor precisa antes de indicar um imóvel","status":"Ideia","formato":"Reel","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-16","roteiroouideia":"Antes de indicar um imóvel, eu preciso entender três pontos: onde você quer morar, quanto pode investir e em quanto tempo pretende comprar. Sem essas respostas, a busca vira uma sequência de visitas sem direção. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Quer encontrar imóveis compatíveis com sua realidade? Me chama no Direct. Até a próxima vez!","cta":"Me chama no Direct e conte região, orçamento e prazo","objetivo":"Lead","idunico":"122","observacoes":"Conteúdo exclusivo do @corretorandersonalves.invest. Tema imobiliário: qualificação do comprador e busca direcionada. Retiradas referências a banco, patrimônio, HS e consórcio."},{"conteudo":"📌 Post Fixo — O imóvel certo começa com uma busca bem orientada","status":"Ideia","formato":"Post","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-17","roteiroouideia":"TEXTO DA ARTE: O imóvel certo começa com uma busca bem orientada. LEGENDA: Antes de abrir dezenas de anúncios, defina localização, faixa de compra, entrada disponível, forma de pagamento e necessidades da família. Quando esses critérios estão claros, a procura fica mais rápida, segura e realista. Anderson Alves: imóveis com visão, negócios com estratégia.","cta":"Salve este post e me chame para organizar sua busca","objetivo":"Autoridade","idunico":"123","observacoes":"Post exclusivo do @corretorandersonalves.invest. Posicionamento como corretor consultivo. Não usar assinatura de estrategista patrimonial ou HS Consórcios."},{"conteudo":"🎠 Carrossel — 5 passos antes de visitar o primeiro imóvel","status":"Ideia","formato":"Carrossel","marca":"Corretor Anderson Alves","perfil":"Imóveis","canal":"Instagram","datapublicacao":"2026-09-18","roteiroouideia":"SLIDE 1: 5 passos antes de visitar o primeiro imóvel. | SLIDE 2: Defina a região e o deslocamento aceitável. | SLIDE 3: Calcule entrada, despesas da compra e faixa de parcela. | SLIDE 4: Verifique renda, FGTS e possibilidade de composição de renda. r as parcelas. | BLOCO 4: contemplação, lance próprio, lance embutido e ausência de garantia de antecipação. | BLOCO 5: reajustes do crédito e da parcela previstos em contrato. | BLOCO 6: cenários em que financiamento, compra à vista ou investimento financeiro podem ser mais adequados. | EXEMPLO: simulação ilustrativa identificada como hipótese, sem prometer desconto ou contemplação. | ENCERRAMENTO: análise individual. Duração prevista: 12 a 18 minutos.","cta":"Comente seu objetivo e solicite uma análise personalizada","objetivo":"Autoridade","idunico":"126","observacoes":"Canal Anderson Alves Investimentos / @andersonalves.invest. Removidas promessas de multiplicação, melhor instrumento e descontos garantidos."},{"conteudo":"REEL 01 | Música ao vivo transforma o ambiente","status":"Roteiro","formato":"Reel","marca":"Kenny Sax29","perfil":"","canal":"Instagram, WhatsApp","datapublicacao":"2026-09-12","roteiroouideia":"Até 40 segundos | Mostrar performance, público e ambiente.","cta":"Casas, cafés, pubs e produtores: envie EVENTO no WhatsApp para consultar formatos e datas.","objetivo":"Lead","idunico":"127","observacoes":""},{"conteudo":"YOUTUBE 01 | Como o sax cria experiência em casas e eventos","status":"Roteiro","formato":"Vídeo YouTube","marca":"Kenny Sax29","perfil":"","canal":"YouTube","datapublicacao":"2026-09-12","roteiroouideia":"Vídeo de 6 a 8 minutos complementar ao Reel 01.","cta":"Gestores e produtores: envie EVENTO no WhatsApp para receber uma proposta de formato musical.","objetivo":"Autoridade","idunico":"128","observacoes":""},{"conteudo":"REEL 02 | O repertório certo para cada ambiente","status":"Roteiro","formato":"Reel","marca":"Kenny Sax29","perfil":"","canal":"Instagram, WhatsApp","datapublicacao":"2026-09-13","roteiroouideia":"Até 40 segundos | Demonstrar três climas musicais.","cta":"Envie REPERTÓRIO no WhatsApp e diga o tipo do seu evento.","objetivo":"Educação","idunico":"129","observacoes":""},{"conteudo":"YOUTUBE 02 | Como escolher reper   sh.classList.add('on'); ligarEstudio();
