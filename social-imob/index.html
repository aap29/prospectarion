  $all('[data-imp]', sh).forEach(function(el){ el.onclick = function(){ var x = S.conteudos.filter(function(y){ return y.id===el.dataset.imp; })[0]; if(!x) return; EST.conteudo = x; EST.titulo = x.titulo; EST.txt = textoGravacao(x); fecharSheet(); var t = $('.st-tit'); if(t) t.textContent = EST.titulo; preencherTexto(); toast('Texto importado ✔'); }; });
}
function fecharSheet(){ var sh = $('#stSheet'); if(sh){ sh.classList.remove('on'); sh.innerHTML = ''; } }
function fecharEstudio(){
  if(EST.gravando && !confirm('Está gravando. Parar e sair? O vídeo será perdido se não salvar.')) return;
  if(EST.gravando){ EST.gravando=false; try{ EST.rec.onstop=null; EST.rec.stop(); }catch(e){} clearInterval(EST.timer); }
  pausar(); pararCamera();
  try{ if(EST.wake) EST.wake.release(); }catch(e){} EST.wake = null;
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){}); }catch(e){}
  var st = $('#studio'); st.classList.remove('on'); st.innerHTML = ''; document.body.classList.remove('no-scroll');
  if(EST.conteudo && $('#ov').classList.contains('on')){ editarConteudo(EST.conteudo.id); }
}
function acaoEstudio(a){
  var e = cfgEst();
  switch(a){
    case 'fechar': fecharEstudio(); break;
    case 'voltar': if(EST.gravando){ if(!confirm('Parar a gravação?')) break; pararGravacao(); break; } telaEscolha(); break;
    case 'modoCamera': EST.textoNaCamera = null; escolherModo('camera'); break;
    case 'modoTele': escolherModo('tele'); break;
    case 'camExterna': $('#stArquivo').click(); break;
    case 'play': if(EST.rolando) pausar(); else rolar(); break;
    case 'mais': e.vel = Math.min(100, e.vel+2); aplicarEstiloTexto(); atualizarTempo(); salvarCfg(); break;
    case 'menos': e.vel = Math.max(1, e.vel-2); aplicarEstiloTexto(); atualizarTempo(); salvarCfg(); break;
    case 'togTexto': EST.texto = !EST.texto; EST.textoNaCamera = EST.texto; if(!EST.texto) pausar(); montarPalco(); if(EST.cam && EST.stream){ $('#stVideo').srcObject = EST.stream; } if(EST.cam && !EST.stream) ligarCamera(); break;
    case 'togCam': if(EST.gravando){ toast('Pare a gravação antes'); break; } EST.cam = !EST.cam; if(!EST.cam){ pararCamera(); if(!EST.texto) EST.texto = true; } montarPalco(); if(EST.cam) ligarCamera(); break;
    case 'virar': if(EST.gravando){ toast('Pare a gravação antes de trocar a câmera'); break; } e.camera = e.camera==='user' ? 'environment' : 'user'; salvarCfg(); ligarCamera(); break;
    case 'gravar': if(EST.gravando) pararGravacao(); else iniciarGravacao(); break;
    case 'ajustes': folhaAjustes(); break;
    case 'importar': folhaImportar(); break;
    case 'fecharSheet': fecharSheet(); break;
    case 'usarAtual': EST.txt = textoGravacao(EST.conteudo); fecharSheet(); preencherTexto(); break;
    case 'usarColado': EST.txt = $('#stCola').value; EST.conteudo = EST.conteudo; fecharSheet(); preencherTexto(); break;
    case 'salvarVideo': var v = EST.ultimoVideo; if(!v) break; var aa = document.createElement('a'); aa.href = v.url; aa.download = v.nome; document.body.appendChild(aa); aa.click(); aa.remove(); toast('Salvo em Downloads ✔'); break;
    case 'compartilharVideo': var vv = EST.ultimoVideo; if(!vv) break; navigator.share({files:[new File([vv.blob], vv.nome, {type:vv.blob.type||'video/mp4'})], title:EST.titulo}).catch(function(){}); break;
    case 'pastaVideos': fecharEstudio(); telaVideos(EST.conteudo?EST.conteudo.id:null); break;
    case 'fonteMais': e.fonte = Math.min(96, e.fonte+4); aplicarEstiloTexto(); posicionar(); salvarCfg(); break;
    case 'fonteMenos': e.fonte = Math.max(18, e.fonte-4); aplicarEstiloTexto(); posicionar(); salvarCfg(); break;
    case 'frases': e.frases = !e.frases; salvarCfg(); preencherTexto(); var bf=$('[data-st="frases"]'); if(bf) bf.classList.toggle('on', !!e.frases); break;
    case 'regravar': fecharSheet(); EST.pos = 0; posicionar(); if(!EST.modo) telaEscolha(); break;
  }
}
function ligarEstudio(){
  var st = $('#studio');
  $all('[data-st]', st).forEach(function(el){ el.onclick = function(ev){ ev.stopPropagation(); acaoEstudio(el.dataset.st); }; });
  var p = $('#stProg'); if(p){ p.oninput = function(){ EST.pos = (+p.value/1000)*maxPos(); posicionar(); }; }
  var tx = $('#stTexto'); if(tx){ tx.onclick = function(){ if(cfgEst().toque && !$('#stSheet').classList.contains('on')){ if(EST.rolando) pausar(); else rolar(); } }; }
}
document.addEventListener('keydown', function(ev){
  var st = document.getElementById('studio'); if(!st || !st.classList.contains('on') || !EST.modo) return;
  if(/input|textarea|select/i.test((ev.target||{}).tagName||'')) return;
  var e = cfgEst(), k = ev.key;
  if(k===' ' || k==='Enter' || k==='MediaPlayPause'){ ev.preventDefault(); if(EST.rolando) pausar(); else rolar(); }
  else if(k==='ArrowUp' || k==='PageUp'){ ev.preventDefault(); e.vel = Math.min(100, e.vel+2); aplicarEstiloTexto(); atualizarTempo(); }
  else if(k==='ArrowDown' || k==='PageDown'){ ev.preventDefault(); e.vel = Math.max(1, e.vel-2); aplicarEstiloTexto(); atualizarTempo(); }
  else if(k==='ArrowLeft'){ EST.pos = Math.max(0, EST.pos-120); posicionar(); }
  else if(k==='ArrowRight'){ EST.pos = Math.min(maxPos(), EST.pos+120); posicionar(); }
  else if(k==='r' || k==='R'){ if(EST.cam) acaoEstudio('gravar'); }
  else if(k==='Escape'){ fecharSheet(); }
});

var REFORM = {"R":{"21":{"g":"Nome negativado não significa fim do sonho da casa própria.","r":"VÍDEO 1\nTá com o nome negativado e acha que nunca vai conseguir comprar um imóvel? Calma. Hoje, com restrição no CPF, o banco não aprova o financiamento. Mas isso não é o fim: é o ponto de partida. Primeiro, descubra exatamente quais dívidas estão no seu nome. Depois, negocie e organize. Enquanto isso, a gente já pode montar o seu plano de compra para quando o nome estiver limpo. Comente NOME que eu te explico o primeiro passo.\n\nVÍDEO 2\nAtenção: limpar o nome não garante a aprovação do financiamento. O banco também olha renda comprovada, quanto da renda já está comprometida, histórico de pagamentos e idade. Muita gente quita a dívida, corre para o banco e recebe um não. O certo é regularizar, organizar a renda e só então fazer a análise de crédito. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ANÁLISE e eu te ajudo a fazer isso na ordem certa."},"27":{"g":"Antes de visitar qualquer imóvel, monte a sua pasta do comprador.","r":"VÍDEO 1\nQuer comprar o primeiro imóvel? Antes da primeira visita, monte a pasta do comprador: documento com foto, CPF, comprovante de estado civil, comprovante de residência, comprovantes de renda dos últimos meses e, se tiver, extrato do FGTS e declaração de imposto de renda. Com essa pasta pronta, a análise anda muito mais rápido e você não perde o imóvel certo por falta de papel. Comente DOCUMENTOS que eu te mando a lista completa.\n\nVÍDEO 2\nMas cuidado: ter todos os documentos não significa ter crédito aprovado. Documento é o que permite a análise começar. A aprovação depende de renda, comprometimento mensal, histórico de crédito e da avaliação do imóvel. Por isso eu sempre recomendo: documentos organizados e simulação feita antes de se apaixonar pelo imóvel. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CRÉDITO para começar a sua análise."},"28":{"g":"Autônomo também pode financiar imóvel. Mas tem um detalhe.","r":"VÍDEO 1\nVocê é autônomo, MEI ou trabalha por conta e acha que banco não financia imóvel para você? Financia sim. O que muda é a forma de comprovar a renda: extratos bancários, declaração de imposto de renda, pró-labore ou faturamento do MEI. Quanto mais organizada estiver essa movimentação, melhor a análise. Comente AUTÔNOMO que eu te digo quais comprovantes funcionam no seu caso.\n\nVÍDEO 2\nO erro mais comum do autônomo é procurar imóvel antes de organizar a renda. Dinheiro que entra em várias contas, sem declaração, não aparece para o banco. Então o primeiro passo é concentrar a movimentação, declarar o que você ganha e manter isso por alguns meses. Aí sim a simulação mostra o seu potencial real. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ORGANIZAR e eu te mostro o caminho."},"29":{"g":"Seu FGTS pode virar parte da entrada do seu imóvel.","r":"VÍDEO 1\nSabia que o FGTS pode ser usado na compra do imóvel? Ele pode entrar como parte da entrada, para amortizar ou até quitar o saldo, desde que você e o imóvel cumpram as regras: tempo de trabalho com carteira, não ter outro imóvel na mesma cidade e imóvel residencial dentro do sistema de habitação. Antes de contar com esse dinheiro, confira o saldo e as condições. Comente FGTS que eu te ajudo a verificar.\n\nVÍDEO 2\nMas o FGTS não resolve tudo. Ele ajuda na entrada, mas você ainda vai ter custos de documentação, ITBI, registro e mudança. E a parcela precisa caber na sua renda todo mês. Quem usa o FGTS e esquece o resto acaba apertado depois da compra. Planejamento completo é o que garante a tranquilidade. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PLANEJAR para montarmos o seu."},"30":{"g":"Pare de procurar imóvel antes de fazer isso.","r":"VÍDEO 1\nAntes de abrir o primeiro anúncio, responda três perguntas: quanto você pode pagar por mês sem apertar, quanto tem para entrada e custos, e em qual região faz sentido morar. Essas respostas definem a sua faixa de compra real. Sem elas, você perde tempo visitando imóveis que não cabem no seu bolso. Comente CASA e eu faço essa análise com você.\n\nVÍDEO 2\nO erro mais caro do primeiro comprador é se apaixonar pelo imóvel antes de saber se consegue comprá-lo. Depois da visita, vem a frustração com o crédito ou uma parcela que sufoca o orçamento. Inverta a ordem: primeiro a análise, depois a busca. Você economiza tempo e compra com segurança. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ANÁLISE para começar pelo lugar certo."},"31":{"g":"Subsídio não é financiamento. Entenda a diferença.","r":"VÍDEO 1\nMuita gente confunde: subsídio não é o financiamento. Subsídio é um desconto que o governo pode dar em programas habitacionais para famílias que se enquadram nas regras de renda e localização. Financiamento é o crédito que você paga em parcelas. Os dois podem andar juntos, mas são coisas diferentes. Comente SUBSÍDIO que eu explico se o seu perfil pode ter direito.\n\nVÍDEO 2\nE cuidado com quem promete o subsídio máximo. O valor depende da renda familiar, da cidade, do imóvel e das regras do programa naquele momento. Só a análise oficial mostra quanto você realmente recebe. Desconfie de promessa de valor antes de qualquer simulação. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ANÁLISE e eu faço a sua simulação com seriedade."},"32":{"g":"Quanto a sua renda consegue comprar? Faça essa conta.","r":"VÍDEO 1\nQuanto de imóvel a sua renda compra? De forma geral, o banco aceita que a parcela comprometa só uma parte da renda familiar, em torno de trinta por cento. A partir disso, entra a entrada, o prazo e a taxa. Duas famílias com a mesma renda podem ter resultados diferentes. Por isso, a simulação é individual. Comente RENDA que eu te ajudo a calcular a sua faixa.\n\nVÍDEO 2\nCapacidade de compra vem antes da escolha do imóvel. Quando você sabe a sua faixa, a busca fica objetiva, a negociação fica mais forte e você não perde tempo com imóveis fora da realidade. Primeiro o número, depois o endereço. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente SIMULAÇÃO e eu faço a sua."},"38":{"g":"Minha Casa Minha Vida em linguagem simples.","r":"VÍDEO 1\nMinha Casa Minha Vida, sem complicação: é um programa do governo que facilita a compra do imóvel para famílias dentro de faixas de renda, com juros menores e, em alguns casos, subsídio. Cada faixa tem regras próprias, e o imóvel também precisa se enquadrar. Comente MCMV que eu te digo em qual faixa você pode estar.\n\nVÍDEO 2\nUma dica importante: não compare o seu benefício com o do vizinho. O valor do subsídio e a taxa mudam conforme renda, cidade, composição familiar e regras do momento. O que o seu colega recebeu pode não valer para você. A análise individual é o único caminho seguro. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente MINHA CASA para fazermos a sua."},"42":{"g":"Quanto você precisa de entrada para comprar um imóvel?","r":"VÍDEO 1\nQuanto de entrada você precisa? No financiamento tradicional, o banco costuma financiar uma parte do valor do imóvel, e o restante é a sua entrada. Em programas habitacionais, essa entrada pode ser menor. Além dela, separe o dinheiro de ITBI, escritura e registro. Comente ENTRADA que eu te mostro a conta para o seu caso.\n\nVÍDEO 2\nAgora, um conselho que pouca gente dá: não use toda a sua reserva na entrada. Depois da compra vêm custos, mudança e imprevistos. Quem zera a conta para dar entrada maior fica sem fôlego no primeiro problema. Equilíbrio entre entrada e reserva é o que dá segurança. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente RESERVA e eu te ajudo a equilibrar."},"43":{"g":"Somar a renda com outra pessoa pode aumentar o seu poder de compra.","r":"VÍDEO 1\nSabia que dá para somar a renda com outra pessoa para financiar? Cônjuge, companheiro, pais ou irmãos podem compor a renda, conforme as regras de cada banco. Isso aumenta o valor que pode ser financiado. Mas todos que compõem a renda entram no contrato e na análise. Comente COMPOSIÇÃO que eu explico como funciona.\n\nVÍDEO 2\nSó que mais renda não garante aprovação. Se a pessoa que vai compor tem nome restrito ou muita dívida, ela pode atrapalhar em vez de ajudar. Antes de somar, analise o perfil de crédito de cada um. A composição certa faz a diferença. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente RENDA para analisarmos juntos."},"45":{"g":"Imóvel na planta: oportunidade ou risco?","r":"VÍDEO 1\nComprar na planta pode ser uma ótima oportunidade: preço de lançamento, entrada parcelada durante a obra e potencial de valorização na entrega. Mas exige atenção à construtora, ao prazo de entrega e às correções das parcelas durante a obra. Comente PLANTA que eu te passo o checklist do comprador na planta.\n\nVÍDEO 2\nE lembre: o decorado é o sonho, o contrato é a realidade. O apartamento decorado usa móveis sob medida e às vezes itens que não vêm com a unidade. O que vale é o memorial descritivo e o contrato: metragem, acabamento, vaga e prazo. Leia antes de assinar. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CONTRATO que eu te ajudo a revisar."},"47":{"g":"A entrada não é o único dinheiro que você precisa.","r":"VÍDEO 1\nAchou que bastava a entrada? Na compra do imóvel ainda tem ITBI, escritura ou contrato do banco, registro em cartório, avaliação do imóvel e, às vezes, taxas da negociação. Esses custos podem pesar se você não planejar. Comente CUSTOS que eu te passo a lista completa.\n\nVÍDEO 2\nUma forma simples de se organizar é pensar em três caixas: a caixa da entrada, a caixa dos custos da compra e a caixa da reserva para depois da mudança. Com as três separadas, você compra sem susto e sem dívida extra. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PLANEJAR para montarmos as suas três caixas."},"51":{"g":"Imóvel novo ou usado: qual compensa mais?","r":"VÍDEO 1\nNovo ou usado? O imóvel novo traz acabamento atual, menos manutenção e às vezes condições de construtora. O usado costuma ter metragem maior, localização consolidada e espaço para negociar preço. Não existe resposta única: depende do seu objetivo. Comente NOVO ou USADO que eu te ajudo a decidir.\n\nVÍDEO 2\nE olhe o custo total, não só o preço. Um usado mais barato pode precisar de reforma. Um novo pode ter condomínio mais alto. Some preço, reforma, condomínio, IPTU e custos da compra antes de decidir. É assim que você compara de verdade. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CUSTO TOTAL e eu faço essa conta com você."},"52":{"g":"O banco também avalia o imóvel, não só você.","r":"VÍDEO 1\nPouca gente sabe: no financiamento, o banco avalia o imóvel. Um engenheiro ou avaliador confere estado, documentação e valor de mercado. Se a avaliação vier abaixo do preço combinado, o banco financia sobre o valor avaliado, e você precisa cobrir a diferença. Comente AVALIAÇÃO que eu te explico como se preparar.\n\nVÍDEO 2\nJá vi comprador com crédito aprovado perder o negócio porque o imóvel tinha problema: documentação irregular, área não averbada ou pendência no condomínio. Por isso, antes de fechar, a análise do imóvel é tão importante quanto a sua. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente IMÓVEL e eu te ajudo a verificar."},"56":{"g":"Simulação aprovada não é crédito aprovado.","r":"VÍDEO 1\nFez a simulação no site do banco e já se viu com a chave na mão? Calma. A simulação é uma estimativa com os números que você digitou. A aprovação real vem depois da análise de documentos, renda e histórico de crédito. Os valores podem mudar. Comente SIMULAÇÃO que eu te explico a diferença na prática.\n\nVÍDEO 2\nO que vale é a sua capacidade real: renda que você consegue comprovar, dívidas que já tem e quanto sobra no fim do mês. Fazer a análise completa antes de assumir compromissos evita frustração e protege o seu orçamento. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CAPACIDADE para fazermos a sua análise real."},"57":{"g":"Comprar para morar ou para investir? As regras mudam.","r":"VÍDEO 1\nComprar para morar e comprar para investir são decisões diferentes. Para morar, pesa rotina, escola, trabalho e conforto. Para investir, pesa demanda de aluguel, valorização da região e facilidade de vender depois. Misturar os critérios é o erro mais comum. Comente MORAR ou INVESTIR que eu te ajudo a definir.\n\nVÍDEO 2\nSe o objetivo é investir, pense em liquidez: quanto tempo você levaria para vender esse imóvel se precisasse do dinheiro? Imóvel bonito em região sem procura pode ficar parado. Bom investimento é aquele que tem saída. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente LIQUIDEZ e eu te mostro como avaliar."},"58":{"g":"O documento mais importante do imóvel é a matrícula.","r":"VÍDEO 1\nAntes de comprar, peça a matrícula atualizada do imóvel. É nela que está a história completa: quem é o dono, se existe hipoteca, penhora, usufruto ou qualquer pendência. Comprar sem ler a matrícula é comprar no escuro. Comente MATRÍCULA que eu te mostro o que conferir.\n\nVÍDEO 2\nVocê não compra só paredes, compra um documento. A casa pode ser linda, mas se a documentação não estiver regular, o banco não financia e você pode ter problema para registrar. Imóvel bom é imóvel bonito e regularizado. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente DOCUMENTO e eu te ajudo a verificar antes de fechar."},"62":{"g":"Imóvel de médio padrão pode ser o melhor negócio da região.","r":"VÍDEO 1\nO imóvel de médio padrão é o que mais gira no mercado: atende famílias que estão crescendo, quem quer sair do aluguel e investidores. Por isso costuma ter boa procura tanto para morar quanto para alugar. Comente MÉDIO PADRÃO que eu te mostro as oportunidades da região.\n\nVÍDEO 2\nNa hora de escolher, pense na revenda: localização perto de serviços, transporte e escolas, planta funcional e condomínio equilibrado. Esses fatores mantêm o imóvel valorizado e fácil de vender no futuro. Patrimônio também é saber sair bem. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PATRIMÔNIO e eu te ajudo a escolher."},"70":{"g":"SFH e SFI: as siglas que mudam o seu financiamento.","r":"VÍDEO 1\nSFH é o Sistema Financeiro da Habitação. Ele vale para imóveis residenciais até um teto de valor definido pelo governo, permite usar o FGTS e tem regras de juros mais protegidas. É o caminho da maioria dos compradores de primeiro imóvel. Comente SFH que eu te explico se o seu imóvel se encaixa.\n\nVÍDEO 2\nJá o SFI, Sistema de Financiamento Imobiliário, atende imóveis acima do teto do SFH e outras operações. As condições são negociadas com o banco e, em geral, não permitem uso do FGTS. Saber em qual sistema você está muda a sua estratégia. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente SFI para entender o seu caso."},"73":{"g":"Alto padrão também se compra com financiamento.","r":"VÍDEO 1\nQuem compra imóvel de alto padrão também usa financiamento, e muitas vezes por estratégia: mantém o dinheiro investido rendendo enquanto paga as parcelas. Nesse caso, a operação costuma ser pelo SFI, com condições negociadas. Comente ALTO PADRÃO que eu te explico as possibilidades.\n\nVÍDEO 2\nNo alto padrão, os critérios são outros: localização exclusiva, segurança, privacidade, qualidade construtiva e, principalmente, liquidez. Imóvel de alto valor demora mais para vender, então escolher bem é proteger o patrimônio. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente LIQUIDEZ e eu te mostro o que avaliar."},"82":{"g":"Comprar imóvel em 5 etapas, sem se perder no caminho.","r":"VÍDEO 1\nA compra do imóvel tem cinco etapas: um, análise de crédito e capacidade; dois, definição da região e do tipo de imóvel; três, visitas e escolha; quatro, proposta, documentação e avaliação; cinco, contrato, registro e chaves. Pular etapas é o que trava o processo. Comente JORNADA que eu te mando o passo a passo.\n\nVÍDEO 2\nE o corretor entra antes da visita, não só na hora de abrir a porta. Um bom corretor filtra imóveis compatíveis, verifica documentação, ajuda na negociação e acompanha até a entrega das chaves. Isso economiza tempo e evita erro caro. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CHAVES e eu caminho com você."},"83":{"g":"Quer vender o seu imóvel? Comece por aqui.","r":"VÍDEO 1\nVai vender o seu imóvel? O primeiro passo é organizar a documentação: matrícula atualizada, IPTU, condomínio em dia e certidões. Depois, fotos boas e uma descrição honesta. Imóvel com documentação pronta vende mais rápido e passa confiança para o comprador. Comente VENDER que eu te ajudo a preparar.\n\nVÍDEO 2\nE o preço certo faz toda a diferença. Preço acima do mercado deixa o imóvel parado, e imóvel parado perde valor na percepção de quem procura. A avaliação com base em vendas reais da região é o caminho para vender bem e no prazo. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente AVALIAR e eu faço a avaliação do seu imóvel."},"88":{"g":"Negociar imóvel não é só pedir desconto.","r":"VÍDEO 1\nNegociar imóvel não é só pedir desconto. Você pode negociar prazo de entrega, forma de pagamento, itens que ficam no imóvel, quem paga custos da transferência e data de mudança. Às vezes, uma condição vale mais do que um desconto no preço. Comente NEGOCIAR que eu te ajudo a montar a sua proposta.\n\nVÍDEO 2\nUma proposta bem feita mostra seriedade: valor, forma de pagamento, prazo e condições por escrito. O vendedor leva mais a sério quem já tem crédito analisado e documentação pronta. Negociação boa é aquela em que os dois lados fecham satisfeitos. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PROPOSTA para começarmos."},"89":{"g":"Você conhece alguém que quer comprar ou vender imóvel?","r":"VÍDEO 1\nUma pergunta rápida: quem você conhece que está pensando em comprar, vender ou alugar um imóvel? Pode ser alguém da família, do trabalho ou um amigo que vive falando em sair do aluguel. Eu posso ajudar essa pessoa com análise de crédito e busca direcionada. Comente IMÓVEL ou me chama no Direct.\n\nVÍDEO 2\nIndicação é a maior prova de confiança que um corretor pode receber. Se eu já te ajudei ou se você gosta do meu conteúdo, me indique para quem precisa. Eu cuido dessa pessoa com o mesmo cuidado que cuido de você. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente INDICAÇÃO e me marque para quem precisa ver isso."},"90":{"g":"Os bastidores de como um imóvel chega até você.","r":"VÍDEO 1\nVocê vê o anúncio pronto, mas antes dele existe o agenciamento: visita ao imóvel, conversa com o proprietário, conferência de documentos, definição do preço e produção das fotos. Esse trabalho é o que garante um anúncio verdadeiro. Comente CAPTAÇÃO que eu mostro mais desses bastidores.\n\nVÍDEO 2\nFicha completa vende melhor: metragem, vagas, condomínio, IPTU, documentação e diferenciais bem descritos. O comprador decide mais rápido quando tem informação clara. Se você quer vender, eu monto essa ficha com você. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente VENDER e eu te explico como funciona."},"95":{"g":"Tabela SAC: a parcela que diminui com o tempo.","r":"VÍDEO 1\nNa tabela SAC, você amortiza o mesmo valor da dívida todo mês. Como os juros são calculados sobre o saldo, que vai caindo, a parcela começa mais alta e diminui ao longo do tempo. No total, você costuma pagar menos juros. Comente SAC que eu te mostro uma simulação.\n\nVÍDEO 2\nJá na tabela Price, a parcela começa menor e tende a se manter estável, mas no início você paga mais juros e amortiza menos. Ela cabe melhor no orçamento inicial, só que o custo total costuma ser maior. A escolha depende do seu fluxo de caixa. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PRICE e eu comparo as duas para você."},"96":{"g":"Em 30 dias, isso foi o que aprendi ajudando compradores.","r":"VÍDEO 1\nFechando este ciclo de trinta dias de conteúdo: o comprador que chega com análise feita, documentos organizados e região definida fecha negócio mais rápido e com menos estresse. O segredo não é sorte, é preparo. Comente IMÓVEL e me conte em qual etapa você está.\n\nVÍDEO 2\nO meu trabalho é ser consultor, não vendedor de porta aberta. Eu analiso o seu momento, filtro opções e acompanho até as chaves. Se você quer comprar com estratégia, vamos conversar. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CONSULTORIA que eu te chamo."},"97":{"g":"Financiamento ou consórcio: qual é o melhor para você?","r":"VÍDEO 1\nFinanciamento ou consórcio? No financiamento, você recebe o imóvel agora e paga juros por isso. No consórcio, não há juros, mas há taxa de administração, e você só usa o crédito quando for contemplado, por sorteio ou lance, sem data garantida. Comente FINANCIAMENTO ou CONSÓRCIO e eu te explico em detalhes.\n\nVÍDEO 2\nO que define o melhor caminho é a urgência. Precisa sair do aluguel agora? O financiamento pode fazer mais sentido. Tem prazo e quer planejar? O consórcio pode ser uma alternativa. Cada caso pede análise. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ESTRATÉGIA e eu comparo os dois para a sua realidade."},"101":{"g":"Antes de escolher a casa, eu analiso você.","r":"VÍDEO 1\nQuando um cliente me procura, a primeira coisa que eu faço não é mostrar imóvel. É o diagnóstico do comprador: renda, entrada disponível, FGTS, dívidas, objetivo e prazo. Com isso, eu sei exatamente quais imóveis fazem sentido. Comente ANÁLISE e eu faço o seu diagnóstico.\n\nVÍDEO 2\nPare de começar pela casa. Quem começa pela casa se frustra quando descobre que não consegue comprá-la. Quem começa pelo diagnóstico encontra o imóvel certo mais rápido e compra com segurança. A ordem muda tudo. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CASA para começarmos do jeito certo."},"102":{"g":"O que observar na visita que quase ninguém olha.","r":"VÍDEO 1\nNa visita, não olhe só a decoração. Confira a posição do sol, sinais de umidade e infiltração, pressão da água, estado das janelas e portas, barulho da rua e o caminho até o trabalho. Leve um checklist e tire fotos. Comente VISITA que eu te mando o meu checklist.\n\nVÍDEO 2\nGostar do imóvel é importante, mas ele precisa fazer sentido: caber no orçamento, atender a família por alguns anos e ter boa documentação. A emoção escolhe, a análise confirma. Quando os dois concordam, a compra é certa. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CHECKLIST e eu te ajudo a avaliar."},"16":{"g":"Lance embutido: usar parte da própria carta para tentar antecipar.","r":"VÍDEO 1\nVocê sabia que dá para dar lance usando parte da própria carta de crédito? Isso é o lance embutido. Uma parte do crédito é usada como lance, e você fica com o restante para comprar o bem. Cada grupo define se aceita e qual o limite. É uma estratégia para quem não tem dinheiro guardado para o lance. Comente LANCE que eu te explico como calcular.\n\nVÍDEO 2\nMas atenção: no lance embutido, o crédito que sobra é menor. Se você precisa de um imóvel de determinado valor, a carta tem que ser maior para compensar. E lance nunca garante contemplação: ele concorre com os lances dos outros participantes. Planeje o crédito pensando nisso. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente EMBUTIDO e eu simulo para você."},"17":{"g":"Consórcio em 40 segundos, sem enrolação.","r":"VÍDEO 1\nConsórcio é um grupo de pessoas que contribui todo mês para formar um fundo. A cada assembleia, participantes são contemplados por sorteio ou lance e recebem a carta de crédito para comprar o bem. Não tem juros como no financiamento, mas tem taxa de administração. Comente CONSÓRCIO que eu te explico cada detalhe.\n\nVÍDEO 2\nE o consórcio não começa pela parcela. Começa pelo objetivo: o que você quer comprar, em quanto tempo e quanto pode pagar por mês sem apertar. A partir disso, a gente define o valor da carta, o prazo e a estratégia de lance. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PLANO e eu monto o seu."},"18":{"g":"Consórcio também é ferramenta de construção de patrimônio.","r":"VÍDEO 1\nConsórcio não é só para comprar a casa própria. Muita gente usa como ferramenta de patrimônio: compra imóvel para alugar, terreno para construir ou amplia o negócio. A disciplina da parcela mensal ajuda a transformar renda em bens. Comente PATRIMÔNIO que eu te mostro como funciona.\n\nVÍDEO 2\nAgora, alavancagem exige cautela. Assumir várias cartas ao mesmo tempo sem reserva e sem planejamento de fluxo de caixa pode virar um problema. Patrimônio se constrói com estratégia, prazo e parcelas que cabem no orçamento, mesmo em um mês ruim. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente DUPLICAR e eu te explico a forma responsável."},"22":{"g":"Taxa de administração: o custo que você precisa entender.","r":"VÍDEO 1\nNo consórcio, não tem juros, mas existe a taxa de administração. Ela remunera a administradora pela gestão do grupo e é diluída nas parcelas ao longo do prazo. Sempre pergunte qual é a taxa total e como ela é cobrada antes de assinar. Comente TAXA que eu te mostro como comparar.\n\nVÍDEO 2\nSem juros não significa sem custo. Além da taxa de administração, pode existir fundo de reserva, seguro e reajuste anual do crédito e das parcelas, conforme o contrato. Para comparar com o financiamento, some todos os custos. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CUSTO e eu faço essa comparação com você."},"23":{"g":"Seu crédito no consórcio é corrigido. Entenda por quê.","r":"VÍDEO 1\nTodo ano, a carta de crédito do consórcio é reajustada por um índice previsto no contrato, como o INCC ou o IPCA. Isso existe para que o crédito acompanhe o preço dos bens ao longo do tempo. As parcelas também são reajustadas. Comente REAJUSTE que eu te explico o índice do seu grupo.\n\nVÍDEO 2\nPor isso, o crédito precisa acompanhar o bem que você quer comprar. Se o imóvel dos seus planos valoriza mais rápido do que o índice, a carta pode não ser suficiente no futuro. Escolher o valor certo da carta é parte da estratégia. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CRÉDITO e eu te ajudo a dimensionar."},"24":{"g":"Meia parcela: quando ela pode ajudar o seu fluxo de caixa.","r":"VÍDEO 1\nAlguns grupos de consórcio oferecem a opção de pagar parcela reduzida até a contemplação, a chamada meia parcela. A diferença não some: ela é redistribuída nas parcelas depois que você é contemplado. Isso alivia o orçamento no início. Comente MEIA PARCELA que eu te explico se o grupo tem essa opção.\n\nVÍDEO 2\nA estratégia faz sentido para quem quer preservar caixa agora, mas precisa ser planejada. Depois da contemplação, a parcela sobe. Se o bem comprado gerar renda, como um imóvel alugado, essa conta pode fechar melhor. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente FLUXO e eu simulo os dois cenários."},"33":{"g":"Carta de crédito: o que é e como você usa.","r":"VÍDEO 1\nCarta de crédito é o valor que você recebe quando é contemplado no consórcio. Com ela, você compra o imóvel, o veículo ou o serviço previsto no contrato, à vista, com poder de negociação. A administradora paga diretamente ao vendedor depois da análise. Comente CARTA que eu te explico o passo a passo.\n\nVÍDEO 2\nO prazo do grupo e o seu objetivo precisam conversar. Se você precisa do bem em pouco tempo, vai depender de lance. Se tem um horizonte maior, o prazo trabalha a seu favor. Escolher o grupo certo é tão importante quanto o valor da carta. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PRAZO e eu te ajudo a escolher."},"35":{"g":"Empresa também pode usar consórcio para crescer.","r":"VÍDEO 1\nEmpresas também usam consórcio para comprar imóveis, veículos, máquinas e equipamentos, sem pagar juros de financiamento. O CNPJ pode participar, e a parcela entra no planejamento financeiro do negócio. Comente EMPRESA que eu te mostro como estruturar.\n\nVÍDEO 2\nO segredo é tratar o consórcio como planejamento de ativos: saber quando a empresa vai precisar do bem, quanto pode comprometer do caixa e qual estratégia de lance usar. Assim, o crescimento acontece sem sufocar o capital de giro. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CAPITAL e eu monto essa estratégia com você."},"36":{"g":"Sorteio no consórcio: como funciona de verdade.","r":"VÍDEO 1\nTodo mês, na assembleia, o grupo realiza sorteios entre os participantes que estão em dia. Quem é sorteado recebe a carta de crédito, sem precisar dar lance. A quantidade de contemplações depende do grupo e do caixa disponível. Comente SORTEIO que eu te explico as regras.\n\nVÍDEO 2\nAlém do sorteio, existe o lance livre: você oferece um valor para antecipar a contemplação, e vence quem oferecer o maior percentual, conforme as regras do grupo. Não há valor garantido para vencer. Estratégia de lance se planeja com histórico e reserva. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente LANCE e eu te ajudo a planejar."},"40":{"g":"Consórcio imobiliário: compra planejada do seu imóvel.","r":"VÍDEO 1\nNo consórcio imobiliário, a carta de crédito pode ser usada para comprar casa, apartamento, terreno, imóvel comercial e, em muitos casos, para construir ou reformar, conforme o contrato. É uma forma de comprar o imóvel sem juros de financiamento. Comente IMÓVEL que eu te mostro as possibilidades.\n\nVÍDEO 2\nA grande diferença está na urgência. Quem precisa do imóvel agora geralmente vai de financiamento. Quem pode planejar ganha com o consórcio. Compra planejada é compra com mais poder de negociação, porque a carta funciona como pagamento à vista. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente ESTRATÉGIA e eu analiso o seu caso."},"49":{"g":"Consórcio não é reserva de emergência.","r":"VÍDEO 1\nUm alerta importante: consórcio não é reserva de emergência. O dinheiro das parcelas não fica disponível para saque quando você precisa. Antes de entrar em um grupo, tenha uma reserva separada para imprevistos. Comente PLANO que eu te mostro a ordem certa.\n\nVÍDEO 2\nPatrimônio forte é diversificado: reserva de emergência com liquidez, investimentos e, quando faz sentido, consórcio para compra planejada de bens. Cada ferramenta tem a sua função. Misturar as funções é o que gera problema. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente DIVERSIFICAR e eu te ajudo a organizar."},"53":{"g":"Simulação de consórcio: o que olhar além da parcela.","r":"VÍDEO 1\nNuma simulação de consórcio, não olhe só a parcela. Confira o valor da carta, o prazo, a taxa de administração total, o fundo de reserva, o seguro, o índice de reajuste e as regras de lance do grupo. São esses números que mostram o custo real. Comente SIMULAÇÃO e eu te mando uma completa.\n\nVÍDEO 2\nAntes da proposta, vem o diagnóstico: objetivo, prazo, capacidade mensal e recurso disponível para lance. Uma proposta sem diagnóstico é só um número. Com diagnóstico, vira estratégia. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente DIAGNÓSTICO e eu faço o seu antes de qualquer proposta."},"55":{"g":"Dá para vender a sua cota de consórcio? Dá, com regras.","r":"VÍDEO 1\nMudou de planos e não quer mais continuar no consórcio? Em geral, é possível transferir a cota para outra pessoa, com autorização da administradora e conforme o contrato. Quem compra assume as parcelas restantes. Comente VENDA que eu te explico o processo.\n\nVÍDEO 2\nCarta contemplada à venda exige cuidado redobrado. Confirme com a administradora a titularidade, o saldo devedor e as condições de transferência antes de pagar qualquer valor. Nunca faça pagamento sem contrato e sem validação oficial. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente TRANSFERÊNCIA e eu te oriento com segurança."},"59":{"g":"Consórcio x financiamento: a comparação honesta.","r":"VÍDEO 1\nConsórcio ou financiamento? No financiamento, você tem o bem agora e paga juros. No consórcio, paga taxa de administração, sem juros, mas depende de sorteio ou lance para usar o crédito. Para comparar, some o custo total de cada um no mesmo prazo. Comente COMPARAR e eu faço essa conta com você.\n\nVÍDEO 2\nO financiamento faz sentido quando existe urgência real, como sair do aluguel caro, ou quando a oportunidade de compra é agora. Não é vilão nem herói: é ferramenta. A decisão certa depende do seu momento. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente FINANCIAR e eu te ajudo a decidir com números."},"63":{"g":"Consórcio de veículo: trocar de carro sem pagar juros.","r":"VÍDEO 1\nO consórcio de veículos permite comprar carro, moto ou utilitário com carta de crédito, sem juros de financiamento. É uma boa opção para quem pode planejar a troca e quer pagar menos no total. Comente CARRO que eu te mostro uma simulação.\n\nVÍDEO 2\nA troca planejada funciona assim: você entra no grupo antes de precisar do carro novo, usa o atual como possível lance ou entrada na negociação e escolhe o momento certo. Planejamento evita a pressa, e a pressa custa caro. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PLANO e eu monto a sua troca."},"64":{"g":"Leia o contrato do consórcio antes de assinar.","r":"VÍDEO 1\nAntes de assinar o consórcio, leia o contrato. Confira prazo, valor da carta, taxa de administração, fundo de reserva, seguro, índice de reajuste, regras de lance e o que acontece em caso de atraso ou desistência. Contrato lido é surpresa evitada. Comente CONTRATO que eu te ajudo a revisar.\n\nVÍDEO 2\nE entenda o grupo: quantos participantes, quantas contemplações por mês e como funcionam as assembleias. Esses dados ajudam a montar uma estratégia realista de lance e prazo. Informação é o que separa decisão de aposta. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente GRUPO e eu te explico como analisar."},"65":{"g":"Prazo longo no consórcio: vantagem ou armadilha?","r":"VÍDEO 1\nPrazo longo deixa a parcela menor, e isso ajuda o orçamento. Mas também significa mais tempo de compromisso e, dependendo da estratégia, pode levar mais tempo até a contemplação. O prazo precisa combinar com o seu objetivo. Comente PRAZO que eu te ajudo a escolher.\n\nVÍDEO 2\nParcela sustentável é aquela que você paga mesmo num mês difícil, sem tirar da reserva. Escolha a carta e o prazo pensando na sua pior fase, não na melhor. É isso que garante que você chegue até o fim. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PARCELA e eu calculo a sua faixa segura."},"66":{"g":"Fui contemplado. E agora?","r":"VÍDEO 1\nFoi contemplado no consórcio? Parabéns, mas ainda não acabou. Agora começa a fase de análise: a administradora confere seus documentos e capacidade de pagamento, e você escolhe o bem dentro das regras do contrato. Só depois disso o crédito é liberado. Comente CONTEMPLADO que eu te explico cada etapa.\n\nVÍDEO 2\nUm detalhe que surpreende muita gente: o crédito não cai livre na sua conta. A administradora paga diretamente ao vendedor do bem, depois da análise do imóvel ou do veículo. Planeje a compra sabendo disso. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CRÉDITO e eu te acompanho nessa fase."},"69":{"g":"Como pensar uma carta de cem mil reais.","r":"VÍDEO 1\nVamos pensar uma carta de cem mil reais. A parcela depende do prazo e da taxa do grupo. Se o objetivo é usar rápido, você vai precisar de estratégia de lance. Se o objetivo é médio prazo, o sorteio e a disciplina trabalham a favor. Comente CEM MIL que eu faço a simulação completa.\n\nVÍDEO 2\nMas o valor vem depois do objetivo. Primeiro, defina o que você quer comprar e para quê: morar, alugar, investir ou ampliar o negócio. Aí a carta é dimensionada para o objetivo, não o contrário. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente OBJETIVO e eu te ajudo a definir."},"74":{"g":"Aposentadoria com imóveis: renda que você planeja hoje.","r":"VÍDEO 1\nMuita gente pensa em aposentadoria só com previdência. Mas imóveis de aluguel também podem formar renda futura. Com planejamento, o consórcio é uma das ferramentas para adquirir esses imóveis ao longo dos anos. Comente APOSENTADORIA que eu te mostro como pensar.\n\nVÍDEO 2\nFormação de patrimônio com imóveis exige prazo, escolha de região com demanda de aluguel e parcelas que cabem no orçamento. Não é enriquecimento rápido: é construção consistente. Quem começa cedo colhe mais. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente IMÓVEIS e eu monto um plano com você."},"76":{"g":"Meta patrimonial: comece pelo número que você quer alcançar.","r":"VÍDEO 1\nQual é a sua meta patrimonial? Ter um imóvel quitado, dois imóveis de aluguel, um terreno? Quando a meta tem número e prazo, fica possível montar o caminho: quanto investir por mês e quais ferramentas usar. Comente META que eu te ajudo a definir a sua.\n\nVÍDEO 2\nExemplo de raciocínio: para uma carta de trezentos mil, você define o prazo, avalia a parcela e decide se vai usar lance. O plano mostra exatamente onde você quer chegar e o que fazer todo mês. Valores reais só com simulação do grupo. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente TREZENTOS MIL e eu simulo para você."},"79":{"g":"Desistir do consórcio: o que acontece com o seu dinheiro?","r":"VÍDEO 1\nSe você desistir do consórcio, o dinheiro não volta na hora. Em geral, o valor pago, descontadas as taxas previstas no contrato, é devolvido quando a cota for contemplada ou no encerramento do grupo, conforme as regras. Comente CANCELAR que eu te explico as opções.\n\nVÍDEO 2\nPor isso, não entre sem entender a saída. Antes de assinar, pergunte: o que acontece se eu atrasar? Se eu quiser transferir? Se eu desistir? Quem conhece as regras de saída entra com segurança. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CONTRATO e eu reviso essas regras com você."},"81":{"g":"Consórcio como plano da família.","r":"VÍDEO 1\nO consórcio pode ser um plano da família: a casa maior quando os filhos crescerem, o imóvel para o estudo deles ou o terreno para construir no futuro. Com prazo e parcela planejados, o objetivo da família vira realidade passo a passo. Comente FAMÍLIA que eu te mostro como montar.\n\nVÍDEO 2\nCrédito para o futuro é decisão que se toma hoje. Começar antes da necessidade dá tempo para a contemplação acontecer sem pressão. Planejar com antecedência é um presente para quem você ama. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente FUTURO e eu monto esse plano com você."},"85":{"g":"Não comprometa a sua renda demais no consórcio.","r":"VÍDEO 1\nUma regra de ouro: não comprometa uma parte grande da sua renda com parcelas de consórcio. Se a parcela aperta, qualquer imprevisto vira atraso, e atraso no consórcio tem consequências previstas em contrato. Comente RISCO que eu te ajudo a calcular o limite seguro.\n\nVÍDEO 2\nReserva vem antes da carta. Primeiro, monte uma reserva para imprevistos. Depois, entre no grupo com uma parcela confortável. Essa ordem protege o seu patrimônio e garante que você chegue até a contemplação. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente RESERVA e eu te mostro o passo a passo."},"87":{"g":"Cinco perguntas antes de entrar em um consórcio.","r":"VÍDEO 1\nAntes de entrar em um consórcio, responda cinco perguntas: O que eu quero comprar? Em quanto tempo? Quanto posso pagar por mês com folga? Tenho recurso para lance? E tenho reserva de emergência? As respostas mostram se o consórcio é para você agora. Comente DIAGNÓSTICO que eu faço essas perguntas com você.\n\nVÍDEO 2\nO erro mais comum é comprar a parcela, não o plano. Alguém oferece uma parcela que cabe e você assina sem pensar em prazo, lance e objetivo. Consórcio bom é aquele que leva você exatamente aonde quer chegar. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CONSÓRCIO e eu monto o seu plano."},"91":{"g":"Para quem o consórcio faz sentido?","r":"VÍDEO 1\nPara quem o consórcio faz sentido? Para quem tem um objetivo claro, pode planejar o prazo, quer evitar juros de financiamento e tem disciplina para pagar todo mês. Se você se encaixa nisso, vale conhecer. Comente OBJETIVO e eu te digo se é o seu caso.\n\nVÍDEO 2\nConhece alguém que está pensando em comprar um imóvel, um carro ou ampliar a empresa? Compartilhe este vídeo com essa pessoa. Uma boa orientação agora pode economizar muito dinheiro no futuro. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente INDICAÇÃO e me marque para quem precisa ver."},"93":{"g":"Histórico de lances: use a informação a seu favor.","r":"VÍDEO 1\nO histórico de lances de um grupo mostra quais percentuais foram vencedores nas últimas assembleias. Essa informação ajuda a planejar a sua estratégia e a separar o recurso certo. Peça esse histórico antes de entrar. Comente LANCE que eu te mostro como analisar.\n\nVÍDEO 2\nMas atenção: histórico não é promessa. Cada assembleia é diferente, e não existe lance garantido. O histórico serve para planejar, não para prometer data. Desconfie de quem garante contemplação. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente ESTRATÉGIA e eu planejo com você, com transparência."},"94":{"g":"Consórcio depois dos 40: planejamento de prazo.","r":"VÍDEO 1\nDepois dos quarenta, o consórcio pode ser uma ótima ferramenta para organizar patrimônio. O importante é escolher um prazo que termine em uma fase confortável da vida e uma parcela que não pese na renda. Comente IDADE que eu te ajudo a planejar.\n\nVÍDEO 2\nPlanejamento de prazo é pensar onde você quer estar quando a última parcela for paga. Com o prazo certo, o consórcio trabalha para a sua tranquilidade, não contra ela. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PRAZO e eu monto essa conta com você."},"100":{"g":"Trinta dias de conteúdo sobre consórcio: o que fica.","r":"VÍDEO 1\nFechando este ciclo de trinta dias falando de consórcio: o que mais faz diferença é começar pelo objetivo, entender os custos reais, ter reserva e planejar a estratégia de lance. Com isso, o consórcio vira ferramenta de verdade. Comente PLANO e me conte qual é o seu objetivo.\n\nVÍDEO 2\nO meu trabalho é consultoria, não venda de parcela. Eu analiso o seu momento, comparo cenários e mostro o caminho com transparência. Se você quer decidir com segurança, vamos conversar. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CONSULTORIA que eu te chamo."},"103":{"g":"Planejar a expansão da empresa com consórcio.","r":"VÍDEO 1\nSua empresa precisa de um imóvel maior, de um veículo de trabalho ou de equipamentos? O consórcio pode fazer parte do planejamento de expansão, sem juros de financiamento e com a parcela entrando no fluxo de caixa. Comente EXPANSÃO que eu te mostro como estruturar.\n\nVÍDEO 2\nPriorize bens produtivos, aqueles que geram receita ou reduzem custo, como a sede própria no lugar do aluguel ou o veículo que amplia as entregas. Quando o bem se paga, a conta fecha melhor. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente EMPRESA e eu analiso o seu caso."},"20":{"g":"O que o banco analisa antes de aprovar o seu financiamento.","r":"ABERTURA (0:00–0:40): Você já se perguntou por que duas pessoas com a mesma renda recebem respostas diferentes do banco? Neste vídeo eu mostro, ponto por ponto, o que o banco analisa antes de aprovar um financiamento imobiliário.\n\nBLOCO 1 — RENDA (0:40–2:30): renda bruta comprovada, como cada tipo de trabalhador comprova (CLT, autônomo, MEI, aposentado) e por que a renda declarada importa.\n\nBLOCO 2 — COMPROMETIMENTO (2:30–4:00): quanto da renda pode ir para a parcela, como dívidas atuais reduzem o seu limite e a conta prática para descobrir a sua faixa.\n\nBLOCO 3 — HISTÓRICO DE CRÉDITO (4:00–5:30): score, restrições no CPF, atrasos recentes e como melhorar o seu perfil antes de pedir o crédito.\n\nBLOCO 4 — IDADE E PRAZO (5:30–6:30): como a idade influencia o prazo máximo e o valor da parcela.\n\nBLOCO 5 — O IMÓVEL (6:30–8:00): avaliação do imóvel, documentação e por que o banco pode financiar menos do que o preço combinado.\n\nENCERRAMENTO (8:00–9:00): resumo em três passos: organizar renda, limpar o histórico e simular antes de escolher o imóvel. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CRÉDITO aqui embaixo e me chame para fazer a sua análise."},"26":{"g":"Primeiro imóvel: o passo a passo do zero até as chaves.","r":"ABERTURA (0:00–0:40): Quer comprar o seu primeiro imóvel e não sabe por onde começar? Neste vídeo eu te mostro o caminho completo, na ordem certa, para você não perder tempo nem dinheiro.\n\nPASSO 1 — DIAGNÓSTICO (0:40–2:00): renda, entrada, FGTS, dívidas e objetivo. Por que começar por você e não pela casa.\n\nPASSO 2 — SIMULAÇÃO (2:00–3:30): diferença entre simulação e aprovação, e como descobrir a sua faixa de compra.\n\nPASSO 3 — REGIÃO E TIPO DE IMÓVEL (3:30–5:00): morar perto do trabalho, escola e serviços; casa ou apartamento; novo ou usado.\n\nPASSO 4 — VISITAS (5:00–6:30): o checklist da visita e os sinais de alerta.\n\nPASSO 5 — PROPOSTA E DOCUMENTOS (6:30–8:00): matrícula, certidões, avaliação do banco e assinatura do contrato.\n\nPASSO 6 — REGISTRO E CHAVES (8:00–9:00): ITBI, registro em cartório e entrega das chaves.\n\nENCERRAMENTO (9:00–9:40): recapitule os seis passos. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PRIMEIRO IMÓVEL que eu te mando o checklist completo."},"46":{"g":"Entrada e custos iniciais: quanto você precisa ter guardado.","r":"ABERTURA (0:00–0:40): Quanto dinheiro você precisa ter para comprar um imóvel? Não é só a entrada. Neste vídeo eu mostro todos os custos iniciais para você não ser pego de surpresa.\n\nBLOCO 1 — ENTRADA (0:40–2:30): como funciona a parte financiada e a parte que você paga, e como os programas habitacionais podem reduzir a entrada.\n\nBLOCO 2 — FGTS (2:30–3:30): quando o FGTS pode compor a entrada e quais regras precisam ser cumpridas.\n\nBLOCO 3 — CUSTOS DA COMPRA (3:30–5:30): ITBI, registro em cartório, avaliação do imóvel e taxas do banco. Por que separar uma reserva só para isso.\n\nBLOCO 4 — CUSTOS DEPOIS DA COMPRA (5:30–7:00): mudança, pequenos reparos, móveis e o primeiro mês de condomínio e IPTU.\n\nBLOCO 5 — AS TRÊS CAIXAS (7:00–8:30): entrada, custos e reserva. Como organizar cada uma.\n\nENCERRAMENTO (8:30–9:15): Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ENTRADA que eu faço a conta para o seu caso."},"54":{"g":"Minha Casa Minha Vida: quem pode participar e como funciona.","r":"ABERTURA (0:00–0:40): O Minha Casa Minha Vida pode ser o caminho mais acessível para a sua casa própria. Neste vídeo eu explico, em linguagem simples, como funciona e o que você precisa saber antes de começar.\n\nBLOCO 1 — O QUE É O PROGRAMA (0:40–2:00): objetivo, quem administra e as vantagens: juros menores e possibilidade de subsídio.\n\nBLOCO 2 — FAIXAS DE RENDA (2:00–3:30): como as faixas funcionam e por que as regras e os valores mudam ao longo do tempo. Sempre confira a regra vigente.\n\nBLOCO 3 — SUBSÍDIO (3:30–5:00): o que é, de que depende e por que não dá para comparar o seu com o de outra pessoa.\n\nBLOCO 4 — O IMÓVEL (5:00–6:30): quais imóveis se enquadram e o limite de valor por região.\n\nBLOCO 5 — DOCUMENTOS E ETAPAS (6:30–8:00): da análise de crédito à assinatura do contrato.\n\nENCERRAMENTO (8:00–8:45): Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente MCMV que eu verifico em qual faixa você pode se enquadrar."},"60":{"g":"Documentação do comprador: a lista que acelera a sua compra.","r":"ABERTURA (0:00–0:40): Documento faltando é um dos maiores motivos de atraso na compra de imóvel. Neste vídeo eu mostro a pasta completa do comprador e por que cada item importa.\n\nBLOCO 1 — DOCUMENTOS PESSOAIS (0:40–2:00): RG ou CNH, CPF, certidão de estado civil e comprovante de residência.\n\nBLOCO 2 — COMPROVAÇÃO DE RENDA (2:00–4:00): holerites, extratos, declaração de imposto de renda, pró-labore e o que muda para autônomos.\n\nBLOCO 3 — FGTS (4:00–5:00): extrato e regras de uso.\n\nBLOCO 4 — COMPOSIÇÃO DE RENDA (5:00–6:00): documentos de quem vai compor a renda com você.\n\nBLOCO 5 — DOCUMENTO NÃO É APROVAÇÃO (6:00–7:30): o que acontece depois da entrega dos documentos e por que a análise pode pedir mais.\n\nENCERRAMENTO (7:30–8:15): Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente DOCUMENTOS que eu te mando a lista pronta para imprimir."},"78":{"g":"Documentação e avaliação do imóvel: o que conferir antes de comprar.","r":"ABERTURA (0:00–0:40): Não é só você que passa por análise: o imóvel também. Neste vídeo eu mostro o que conferir na documentação e como funciona a avaliação do banco.\n\nBLOCO 1 — MATRÍCULA (0:40–2:30): o que é, como pedir a atualizada e o que procurar: proprietário, hipoteca, penhora, usufruto e averbações.\n\nBLOCO 2 — CERTIDÕES (2:30–4:00): certidões do vendedor e do imóvel, débitos de IPTU e condomínio.\n\nBLOCO 3 — REGULARIDADE DA CONSTRUÇÃO (4:00–5:30): área construída averbada, habite-se e por que isso afeta o financiamento.\n\nBLOCO 4 — AVALIAÇÃO DO BANCO (5:30–7:00): quem faz, o que é verificado e o que acontece se o valor vier abaixo do preço.\n\nBLOCO 5 — CHECKLIST FINAL (7:00–8:15): os pontos que eu confiro antes de qualquer cliente assinar.\n\nENCERRAMENTO (8:15–9:00): Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente IMÓVEL que eu te ajudo a verificar a documentação."},"86":{"g":"Financiamento ou consórcio: como escolher o caminho certo.","r":"ABERTURA (0:00–0:40): Financiamento ou consórcio? Essa é uma das perguntas que eu mais recebo. Neste vídeo eu comparo os dois de forma honesta para você decidir com segurança.\n\nBLOCO 1 — COMO FUNCIONA O FINANCIAMENTO (0:40–2:30): imóvel agora, juros, prazo, entrada e análise de crédito.\n\nBLOCO 2 — COMO FUNCIONA O CONSÓRCIO (2:30–4:30): grupo, taxa de administração, sorteio, lance e reajuste. Sem juros, mas sem data garantida.\n\nBLOCO 3 — CUSTO TOTAL (4:30–6:00): como comparar os dois no mesmo prazo, somando todos os custos.\n\nBLOCO 4 — A PERGUNTA DECISIVA: URGÊNCIA (6:00–7:30): quando cada um faz mais sentido, com exemplos de perfis.\n\nBLOCO 5 — ESTRATÉGIAS COMBINADAS (7:30–8:30): quando o consórcio complementa o planejamento de quem já financiou.\n\nENCERRAMENTO (8:30–9:15): Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ESTRATÉGIA que eu comparo os dois para a sua realidade."},"98":{"g":"Morar ou investir: como escolher o imóvel certo para cada objetivo.","r":"ABERTURA (0:00–0:40): Comprar para morar e comprar para investir são decisões diferentes, e misturar os critérios é o erro mais comum. Neste vídeo eu mostro como avaliar cada caso.\n\nBLOCO 1 — PARA MORAR (0:40–2:30): rotina, deslocamento, escola, segurança, tamanho da família e parcela sustentável.\n\nBLOCO 2 — PARA /* ================= v3.7 — Memória de tela, desfazer/refazer, lixeira ================= */
var LS = { get:function(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }, del:function(k){ try{ localStorage.removeItem(k); }catch(e){} } };
var UI_CHAVES = ['view','perfil','formato','rede','busca','modo','mes','diaSel','calModo','redeSel','perenes','modeloPerfil','gapPerfil'];
function salvarUI(){ var o = {}; UI_CHAVES.forEach(function(k){ o[k] = UI[k]; }); o.scroll = window.scrollY||0; o.em = Date.now(); LS.set('si_ui', o); }
function restaurarUI(){ var o = LS.get('si_ui'); if(!o) return false; UI_CHAVES.forEach(function(k){ if(o[k]!==undefined && o[k]!==null) UI[k] = o[k]; }); restaurarUI.scroll = o.scroll||0; return true; }
var _tScroll; window.addEventListener('scroll', function(){ clearTimeout(_tScroll); _tScroll = setTimeout(salvarUI, 300); }, {passive:true});

/* rascunho do editor: salvo a cada alteração e ao sair do app */
function snapEditor(){ var m = $('#modal'); if(!m || !$('#eTitulo')) return null; var o = {}; $all('#modal [id^="e"]', document).forEach(function(i){ if(i.id && /^(INPUT|TEXTAREA|SELECT)$/.test(i.tagName)) o[i.id] = i.type==='checkbox' ? i.checked : i.value; }); return o; }
function aplicarSnap(o){ if(!o) return; Object.keys(o).forEach(function(k){ var i = $('#'+k); if(!i) return; if(i.type==='checkbox') i.checked = !!o[k]; else i.value = o[k]; }); ['eRoteiro','eLegenda'].forEach(function(k){ var el=$('#'+k); if(el) autoAltura(el); }); if($('#eLegenda') && $('#eLegenda').oninput) $('#eLegenda').oninput(); var er=$('#eRoteiro'); if(er && $('#eTempo')) $('#eTempo').innerHTML = htmlTempo(er.value, ($('#eFormato')||{}).value); }
function guardarRascunho(){ var c = editarConteudo.atual, s = snapEditor(); if(!c || !s) return; LS.set('si_rascunho', {id:c.id, novo:!S.conteudos.some(function(x){ return x.id===c.id; }), base:c, campos:s, em:Date.now()}); }
function limparRascunho(){ LS.del('si_rascunho'); }
function recuperarRascunho(){
  var r = LS.get('si_rascunho'); if(!r || !r.campos) return false;
  if(Date.now() - (r.em||0) > 7*864e5){ limparRascunho(); return false; }
  if(r.novo){ editarConteudo(null, r.base); } else if(S.conteudos.some(function(x){ return x.id===r.id; })){ editarConteudo(r.id); } else { limparRascunho(); return false; }
  aplicarSnap(r.campos); EDH.pilha=[JSON.stringify(r.campos)]; EDH.pos=0; EDH.recuperado=true; atualizarBotoesEd();
  toast('↩️ Rascunho recuperado: continue de onde parou'); return true;
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden'){ guardarRascunho(); salvarUI(); } });
window.addEventListener('pagehide', function(){ guardarRascunho(); salvarUI(); });

/* desfazer/refazer dentro do editor (texto e campos) */
var EDH = {pilha:[], pos:-1, t:null};
function iniciarHistEditor(){ EDH.recuperado = false; var s = snapEditor(); EDH.pilha = s ? [JSON.stringify(s)] : []; EDH.pos = EDH.pilha.length-1; atualizarBotoesEd();
  var m = $('#modal'); m.addEventListener('input', function(){ clearTimeout(EDH.t); EDH.t = setTimeout(function(){ var s2 = JSON.stringify(snapEditor()); if(s2 && s2!==EDH.pilha[EDH.pos]){ EDH.pilha = EDH.pilha.slice(0, EDH.pos+1); EDH.pilha.push(s2); if(EDH.pilha.length>80) EDH.pilha.shift(); EDH.pos = EDH.pilha.length-1; atualizarBotoesEd(); } guardarRascunho(); }, 450); });
  m.addEventListener('change', function(){ guardarRascunho(); });
}
function atualizarBotoesEd(){ var u=$('#edDesfazer'), r=$('#edRefazer'); if(u) u.disabled = EDH.pos<=0; if(r) r.disabled = EDH.pos>=EDH.pilha.length-1; }
function edDesfazer(){ if(EDH.pos<=0) return; EDH.pos--; aplicarSnap(JSON.parse(EDH.pilha[EDH.pos])); atualizarBotoesEd(); guardarRascunho(); }
function edRefazer(){ if(EDH.pos>=EDH.pilha.length-1) return; EDH.pos++; aplicarSnap(JSON.parse(EDH.pilha[EDH.pos])); atualizarBotoesEd(); guardarRascunho(); }
function editorAlterado(){ return !!EDH.recuperado || (EDH.pilha.length>1 && EDH.pos>0); }

/* desfazer/refazer global: salvar, mover etapa, excluir */
var HIST = {desfazer:[], refazer:[], ocupado:false};
function registrarHist(antes, depois, rotulo){ if(HIST.ocupado) return; HIST.desfazer.push({antes:antes?JSON.parse(JSON.stringify(antes)):null, depois:depois?JSON.parse(JSON.stringify(depois)):null, rotulo:rotulo||''}); if(HIST.desfazer.length>40) HIST.desfazer.shift(); HIST.refazer = []; atualizarBotoesHist(); }
function aplicarVersao(v, id){
  HIST.ocupado = true;
  var p = v ? salvarConteudo(JSON.parse(JSON.stringify(v))) : apagar('conteudos', id).then(function(){ S.conteudos = S.conteudos.filter(function(x){ return x.id!==id; }); });
  return p.then(function(){ HIST.ocupado = false; }, function(e){ HIST.ocupado = false; throw e; });
}
function desfazerGlobal(){ var h = HIST.desfazer.pop(); if(!h) return; if(h.lote){ aplicarLote(h.lote,'antes').then(function(){ HIST.refazer.push(h); atualizarBotoesHist(); toast('↶ Desfeito: '+h.rotulo); render(); }); return; } var id = (h.antes||h.depois).id; aplicarVersao(h.antes, id).then(function(){ HIST.refazer.push(h); atualizarBotoesHist(); toast('↶ Desfeito: '+h.rotulo); if(h.depois && !h.antes) tirarDaLixeira(id); render(); }); }
function refazerGlobal(){ var h = HIST.refazer.pop(); if(!h) return; if(h.lote){ aplicarLote(h.lote,'depois').then(function(){ HIST.desfazer.push(h); atualizarBotoesHist(); toast('↷ Refeito: '+h.rotulo); render(); }); return; } var id = (h.antes||h.depois).id; aplicarVersao(h.depois, id).then(function(){ HIST.desfazer.push(h); atualizarBotoesHist(); toast('↷ Refeito: '+h.rotulo); render(); }); }
function atualizarBotoesHist(){ var u=$('#btnDesfazer'), r=$('#btnRefazer'); if(u) u.disabled = !HIST.desfazer.length; if(r) r.disabled = !HIST.refazer.length; }
function toastAcao(msg, rot, fn){ var t = $('#toast'); toast(msg); if(!t) return; var b = document.createElement('button'); b.className='btn sm'; b.style.marginLeft='10px'; b.textContent=rot; b.onclick=function(){ fn(); t.classList.remove('on'); }; t.appendChild(b); }

/* lixeira: excluídos ficam 30 dias */
function lixeira(){ S.cfg.lixeira = (S.cfg.lixeira||[]).filter(function(x){ return Date.now()-x.em < 30*864e5; }); return S.cfg.lixeira; }
function paraLixeira(c){ lixeira().unshift({em:Date.now(), item:JSON.parse(JSON.stringify(c))}); return salvarCfg(); }
function tirarDaLixeira(id){ S.cfg.lixeira = lixeira().filter(function(x){ return x.item.id!==id; }); return salvarCfg(); }
function excluirConteudo(c){
  registrarHist(c, null, 'exclusão de "'+c.titulo+'"');
  return paraLixeira(c).then(function(){ return apagar('conteudos', c.id); }).then(function(){ S.conteudos = S.conteudos.filter(function(x){ return x.id!==c.id; }); });
}
function restaurarDaLixeira(id){ var e = lixeira().filter(function(x){ return x.item.id===id; })[0]; if(!e) return Promise.resolve(); registrarHist(null, e.item, 'restauração'); return salvarConteudo(e.item).then(function(){ return tirarDaLixeira(id); }); }
function telaLixeira(){
  var l = lixeira();
  abrirModal('<div class="mh"><h2>🗑️ Lixeira ('+l.length+')</h2><button class="btn sm ghost x" data-act="fechar">✕</button></div><p class="sub">Conteúdos excluídos ficam aqui por 30 dias. Toque em Restaurar para trazer de volta.</p><div class="list">'+
    (l.length ? l.map(function(x){ var c = x.item; return '<div class="it"><i class="dot" style="background:'+perfil(c.perfil).cor+'"></i><div class="grow"><div class="t">'+esc(c.titulo)+'</div><div class="m">'+esc(perfil(c.perfil).arroba)+' · excluído em '+new Date(x.em).toLocaleDateString('pt-BR')+'</div></div><button class="btn sm" data-restaurar="'+c.id+'">Restaurar</button></div>'; }).join('') : '<div class="empty">Lixeira vazia.</div>')+'</div>');
  $all('#modal [data-restaurar]').forEach(function(b){ b.onclick = function(){ restaurarDaLixeira(b.dataset.restaurar).then(function(){ toast('Restaurado ✔'); telaLixeira(); render(); }); }; });
}

function checarAtualizacao(){
  if(!/^https:/.test(location.protocol) || !window.fetch) return;
  fetch(location.href.split('#')[0].split('?')[0]+'?v='+Date.now(), {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){

  }).catch(function(){});
}

/* ================= Roteiros reformulados (texto completo pronto) ================= */
function ehEsboco(c){ var r = String(c.roteiro||'').trim(); return !r || /^V1\b/.test(r) || /^(Dois imóveis|Postar d|Imóveis manhã|Até 40 segundos|Vídeo de \d)/i.test(r) || contarPalavras(r) < 20; }
function reformDe(c){
  if(c.notionId && REFORM.R[c.notionId]) return REFORM.R[c.notionId];
  if(/imóveis manhã e tarde/i.test(c.titulo||'') || /dois imóveis/i.test(c.roteiro||'')) return REFORM.POST;
  return null;
}
function aplicarReformulados(lista){
  var mud = [];
  (lista||S.conteudos).forEach(function(c){
    var rf = reformDe(c); if(!rf || !ehEsboco(c)) return;
    var antigo = c.roteiro, legAuto = !String(c.legenda||'').trim() || (c.historico||[]).some(function(h){ return /montadas automaticamente/.test(h.txt); });
    if(antigo) registrar(c, 'Esboço original guardado: '+antigo);
    var tv = (String(antigo||'').match(/V1\s+([^.]+)/)||[])[1]; if(tv && !String(c.tema||'').trim()) c.tema = tv.trim();
    c.roteiro = rf.r; if(!String(c.gancho||'').trim()) c.gancho = rf.g;
    if(legAuto) c.legenda = montarDescricao(c);
    registrar(c, 'Texto completo reformulado pelo assistente (revise antes de gravar)'); mud.push(c);
  });
  return gravar('conteudos', mud).then(function(){ return mud.length; });
}

  });
