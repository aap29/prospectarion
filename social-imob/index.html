or e do imóvel, débitos de IPTU e condomínio.\n\nBLOCO 3 — REGULARIDADE DA CONSTRUÇÃO (4:00–5:30): área construída averbada, habite-se e por que isso afeta o financiamento.\n\nBLOCO 4 — AVALIAÇÃO DO BANCO (5:30–7:00): quem faz, o que é verificado e o que acontece se o valor vier abaixo do preço.\n\nBLOCO 5 — CHECKLIST FINAL (7:00–8:15): os pontos que eu confiro antes de qualquer cliente assinar.\n\nENCERRAMENTO (8:15–9:00): Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente IMÓVEL que eu te ajudo a verificar a documentação."},"86":{"g":"Financiamento ou consórcio: como escolher o caminho certo.","r":"ABERTURA (0:00–0:40): Financiamento ou consórcio? Essa é uma das perguntas que eu mais recebo. Neste vídeo eu comparo os dois de forma honesta para você decidir com segurança.\n\nBLOCO 1 — COMO FUNCIONA O FINANCIAMENTO (0:40–2:30): imóvel agora, juros, prazo, entrada e análise de crédito.\n\nBLOCO 2 — COMO FUNCIONA O CONSÓRCIO (2:30–4:30): grupo, taxa de administração, sorteio, lance e reajuste. Sem juros, mas sem data garantida.\n\nBLOCO 3 — CUSTO TOTAL (4:30–6:00): como comparar os dois no mesmo prazo, somando todos os custos.\n\nBLOCO 4 — A PERGUNTA DECISIVA: URGÊNCIA (6:00–7:30): quando cada um faz mais sentido, com exemplos de perfis.\n\nBLOCO 5 — ESTRATÉGIAS COMBINADAS (7:30–8:30): quando o consórcio complementa o planejamento de quem já financiou.\n\nENCERRAMENTO (8:30–9:15): Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente ESTRATÉGIA que eu comparo os dois para a sua realidade."},"98":{"g":"Morar ou investir: como escolher o imóvel certo para cada objetivo.","r":"ABERTURA (0:00–0:40): Comprar para morar e comprar para investir são decisões diferentes, e misturar os critérios é o erro mais comum. Neste vídeo eu mostro como avaliar cada caso.\n\nBLOCO 1 — PARA MORAR (0:40–2:30): rotina, deslocamento, escola, segurança, tamanho da família e parcela sustentável.\n\nBLOCO 2 — PARA INVESTIR (2:30–4:30): demanda de aluguel, rentabilidade, valorização da região e custos de manutenção.\n\nBLOCO 3 — LIQUIDEZ (4:30–6:00): por que a facilidade de vender importa e como avaliar.\n\nBLOCO 4 — ERROS COMUNS (6:00–7:30): comprar pela emoção, ignorar condomínio e IPTU, e não calcular a vacância.\n\nBLOCO 5 — COMO DECIDIR (7:30–8:30): perguntas que definem o seu objetivo antes da busca.\n\nENCERRAMENTO (8:30–9:15): Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente INVESTIMENTO que eu analiso o seu objetivo."},"127":{"g":"Repara como o ambiente muda quando o sax começa a tocar.","r":"Repara como o ambiente muda quando o sax começa a tocar. [Mostrar a performance e o público reagindo.] Música ao vivo transforma um jantar comum em experiência, aumenta o tempo das pessoas na casa e faz o cliente voltar. Seja um café, um pub, um restaurante ou um evento, o sax cria o clima certo. Eu sou o Kenny Sax29, saxofone ao vivo para eventos, bares e celebrações. Casas, cafés, pubs e produtores: envie EVENTO no WhatsApp para consultar formatos e datas."},"128":{"g":"Como o saxofone cria experiência em casas e eventos.","r":"ABERTURA (0:00–0:40): Por que tantas casas e eventos estão investindo em música ao vivo? Neste vídeo eu mostro como o saxofone transforma ambientes, com exemplos reais das minhas apresentações.\n\nBLOCO 1 — O EFEITO DA MÚSICA AO VIVO (0:40–2:00): clima, permanência dos clientes e lembrança da marca.\n\nBLOCO 2 — FORMATOS (2:00–3:30): solo com base, duo, participação em eventos e intervenções especiais.\n\nBLOCO 3 — PARA CADA AMBIENTE (3:30–5:00): café, bar, restaurante, casamento, evento corporativo.\n\nBLOCO 4 — BASTIDORES (5:00–6:30): estrutura de som, montagem e cuidado com o volume.\n\nENCERRAMENTO (6:30–7:30): Eu sou o Kenny Sax29, saxofone ao vivo para eventos, bares e celebrações. Gestores e produtores: envie EVENTO no WhatsApp para receber uma proposta de formato musical."},"129":{"g":"Três climas, um saxofone. Qual combina com o seu evento?","r":"Três climas, um saxofone. [Trecho 1: jazz suave.] Para jantar e recepção, algo leve. [Trecho 2: pop instrumental.] Para animar sem atrapalhar a conversa, os sucessos que todo mundo conhece. [Trecho 3: ritmo dançante.] Para levantar a pista, energia total. O repertório certo faz o público sentir que a música foi feita para aquele momento. Eu sou o Kenny Sax29, saxofone ao vivo para eventos, bares e celebrações. Envie REPERTÓRIO no WhatsApp e diga o tipo do seu evento."},"130":{"g":"Repertório e volume: o segredo de um evento com música agradável.","r":"ABERTURA (0:00–0:40): Música alta demais atrapalha a conversa; baixa demais ninguém percebe. Neste vídeo eu mostro como escolher repertório e volume para o seu evento.\n\nBLOCO 1 — CONHECER O PÚBLICO (0:40–2:00): idade, estilo do evento e momento de cada parte da programação.\n\nBLOCO 2 — REPERTÓRIO POR MOMENTO (2:00–4:00): recepção, jantar, homenagens e pista.\n\nBLOCO 3 — VOLUME E POSICIONAMENTO (4:00–5:30): onde o músico fica e como ajustar o som ao ambiente.\n\nBLOCO 4 — PEDIDOS ESPECIAIS (5:30–6:30): músicas marcantes do casal ou da empresa.\n\nENCERRAMENTO (6:30–7:15): Eu sou o Kenny Sax29, saxofone ao vivo para eventos, bares e celebrações. Envie REPERTÓRIO no WhatsApp com local, público e horário."},"131":{"g":"Contratar sax ao vivo é mais simples do que você imagina.","r":"Contratar sax ao vivo é mais simples do que você imagina. Você me envia a data, a cidade, o local, a ocasião e o horário. Eu te retorno com o formato ideal, o repertório sugerido e a proposta. Levo a estrutura de som necessária e chego com antecedência para montar tudo. Sem complicação. Eu sou o Kenny Sax29, saxofone ao vivo para eventos, bares e celebrações. Envie DATA no WhatsApp com cidade, local, ocasião e horário."},"132":{"g":"Como contratar sax ao vivo sem dúvidas.","r":"ABERTURA (0:00–0:40): Vai contratar música ao vivo e tem dúvidas? Neste vídeo eu respondo as perguntas que mais recebo.\n\nBLOCO 1 — INFORMAÇÕES PARA O ORÇAMENTO (0:40–2:00): data, cidade, local, ocasião, horário e duração.\n\nBLOCO 2 — ESTRUTURA (2:00–3:30): som, energia, espaço e o que o local precisa oferecer.\n\nBLOCO 3 — REPERTÓRIO (3:30–4:30): como escolhemos juntos e como funcionam os pedidos.\n\nBLOCO 4 — DIA DO EVENTO (4:30–5:30): chegada, montagem, passagem de som e pausas.\n\nENCERRAMENTO (5:30–6:15): Eu sou o Kenny Sax29, saxofone ao vivo para eventos, bares e celebrações. Envie DATA no WhatsApp para consultar disponibilidade e proposta."},"1":{"g":"Vinte minutos no domingo podem mudar a sua semana financeira.","r":"ABERTURA (0:00–0:40): Vinte minutos no domingo podem mudar a sua semana financeira. Neste vídeo eu mostro o roteiro que eu uso para planejar a semana: saldo, compromissos, metas e patrimônio.\n\nBLOCO 1 — SALDO E COMPROMISSOS (0:40–2:30): confira o saldo das contas, as faturas e tudo o que vence nos próximos sete dias.\n\nBLOCO 2 — FIXAS E VARIÁVEIS (2:30–4:00): separe o que é fixo do que é variável e defina um teto para os gastos variáveis da semana.\n\nBLOCO 3 — META DE RENDA (4:00–5:30): defina uma meta concreta: quantos contatos, propostas ou vendas você precisa fazer nesta semana.\n\nBLOCO 4 — PATRIMÔNIO PRIMEIRO (5:30–7:00): reserve um valor para patrimônio antes de gastar: reserva de emergência, investimento ou parcela do seu plano.\n\nBLOCO 5 — UMA AÇÃO FINANCEIRA (7:00–8:30): escolha uma única ação para a semana, como renegociar uma dívida ou cancelar um gasto que não faz sentido.\n\nENCERRAMENTO (8:30–9:15): baixe o modelo, faça o seu planejamento e me conte nos comentários qual foi a sua ação da semana. Eu sou Anderson Alves, consultor de investimentos e consórcios. Inscreva-se no canal."},"2":{"g":"Faturamento alto não é sinônimo de dinheiro no caixa.","r":"Faturamento alto não é sinônimo de dinheiro no caixa. Tem empresa que vende todo mês e mesmo assim vive apertada. Normalmente, o problema está em três vazamentos. Primeiro: você recebe dos clientes depois de pagar os fornecedores. Segundo: retirada dos sócios sem controle. Terceiro: estoque parado, que é dinheiro preso na prateleira. Arrumar esses três pontos libera caixa para crescer com planejamento. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CAIXA e eu te mando o checklist de diagnóstico da sua empresa."},"3":{"g":"7 mitos sobre consórcio que confundem iniciantes.","r":"CARTÃO 1: 7 mitos sobre consórcio que confundem iniciantes.\nCARTÃO 2: Mito 1 — Consórcio é financiamento. Não é: no consórcio não há juros; há taxa de administração.\nCARTÃO 3: Mito 2 — Tem juros bancários. Não tem. Os custos estão no contrato: taxa de administração, fundo de reserva e seguro, quando houver.\nCARTÃO 4: Mito 3 — A contemplação é imediata. Não é: acontece por sorteio ou lance, sem data garantida.\nCARTÃO 5: Mito 4 — Lance garante a contemplação. Não garante: vence o maior lance da assembleia, conforme as regras do grupo.\nCARTÃO 6: Mito 5 — Só serve para carro. Existe consórcio de imóveis, veículos, serviços e equipamentos.\nCARTÃO 7: Mito 6 — Não serve para investir. Pode ser ferramenta de patrimônio quando há planejamento e prazo.\nCARTÃO 8: Mito 7 — Qualquer parcela cabe no orçamento. A parcela certa é a que você paga mesmo num mês difícil.\nCARTÃO FINAL: Antes de entrar, leia o contrato e as condições do grupo. Comente qual mito você já acreditou."},"4":{"g":"Você sabe quanto realmente sobra no fim do mês?","r":"STORY 1: Você sabe quanto realmente sobra no fim do mês?\nSTORY 2 (enquete): Você anota tudo o que entra e sai? Sim / Não.\nSTORY 3: Três números que você precisa conhecer: 1) quanto entra; 2) quanto sai; 3) quanto já está comprometido nos próximos meses (parcelas e faturas).\nSTORY 4: Com esses três números na mão, dá para planejar patrimônio de verdade. Quer ajuda para montar o seu raio-x? Envie DIAGNÓSTICO no direct ou no WhatsApp (51) 98416-8848."},"5":{"g":"Comprar imóvel para morar ou para investir? Os critérios mudam.","r":"Comprar imóvel para morar ou para investir? Os critérios mudam completamente. Para morar, pesa a localização, a sua rotina, o conforto da família e uma parcela que caiba no orçamento sem sufoco. Para investir, o que importa é liquidez, demanda da região, valor de aluguel, potencial de valorização e facilidade de vender depois. O melhor imóvel não é o mais bonito: é o que combina com o seu objetivo. A emoção escolhe; a análise confirma. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Envie MORAR ou INVESTIR no direct e eu faço uma análise inicial para você."},"6":{"g":"A estratégia que parece lenta pode evitar anos de prejuízo.","r":"A estratégia que parece lenta pode evitar anos de prejuízo. Uma pessoa me procurou depois de fechar um negócio escolhendo só pela parcela. Parecia ótimo no primeiro mês. Depois vieram os custos que ela não tinha calculado e um prazo muito maior do que imaginava. Ela não errou por falta de vontade, errou por pressa. Velocidade sem direção é só pressa cara. Antes de uma grande decisão financeira, pare, compare o custo total e o prazo, e só então assine. Eu sou Anderson Alves, consultor de investimentos e consórcios. Compartilhe este vídeo com alguém que está prestes a tomar uma decisão importante."},"7":{"g":"Consórcio não começa pela parcela.","r":"CARTÃO 1: Consórcio não começa pela parcela.\nCARTÃO 2: Começa pelo objetivo: o que você quer comprar e para quê?\nCARTÃO 3: Depois, o prazo: em quanto tempo você precisa do bem?\nCARTÃO 4: Capacidade de pagamento: qual parcela você paga com folga, mesmo num mês difícil?\nCARTÃO 5: Estratégia de contemplação: você vai contar com sorteio ou terá recurso para lance?\nCARTÃO 6: Reserva para custos: documentação, impostos e imprevistos.\nCARTÃO 7: Só então vem a proposta. Planejamento antes da assinatura.\nCARTÃO FINAL: Salve este post e envie para alguém que está pensando em comprar um bem. Consultoria: Anderson Alves · HS Consórcios."},"8":{"g":"Cinco perguntas rápidas sobre o seu dinheiro.","r":"STORY 1 (enquete): Você tem reserva de emergência? Sim / Ainda não.\nSTORY 2 (enquete): Você tem alguma dívida com juros altos, como cartão ou cheque especial? Sim / Não.\nSTORY 3 (enquete): Você já investe com um objetivo definido? Sim / Ainda não.\nSTORY 4 (enquete): Você pretende comprar um imóvel nos próximos 3 anos? Sim / Não.\nSTORY 5 (enquete): Você tem vontade de empreender ou ampliar o seu negócio? Sim / Não.\nSTORY 6: Amanhã eu respondo os temas mais votados. Deixe também a sua dúvida na caixinha."},"9":{"g":"Hoje a sua renda constrói patrimônio ou só paga contas?","r":"STORY 1: Bom dia! Bastidor de hoje: preparando análises de clientes.\nSTORY 2 (enquete): Hoje a sua renda constrói patrimônio ou só paga contas? Constrói / Só paga contas.\nSTORY 3: Se a resposta foi \"só paga contas\", você não está sozinho. O primeiro passo é separar um valor fixo para patrimônio assim que o dinheiro entra, antes dos gastos.\nSTORY 4 (caixa de perguntas): Qual é a sua maior dúvida sobre investimentos ou consórcio? Eu respondo aqui."},"10":{"g":"5 sinais de um imóvel com potencial.","r":"CARTÃO 1: 5 sinais de um imóvel com potencial.\nCARTÃO 2: 1) Localização com demanda: perto de transporte, comércio, escolas e serviços.\nCARTÃO 3: 2) Documentação regular: matrícula atualizada e sem pendências.\nCARTÃO 4: 3) Condomínio compatível com o padrão e com o que oferece.\nCARTÃO 5: 4) Planta funcional: ambientes bem aproveitados valem mais do que metros a mais.\nCARTÃO 6: 5) Potencial de valorização: região com obras, novos serviços e procura crescente.\nCARTÃO FINAL: Uma boa análise une o olhar financeiro e o imobiliário. Salve para usar na próxima visita e compartilhe com quem está procurando imóvel."},"11":{"g":"Trabalhar muito não garante patrimônio.","r":"Trabalhar muito não garante patrimônio. Tem gente que ganha bem e, no fim do ano, não tem nada no nome. A diferença está entre renda, consumo e construção de patrimônio. Renda é o que entra. Consumo é o que sai sem voltar. Patrimônio é o que fica e cresce com o tempo. O consórcio pode ser uma das ferramentas para isso, não uma solução mágica: funciona quando existe objetivo, prazo e parcela que cabe no orçamento. O primeiro investimento não é financeiro, é uma decisão. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PATRIMÔNIO e eu preparo uma simulação gratuita para você."},"12":{"g":"Mito ou verdade sobre consórcio: responda nos stories.","r":"STORY 1 (quiz): Consórcio tem juros? Mito / Verdade. Resposta: mito. Tem taxa de administração.\nSTORY 2 (quiz): A contemplação tem data garantida? Mito / Verdade. Resposta: mito. É por sorteio ou lance.\nSTORY 3 (quiz): O lance é obrigatório? Mito / Verdade. Resposta: mito. Você pode esperar o sorteio.\nSTORY 4 (quiz): Posso usar o consórcio para comprar imóvel? Mito / Verdade. Resposta: verdade, conforme o contrato.\nSTORY 5 (quiz): Empresário pode usar consórcio para expandir o negócio? Mito / Verdade. Resposta: verdade.\nSTORY 6: Quer uma análise personalizada? Me chama no direct."},"13":{"g":"Bastidores: um dia de reuniões e aprendizados.","r":"STORY 1: Chegando no escritório para mais um dia de atendimentos.\nSTORY 2: Aprendizado de hoje: quem chega com o objetivo claro decide muito mais rápido e com mais segurança.\nSTORY 3: Rotina de atendimento: análise, simulação e conversa franca sobre prazos e custos. Sem expor dados de clientes, sempre.\nSTORY 4 (enquete): Qual tema você quer ver na próxima semana? Imóveis / Consórcio / Finanças / Negócios."},"14":{"g":"Revisão da semana e planejamento da próxima.","r":"STORY 1 (caixa): O que funcionou para você nesta semana?\nSTORY 2 (enquete): Qual conteúdo mais ajudou você? Imóveis / Consórcio / Finanças pessoais.\nSTORY 3: Minha meta para a próxima semana: ajudar mais famílias a planejar a compra do imóvel com segurança.\nSTORY 4: Na segunda começa uma nova série sobre patrimônio, negócios e imóveis. Ative as notificações e compartilhe a sua meta financeira da semana."},"112":{"g":"Seu concorrente aparece no Google Maps e você não. Eu te mostro por quê.","r":"Seu concorrente aparece no Google Maps e você não. Eu te mostro por quê. Na maioria das vezes, o problema é um perfil do Google Meu Negócio incompleto: categoria errada, sem fotos reais, sem horário atualizado e sem avaliações recentes. Para quem procura um serviço perto de casa, isso significa que a sua empresa simplesmente não existe. A boa notícia é que dá para corrigir. Eu sou Anderson Alves, da Marca & Estratégia. Comente GOOGLE que eu faço um diagnóstico gratuito do seu perfil."},"115":{"g":"Empresa que não aparece na internet perde cliente todos os dias.","r":"Empresa que não aparece na internet perde cliente todos os dias, e o dono nem percebe. O ciclo é silencioso: sem presença digital, menos pessoas encontram você; com menos contatos, a receita cai; com a receita caindo, sobra menos para investir no negócio. Quebrar esse ciclo começa pelo básico: perfil do Google completo, Instagram ativo e um jeito fácil de o cliente chamar no WhatsApp. Eu sou Anderson Alves, da Marca & Estratégia. Salve este vídeo e mande para um dono de negócio que precisa ver isso."},"116":{"g":"Veja o que muda quando um perfil do Google é configurado do jeito certo.","r":"Veja o que muda quando um perfil do Google é configurado do jeito certo. Antes: nome sem padrão, categoria genérica, sem fotos e sem horário. Depois: categoria certa, descrição com as palavras que o cliente procura, fotos reais, horário atualizado, produtos e serviços cadastrados e botão para ligar ou chamar no WhatsApp. Um perfil completo passa confiança e facilita a vida de quem quer comprar de você. Eu sou Anderson Alves, da Marca & Estratégia. Me chama no WhatsApp (51) 98416-8848 e eu faço o diagnóstico do seu negócio."}},"SPLIT":{"21":[{"t":"Nome negativado: dá para comprar imóvel?","g":"Nome negativado não significa fim do sonho da casa própria.","r":"Tá com o nome negativado e acha que nunca vai conseguir comprar um imóvel? Calma. Hoje, com restrição no CPF, o banco não aprova o financiamento. Mas isso não é o fim: é o ponto de partida. Primeiro, descubra exatamente quais dívidas estão no seu nome. Depois, negocie e organize. Enquanto isso, a gente já pode montar o seu plano de compra para quando o nome estiver limpo. Comente NOME que eu te explico o primeiro passo.","cta":"Comente NOME"},{"t":"Limpar o nome não garante aprovação","g":"Atenção: limpar o nome não garante a aprovação do financiamento.","r":"Atenção: limpar o nome não garante a aprovação do financiamento. O banco também olha renda comprovada, quanto da renda já está comprometida, histórico de pagamentos e idade. Muita gente quita a dívida, corre para o banco e recebe um não. O certo é regularizar, organizar a renda e só então fazer a análise de crédito. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ANÁLISE e eu te ajudo a fazer isso na ordem certa.","cta":"Comente ANÁLISE"}],"27":[{"t":"A pasta do comprador antes da primeira visita","g":"Antes de visitar qualquer imóvel, monte a sua pasta do comprador.","r":"Quer comprar o primeiro imóvel? Antes da primeira visita, monte a pasta do comprador: documento com foto, CPF, comprovante de estado civil, comprovante de residência, comprovantes de renda dos últimos meses e, se tiver, extrato do FGTS e declaração de imposto de renda. Com essa pasta pronta, a análise anda muito mais rápido e você não perde o imóvel certo por falta de papel. Comente DOCUMENTOS que eu te mando a lista completa.","cta":"Comente DOCUMENTOS"},{"t":"Documento entregue não é crédito aprovado","g":"Mas cuidado: ter todos os documentos não significa ter crédito aprovado.","r":"Mas cuidado: ter todos os documentos não significa ter crédito aprovado. Documento é o que permite a análise começar. A aprovação depende de renda, comprometimento mensal, histórico de crédito e da avaliação do imóvel. Por isso eu sempre recomendo: documentos organizados e simulação feita antes de se apaixonar pelo imóvel. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CRÉDITO para começar a sua análise.","cta":"Comente CRÉDITO"}],"28":[{"t":"Autônomo pode financiar imóvel?","g":"Autônomo também pode financiar imóvel. Mas tem um detalhe.","r":"Você é autônomo, MEI ou trabalha por conta e acha que banco não financia imóvel para você? Financia sim. O que muda é a forma de comprovar a renda: extratos bancários, declaração de imposto de renda, pró-labore ou faturamento do MEI. Quanto mais organizada estiver essa movimentação, melhor a análise. Comente AUTÔNOMO que eu te digo quais comprovantes funcionam no seu caso.","cta":"Comente AUTÔNOMO"},{"t":"Autônomo: organize a renda antes de procurar","g":"O erro mais comum do autônomo é procurar imóvel antes de organizar a renda.","r":"O erro mais comum do autônomo é procurar imóvel antes de organizar a renda. Dinheiro que entra em várias contas, sem declaração, não aparece para o banco. Então o primeiro passo é concentrar a movimentação, declarar o que você ganha e manter isso por alguns meses. Aí sim a simulação mostra o seu potencial real. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ORGANIZAR e eu te mostro o caminho.","cta":"Comente ORGANIZAR"}],"29":[{"t":"Como usar o FGTS na compra do imóvel","g":"Seu FGTS pode virar parte da entrada do seu imóvel.","r":"Sabia que o FGTS pode ser usado na compra do imóvel? Ele pode entrar como parte da entrada, para amortizar ou até quitar o saldo, desde que você e o imóvel cumpram as regras: tempo de trabalho com carteira, não ter outro imóvel na mesma cidade e imóvel residencial dentro do sistema de habitação. Antes de contar com esse dinheiro, confira o saldo e as condições. Comente FGTS que eu te ajudo a verificar.","cta":"Comente FGTS"},{"t":"O FGTS não resolve todos os custos","g":"Mas o FGTS não resolve tudo.","r":"Mas o FGTS não resolve tudo. Ele ajuda na entrada, mas você ainda vai ter custos de documentação, ITBI, registro e mudança. E a parcela precisa caber na sua renda todo mês. Quem usa o FGTS e esquece o resto acaba apertado depois da compra. Planejamento completo é o que garante a tranquilidade. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PLANEJAR para montarmos o seu.","cta":"Comente PLANEJAR"}],"30":[{"t":"Antes de procurar imóvel, faça isto","g":"Pare de procurar imóvel antes de fazer isso.","r":"Antes de abrir o primeiro anúncio, responda três perguntas: quanto você pode pagar por mês sem apertar, quanto tem para entrada e custos, e em qual região faz sentido morar. Essas respostas definem a sua faixa de compra real. Sem elas, você perde tempo visitando imóveis que não cabem no seu bolso. Comente CASA e eu faço essa análise com você.","cta":"Comente CASA"},{"t":"O erro mais caro do primeiro comprador","g":"O erro mais caro do primeiro comprador é se apaixonar pelo imóvel antes de saber se consegue comprá-lo.","r":"O erro mais caro do primeiro comprador é se apaixonar pelo imóvel antes de saber se consegue comprá-lo. Depois da visita, vem a frustração com o crédito ou uma parcela que sufoca o orçamento. Inverta a ordem: primeiro a análise, depois a busca. Você economiza tempo e compra com segurança. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ANÁLISE para começar pelo lugar certo.","cta":"Comente ANÁLISE"}],"31":[{"t":"Subsídio não é financiamento","g":"Subsídio não é financiamento. Entenda a diferença.","r":"Muita gente confunde: subsídio não é o financiamento. Subsídio é um desconto que o governo pode dar em programas habitacionais para famílias que se enquadram nas regras de renda e localização. Financiamento é o crédito que você paga em parcelas. Os dois podem andar juntos, mas são coisas diferentes. Comente SUBSÍDIO que eu explico se o seu perfil pode ter direito.","cta":"Comente SUBSÍDIO"},{"t":"Cuidado com a promessa de subsídio máximo","g":"E cuidado com quem promete o subsídio máximo.","r":"E cuidado com quem promete o subsídio máximo. O valor depende da renda familiar, da cidade, do imóvel e das regras do programa naquele momento. Só a análise oficial mostra quanto você realmente recebe. Desconfie de promessa de valor antes de qualquer simulação. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente ANÁLISE e eu faço a sua simulação com seriedade.","cta":"Comente ANÁLISE"}],"32":[{"t":"Quanto a sua renda consegue comprar?","g":"Quanto a sua renda consegue comprar? Faça essa conta.","r":"Quanto de imóvel a sua renda compra? De forma geral, o banco aceita que a parcela comprometa só uma parte da renda familiar, em torno de trinta por cento. A partir disso, entra a entrada, o prazo e a taxa. Duas famílias com a mesma renda podem ter resultados diferentes. Por isso, a simulação é individual. Comente RENDA que eu te ajudo a calcular a sua faixa.","cta":"Comente RENDA"},{"t":"Capacidade de compra vem antes do imóvel","g":"Capacidade de compra vem antes da escolha do imóvel.","r":"Capacidade de compra vem antes da escolha do imóvel. Quando você sabe a sua faixa, a busca fica objetiva, a negociação fica mais forte e você não perde tempo com imóveis fora da realidade. Primeiro o número, depois o endereço. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente SIMULAÇÃO e eu faço a sua.","cta":"Comente SIMULAÇÃO"}],"38":[{"t":"Minha Casa Minha Vida sem complicação","g":"Minha Casa Minha Vida em linguagem simples.","r":"Minha Casa Minha Vida, sem complicação: é um programa do governo que facilita a compra do imóvel para famílias dentro de faixas de renda, com juros menores e, em alguns casos, subsídio. Cada faixa tem regras próprias, e o imóvel também precisa se enquadrar. Comente MCMV que eu te digo em qual faixa você pode estar.","cta":"Comente MCMV"},{"t":"Não compare o seu benefício com o do vizinho","g":"Uma dica importante: não compare o seu benefício com o do vizinho.","r":"Uma dica importante: não compare o seu benefício com o do vizinho. O valor do subsídio e a taxa mudam conforme renda, cidade, composição familiar e regras do momento. O que o seu colega recebeu pode não valer para você. A análise individual é o único caminho seguro. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente MINHA CASA para fazermos a sua.","cta":"Comente MINHA CASA"}],"42":[{"t":"Quanto de entrada você precisa?","g":"Quanto você precisa de entrada para comprar um imóvel?","r":"Quanto de entrada você precisa? No financiamento tradicional, o banco costuma financiar uma parte do valor do imóvel, e o restante é a sua entrada. Em programas habitacionais, essa entrada pode ser menor. Além dela, separe o dinheiro de ITBI, escritura e registro. Comente ENTRADA que eu te mostro a conta para o seu caso.","cta":"Comente ENTRADA"},{"t":"Não use toda a reserva na entrada","g":"Agora, um conselho que pouca gente dá: não use toda a sua reserva na entrada.","r":"Agora, um conselho que pouca gente dá: não use toda a sua reserva na entrada. Depois da compra vêm custos, mudança e imprevistos. Quem zera a conta para dar entrada maior fica sem fôlego no primeiro problema. Equilíbrio entre entrada e reserva é o que dá segurança. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente RESERVA e eu te ajudo a equilibrar.","cta":"Comente RESERVA"}],"43":[{"t":"Composição de renda: somar para comprar","g":"Somar a renda com outra pessoa pode aumentar o seu poder de compra.","r":"Sabia que dá para somar a renda com outra pessoa para financiar? Cônjuge, companheiro, pais ou irmãos podem compor a renda, conforme as regras de cada banco. Isso aumenta o valor que pode ser financiado. Mas todos que compõem a renda entram no contrato e na análise. Comente COMPOSIÇÃO que eu explico como funciona.","cta":"Comente COMPOSIÇÃO"},{"t":"Mais renda não garante aprovação","g":"Só que mais renda não garante aprovação.","r":"Só que mais renda não garante aprovação. Se a pessoa que vai compor tem nome restrito ou muita dívida, ela pode atrapalhar em vez de ajudar. Antes de somar, analise o perfil de crédito de cada um. A composição certa faz a diferença. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente RENDA para analisarmos juntos.","cta":"Comente RENDA"}],"45":[{"t":"Imóvel na planta: oportunidade ou risco?","g":"Imóvel na planta: oportunidade ou risco?","r":"Comprar na planta pode ser uma ótima oportunidade: preço de lançamento, entrada parcelada durante a obra e potencial de valorização na entrega. Mas exige atenção à construtora, ao prazo de entrega e às correções das parcelas durante a obra. Comente PLANTA que eu te passo o checklist do comprador na planta.","cta":"Comente PLANTA"},{"t":"Decorado x contrato: o que vale de verdade","g":"E lembre: o decorado é o sonho, o contrato é a realidade.","r":"E lembre: o decorado é o sonho, o contrato é a realidade. O apartamento decorado usa móveis sob medida e às vezes itens que não vêm com a unidade. O que vale é o memorial descritivo e o contrato: metragem, acabamento, vaga e prazo. Leia antes de assinar. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CONTRATO que eu te ajudo a revisar.","cta":"Comente CONTRATO"}],"47":[{"t":"Os custos além da entrada","g":"A entrada não é o único dinheiro que você precisa.","r":"Achou que bastava a entrada? Na compra do imóvel ainda tem ITBI, escritura ou contrato do banco, registro em cartório, avaliação do imóvel e, às vezes, taxas da negociação. Esses custos podem pesar se você não planejar. Comente CUSTOS que eu te passo a lista completa.","cta":"Comente CUSTOS"},{"t":"As três caixas da compra do imóvel","g":"Uma forma simples de se organizar é pensar em três caixas: a caixa da entrada, a caixa dos custos da compra e a caixa da reserva para depois da mudança.","r":"Uma forma simples de se organizar é pensar em três caixas: a caixa da entrada, a caixa dos custos da compra e a caixa da reserva para depois da mudança. Com as três separadas, você compra sem susto e sem dívida extra. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PLANEJAR para montarmos as suas três caixas.","cta":"Comente PLANEJAR"}],"51":[{"t":"Imóvel novo ou usado?","g":"Imóvel novo ou usado: qual compensa mais?","r":"Novo ou usado? O imóvel novo traz acabamento atual, menos manutenção e às vezes condições de construtora. O usado costuma ter metragem maior, localização consolidada e espaço para negociar preço. Não existe resposta única: depende do seu objetivo. Comente NOVO ou USADO que eu te ajudo a decidir.","cta":"Comente NOVO"},{"t":"Preço x custo total do imóvel","g":"E olhe o custo total, não só o preço.","r":"E olhe o custo total, não só o preço. Um usado mais barato pode precisar de reforma. Um novo pode ter condomínio mais alto. Some preço, reforma, condomínio, IPTU e custos da compra antes de decidir. É assim que você compara de verdade. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CUSTO TOTAL e eu faço essa conta com você.","cta":"Comente USADO"}],"52":[{"t":"O banco também avalia o imóvel","g":"O banco também avalia o imóvel, não só você.","r":"Pouca gente sabe: no financiamento, o banco avalia o imóvel. Um engenheiro ou avaliador confere estado, documentação e valor de mercado. Se a avaliação vier abaixo do preço combinado, o banco financia sobre o valor avaliado, e você precisa cobrir a diferença. Comente AVALIAÇÃO que eu te explico como se preparar.","cta":"Comente AVALIAÇÃO"},{"t":"Crédito aprovado e imóvel com problema","g":"Já vi comprador com crédito aprovado perder o negócio porque o imóvel tinha problema: documentação irregular, área não averbada ou pendência no condomínio.","r":"Já vi comprador com crédito aprovado perder o negócio porque o imóvel tinha problema: documentação irregular, área não averbada ou pendência no condomínio. Por isso, antes de fechar, a análise do imóvel é tão importante quanto a sua. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente IMÓVEL e eu te ajudo a verificar.","cta":"Comente IMÓVEL"}],"56":[{"t":"Simulação não é aprovação","g":"Simulação aprovada não é crédito aprovado.","r":"Fez a simulação no site do banco e já se viu com a chave na mão? Calma. A simulação é uma estimativa com os números que você digitou. A aprovação real vem depois da análise de documentos, renda e histórico de crédito. Os valores podem mudar. Comente SIMULAÇÃO que eu te explico a diferença na prática.","cta":"Comente SIMULAÇÃO"},{"t":"A sua capacidade real de compra","g":"O que vale é a sua capacidade real: renda que você consegue comprovar, dívidas que já tem e quanto sobra no fim do mês.","r":"O que vale é a sua capacidade real: renda que você consegue comprovar, dívidas que já tem e quanto sobra no fim do mês. Fazer a análise completa antes de assumir compromissos evita frustração e protege o seu orçamento. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CAPACIDADE para fazermos a sua análise real.","cta":"Comente CAPACIDADE"}],"57":[{"t":"Comprar para morar ou para investir?","g":"Comprar para morar ou para investir? As regras mudam.","r":"Comprar para morar e comprar para investir são decisões diferentes. Para morar, pesa rotina, escola, trabalho e conforto. Para investir, pesa demanda de aluguel, valorização da região e facilidade de vender depois. Misturar os critérios é o erro mais comum. Comente MORAR ou INVESTIR que eu te ajudo a definir.","cta":"Comente INVESTIR"},{"t":"Liquidez: o imóvel que tem saída","g":"Se o objetivo é investir, pense em liquidez: quanto tempo você levaria para vender esse imóvel se precisasse do dinheiro?","r":"Se o objetivo é investir, pense em liquidez: quanto tempo você levaria para vender esse imóvel se precisasse do dinheiro? Imóvel bonito em região sem procura pode ficar parado. Bom investimento é aquele que tem saída. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente LIQUIDEZ e eu te mostro como avaliar.","cta":"Comente MORAR"}],"58":[{"t":"Matrícula: o documento mais importante","g":"O documento mais importante do imóvel é a matrícula.","r":"Antes de comprar, peça a matrícula atualizada do imóvel. É nela que está a história completa: quem é o dono, se existe hipoteca, penhora, usufruto ou qualquer pendência. Comprar sem ler a matrícula é comprar no escuro. Comente MATRÍCULA que eu te mostro o que conferir.","cta":"Comente MATRÍCULA"},{"t":"Você não compra só paredes","g":"Você não compra só paredes, compra um documento.","r":"Você não compra só paredes, compra um documento. A casa pode ser linda, mas se a documentação não estiver regular, o banco não financia e você pode ter problema para registrar. Imóvel bom é imóvel bonito e regularizado. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente DOCUMENTO e eu te ajudo a verificar antes de fechar.","cta":"Comente DOCUMENTO"}],"62":[{"t":"Médio padrão: o imóvel que mais gira","g":"Imóvel de médio padrão pode ser o melhor negócio da região.","r":"O imóvel de médio padrão é o que mais gira no mercado: atende famílias que estão crescendo, quem quer sair do aluguel e investidores. Por isso costuma ter boa procura tanto para morar quanto para alugar. Comente MÉDIO PADRÃO que eu te mostro as oportunidades da região.","cta":"Comente MÉDIO"},{"t":"Pense na revenda antes de comprar","g":"Na hora de escolher, pense na revenda: localização perto de serviços, transporte e escolas, planta funcional e condomínio equilibrado.","r":"Na hora de escolher, pense na revenda: localização perto de serviços, transporte e escolas, planta funcional e condomínio equilibrado. Esses fatores mantêm o imóvel valorizado e fácil de vender no futuro. Patrimônio também é saber sair bem. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PATRIMÔNIO e eu te ajudo a escolher.","cta":"Comente PATRIMÔNIO"}],"70":[{"t":"O que é SFH","g":"SFH e SFI: as siglas que mudam o seu financiamento.","r":"SFH é o Sistema Financeiro da Habitação. Ele vale para imóveis residenciais até um teto de valor definido pelo governo, permite usar o FGTS e tem regras de juros mais protegidas. É o caminho da maioria dos compradores de primeiro imóvel. Comente SFH que eu te explico se o seu imóvel se encaixa.","cta":"Comente SFH"},{"t":"O que é SFI","g":"Já o SFI, Sistema de Financiamento Imobiliário, atende imóveis acima do teto do SFH e outras operações.","r":"Já o SFI, Sistema de Financiamento Imobiliário, atende imóveis acima do teto do SFH e outras operações. As condições são negociadas com o banco e, em geral, não permitem uso do FGTS. Saber em qual sistema você está muda a sua estratégia. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente SFI para entender o seu caso.","cta":"Comente SFI"}],"73":[{"t":"Alto padrão também se financia","g":"Alto padrão também se compra com financiamento.","r":"Quem compra imóvel de alto padrão também usa financiamento, e muitas vezes por estratégia: mantém o dinheiro investido rendendo enquanto paga as parcelas. Nesse caso, a operação costuma ser pelo SFI, com condições negociadas. Comente ALTO PADRÃO que eu te explico as possibilidades.","cta":"Comente ALTO PADRÃO"},{"t":"Os critérios do alto padrão","g":"No alto padrão, os critérios são outros: localização exclusiva, segurança, privacidade, qualidade construtiva e, principalmente, liquidez.","r":"No alto padrão, os critérios são outros: localização exclusiva, segurança, privacidade, qualidade construtiva e, principalmente, liquidez. Imóvel de alto valor demora mais para vender, então escolher bem é proteger o patrimônio. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente LIQUIDEZ e eu te mostro o que avaliar.","cta":"Comente LIQUIDEZ"}],"82":[{"t":"Comprar imóvel em 5 etapas","g":"Comprar imóvel em 5 etapas, sem se perder no caminho.","r":"A compra do imóvel tem cinco etapas: um, análise de crédito e capacidade; dois, definição da região e do tipo de imóvel; três, visitas e escolha; quatro, proposta, documentação e avaliação; cinco, contrato, registro e chaves. Pular etapas é o que trava o processo. Comente JORNADA que eu te mando o passo a passo.","cta":"Comente JORNADA"},{"t":"O corretor entra antes da visita","g":"E o corretor entra antes da visita, não só na hora de abrir a porta.","r":"E o corretor entra antes da visita, não só na hora de abrir a porta. Um bom corretor filtra imóveis compatíveis, verifica documentação, ajuda na negociação e acompanha até a entrega das chaves. Isso economiza tempo e evita erro caro. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CHAVES e eu caminho com você.","cta":"Comente CHAVES"}],"83":[{"t":"Como começar a vender o seu imóvel","g":"Quer vender o seu imóvel? Comece por aqui.","r":"Vai vender o seu imóvel? O primeiro passo é organizar a documentação: matrícula atualizada, IPTU, condomínio em dia e certidões. Depois, fotos boas e uma descrição honesta. Imóvel com documentação pronta vende mais rápido e passa confiança para o comprador. Comente VENDER que eu te ajudo a preparar.","cta":"Comente VENDER"},{"t":"O preço certo vende mais rápido","g":"E o preço certo faz toda a diferença.","r":"E o preço certo faz toda a diferença. Preço acima do mercado deixa o imóvel parado, e imóvel parado perde valor na percepção de quem procura. A avaliação com base em vendas reais da região é o caminho para vender bem e no prazo. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente AVALIAR e eu faço a avaliação do seu imóvel.","cta":"Comente AVALIAR"}],"88":[{"t":"Negociar não é só pedir desconto","g":"Negociar imóvel não é só pedir desconto.","r":"Negociar imóvel não é só pedir desconto. Você pode negociar prazo de entrega, forma de pagamento, itens que ficam no imóvel, quem paga custos da transferência e data de mudança. Às vezes, uma condição vale mais do que um desconto no preço. Comente NEGOCIAR que eu te ajudo a montar a sua proposta.","cta":"Comente NEGOCIAR"},{"t":"Como montar uma proposta forte","g":"Uma proposta bem feita mostra seriedade: valor, forma de pagamento, prazo e condições por escrito.","r":"Uma proposta bem feita mostra seriedade: valor, forma de pagamento, prazo e condições por escrito. O vendedor leva mais a sério quem já tem crédito analisado e documentação pronta. Negociação boa é aquela em que os dois lados fecham satisfeitos. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PROPOSTA para começarmos.","cta":"Comente PROPOSTA"}],"89":[{"t":"Quem você conhece que quer um imóvel?","g":"Você conhece alguém que quer comprar ou vender imóvel?","r":"Uma pergunta rápida: quem você conhece que está pensando em comprar, vender ou alugar um imóvel? Pode ser alguém da família, do trabalho ou um amigo que vive falando em sair do aluguel. Eu posso ajudar essa pessoa com análise de crédito e busca direcionada. Comente IMÓVEL ou me chama no Direct.","cta":"Comente IMÓVEL"},{"t":"Indicação: a maior prova de confiança","g":"Indicação é a maior prova de confiança que um corretor pode receber.","r":"Indicação é a maior prova de confiança que um corretor pode receber. Se eu já te ajudei ou se você gosta do meu conteúdo, me indique para quem precisa. Eu cuido dessa pessoa com o mesmo cuidado que cuido de você. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente INDICAÇÃO e me marque para quem precisa ver isso.","cta":"Comente INDICAÇÃO"}],"90":[{"t":"Bastidores do agenciamento","g":"Os bastidores de como um imóvel chega até você.","r":"Você vê o anúncio pronto, mas antes dele existe o agenciamento: visita ao imóvel, conversa com o proprietário, conferência de documentos, definição do preço e produção das fotos. Esse trabalho é o que garante um anúncio verdadeiro. Comente CAPTAÇÃO que eu mostro mais desses bastidores.","cta":"Comente CAPTAÇÃO"},{"t":"Ficha completa vende melhor","g":"Ficha completa vende melhor: metragem, vagas, condomínio, IPTU, documentação e diferenciais bem descritos.","r":"Ficha completa vende melhor: metragem, vagas, condomínio, IPTU, documentação e diferenciais bem descritos. O comprador decide mais rápido quando tem informação clara. Se você quer vender, eu monto essa ficha com você. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente VENDER e eu te explico como funciona.","cta":"Comente VENDER"}],"95":[{"t":"Tabela SAC sem complicação","g":"Tabela SAC: a parcela que diminui com o tempo.","r":"Na tabela SAC, você amortiza o mesmo valor da dívida todo mês. Como os juros são calculados sobre o saldo, que vai caindo, a parcela começa mais alta e diminui ao longo do tempo. No total, você costuma pagar menos juros. Comente SAC que eu te mostro uma simulação.","cta":"Comente SAC"},{"t":"Tabela Price sem complicação","g":"Já na tabela Price, a parcela começa menor e tende a se manter estável, mas no início você paga mais juros e amortiza menos.","r":"Já na tabela Price, a parcela começa menor e tende a se manter estável, mas no início você paga mais juros e amortiza menos. Ela cabe melhor no orçamento inicial, só que o custo total costuma ser maior. A escolha depende do seu fluxo de caixa. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente PRICE e eu comparo as duas para você.","cta":"Comente PRICE"}],"96":[{"t":"30 dias ajudando compradores: o que aprendi","g":"Em 30 dias, isso foi o que aprendi ajudando compradores.","r":"Fechando este ciclo de trinta dias de conteúdo: o comprador que chega com análise feita, documentos organizados e região definida fecha negócio mais rápido e com menos estresse. O segredo não é sorte, é preparo. Comente IMÓVEL e me conte em qual etapa você está.","cta":"Comente IMÓVEL"},{"t":"Corretor consultor, não vendedor de porta aberta","g":"O meu trabalho é ser consultor, não vendedor de porta aberta.","r":"O meu trabalho é ser consultor, não vendedor de porta aberta. Eu analiso o seu momento, filtro opções e acompanho até as chaves. Se você quer comprar com estratégia, vamos conversar. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CONSULTORIA que eu te chamo.","cta":"Comente CONSULTORIA"}],"97":[{"t":"Financiamento ou consórcio?","g":"Financiamento ou consórcio: qual é o melhor para você?","r":"Financiamento ou consórcio? No financiamento, você recebe o imóvel agora e paga juros por isso. No consórcio, não há juros, mas há taxa de administração, e você só usa o crédito quando for contemplado, por sorteio ou lance, sem data garantida. Comente FINANCIAMENTO ou CONSÓRCIO e eu te explico em detalhes.","cta":"Comente CONSÓRCIO"},{"t":"A urgência define o caminho","g":"O que define o melhor caminho é a urgência.","r":"O que define o melhor caminho é a urgência. Precisa sair do aluguel agora? O financiamento pode fazer mais sentido. Tem prazo e quer planejar? O consórcio pode ser uma alternativa. Cada caso pede análise. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente ESTRATÉGIA e eu comparo os dois para a sua realidade.","cta":"Comente FINANCIAMENTO"}],"101":[{"t":"O diagnóstico do comprador","g":"Antes de escolher a casa, eu analiso você.","r":"Quando um cliente me procura, a primeira coisa que eu faço não é mostrar imóvel. É o diagnóstico do comprador: renda, entrada disponível, FGTS, dívidas, objetivo e prazo. Com isso, eu sei exatamente quais imóveis fazem sentido. Comente ANÁLISE e eu faço o seu diagnóstico.","cta":"Comente ANÁLISE"},{"t":"Pare de começar pela casa","g":"Pare de começar pela casa.","r":"Pare de começar pela casa. Quem começa pela casa se frustra quando descobre que não consegue comprá-la. Quem começa pelo diagnóstico encontra o imóvel certo mais rápido e compra com segurança. A ordem muda tudo. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CASA para começarmos do jeito certo.","cta":"Comente CASA"}],"102":[{"t":"O que observar na visita","g":"O que observar na visita que quase ninguém olha.","r":"Na visita, não olhe só a decoração. Confira a posição do sol, sinais de umidade e infiltração, pressão da água, estado das janelas e portas, barulho da rua e o caminho até o trabalho. Leve um checklist e tire fotos. Comente VISITA que eu te mando o meu checklist.","cta":"Comente VISITA"},{"t":"Gostar do imóvel x fazer sentido","g":"Gostar do imóvel é importante, mas ele precisa fazer sentido: caber no orçamento, atender a família por alguns anos e ter boa documentação.","r":"Gostar do imóvel é importante, mas ele precisa fazer sentido: caber no orçamento, atender a família por alguns anos e ter boa documentação. A emoção escolhe, a análise confirma. Quando os dois concordam, a compra é certa. Eu sou o corretor Anderson Alves: imóveis com visão, negócios com estratégia. Comente CHECKLIST e eu te ajudo a avaliar.","cta":"Comente CHECKLIST"}],"16":[{"t":"Lance embutido: o que é","g":"Lance embutido: usar parte da própria carta para tentar antecipar.","r":"Você sabia que dá para dar lance usando parte da própria carta de crédito? Isso é o lance embutido. Uma parte do crédito é usada como lance, e você fica com o restante para comprar o bem. Cada grupo define se aceita e qual o limite. É uma estratégia para quem não tem dinheiro guardado para o lance. Comente LANCE que eu te explico como calcular.","cta":"Comente LANCE"},{"t":"Lance embutido reduz o crédito: planeje","g":"Mas atenção: no lance embutido, o crédito que sobra é menor.","r":"Mas atenção: no lance embutido, o crédito que sobra é menor. Se você precisa de um imóvel de determinado valor, a carta tem que ser maior para compensar. E lance nunca garante contemplação: ele concorre com os lances dos outros participantes. Planeje o crédito pensando nisso. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente EMBUTIDO e eu simulo para você.","cta":"Comente EMBUTIDO"}],"17":[{"t":"Consórcio em 40 segundos","g":"Consórcio em 40 segundos, sem enrolação.","r":"Consórcio é um grupo de pessoas que contribui todo mês para formar um fundo. A cada assembleia, participantes são contemplados por sorteio ou lance e recebem a carta de crédito para comprar o bem. Não tem juros como no financiamento, mas tem taxa de administração. Comente CONSÓRCIO que eu te explico cada detalhe.","cta":"Comente CONSÓRCIO"},{"t":"Consórcio não começa pela parcela","g":"E o consórcio não começa pela parcela.","r":"E o consórcio não começa pela parcela. Começa pelo objetivo: o que você quer comprar, em quanto tempo e quanto pode pagar por mês sem apertar. A partir disso, a gente define o valor da carta, o prazo e a estratégia de lance. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PLANO e eu monto o seu.","cta":"Comente PLANO"}],"18":[{"t":"Consórcio para construir patrimônio","g":"Consórcio também é ferramenta de construção de patrimônio.","r":"Consórcio não é só para comprar a casa própria. Muita gente usa como ferramenta de patrimônio: compra imóvel para alugar, terreno para construir ou amplia o negócio. A disciplina da parcela mensal ajuda a transformar renda em bens. Comente PATRIMÔNIO que eu te mostro como funciona.","cta":"Comente PATRIMÔNIO"},{"t":"Alavancagem com cautela","g":"Agora, alavancagem exige cautela.","r":"Agora, alavancagem exige cautela. Assumir várias cartas ao mesmo tempo sem reserva e sem planejamento de fluxo de caixa pode virar um problema. Patrimônio se constrói com estratégia, prazo e parcelas que cabem no orçamento, mesmo em um mês ruim. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente DUPLICAR e eu te explico a forma responsável.","cta":"Comente DUPLICAR"}],"22":[{"t":"Taxa de administração do consórcio","g":"Taxa de administração: o custo que você precisa entender.","r":"No consórcio, não tem juros, mas existe a taxa de administração. Ela remunera a administradora pela gestão do grupo e é diluída nas parcelas ao longo do prazo. Sempre pergunte qual é a taxa total e como ela é cobrada antes de assinar. Comente TAXA que eu te mostro como comparar.","cta":"Comente TAXA"},{"t":"Sem juros não significa sem custo","g":"Sem juros não significa sem custo.","r":"Sem juros não significa sem custo. Além da taxa de administração, pode existir fundo de reserva, seguro e reajuste anual do crédito e das parcelas, conforme o contrato. Para comparar com o financiamento, some todos os custos. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CUSTO e eu faço essa comparação com você.","cta":"Comente CUSTO"}],"23":[{"t":"O reajuste da carta de crédito","g":"Seu crédito no consórcio é corrigido. Entenda por quê.","r":"Todo ano, a carta de crédito do consórcio é reajustada por um índice previsto no contrato, como o INCC ou o IPCA. Isso existe para que o crédito acompanhe o preço dos bens ao longo do tempo. As parcelas também são reajustadas. Comente REAJUSTE que eu te explico o índice do seu grupo.","cta":"Comente REAJUSTE"},{"t":"A carta precisa acompanhar o bem","g":"Por isso, o crédito precisa acompanhar o bem que você quer comprar.","r":"Por isso, o crédito precisa acompanhar o bem que você quer comprar. Se o imóvel dos seus planos valoriza mais rápido do que o índice, a carta pode não ser suficiente no futuro. Escolher o valor certo da carta é parte da estratégia. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CRÉDITO e eu te ajudo a dimensionar.","cta":"Comente CRÉDITO"}],"24":[{"t":"Meia parcela no consórcio","g":"Meia parcela: quando ela pode ajudar o seu fluxo de caixa.","r":"Alguns grupos de consórcio oferecem a opção de pagar parcela reduzida até a contemplação, a chamada meia parcela. A diferença não some: ela é redistribuída nas parcelas depois que você é contemplado. Isso alivia o orçamento no início. Comente MEIA PARCELA que eu te explico se o grupo tem essa opção.","cta":"Comente MEIA PARCELA"},{"t":"Meia parcela e fluxo de caixa","g":"A estratégia faz sentido para quem quer preservar caixa agora, mas precisa ser planejada.","r":"A estratégia faz sentido para quem quer preservar caixa agora, mas precisa ser planejada. Depois da contemplação, a parcela sobe. Se o bem comprado gerar renda, como um imóvel alugado, essa conta pode fechar melhor. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente FLUXO e eu simulo os dois cenários.","cta":"Comente FLUXO"}],"33":[{"t":"Carta de crédito: como usar","g":"Carta de crédito: o que é e como você usa.","r":"Carta de crédito é o valor que você recebe quando é contemplado no consórcio. Com ela, você compra o imóvel, o veículo ou o serviço previsto no contrato, à vista, com poder de negociação. A administradora paga diretamente ao vendedor depois da análise. Comente CARTA que eu te explico o passo a passo.","cta":"Comente CARTA"},{"t":"Prazo do grupo x seu objetivo","g":"O prazo do grupo e o seu objetivo precisam conversar.","r":"O prazo do grupo e o seu objetivo precisam conversar. Se você precisa do bem em pouco tempo, vai depender de lance. Se tem um horizonte maior, o prazo trabalha a seu favor. Escolher o grupo certo é tão importante quanto o valor da carta. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PRAZO e eu te ajudo a escolher.","cta":"Comente PRAZO"}],"35":[{"t":"Consórcio para empresas","g":"Empresa também pode usar consórcio para crescer.","r":"Empresas também usam consórcio para comprar imóveis, veículos, máquinas e equipamentos, sem pagar juros de financiamento. O CNPJ pode participar, e a parcela entra no planejamento financeiro do negócio. Comente EMPRESA que eu te mostro como estruturar.","cta":"Comente EMPRESA"},{"t":"Consórcio no planejamento de ativos da empresa","g":"O segredo é tratar o consórcio como planejamento de ativos: saber quando a empresa vai precisar do bem, quanto pode comprometer do caixa e qual estratégia de lance usar.","r":"O segredo é tratar o consórcio como planejamento de ativos: saber quando a empresa vai precisar do bem, quanto pode comprometer do caixa e qual estratégia de lance usar. Assim, o crescimento acontece sem sufocar o capital de giro. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CAPITAL e eu monto essa estratégia com você.","cta":"Comente CAPITAL"}],"36":[{"t":"Como funciona o sorteio","g":"Sorteio no consórcio: como funciona de verdade.","r":"Todo mês, na assembleia, o grupo realiza sorteios entre os participantes que estão em dia. Quem é sorteado recebe a carta de crédito, sem precisar dar lance. A quantidade de contemplações depende do grupo e do caixa disponível. Comente SORTEIO que eu te explico as regras.","cta":"Comente LANCE"},{"t":"Como funciona o lance livre","g":"Além do sorteio, existe o lance livre: você oferece um valor para antecipar a contemplação, e vence quem oferecer o maior percentual, conforme as regras do grupo.","r":"Além do sorteio, existe o lance livre: você oferece um valor para antecipar a contemplação, e vence quem oferecer o maior percentual, conforme as regras do grupo. Não há valor garantido para vencer. Estratégia de lance se planeja com histórico e reserva. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente LANCE e eu te ajudo a planejar.","cta":"Comente SORTEIO"}],"40":[{"t":"Consórcio imobiliário","g":"Consórcio imobiliário: compra planejada do seu imóvel.","r":"No consórcio imobiliário, a carta de crédito pode ser usada para comprar casa, apartamento, terreno, imóvel comercial e, em muitos casos, para construir ou reformar, conforme o contrato. É uma forma de comprar o imóvel sem juros de financiamento. Comente IMÓVEL que eu te mostro as possibilidades.","cta":"Comente IMÓVEL"},{"t":"Compra planejada x urgência","g":"A grande diferença está na urgência.","r":"A grande diferença está na urgência. Quem precisa do imóvel agora geralmente vai de financiamento. Quem pode planejar ganha com o consórcio. Compra planejada é compra com mais poder de negociação, porque a carta funciona como pagamento à vista. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente ESTRATÉGIA e eu analiso o seu caso.","cta":"Comente ESTRATÉGIA"}],"49":[{"t":"Consórcio não é reserva de emergência","g":"Consórcio não é reserva de emergência.","r":"Um alerta importante: consórcio não é reserva de emergência. O dinheiro das parcelas não fica disponível para saque quando você precisa. Antes de entrar em um grupo, tenha uma reserva separada para imprevistos. Comente PLANO que eu te mostro a ordem certa.","cta":"Comente DIVERSIFICAR"},{"t":"Diversificar: cada ferramenta tem sua função","g":"Patrimônio forte é diversificado: reserva de emergência com liquidez, investimentos e, quando faz sentido, consórcio para compra planejada de bens.","r":"Patrimônio forte é diversificado: reserva de emergência com liquidez, investimentos e, quando faz sentido, consórcio para compra planejada de bens. Cada ferramenta tem a sua função. Misturar as funções é o que gera problema. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente DIVERSIFICAR e eu te ajudo a organizar.","cta":"Comente PLANO"}],"53":[{"t":"Simulação de consórcio: o que olhar","g":"Simulação de consórcio: o que olhar além da parcela.","r":"Numa simulação de consórcio, não olhe só a parcela. Confira o valor da carta, o prazo, a taxa de administração total, o fundo de reserva, o seguro, o índice de reajuste e as regras de lance do grupo. São esses números que mostram o custo real. Comente SIMULAÇÃO e eu te mando uma completa.","cta":"Comente SIMULAÇÃO"},{"t":"Diagnóstico antes da proposta","g":"Antes da proposta, vem o diagnóstico: objetivo, prazo, capacidade mensal e recurso disponível para lance.","r":"Antes da proposta, vem o diagnóstico: objetivo, prazo, capacidade mensal e recurso disponível para lance. Uma proposta sem diagnóstico é só um número. Com diagnóstico, vira estratégia. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente DIAGNÓSTICO e eu faço o seu antes de qualquer proposta.","cta":"Comente DIAGNÓSTICO"}],"55":[{"t":"Dá para vender a cota de consórcio?","g":"Dá para vender a sua cota de consórcio? Dá, com regras.","r":"Mudou de planos e não quer mais continuar no consórcio? Em geral, é possível transferir a cota para outra pessoa, com autorização da administradora e conforme o contrato. Quem compra assume as parcelas restantes. Comente VENDA que eu te explico o processo.","cta":"Comente VENDA"},{"t":"Carta contemplada à venda: cuidados","g":"Carta contemplada à venda exige cuidado redobrado.","r":"Carta contemplada à venda exige cuidado redobrado. Confirme com a administradora a titularidade, o saldo devedor e as condições de transferência antes de pagar qualquer valor. Nunca faça pagamento sem contrato e sem validação oficial. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente TRANSFERÊNCIA e eu te oriento com segurança.","cta":"Comente TRANSFERÊNCIA"}],"59":[{"t":"Consórcio x financiamento: comparação honesta","g":"Consórcio x financiamento: a comparação honesta.","r":"Consórcio ou financiamento? No financiamento, você tem o bem agora e paga juros. No consórcio, paga taxa de administração, sem juros, mas depende de sorteio ou lance para usar o crédito. Para comparar, some o custo total de cada um no mesmo prazo. Comente COMPARAR e eu faço essa conta com você.","cta":"Comente COMPARAR"},{"t":"Quando o financiamento faz sentido","g":"O financiamento faz sentido quando existe urgência real, como sair do aluguel caro, ou quando a oportunidade de compra é agora.","r":"O financiamento faz sentido quando existe urgência real, como sair do aluguel caro, ou quando a oportunidade de compra é agora. Não é vilão nem herói: é ferramenta. A decisão certa depende do seu momento. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente FINANCIAR e eu te ajudo a decidir com números.","cta":"Comente FINANCIAR"}],"63":[{"t":"Consórcio de veículos","g":"Consórcio de veículo: trocar de carro sem pagar juros.","r":"O consórcio de veículos permite comprar carro, moto ou utilitário com carta de crédito, sem juros de financiamento. É uma boa opção para quem pode planejar a troca e quer pagar menos no total. Comente CARRO que eu te mostro uma simulação.","cta":"Comente CARRO"},{"t":"Troca de carro planejada","g":"A troca planejada funciona assim: você entra no grupo antes de precisar do carro novo, usa o atual como possível lance ou entrada na negociação e escolhe o momento certo.","r":"A troca planejada funciona assim: você entra no grupo antes de precisar do carro novo, usa o atual como possível lance ou entrada na negociação e escolhe o momento certo. Planejamento evita a pressa, e a pressa custa caro. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PLANO e eu monto a sua troca.","cta":"Comente PLANO"}],"64":[{"t":"Leia o contrato antes de assinar","g":"Leia o contrato do consórcio antes de assinar.","r":"Antes de assinar o consórcio, leia o contrato. Confira prazo, valor da carta, taxa de administração, fundo de reserva, seguro, índice de reajuste, regras de lance e o que acontece em caso de atraso ou desistência. Contrato lido é surpresa evitada. Comente CONTRATO que eu te ajudo a revisar.","cta":"Comente CONTRATO"},{"t":"Entenda o grupo e as assembleias","g":"E entenda o grupo: quantos participantes, quantas contemplações por mês e como funcionam as assembleias.","r":"E entenda o grupo: quantos participantes, quantas contemplações por mês e como funcionam as assembleias. Esses dados ajudam a montar uma estratégia realista de lance e prazo. Informação é o que separa decisão de aposta. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente GRUPO e eu te explico como a o é pensar onde você quer estar quando a última parcela for paga. Com o prazo certo, o consórcio trabalha para a sua tranquilidade, não contra ela. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente PRAZO e eu monto essa conta com você.","cta":"Comente PRAZO"}],"100":[{"t":"30 dias de consórcio: o que fica","g":"Trinta dias de conteúdo sobre consórcio: o que fica.","r":"Fechando este ciclo de trinta dias falando de consórcio: o que mais faz diferença é começar pelo objetivo, entender os custos reais, ter reserva e planejar a estratégia de lance. Com isso, o consórcio vira ferramenta de verdade. Comente PLANO e me conte qual é o seu objetivo.","cta":"Comente PLANO"},{"t":"Consultoria, não venda de parcela","g":"O meu trabalho é consultoria, não venda de parcela.","r":"O meu trabalho é consultoria, não venda de parcela. Eu analiso o seu momento, comparo cenários e mostro o caminho com transparência. Se você quer decidir com segurança, vamos conversar. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente CONSULTORIA que eu te chamo.","cta":"Comente CONSULTORIA"}],"103":[{"t":"Consórcio na expansão da empresa","g":"Planejar a expansão da empresa com consórcio.","r":"Sua empresa precisa de um imóvel maior, de um veículo de trabalho ou de equipamentos? O consórcio pode fazer parte do planejamento de expansão, sem juros de financiamento e com a parcela entrando no fluxo de caixa. Comente EXPANSÃO que eu te mostro como estruturar.","cta":"Comente EMPRESA"},{"t":"Bem produtivo: o que se paga","g":"Priorize bens produtivos, aqueles que geram receita ou reduzem custo, como a sede própria no lugar do aluguel ou o veículo que amplia as entregas.","r":"Priorize bens produtivos, aqueles que geram receita ou reduzem custo, como a sede própria no lugar do aluguel ou o veículo que amplia as entregas. Quando o bem se paga, a conta fecha melhor. Eu sou Anderson Alves, consultor de investimentos e consórcios. Comente EMPRESA e eu analiso o seu cas   [/lance/i,'#lanceconsorcio'],[/carta/i,'#cartadecredito'],[/empresa|cnpj|neg[oó]cio/i,'#consorcioempresarial'],[/ve[ií]culo|carro/i,'#consorciodeveiculos'],[/patrim[oô]n/i,'#patrimonio'],[/contempla/i,'#contemplacao'],[/reserva|emerg[eê]ncia/i,'#educacaofinanceira'],
  [/google|maps/i,'#googlemeunegocio'],[/instagram/i,'#instagramparanegocios'],[/sax/i,'#saxofone'],[/evento|casamento/i,'#musicaaovivo'],[/repert[oó]rio/i,'#repertorio']];
function hashtagsDe(c){
  var base = String(S.cfg.hashtags[c.perfil]||'').split(/\s+/).filter(function(x){ return /^#/.test(x); }), txt = (c.titulo||'')+' '+(c.tema||'')+' '+(c.roteiro||'').slice(0,400), tema = [];
  TAGS_TEMA.forEach(function(t){ if(t[0].test(txt) && tema.indexOf(t[1])<0 && base.indexOf(t[1])<0) tema.push(t[1]); });
  var out = tema.slice(0,2).concat(base).filter(function(x,i,a){ return a.indexOf(x)===i; }).slice(0,5);
  return out.join(' ');
}
function seedOriginal(nid){ var r = (NOTION_SEED||[]).filter(function(x){ return String(x.idunico)===String(nid); })[0]; return r ? String(r.roteiroouideia||'').trim() : null; }
function textoIntocado(c){ var r = String(c.roteiro||'').trim(), o = c.notionId ? seedOriginal(c.notionId) : null; return !r || ehEsboco(c) || /^VÍDEO 1\n/.test(r) || (o!==null && r===o) || /^POST DA MANHÃ/.test(r) || /^Dois imóveis/i.test(r); }
function legendaAuto(c){ return !String(c.legenda||'').trim() || (c.historico||[]).some(function(h){ return /montadas automaticamente|reformulado pelo assistente|Revisado pela skill/.test(h.txt); }); }
function hashAuto(c){ var h = String(c.hashtags||'').trim(); return !h || h===String(S.cfg.hashtags[c.perfil]||'').trim(); }
function revisarTextos(){
  var mud = [], novos = [], R2 = REFORM2;
  S.conteudos.slice().forEach(function(c){
    if(c.etapa==='Publicado') return;
    var nid = String(c.notionId||''), feito = false;
    if(R2.MOVER[nid] && c.perfil!==R2.MOVER[nid]){ registrar(c, 'Perfil ajustado para '+perfil(R2.MOVER[nid]).arroba+' (consórcio não é falado no perfil do corretor)'); c.perfil = R2.MOVER[nid]; feito = true; }
    if(R2.SPLIT[nid] && textoIntocado(c)){
      var a = R2.SPLIT[nid][0], b = R2.SPLIT[nid][1];
      if(c.roteiro) registrar(c, 'Texto anterior guardado: '+c.roteiro);
      c.titulo = a.t; c.gancho = a.g; c.roteiro = a.r; c.cta = a.cta; c.tema = a.t; feito = true;
      registrar(c, 'Separado em dois posts (este é o vídeo 1). Revisado pela skill reutilizar-conteudo-360.');
      if(!S.conteudos.some(function(x){ return x.notionId===nid+'-2'; })){
        var n = novoConteudo({titulo:b.t, tema:b.t, gancho:b.g, roteiro:b.r, cta:b.cta, perfil:c.perfil, rede:c.rede, formato:c.formato, etapa:c.etapa==='Publicado'?'Produção':etapaUnica(c.etapa), objetivo:c.objetivo, pilar:c.pilar, data:c.data, notionId:nid+'-2', origemId:c.id});
        registrar(n, 'Vídeo 2 separado de "'+a.t+'". Revisado pela skill reutilizar-conteudo-360.');
        n.legenda = montarDescricao(n); n.hashtags = hashtagsDe(n); novos.push(n);
      }
    } else if(R2.R[nid] && textoIntocado(c)){
      if(c.roteiro && c.roteiro!==R2.R[nid].r) registrar(c, 'Texto anterior guardado: '+c.roteiro);
      c.roteiro = R2.R[nid].r; if(!String(c.gancho||'').trim()) c.gancho = R2.R[nid].g; feito = true;
      registrar(c, 'Texto completo revisado pela skill reutilizar-conteudo-360');
    } else if((/imóveis manhã e tarde/i.test(c.titulo||'') || /^POST DA MANHÃ|^Dois imóveis/i.test(c.roteiro||'')) && textoIntocado(c)){
      c.titulo = 'Imóvel do dia (preencher com o imóvel)'; c.gancho = R2.POST.g; c.roteiro = R2.POST.r; c.formato = 'Post'; feito = true;
      registrar(c, 'Modelo de post único de imóvel aplicado. Preencha os dados reais do imóvel.');
    }
    var limpo = tituloLimpo(c.titulo); if(limpo && limpo!==c.titulo && !/^Vídeos? \d/i.test(limpo)){ c.titulo = limpo; feito = true; }
    if(feito || legendaAuto(c)){ if(legendaAuto(c)){ c.legenda = montarDescricao(c); feito = true; } }
    if(hashAuto(c)){ var hh = hashtagsDe(c); if(hh && hh!==c.hashtags){ c.hashtags = hh; feito = true; } }
    if(!String(c.tema||'').trim()){ c.tema = tituloLimpo(c.titulo); feito = true; }
    if(feito) mud.push(c);
  });
  novos.forEach(function(n){ S.conteudos.push(n); });
  return gravar('conteudos', mud.concat(novos)).then(function(){ return {alterados:mud.length, novos:novos.length}; });
}

/* ---- desfazer/refazer em lote ---- */
function registrarLote(pares, rotulo){ if(HIST.ocupado || !pares.length) return; HIST.desfazer.push({lote:pares.map(function(p){ return {antes:p[0]?JSON.parse(JSON.stringify(p[0])):null, depois:p[1]?JSON.parse(JSON.stringify(p[1])):null}; }), rotulo:rotulo}); HIST.refazer = []; atualizarBotoesHist(); }
function aplicarLote(lote, lado){
  HIST.ocupado = true;
  var put = [], del = [];
  lote.forEach(function(x){ var v = x[lado], id = (x.antes||x.depois).id; if(v){ put.push(JSON.parse(JSON.stringify(v))); } else del.push(id); });
  put.forEach(function(v){ var i = S.conteudos.findIndex(function(x){ return x.id===v.id; }); if(i>=0) S.conteudos[i]=v; else S.conteudos.push(v); });
  S.conteudos = S.conteudos.filter(function(x){ return del.indexOf(x.id)<0; });
  return gravar('conteudos', put).then(function(){ return del.reduce(function(q,id){ return q.then(function(){ return apagar('conteudos', id); }); }, Promise.resolve()); }).then(function(){ HIST.ocupado = false; }, function(e){ HIST.ocupado = false; throw e; });

function planoReorganizar(){
  var h = hoje(), ocup = {}, mud = [];
  var fixo = function(c){ return c.etapa==='Publicado' || (c.etapa==='Agendado' && c.data && c.data>h); };
  S.conteudos.forEach(function(c){ if(fixo(c) && c.data) ocup[c.perfil+'|'+slotDe(c).trilha+'|'+c.data] = 1; });

    if(c.data!==d || c.hora!==sl.hora) mud.push({c:c, data:d, hora:sl.hora});

function reorganizarCalendario(){
